,"f":0,"i":"누군가를 두 팔로 감싸 지키며 놓지 않는 상태 — 아이를 품는 양육권부터 경찰이 붙잡아 두는 구금까지, '내 관리 아래 꽉 잡고 있음'이 핵심."},{"w":"desperate","p":"a.","m":"필사적인","f":0,"i":"희망의 밧줄이 끊겨(de-분리 + sper희망) 벼랑 끝에서 뭐든 붙잡으려 발버둥치는 상태. 그래서 '절망적인'이자 '(그 절박함으로) 필사적인'."},{"w":"destitute","p":"a.","m":"빈곤한","f":0,"i":"발밑의 받침이 통째로 빠져나가(de-분리 + stit세우다) 아무것도 남지 않고 맨바닥에 선 상태. 단순 가난이 아니라 '텅 비어 아무것도 없는' 극빈. (문어·격식체)"},{"w":"destruction","p":"n.","m":"파멸, 멸망","f":0,"i":"쌓아 올린 구조물을 아래로 다 허물어(de-아래로 + struct세우다) 잔해만 남김. 지어진 것을 역방향으로 무너뜨리는 그림."},{"w":"discriminatory","p":"a.","m":"차별적인, 차별 대우의, 불공평한","f":0,"i":"사람들을 갈라(dis-흩어짐 + crimin가려내다) 한쪽만 골라 다르게 대함. 원래 '식별'이 나쁜 쪽으로 굳어 '차별하는'."},{"w":"distort","p":"v.","m":"왜곡하다","f":0,"i":"멀쩡한 형태를 양쪽으로 비틀어(dis-흩어짐 + tort비틀다) 원래 모양에서 어긋나게 함. 사실을 비틀면 왜곡."},{"w":"distortion","p":"n.","m":"왜곡","f":0,"i":"비틀린 결과물 — 거울에 비친 몸이 늘어나고 휜 것처럼, 원형에서 어긋나 뒤틀린 상태(dis-흩어짐 + tort비틀다)."},{"w":"distress","p":"v.","m":"괴롭히다","f":0,"i":"가슴을 사방에서 꽉 조여(di-분리+strain조이다) 옥죄는 고통·압박. 마음을 짓눌러 괴롭게 함."},{"w":"disturb","p":"v.","m":"방해하다","f":0,"i":"고요히 가라앉은 것을 휘저어(dis-흩어짐 + turb소용돌이) 흙탕물처럼 뒤흔들어 놓음. 평온·집중을 어지럽혀 방해."},{"w":"eavesdrop","p":"v.","m":"엿듣다, 도청하다","f":0,"i":"처마(eaves) 밑 빗물 떨어지는 자리에 몰래 붙어 서서 안의 대화를 훔쳐 듣는 그림. 그래서 '엿듣다'."},{"w":"eccentric","p":"a.","m":"별난","f":0,"i":"중심(center)에서 벗어나(ec-밖으로) 궤도를 이탈한 바퀴처럼 남들과 축이 어긋난 사람. 그래서 '별난, 괴짜의'."},{"w":"edible","p":"a.","m":"먹을 수 있는","f":0,"i":"입에 넣어 먹을(ed먹다) 수 있는. 독버섯과 대비되는 '안전하게 삼킬 수 있는' 것. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"embark","p":"v.","m":"탑승하다, 출항하다, 종사하다","f":0,"i":"배(bark: 작은 배)에 몸을 싣고(em-안으로) 올라 항해를 시작함. 그래서 '탑승하다', 나아가 새 일에 '착수하다·종사하다'."},{"w":"endanger","p":"v.","m":"위태롭게 하다","f":0,"i":"무언가를 위험(danger) 한복판으로 밀어넣어(en-안으로) 위태롭게 만듦."},{"w":"exonerate","p":"v.","m":"결백을 입증하다","f":0,"i":"어깨에 얹힌 짐(oner무게)을 밖으로(ex-밖으로) 벗겨내 줌 — 혐의라는 짐을 벗겨 '결백을 입증하다'. (문어·격식·법률체)"},{"w":"fluid","p":"n.","m":"체액, 수분, 액체","f":0,"i":"흘러(flu흐르다) 정해진 모양 없이 그릇을 따라 흐르는 것 — 액체·체액. 특별한 감각 이미지 없음, '흐름'이 곧 뜻."},{"w":"found","p":"v.","m":"설립하다, 창건하다","f":0,"i":"건물의 바닥(found바닥)을 처음 다져 세움 — 그래서 '설립·창건하다'. find의 과거형과 철자가 같으니 주의."},{"w":"fountain","p":"n.","m":"분수, 샘","f":0,"i":"바닥 샘(found샘)에서 물이 솟아 위로 뿜어 오르는 그림 — 분수·샘. 지식·감정의 '원천'으로도 확장."},{"w":"gadget","p":"n.","m":"간단한 장치","f":0,"i":"손바닥에 쏙 들어오는 작고 기발한 도구 — 병따개·리모컨 같은 '요 자그마한 장치'. 특별한 어원 이미지 없음."},{"w":"glaze","p":"n.","m":"유약, 광택","f":0,"i":"도자기 겉에 발라 구우면 유리처럼 매끈하게 반짝이는 코팅막. glass(유리)와 한 뿌리 — 그 유리막이 유약·광택."},{"w":"honorable","p":"a.","m":"고결한, 명예로운, 존경할 만한","f":0,"i":"명예(honor)를 몸에 두른, 존경으로 우러러볼 만한. 흠 없이 떳떳한 인격을 그림."},{"w":"householder","p":"n.","m":"세대주","f":0,"i":"한 집(household)을 이끄는 주인 — 그 지붕 아래를 책임지고 붙들고 있는 사람. 그래서 '세대주·가장'."},{"w":"hypothesis","p":"n.","m":"가설","f":0,"i":"본론 아래에(hypo-아래 + thesis놓음) 임시로 받쳐 깔아둔 디딤돌 — 아직 증명 안 됐지만 위 논의를 떠받치려 놓아둔 가설. (학술체)"},{"w":"idealism","p":"n.","m":"이상주의, 이상화","f":0,"i":"현실보다 머릿속 이상(ideal)을 더 실재로 보고 그것을 좇는 태도 — 이상주의."},{"w":"imitation","p":"n.","m":"모방, 흉내","f":0,"i":"남의 것을 그대로 본떠 따라 그린(imit흉내) 복제품·흉내. 진품 옆의 '짝퉁'이 전형적 그림."},{"w":"in advance","p":"phr.","m":"미리, 사전에","f":0,"i":"남들보다 한 걸음 앞으로(advance전진) 나가 미리 해둠 — 시간축에서 먼저 자리 잡음. '미리, 사전에'."},{"w":"in response to","p":"phr.","m":"~에 답하여, ~에 응하여","f":0,"i":"상대가 던진 것에 되받아(re-뒤로 + spond응답) 반응하며 응함 — 자극→반응의 짝. '~에 답하여'."},{"w":"in return","p":"phr.","m":"회답으로","f":0,"i":"받은 것을 되돌려(return되돌림) 갚음 — 주고받기에서 답례로 돌려주는 그림. '회답·답례로'."},{"w":"in terms of","p":"phr.","m":"~의 점에서 보면","f":0,"i":"어떤 잣대(term기준·용어)의 틀 안에 놓고 봄 — 그 관점의 렌즈로 재단함. '~의 점에서 보면'."},{"w":"in the long run","p":"phr.","m":"결국은","f":0,"i":"짧은 스퍼트가 아니라 긴(long) 트랙을 끝까지 달렸을 때(run) 드러나는 최종 결과 — '결국은, 장기적으로'."},{"w":"knack","p":"n.","m":"솜씨, 기교","f":0,"i":"몸에 밴 손끝의 재주 — 딱 그 각도로 틀면 되는, 배워서라기보단 감으로 아는 요령. '요령·솜씨'."},{"w":"lust","p":"n.","m":"강한 욕망, 열망, 갈망","f":0,"i":"몸을 확 달아오르게 미는 원초적 갈망 — 성욕이 대표적이나 권력·피에 대한 탐욕으로도. 단순 want보다 훨씬 뜨겁고 육체적."},{"w":"luxury","p":"a.","m":"사치의, 고급(품)의","f":0,"i":"빛나며 넘쳐흐르는(lux빛) 여유 — 필요 이상으로 풍족해 반짝이는 사치·호화. 궁핍의 반대편 그림."},{"w":"made up of","p":"phr.","m":"~으로 만들어진","f":0,"i":"여러 부품을 위로 쌓아 조립해(make up구성) 하나를 이룸 — 'A는 B들로 이루어져 있다'. 구성 요소를 세는 그림."},{"w":"makeup","p":"n.","m":"성질, 기질, 구성","f":0,"i":"여러 조각을 쌓아 맞춰(make up) 이룬 전체의 짜임새 — 그래서 '구성·기질'. 얼굴을 꾸며 만드는 '화장'도 같은 뿌리."},{"w":"measurement","p":"n.","m":"측량, 측정","f":0,"i":"자를 대어 재어(measure재다) 얻은 수치 — 길이·양을 딱 확정지은 값. '측정, 치수'."},{"w":"mill","p":"v.","m":"분쇄하다, 맷돌로 갈다","f":0,"i":"무거운 맷돌 두 짝 사이에 낟알을 넣고 짓눌러 가루로 빻는 그림 — 그래서 '분쇄하다, 맷돌로 갈다'."},{"w":"mockery","p":"n.","m":"비웃음, 놀림, 조롱","f":0,"i":"상대를 흉내 내며 깔깔 비웃는 조롱 — 놀림감으로 만들어 웃음거리로 세우는 그림."},{"w":"novice","p":"n.","m":"초보자","f":0,"i":"그 세계에 갓(nov새로운) 들어온 신출내기 — 아직 손에 익지 않은 초보자."},{"w":"numerous","p":"a.","m":"다수의, 수많은","f":0,"i":"숫자(numer수)로 다 못 셀 만큼 우글우글 많은 — '수많은'. many보다 격식 있는 느낌."},{"w":"oblige","p":"v.","m":"강요하다, 억지로 시키다","f":0,"i":"상대를 끈으로 묶어(ob-맞서 + lig묶다) 안 할 수 없게 매어 둠 — 의무·은혜로 옭아매 '강요하다, ~하게 하다'."},{"w":"occasional","p":"a.","m":"가끔의, 이따금씩의","f":0,"i":"쭉 이어지지 않고 어쩌다 한 번씩 툭 떨어지듯 일어나는 — '가끔의, 이따금의'."},{"w":"odds","p":"n.","m":"가능성, 확률","f":0,"i":"저울 양쪽의 어긋난(odd) 기울기 — 이길 쪽과 질 쪽의 확률 차이. 그래서 '가능성, 승산, 확률'."},{"w":"outstanding","p":"a.","m":"두드러진, 뛰어난","f":0,"i":"무리 밖으로(out) 혼자 우뚝 솟아 서(stand) 눈에 확 띔 — '두드러진, 뛰어난'. (미지불 대금이 '남아 서 있다'는 뜻도 주의.)"},{"w":"paralyze","p":"v.","m":"마비시키다","f":0,"i":"몸 옆쪽(para-옆) 신경이 풀려(lys풀다) 움직임이 뚝 끊긴 상태 — 근육이 얼어 못 움직이는 '마비'."},{"w":"pastoral","p":"a.","m":"전원 생활의, 시골의","f":0,"i":"양치기(pastor목자)가 풀밭에서 양을 치는 한가로운 시골 풍경 — 그래서 '전원의, 목가적인'. (문어체)"},{"w":"pave the way","p":"phr.","m":"용이하게 하다, 준비하다","f":0,"i":"울퉁불퉁한 흙길을 돌로 평평히 깔아(pave포장) 뒤에 올 사람이 수월히 지나가게 함 — '길을 닦다, 준비하다'."},{"w":"peruse","p":"v.","m":"정독하다","f":0,"i":"글자 하나하나를 끝까지 관통하며(per-끝까지) 꼼꼼히 훑어 읽음 — 대충 훑기가 아니라 '정독하다'. (문어·격식체)"},{"w":"potential","p":"a.","m":"잠재적인","f":0,"i":"아직 터지지 않았지만 안에 힘(pot힘)을 잔뜩 머금은 상태 — 언제든 발현될 수 있는 '잠재적인'."},{"w":"prevent","p":"v.","m":"예방하다, 방지하다","f":0,"i":"일이 터지기 전에 앞서(pre-앞 + vent오다) 나가 길목을 막아섬 — 미리 가로막아 '예방·방지하다'."},{"w":"qualified","p":"a.","m":"자격이 있는, 적임의","f":0,"i":"요구되는 자질(quality)을 갖춰 통과 도장을 받은 — '자격 있는, 적임의'."},{"w":"quality","p":"n.","m":"특성, 특색","f":0,"i":"그것을 바로 그것이게 만드는 고유의 결·성질 — 다른 것과 구별짓는 '특성'. (좋고 나쁨의 '품질'로도.)"},{"w":"recover","p":"v.","m":"회복하다, 원상태로 복구하다","f":0,"i":"벗겨졌던 것을 도로(re-다시) 덮어(cover덮다) 원상태로 되돌림 — 잃은 건강·물건을 '회복·되찾다'."},{"w":"recreation","p":"n.","m":"기분 전환, 오락","f":0,"i":"지친 몸과 마음을 다시(re-다시) 새로 만들어내는(creation창조) 활동 — 그래서 놀이·오락이 '기분 전환'."},{"w":"refurbish","p":"v.","m":"일신하다, 개장하다","f":0,"i":"낡은 것을 다시(re-다시) 문질러 광내(furbish닦다) 새것처럼 되살림 — '개장하다, 일신하다'."},{"w":"resound","p":"v.","m":"널리 알려지다, 울려퍼지다","f":0,"i":"소리(sound)가 벽에 부딪혀 되(re-다시) 울려 크게 퍼짐 — 공간을 채우며 '울려 퍼지다', 나아가 명성이 '널리 알려지다'."},{"w":"restriction","p":"n.","m":"제한, 한정","f":0,"i":"뒤로(re-) 팽팽히 조여(strict조이다) 묶어 움직임의 폭을 좁힘 — '제한, 한정'."},{"w":"revolt","p":"n.","m":"반발, 반항","f":0,"i":"짓눌리던 아래쪽이 확 뒤집혀(re-뒤로 + volt돌다) 위로 굴러 일어남 — 권위에 등 돌려 '반란·반항'. (역겨워 속이 뒤집히는 revolting과 한 뿌리.)"},{"w":"sadistic","p":"a.","m":"사디스트적인, 가학적인","f":0,"i":"남의 고통을 즐기는 — 사드(Sade) 후작 이름에서 온 말로, 아프게 하며 쾌감을 느끼는 '가학적인'."},{"w":"scarlet","p":"a.","m":"주황색의","f":0,"i":"피처럼 확 타오르는 새빨간 진홍색. 주황보다 붉은 쪽 — 화상 자국, 추기경 옷, '주홍글씨(A)'의 그 강렬한 빨강."},{"w":"seal","p":"v.","m":"(틈을) 막다","f":0,"i":"물개 말고, 뜨거운 밀랍을 뚝 떨어뜨려 도장 찍듯 눌러 봉인함. 틈새를 완전히 메워 공기·물이 못 새게 꽉 막는 이미지."},{"w":"share","p":"v.","m":"공유하다","f":0,"i":"하나의 덩어리를 칼로 잘라 각자 몫으로 나눠 가짐. 나눠도 서로가 같은 것을 함께 누림 — 그래서 공유."},{"w":"significantly","p":"ad.","m":"크게, 상당히","f":0,"i":"그냥 변한 게 아니라 '어라?' 하고 신호(sign)를 보낼 만큼 눈에 띄게 큰 폭으로. 의미가 있을 정도로 상당히."},{"w":"skeptical","p":"a.","m":"의심 많은, 회의적인","f":0,"i":"상대 말에 바로 안 넘어가고 눈을 가늘게 뜬 채 '진짜?' 하며 한 발 물러서서 뜯어보는 표정. 의심하며 판단 보류."},{"w":"slender","p":"a.","m":"가느다란, 날씬한","f":0,"i":"위아래로 길게 뽑아 가늘게 만든 몸매·줄기. slim보다 우아하고 여린 느낌의 날씬함."},{"w":"slick","p":"a.","m":"능숙한, 빈틈 없는","f":0,"i":"기름 발린 듯 매끄럽게 쓱 미끄러져 걸림 없이 처리함. 능숙·빈틈없음. 단, 너무 매끈해서 '얍삽하다'는 부정 뉘앙스도."},{"w":"smear","p":"n.","m":"얼룩","f":0,"i":"손가락으로 쓱 문질러 번진 얼룩·자국. 물감·잼처럼 미끄덩하게 발려 퍼진 것. 동사로 '평판을 더럽히다(비방)'로도 확장."},{"w":"soft drink","p":"phr.","m":"청량 음료","f":0,"i":"알코올 없는(soft=순한) 탄산·청량음료. 특별한 이미지 없음 — 콜라·사이다류."},{"w":"specialize","p":"v.","m":"전문화하다","f":0,"i":"여러 갈래 중 딱 한 종(species)에만 파고들어 그 분야 전문가가 됨 (special=한 종에 특화)."},{"w":"specialty","p":"n.","m":"전문","f":0,"i":"그 집·그 사람만의 콕 집어 내세우는 특기·간판 메뉴. 남과 구별되는 한 가지 전문 종목."},{"w":"stain","p":"n.","m":"얼룩","f":0,"i":"천·나무에 깊이 스며들어 잘 안 지워지는 물든 얼룩. smear가 겉에 번진 거라면 stain은 배어든 것."},{"w":"territorial","p":"a.","m":"영토의, 지역적인","f":0,"i":"여기까지가 내 땅이라며 선 긋고 침입자에 으르렁대는 감각 (terra=땅). 영토의, 자기 구역을 지키려는."},{"w":"throughout","p":"prep.","m":"전체에 걸쳐","f":0,"i":"한쪽 끝에서 반대쪽 끝까지(through) 빠짐없이 관통해 구석구석 다 미침. 공간이든 시간이든 '전체에 걸쳐'."},{"w":"triumphant","p":"a.","m":"성공적인","f":0,"i":"개선문을 지나며 팔 치켜든 승자의 표정. 이겨서 의기양양하게 빛나는 성공의 순간."},{"w":"up-and-coming","p":"a.","m":"유망한, 활동적인","f":0,"i":"지금 막 아래에서 위로(up) 치고 올라오는(coming) 신예. 아직 정상은 아니지만 곧 뜰 유망주."},{"w":"urban","p":"a.","m":"도시의","f":0,"i":"빌딩·아스팔트·인파로 빽빽한 도시 풍경 (urbs=도시). rural(시골)의 반대."},{"w":"violence","p":"n.","m":"폭력","f":0,"i":"억눌린 힘이 확 터져 부수고 때리는 거친 물리력 (vio=힘). 폭력·격렬함."},{"w":"whopping","p":"a.","m":"굉장한, 엄청난","f":0,"i":"'우와!' 소리 나올 만큼 예상치를 훌쩍 넘긴 어마어마한 크기·액수. 회화체로 숫자 앞에 붙여 강조."},{"w":"aberrance","p":"n.","m":"비정상","f":0,"i":"정상 궤도에서 벗어나(ab-떨어져) 옆길로 헤맴(err=방황하다). 규범을 이탈한 비정상. (문어·격식체)"},{"w":"abrasion","p":"n.","m":"마모, 마멸","f":0,"i":"표면을 문질러 벗겨 닳게 함 (ab-떨어져 + ras긁다). 살갗 까진 상처나 마모. 연마재 abrasive와 한 뿌리."},{"w":"adapt to","p":"phr.","m":"~에 순응하다, ~에 익숙해지다","f":0,"i":"새 환경에 몸을 맞춰(ad-쪽으로 + apt적합) 딱 맞게 조율함. ~에 순응·적응. adopt(입양·채택)와 혼동 주의."},{"w":"adaptation","p":"n.","m":"적응, 적합","f":0,"i":"낯선 조건에 자신을 맞춰 바꾼 결과물. 생물의 진화적 적응, 소설의 영화 각색 둘 다."},{"w":"affirmative","p":"a.","m":"긍정적인","f":0,"i":"'그렇다'고 단단히(af- 강조) 굳혀(firm) 못박는 긍정의 대답. Yes 쪽. 반대는 negative."},{"w":"aloft","p":"ad.","m":"공중에, 위에","f":0,"i":"머리 위 공중으로 붕 떠올라 있는 상태 (a-+loft다락·높은곳). 깃발·연이 하늘 높이. (문어체)"},{"w":"ample","p":"a.","m":"충분한, 풍부한, 넓은","f":0,"i":"넘칠 만큼 넉넉히 부풀어 있는 양·공간. '모자라지 않다' 정도가 아니라 여유롭게 충분함."},{"w":"an array of","p":"phr.","m":"다수의","f":0,"i":"쭉 줄지어 죽 펼쳐 늘어놓은 다양한 진열대. 종류가 많고 화려하게 배열된 다수의."},{"w":"apathetic","p":"a.","m":"무관심한","f":0,"i":"감정(pathos)이 딱 꺼져(a-없음) 아무 반응 없는 무덤덤한 표정. 관심도 열정도 제로."},{"w":"bleak","p":"a.","m":"황량한, 삭막한","f":0,"i":"잎도 색도 다 빠져나간 잿빛 겨울 벌판처럼 휑하고 희망 없는. 풍경도 전망도 '삭막·암울'."},{"w":"break down into","p":"phr.","m":"~으로 분류하다, ~으로 분석하다","f":0,"i":"덩어리를 툭툭 부숴 작은 조각으로 갈라 분류·분석함. 큰 것을 항목별로 쪼개는 이미지."},{"w":"breakage","p":"n.","m":"파손, 손상","f":0,"i":"깨져 부서진 것(들). 운송 중 파손처럼 '깨진 상태·깨진 물건'을 가리키는 명사."},{"w":"breakthrough","p":"n.","m":"새 발견, 약진","f":0,"i":"가로막힌 벽을 뚫고(break through) 반대편으로 확 돌파함. 막혔던 연구·상황의 획기적 약진."},{"w":"break new ground","p":"phr.","m":"새 분야를 개척하다","f":0,"i":"아무도 안 파본 처녀지에 삽을 처음 꽂아 땅을 갊. 새 분야를 개척하다."},{"w":"Census Bureau","p":"phr.","m":"조사국","f":0,"i":"인구를 한 명씩 세어(census) 집계하는 정부 조사국. 특별한 이미지 없음 — 뜻 그대로."},{"w":"characteristic","p":"n.","m":"특징, 특성","f":0,"i":"그것을 그것이게 만드는 새겨진(char-각인) 고유의 표시·특징. 남과 구별되는 성질."},{"w":"clay","p":"n.","m":"점토, 흙","f":0,"i":"물 먹어 축축하고 손에 착 붙는 점토. 도자기·벽돌의 재료. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"collector","p":"n.","m":"수집가","f":0,"i":"여기저기 흩어진 것을 한데 그러모아(col-함께 + lect모으다) 쌓는 사람. 수집가·수금원."},{"w":"combination","p":"n.","m":"결합, 조합","f":0,"i":"둘 이상을 하나로 묶어(com-함께 + bine둘씩) 합친 조합. 자물쇠 번호 조합도 이 감각."},{"w":"combine","p":"v.","m":"결합시키다","f":0,"i":"따로 있던 것들을 함께 붙여 하나로 만듦 (com-함께). 결합시키다."},{"w":"concentration","p":"n.","m":"집중, 전념","f":0,"i":"흩어진 것을 하나의 중심(center)으로 바짝 끌어모음 (con-함께). 정신을 한 점에 모으면 집중, 물질이 모이면 농도."},{"w":"crank up","p":"phr.","m":"시작하다, (정도를) 높이다","f":0,"i":"옛날 자동차 손잡이(crank)를 돌려 시동 걸듯 세게 돌려 켜고 강도를 확 올림. 볼륨·열기를 높이다."},{"w":"customize","p":"v.","m":"자기 취향에 맞게 설정하다","f":0,"i":"기성품을 그 사람 습관(custom)에 맞춰 뜯어고쳐 딱 맞춤. 자기 취향대로 개조."},{"w":"custom","p":"n.","m":"세관, 풍습","f":0,"i":"오래 반복돼 몸에 밴 관습·풍습. 복수 customs가 되면 물건 통과를 검사하는 '세관'."},{"w":"deliberately","p":"ad.","m":"의도적으로","f":0,"i":"저울질하며(de-완전히 + liber재다) 충분히 재고 나서 일부러 그렇게 함. 실수가 아니라 의도적으로."},{"w":"depend on","p":"phr.","m":"좌우되다, (~에 따라) 결정되다","f":0,"i":"천장에 매달린(de-아래로 + pend매달다) 것처럼 그것에 통째로 걸려 좌우됨. ~에 달려 있다·의지하다."},{"w":"desirable","p":"a.","m":"바람직한","f":0,"i":"누구나 손 뻗어 갖고 싶어 할 만큼 매력적인. '있으면 좋은' 바람직한 조건."},{"w":"discover","p":"v.","m":"발견하다","f":0,"i":"덮여 있던 뚜껑을 걷어내(dis-제거 + cover덮개) 숨은 것을 드러냄. 발견하다."},{"w":"disparagingly","p":"ad.","m":"얕보아, 헐뜯어","f":0,"i":"상대를 자기보다 아래(par=동등) 급으로 깎아내리며 말하는 태도. 얕보고 헐뜯어. (문어체)"},{"w":"disparity","p":"n.","m":"격차, 불균형","f":0,"i":"저울 양쪽이 안 맞아(dis-반대 + par동등) 한쪽으로 확 기운 격차. 불균형·차이."},{"w":"disruptive","p":"a.","m":"분열시키는","f":0,"i":"질서 있게 이어진 것을 확 찢어(dis-흩어짐 + rupt깨다) 흐름을 깨뜨림. 분열·방해시키는."},{"w":"distinct","p":"a.","m":"뚜렷한, 분명한","f":0,"i":"다른 것과 콕 찍어 갈라놓은(di-분리 + stinct찌르다) 또렷한 경계. 뚜렷이 구별되는."},{"w":"distinction","p":"n.","m":"차별, 차이","f":0,"i":"둘 사이에 선을 그어 갈라놓음 — 차이. 나아가 남들과 갈라져 돋보이는 '탁월함·영예'로도."},{"w":"elegant","p":"a.","m":"품위 있는, 우아한","f":0,"i":"군더더기 없이 딱 골라낸(e-밖으로 + leg고르다) 세련됨. 매끈하게 다듬어진 우아함."},{"w":"embarrassment","p":"n.","m":"당황","f":0,"i":"갑자기 앞이 막혀(barra=막대·장벽) 얼굴 빨개지고 말문 막힌 어색함. 당황·창피."},{"w":"endeavor","p":"n.","m":"노력, 시도","f":0,"i":"'내 의무(devoir)로 삼겠다'는 각오로 온 힘 실어 애써 해냄. 진지한 노력·시도. (문어체)"},{"w":"epitomize","p":"v.","m":"요약하다, 전형이다","f":0,"i":"두꺼운 책을 한 줄로 잘라 압축하듯, 그 하나가 전체를 대표하는 전형이 됨. 요약하다·전형이다. (문어체)"},{"w":"equate","p":"v.","m":"동등시하다, 동등하게 다루다","f":0,"i":"저울 양쪽에 올려 '이거랑 저거는 같다'고 등호(=)로 묶음 (equa=같은). 동일시하다."},{"w":"equilibrium","p":"n.","m":"균형, 평형","f":0,"i":"저울이 양쪽 무게가 같아(equi-같은 + libra저울) 안 기울고 딱 멈춘 상태. 균형·평형."},{"w":"equivalent","p":"a.","m":"동등한, 같은","f":0,"i":"값어치(val=가치)가 서로 같아(equi-) 맞바꿔도 되는. 동등한·맞먹는."},{"w":"fillet","p":"n.","m":"(가시를 발라낸) 생선의 저민 고기","f":0,"i":"생선·고기에서 뼈와 가시를 발라내고 살만 길게 떠낸 저민 조각. 특별한 이미지 없음 — 뜻 그대로."},{"w":"foraging","p":"n.","m":"채집","f":0,"i":"숲바닥을 뒤지며 먹을 것을 이리저리 훑어 그러모으는 동작. 동물이나 사람이 여기저기 돌아다니며 열매·먹이를 채집하는 그림."},{"w":"forgo","p":"v.","m":"~없이 지내다, 그만두다","f":0,"i":"손 앞에 놓인 것을 일부러 그냥 지나쳐 보냄 (for-지나쳐 + go가다). 누릴 수 있는 걸 스스로 포기하고 안 가짐. 'forego(앞서다)'와 혼동 주의."},{"w":"foul","p":"a.","m":"지저분한, 악취가 나는","f":0,"i":"코를 찌르는 악취와 끈적한 오물이 뒤엉킨 더러움. 물리적으로 썩고 지저분한 것에서 '반칙·비열함'까지 번짐. 'fair'의 반대."},{"w":"frustrate","p":"v.","m":"좌절시키다, 실망시키다","f":0,"i":"앞으로 밀고 나가려는데 벽에 턱 막혀 헛수고로 되돌려짐 (frustra헛되이). 계획이 좌절되고, 그 막힌 답답함이 사람 감정에 옮겨붙어 짜증·좌절."},{"w":"gaffer","p":"n.","m":"늙은이, 영감","f":0,"i":"허리 굽은 시골 노인 영감. 특별한 감각 이미지 없음 — 뜻 그대로. (영국식·구어, 다소 옛말)"},{"w":"hook","p":"n.","m":"갈고리","f":0,"i":"끝이 'ㄱ'자로 굽어 뭔가를 걸어 낚아채는 갈고리. 그 걸리는 감각에서 '낚다·사로잡다·중독시키다(hooked)'로 번짐."},{"w":"humorous","p":"a.","m":"재미있는, 우스운","f":0,"i":"듣는 사람 입꼬리를 슬며시 올리는 재치가 밴 상태. 'humor(유머)' 자체가 스민 느낌. 'humerus(위팔뼈)'와 발음 혼동 주의."},{"w":"identical","p":"a.","m":"동일한","f":0,"i":"두 개를 겹쳐 놓으면 윤곽이 티끌 하나 안 어긋나고 딱 포개짐 (ident-같음). 쌍둥이처럼 완전히 똑같음. 'similar(비슷)'보다 훨씬 강함."},{"w":"immediate","p":"a.","m":"즉각적인","f":0,"i":"나와 그것 사이에 아무 것도 안 낀, 틈 없이 붙은 상태 (im-없음 + medi가운데). 중간 매개가 없으니 시간상 '즉각', 관계상 '직속·바로 옆'."},{"w":"inclusive","p":"a.","m":"포함한","f":0,"i":"울타리 안으로 다 끌어들여 하나도 안 빼고 품음 (in-안으로 + clud닫다). 요금에 다 포함, 사람도 다 껴주는 포용."},{"w":"independently","p":"ad.","m":"독립적으로","f":0,"i":"위에서 늘어뜨린 줄에 매달리지 않고(de-아래로 + pend매달리다 + in-부정) 제 발로 홀로 섬. 남에게 안 기대고 스스로."},{"w":"irrelevance","p":"n.","m":"부적절, 무관","f":0,"i":"던져진 화제와 전혀 다시 들어올려 붙지 않고 겉도는 상태 (ir-부정 + re-다시 + lev들어올리다). 지금 얘기와 아무 상관 없음."},{"w":"isolation","p":"n.","m":"고립, 격리","f":0,"i":"망망대해 한가운데 뚝 떨어진 섬처럼 뚝 잘려 홀로 놓임 (isol-섬 insula). 주변과 연결이 끊겨 고립·격리."},{"w":"luncheon","p":"n.","m":"점심, 오찬 모임","f":0,"i":"냅킨 깔고 격식 차려 앉는 점심 모임. 'lunch'의 차려입은 버전. 특별한 이미지 없음 — 뜻 그대로. (문어·격식체)"},{"w":"lush","p":"a.","m":"무성한, 비옥한","f":0,"i":"잎이 물오르고 겹겹이 우거져 초록이 넘쳐흐르는 풀숲. 그 풍성함에서 '호화로운·감미로운'으로도 번짐."},{"w":"majority","p":"n.","m":"대부분, 대다수","f":0,"i":"저울 한쪽으로 무리의 절반 넘게 쏠려 무거워진 쪽 (major더 큰). 수적으로 더 많은 쪽·대다수."},{"w":"meat","p":"n.","m":"고기, 살, 속, 알맹이","f":0,"i":"껍질·뼈를 걷어내고 남는 실속 있는 살덩이. 그 '알맹이·핵심(the meat of the matter)' 감각까지 그대로 번짐."},{"w":"mimic","p":"v.","m":"흉내 내다, 모방하다, ~와 꼭 닮다","f":0,"i":"상대의 몸짓·말투를 거울처럼 그대로 되받아 흉내 냄 (mim흉내). 원숭이가 사람 따라 하듯, 겉모습을 똑같이 베낌."},{"w":"moderate","p":"a.","m":"알맞은, 보통의, 중간 정도의","f":0,"i":"양극단의 가운데로 눌러 잡아 튀지 않게 다스린 상태 (mod척도·한도). 넘치지도 모자라지도 않은 알맞음·온건함."},{"w":"must-have","p":"a.","m":"필수의 n. 필수품","f":0,"i":"안 가지면 안 되는, 반드시 손에 쥐어야 하는 물건. 'must have(가져야 함)'를 통째로 형용사로 굳힌 말. (구어·마케팅체)"},{"w":"notwithstanding","p":"ad.","m":"그럼에도 불구하고","f":0,"i":"거센 반대 흐름이 밀어붙여도 버티고 서 있음(not + withstand맞서 버티다). 그 방해에도 아랑곳 않고 그럼에도 불구하고. (문어·격식체)"},{"w":"observation","p":"n.","m":"관찰","f":0,"i":"대상 쪽으로 눈길을 딱 붙들어 지켜봄 (ob-쪽으로·맞서 + serv지키다·주시). 유심히 살펴봄, 그래서 나온 '관찰 소견'."},{"w":"offensive","p":"a.","m":"공격적인","f":0,"i":"상대를 향해 먼저 부딪쳐 들어가 치받음 (of-쪽으로 + fend치다). 공격적, 그 거슬리는 충돌감에서 '불쾌한'도 나옴. 'defensive'의 반대."},{"w":"ought to","p":"phr.","m":"~해야 한다","f":0,"i":"어깨에 지워진 마땅한 도리가 등을 떠미는 느낌. 'owe(빚지다)'의 옛 형태 — 도의적으로 그렇게 해야 함. 'must'보다 부드러운 당위."},{"w":"passenger","p":"n.","m":"승객","f":0,"i":"제 발로 안 몰고 그저 실려 지나가는(pass지나가다) 사람. 운전자 아닌, 태워져 이동하는 승객."},{"w":"perspective","p":"n.","m":"견해, 관점","f":0,"i":"한 지점에 서서 대상을 꿰뚫어 내다봄 (per-관통 + spec보다). 그 위치에서만 보이는 그림 = 관점·시각·원근법."},{"w":"possibility","p":"n.","m":"실현 가능성","f":0,"i":"아직 안 됐지만 언제든 될 수 있게 문이 빠끔 열려 있는 상태 (poss-할 수 있음). 일어날 수 있는 가능성."},{"w":"prestigious","p":"a.","m":"고급의, 일류의","f":0,"i":"이름만 들어도 남들 눈이 휘둥그레지는 후광이 두른 상태 (원래 '눈속임·마술'에서). 명성 높은 일류."},{"w":"protection","p":"n.","m":"보호","f":0,"i":"앞에 방패를 세워 날아오는 것을 대신 막아줌 (pro-앞에 + tect덮다). 위험 앞을 가려 지킴."},{"w":"protective","p":"a.","m":"보호하는","f":0,"i":"새끼 앞을 제 몸으로 가로막고 지키려 드는 태도 (pro-앞에 + tect덮다). 감싸고 보호하려는 성향."},{"w":"pungent","p":"a.","m":"자극성의","f":0,"i":"코 안쪽을 콕 찌르고 들어오는 날카로운 냄새·맛 (pung찌르다). 후추·겨자처럼 톡 쏘는 자극. 'poignant(가슴 찌르는)'와 어근 형제."},{"w":"quarter","p":"n.","m":"1분기(3개월), 4분의 1","f":0,"i":"하나를 넷으로 딱 자른 한 조각(quart넷). 1년의 4분의 1이 분기, 도시를 나눈 한 구역도 quarter."},{"w":"railroad","p":"n.","m":"선로","f":0,"i":"쇠(rail)를 두 줄로 깔아 만든 길(road). 특별한 이미지 없음 — 뜻 그대로. 동사로 쓰면 '밀어붙여 억지로 통과시키다'."},{"w":"raunchy","p":"a.","m":"초라한","f":0,"i":"때 묻고 후줄근하게 꾀죄죄한 상태. 초라함. (구어) 참고: 현대 영어에선 오히려 '야한·상스러운' 뜻으로 더 흔히 쓰임."},{"w":"ravage","p":"v.","m":"파괴하다, 황폐화하다","f":0,"i":"게걸스레 휩쓸고 지나가 초토화함 (rav움켜채다·게걸). 전쟁·재해가 땅을 물어뜯어 황폐화. 'ravish(강탈·황홀케 함)'와 형제."},{"w":"recording","p":"n.","m":"기록, 녹음","f":0,"i":"소리·장면을 매체에 다시 새겨(re-다시 + cord마음에 새기다) 붙들어 둔 것. 녹음·기록물."},{"w":"refresh","p":"v.","m":"상쾌하게 하다, 새롭게 하다","f":0,"i":"시들었던 것에 다시 신선한 기운을 부어 되살림 (re-다시 + fresh신선). 새로 고쳐 상쾌하게 함, 화면 새로고침."},{"w":"reputation","p":"n.","m":"명성 불공정한."},{"w":"infestation","p":"n.","m":"들끓음, 만연","f":0,"i":"벌레·해충이 온 집안에 우글우글 파고들어(in-안으로) 들끓음. 들끓음·만연."},{"w":"inhospitable","p":"a.","m":"살기에 부적합한, 불친절한","f":0,"i":"손님을 반기기는커녕 문전박대하는(in-부정 + hospit손님맞이) 냉랭함. 사람 살기 힘든 척박한 환경으로도 확장."},{"w":"initial","p":"a.","m":"처음의, 최초의","f":0,"i":"발을 처음 안으로 내디딘(in-안으로 + it가다) 그 첫 순간. 맨 처음의, 이름의 첫 글자."},{"w":"laundry process","p":"phr.","m":"세탁 과정","f":0,"i":"빨랫감을 세제·물·건조기를 거쳐 깨끗하게 만드는 일련의 과정. 뜻 그대로 세탁 과정."},{"w":"loss","p":"n.","m":"손실, 감소, 손해","f":0,"i":"손에 쥐고 있던 것이 스르르 빠져나가 사라짐(lose의 명사). 잃음·손실·감소."},{"w":"manage to","p":"phr.","m":"가까스로 ~하다","f":0,"i":"빡빡한 상황에서 겨우 고삐를 쥐고 몰아붙여(manage) 결국 해냄. 가까스로 ~해내다."},{"w":"meditate","p":"v.","m":"명상하다","f":0,"i":"마음의 한가운데(med-가운데)로 들어가 조용히 곱씹으며 머묾. 명상하다·깊이 궁리하다."},{"w":"minimize","p":"v.","m":"최소로 하다","f":0,"i":"덩치 큰 것을 가장 작은(mini-) 크기로 꾹 눌러 줄임. 최소화하다, 축소해 보다."},{"w":"mutable","p":"a.","m":"변덕스러운","f":0,"i":"손대는 대로 모양이 휙휙 바뀌는(mut바꾸다) 물렁한 성질. 변하기 쉬운·변덕스러운. (문어체)"},{"w":"neglect","p":"v.","m":"무시하다","f":0,"i":"골라야 할 것을 집어 들지 않고(neg-안 + lect고르다) 옆으로 흘려버림. 소홀히 하다·방치하다."},{"w":"negligence","p":"n.","m":"무관심, 소홀함","f":0,"i":"마땅히 챙길 것을 집어 들지 않고(neg-안 + lig고르다) 내버려둔 상태. 태만·부주의·소홀함."},{"w":"obsolete","p":"a.","m":"쓸모 없게 된, 시대에 뒤진","f":0,"i":"낡은 기계가 창고 구석에서 먼지를 뒤집어쓴 채 아무도 안 쓰는 상태 (ob-맞서서 + sol닳다). 세월에 밀려 '더는 안 통하는' 퇴물이 됨."},{"w":"official","p":"n.","m":"공무원","f":0,"i":"관청 도장을 손에 쥔 사람 — 공적 권한을 위임받아 그 자리에 앉은 이. office(직무)에서 나온 '직에 매인 사람'."},{"w":"organization","p":"n.","m":"단체","f":0,"i":"따로 놀던 부품들을 하나의 살아있는 몸(organ 기관)처럼 짜맞춰 돌아가게 엮은 것. 그래서 '유기적으로 조직된 단체'."},{"w":"participate","p":"v.","m":"참여하다, 관여하다","f":0,"i":"한 덩어리(part)를 손으로 붙잡아(cap잡다) 자기 몫으로 끌어안고 그 안에 발을 들임 (part부분 + cip잡다). 그래서 '한몫 끼어 참여'."},{"w":"persistence","p":"n.","m":"영속","f":0,"i":"발을 딱 붙이고 서서(sist서다) 끝까지(per-관통) 버티며 안 물러섬. 그 버팀이 시간으로 이어지면 '영속·끈질김'."},{"w":"premier","p":"a.","m":"최상의, 제1위의, 최고의","f":0,"i":"줄 맨 앞에 딱 선 첫 번째 사람 (pre-앞) — 그래서 최고·수석. 명사면 총리(내각의 1번)."},{"w":"proportion","p":"n.","m":"몫, 부분","f":0,"i":"전체 몫(portion)을 앞에 펼쳐놓고(pro-앞으로) 서로 크기를 견줘 나눈 배분. 그래서 '비율·몫'."},{"w":"prosperity","p":"n.","m":"번영, 번창","f":0,"i":"곡식이 바라던 방향으로 쭉쭉 뻗어 나가 곳간이 그득 찬 상태 (pro-앞으로 + sper희망). 앞날이 술술 풀림 = 번영."},{"w":"prosperous","p":"a.","m":"번영하고 있는, 번창하는, 부유한","f":0,"i":"돛에 순풍 받아 앞으로 쭉 나아가듯 일이 술술 풀려 살림이 불어난 (pro-앞으로 + sper희망). 그래서 '번창하는·부유한'."},{"w":"provisional","p":"a.","m":"일시적인, 잠정적인, 임시의","f":0,"i":"본 건물 짓기 전에 앞서 미리(pro-앞 + vis보다) 급히 세운 가건물. '지금만 임시로'라 언제든 헐릴 잠정적인 것."},{"w":"purge","p":"v.","m":"깨끗이 하다","f":0,"i":"물을 확 쏟아 안의 더러운 것을 싹 씻어내 순수하게(pur-순수) 만듦. 몸이면 배설, 조직이면 불순분자 '숙청'."},{"w":"purpose","p":"n.","m":"목적","f":0,"i":"마음 앞에(pur-=pro앞) 딱 놓아둔(pos놓다) 하나의 과녁 — 거길 향해 나아가려는 '목적'."},{"w":"purposeful","p":"a.","m":"목적이 있는, 의미 있는","f":0,"i":"목적이라는 과녁을 눈에 딱 박고 한눈 안 팔고 움직이는 모습. 그래서 '의도가 뚜렷한·야무진'."},{"w":"queue","p":"n.","m":"줄 v. 줄을 서다","f":0,"i":"은행 창구 앞에 한 줄로 늘어선 사람들의 긴 꼬리(원래 '꼬리'). (영국식) 미국은 보통 line을 씀."},{"w":"reduce","p":"v.","m":"줄이다, 감소시키다","f":0,"i":"부풀었던 것을 뒤로·아래로(re-뒤) 도로 끌어내려(duce이끌다) 크기를 낮춤. 그래서 '줄이다'."},{"w":"reluctant","p":"a.","m":"주저하는, 마음이 내키지 않는","f":0,"i":"가자는 손에 끌려가면서도 뒤로(re-뒤) 몸을 버티며 씨름하듯 저항하는(luct몸부림) 상태. 그래서 '마지못해 하는'."},{"w":"repress","p":"v.","m":"억제하다, 억누르다","f":0,"i":"솟구치려는 것을 손바닥으로 도로(re-뒤) 꾹 눌러(press누르다) 못 올라오게 함. 감정·반란을 '억누름'."},{"w":"repression","p":"n.","m":"억제, 억압, 진압","f":0,"i":"튀어오르려는 것을 계속 도로 눌러 가둔 상태 (re-뒤 + press누르다). 감정의 억압, 시위의 진압."},{"w":"retreat","p":"v.","m":"물러서다, 후퇴하다 n. 피난처","f":0,"i":"적 앞에서 발길을 도로(re-뒤) 돌려 뒤로 끌며(treat=tract끌다) 빠짐. 그 물러난 안전한 곳이 '피난처'."},{"w":"ridge","p":"n.","m":"산등성이","f":0,"i":"산의 두 비탈이 만나 위로 솟은 긴 등뼈 같은 선 — 산등성이. 지붕 꼭대기 마루선도 같은 그림."},{"w":"savvy","p":"n.","m":"상식, 기지, 재치","f":0,"i":"'알다(스페인어 sabe)'에서 온 말 — 척 보면 상황을 꿰뚫어 아는 실전 감각·눈치. (구어체) tech-savvy처럼 '~에 훤한'."},{"w":"scratch","p":"v.","m":"할퀴어 상처를 내다","f":0,"i":"손톱·발톱이 살갗을 쫙 긁어 가느다란 줄 상처를 냄. 긁는 그 날카로운 촉감이 핵심."},{"w":"secondary","p":"a.","m":"두 번째의, 보조적인","f":0,"i":"1번 뒤에 붙은 두 번째 줄 — 그래서 '주(主)가 아닌 곁다리·부차적'. 중등학교(secondary school)도 초등 다음 단계."},{"w":"shatter","p":"v.","m":"산산이 부수다, 파괴하다","f":0,"i":"유리컵이 바닥에 떨어져 사방으로 파편이 튀며 산산조각 남. 순간적 '와장창' 깨짐이 핵심."},{"w":"skyrocket","p":"v.","m":"높아지다, 급등하다","f":0,"i":"쏘아올린 불꽃 로켓이 하늘로 슉 치솟듯, 값·수치가 수직으로 급등함. 그림 그대로 '치솟다'."},{"w":"slimmer","p":"a.","m":"얼마 안 되는, 적은, 호리호리한","f":0,"i":"허리띠를 한 칸 더 조인 듯 폭이 더 얇아진(slim) 비교급 — 몸매면 더 날씬, 양·가능성이면 더 빠듯·희박."},{"w":"solicitation","p":"n.","m":"간청","f":0,"i":"상대 마음을 통째로 흔들어(sol전체 + cit흔들다) 뭔가 달라고 조르는 행위. 기부·표를 '간청·권유'함. (문어·격식체)"},{"w":"species","p":"n.","m":"종, 종류","f":0,"i":"겉모습(spec보다)이 똑같이 생긴 것끼리 묶은 한 무리 — '보이는 종류'가 곧 '종'. 단수·복수 형태 같음(주의)."},{"w":"specifically","p":"ad.","m":"명확하게, 특히","f":0,"i":"손가락으로 콕 집어 '바로 이것'이라고 또렷이 가리키듯(spec보다) 말함. 그래서 '구체적으로·특히'."},{"w":"standardization","p":"n.","m":"표준화, 규격화","f":0,"i":"제각각인 것들을 하나의 깃발(standard 기준)에 맞춰 똑같은 규격으로 줄 세움. 그래서 '표준화'."},{"w":"subjective","p":"a.","m":"주관적인, 개인적인","f":0,"i":"세상을 '내 눈 밑에(sub-아래) 던져진(ject던지다)' 내 시점으로만 봄 — 나라는 주체에 갇힘. 그래서 '주관적'."},{"w":"swallow","p":"v.","m":"삼키다, 들이키다","f":0,"i":"입에 든 것을 목구멍 아래로 꿀꺽 넘겨 몸속으로 내려보냄. 그 '넘어가는' 감각이 핵심. (제비를 뜻하기도)"},{"w":"tender","p":"a.","m":"부드러운, 약한","f":0,"i":"손끝으로 살짝만 눌러도 쑥 들어갈 만큼 여리고 무른 — 고기가 연하고, 마음이 다정하고, 상처가 건드리면 아픔."},{"w":"tract","p":"n.","m":"넓은 면적, 지대","f":0,"i":"쭉 끌어당겨 편(tract끌다) 넓은 땅덩어리 한 폭 — 광활한 지대. 몸속의 소화관(관 모양 길)도 tract."},{"w":"tribe","p":"n.","m":"집단, 무리","f":0,"i":"같은 핏줄·풍습으로 뭉쳐 한 우두머리 밑에 모여 사는 사람 무리 — 부족. 넓게는 같은 성향의 '집단'."},{"w":"turnaround","p":"n.","m":"방향 전환","f":0,"i":"차를 U자로 홱 돌려 왔던 반대 방향으로 감 — 상황·실적이 나쁘다가 반대로 확 뒤집혀 좋아지는 '반전·회생'."},{"w":"unaffected","p":"a.","m":"영향을 받지 않은","f":0,"i":"밖에서 아무리 건드려도(affect영향) 안(un-) 흔들리고 원래 그대로 있음. 그래서 '영향 안 받은·태연한'."},{"w":"uncompromising","p":"a.","m":"타협하지 않는, 단호한","f":0,"i":"서로 중간에서 만나 손잡길(compromise 타협) 딱 거부하고(un-) 자기 선을 한 치도 안 물림. 그래서 '단호한'."},{"w":"upset","p":"v.","m":"당황하게 하다, 뒤엎다 a. 기분 상한","f":0,"i":"잘 세워둔 것을 확 위로(up) 뒤엎어(set) 안의 것이 쏟아짐. 뱃속·마음·판세가 '뒤집혀' 상하고 당황함."},{"w":"verify","p":"v.","m":"확인하다","f":0,"i":"진짜(ver진실)인지 하나하나 대조해 도장을 찍듯 사실로 굳힘(fy만들다). 그래서 '진위를 확인·입증'."},{"w":"vibration","p":"n.","m":"감촉, 느낌, 분위기, 진동","f":0,"i":"팽팽한 줄이 튕겨 파르르 떨며 그 떨림이 공기로 퍼짐 — 물리적 진동. 그 미묘한 떨림이 사람 사이 '분위기·느낌(vibe)'으로도."},{"w":"vulgar","p":"a.","m":"상스러운, 천박한","f":0,"i":"고상한 자리에 안 어울리는, 길거리 대중(vulg-무리)의 거칠고 상스러운 말투·행동. 그래서 '천박한'."},{"w":"wipe","p":"v.","m":"닦다, 닦아 내다","f":0,"i":"천으로 표면을 쓱 밀어 붙은 것을 훑어 없앰. 그 '문질러 지우는' 동작이 핵심."},{"w":"abusive","p":"a.","m":"남용하는","f":0,"i":"정상 범위에서 벗어나(ab-떨어져) 마구 써대며(use) 상대를 짓밟는 — 폭언·학대하는. ab-가 '빗나간 사용'을 뜻함."},{"w":"administer","p":"v.","m":"관리하다, 운영하다","f":0,"i":"곁에서(ad-쪽으로) 잔심부름하듯(minister시중들다) 일이 굴러가게 챙겨 돌봄 — 조직을 '운영', 약을 '투여'."},{"w":"administrator","p":"n.","m":"행정관","f":0,"i":"조직이 굴러가게 곁에서 챙기고 다스리는 사람 (ad-쪽으로 + minister시중들다). 그래서 '관리자·행정관'."},{"w":"agility","p":"n.","m":"민첩성","f":0,"i":"몰던 소를 홱홱 모는(ag몰다) 듯 몸을 재빠르게 이리저리 트는 능력 — 날렵함·민첩성."},{"w":"appalling","p":"a.","m":"소름 끼치는","f":0,"i":"얼굴이 하얗게(pall창백) 질릴 만큼 끔찍해 온몸이 오싹 굳는 (ap-쪽으로). 그래서 '소름 끼치는·경악스러운'."},{"w":"arrangement","p":"n.","m":"배열","f":0,"i":"흐트러진 것을 한 줄(rang열)로 반듯이 세워 정돈해 둔 배치. 그래서 '배열·정리·(만남의) 준비'."},{"w":"ash","p":"n.","m":"재","f":0,"i":"다 타버린 뒤 남은 잿빛 부스러기 가루 — 재. 특별한 감각 이미지 없음, 뜻 그대로."},{"w":"at all cost","p":"phr.","m":"어떤 희생을 치르더라도, 기어코","f":0,"i":"값이 얼마가 나오든 계산 안 하고 무조건 사겠다는 각오 — 어떤 희생을 치르더라도 기어코."},{"w":"at risk","p":"phr.","m":"위험한 상태에","f":0,"i":"발밑이 낭떠러지라 언제 떨어질지 모르는 상태 — 위험에 노출돼 있음. children at risk = 위기의 아이들."},{"w":"belief","p":"n.","m":"믿음","f":0,"i":"증거 없이도 '이건 참이다'라고 마음에 꽉 붙들어(lief=love아끼다) 놓지 않는 것 — 믿음."},{"w":"bragger","p":"n.","m":"허풍선이","f":0,"i":"가슴을 쫙 펴고 자기 자랑을 큰소리로 떠벌리는(brag) 사람 — 허풍선이. (구어체)"},{"w":"buildup","p":"n.","m":"증대, 강화","f":0,"i":"벽돌을 한 장씩 위로(up) 쌓아(build) 점점 덩치가 불어남 — 병력·긴장·기대의 '축적·증강'."},{"w":"calendar","p":"n.","m":"달력","f":0,"i":"날짜를 격자로 죽 늘어놓은 달력. 특별한 감각 이미지 없음 — 뜻 그대로. (철자 주의: -dar)"},{"w":"candid","p":"a.","m":"솔직한","f":0,"i":"숨김없이 환하게(cand하얗게 빛나다) 속을 다 드러내 보임 — 꾸밈없이 솔직한. 몰래 찍은 자연스러운 사진도 candid."},{"w":"capacity","p":"n.","m":"수용력, 용량, 용적","f":0,"i":"얼마나 담아(cap잡다) 안을 수 있는지의 그릇 크기 — 용량. 사람이면 받아들일 능력·역량."},{"w":"colonize","p":"v.","m":"식민지로 개척하다","f":0,"i":"빈 땅에 사람을 심어(col경작) 자기 무리의 마을을 세워 지배함 — 식민지로 개척. colony(식민지)의 동사형."},{"w":"commission","p":"n.","m":"위원회","f":0,"i":"임무를 통째로 상대 손에 함께(com-함께) 맡겨 보냄(miss보내다) — 그 일을 위임받은 사람들의 모임이 '위원회', 맡긴 대가가 '수수료'."},{"w":"commit suicide","p":"phr.","m":"자살하다","f":0,"i":"자기 목숨을 스스로 어딘가에 던져 되돌릴 수 없게 저질러 버림 (commit-되돌릴 수 없이 실행). suicide는 sui-자기 + cide-죽이다. '자살하다'의 기본 표현."},{"w":"commitment","p":"n.","m":"위임, 서약","f":0,"i":"자신을 통째로 한쪽에 실어 보내 못 빼게 묶어둠 (com-함께 + mit-보내다). 그 묶임이 약속·헌신이 되고, 발 뺄 수 없는 상태가 곧 책무."},{"w":"coastal","p":"a.","m":"근해의, 연안의","f":0,"i":"바다와 육지가 맞닿는 해안선 그 언저리에 붙어 있음. coast(해안) + -al. '연안의'라는 뜻 그대로, 특별한 이미지 없음."},{"w":"correspond","p":"v.","m":"같다, 대응하다, 교신하다","f":0,"i":"두 편지가 서로 오가며 딱 짝을 맞춰 응답함 (cor-함께 + respond-응답하다). 그래서 서신을 주고받다, 그리고 서로 아귀가 맞아떨어지다."},{"w":"correspondence","p":"n.","m":"대응, 교신","f":0,"i":"서로 오가는 편지 뭉치, 또는 두 대상이 하나하나 아귀 맞아 겹쳐지는 대응관계 (cor-함께 + respond-응답). correspond의 명사형."},{"w":"cotton","p":"n.","m":"면","f":0,"i":"목화솜에서 뽑아낸 부드러운 흰 섬유, 면. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"covert","p":"a.","m":"은밀한","f":0,"i":"천으로 위에서 덮어 가려 안 보이게 한 상태 (cover-덮다에서). 덮개 아래 숨은 은밀한 작전. 반대말은 overt(드러난)."},{"w":"creative","p":"a.","m":"창의적인","f":0,"i":"무에서 새 형태를 빚어내는 손 (creat-만들다 + -ive). 없던 것을 만들어내는 기운, 창의적인."},{"w":"creativity","p":"n.","m":"창의성","f":0,"i":"없던 것을 새로 빚어내는 능력 그 자체 (creat-만들다). creative의 명사형."},{"w":"credibility","p":"n.","m":"신뢰","f":0,"i":"'저 사람 말은 믿고 맡겨도 된다'며 마음을 실어주게 되는 무게 (cred-믿다). 믿음을 살 만한 신뢰도."},{"w":"creek","p":"n.","m":"시내, 샛강","f":0,"i":"산·들 사이로 졸졸 흐르는 좁고 얕은 개울, 샛강. 강(river)보다 훨씬 작음. 특별한 이미지 없음 — 뜻 그대로."},{"w":"curiosity","p":"n.","m":"호기심","f":0,"i":"닫힌 상자 안이 궁금해 자꾸 들여다보고 만지작대게 만드는 근질거림 (cur-보살피다·마음쓰다). 호기심."},{"w":"definition","p":"n.","m":"정의","f":0,"i":"말의 경계선을 딱 그어 '여기까지가 이 뜻'이라고 못박음 (de-완전히 + fin-끝·경계). 경계를 그으니 곧 정의."},{"w":"definitive","p":"a.","m":"명확한","f":0,"i":"더 손댈 여지 없이 경계를 확정지어 이게 최종본이라 못박은 상태 (de- + fin-끝). '이걸로 끝, 결정판'인 명확함."},{"w":"disastrous","p":"a.","m":"비참한, 피해가 막심한","f":0,"i":"별(astro)이 흩어져 나쁜 자리로 어긋난 흉조 — 재앙이 쏟아짐 (dis-어긋남 + astr-별). 옛 점성술에서 별자리가 틀어지면 재앙. 피해 막심한."},{"w":"discard","p":"v.","m":"버리다","f":0,"i":"손에 쥔 카드를 확 흩뿌려 던져 버림 (dis-흩어짐 + card-카드). 필요 없는 걸 내던져 버리다."},{"w":"disgruntled","p":"a.","m":"불만족스러운","f":0,"i":"속으로 계속 툴툴 돼지처럼 꿍얼대는 불만 가득한 얼굴 (gruntle-툴툴대다). 대접이 성에 안 차 뾰로통한."},{"w":"disillusionment","p":"n.","m":"환멸","f":0,"i":"곱게 씌워진 환상(illusion)의 껍질이 벗겨져 맨 현실만 남은 씁쓸함 (dis-제거 + illusion-환상). 콩깍지가 벗겨진 환멸."},{"w":"dispersion","p":"n.","m":"살포, 분산","f":0,"i":"한 점에 뭉쳐 있던 것들이 사방으로 확 흩뿌려져 퍼짐 (dis-흩어짐 + spers-뿌리다). 살포·분산. (문어·학술체)"},{"w":"embroil","p":"v.","m":"휩쓸리게 하다, 뒤얽히게 하다","f":0,"i":"펄펄 끓는(broil) 국물 속으로 사람을 확 밀어넣어 엉키게 함 (em-안으로 + broil). 분쟁·혼란에 휩쓸리게 하다. (문어체)"},{"w":"enrage","p":"v.","m":"몹시 화나게 하다","f":0,"i":"속에 분노(rage)를 확 불붙여 폭발 직전까지 몰아감 (en-~하게 만들다 + rage-격노). 몹시 화나게 하다."},{"w":"essence","p":"n.","m":"본질, 정수","f":0,"i":"여러 겹 벗겨내고 남은, 그것을 그것이게 하는 알맹이 (ess-있다·존재). 존재의 핵, 본질·정수."},{"w":"evil","p":"n.","m":"악, 악행 a. 사악한","f":0,"i":"속에서부터 뒤틀려 남을 해치려 드는 검고 사악한 기운. 특별한 어원 이미지보다 뜻 그대로 — 악, 사악한."},{"w":"exalt","p":"v.","m":"(신분을) 높이다, 찬양하다","f":0,"i":"높이(alt) 들어올려 밖으로·위로 치켜세움 (ex-밖으로 + alt-높은). 신분을 높이거나 하늘 높이 찬양하다. (문어·격식체)"},{"w":"fascination","p":"n.","m":"매혹, 매력","f":0,"i":"눈을 못 떼게 옭아매 홀려버리는 마력 (fascin-마법으로 묶다). 시선이 딱 붙어버리는 매혹."},{"w":"force","p":"v.","m":"강요하다","f":0,"i":"상대 의지를 눌러 억지로 밀어붙이는 물리적 힘. 힘(force)으로 떠밀다 → 강요하다. 뜻 그대로."},{"w":"frequency","p":"n.","m":"빈도","f":0,"i":"같은 일이 짧은 간격으로 빽빽이 자주 되풀이되는 정도 (frequ-빽빽한·잦은). 빈도."},{"w":"frighten","p":"v.","m":"놀라게 하다","f":0,"i":"갑자기 훅 튀어나와 심장이 철렁 얼어붙게 함 (fright-공포 + -en 만들다). 놀라게 하다."},{"w":"geometrical","p":"a.","m":"기하학적인","f":0,"i":"땅(geo)을 자로 재(metr) 그린 반듯한 도형·선의 세계 (geo-땅 + metr-재다). 기하학적인."},{"w":"gorge","p":"v.","m":"게걸스럽게 먹다","f":0,"i":"목구멍(gorge)이 미어지도록 마구 쑤셔 넣어 게걸스럽게 먹음. 목구멍이라는 원뜻에서 '꾸역꾸역 삼키다'로."},{"w":"helpless","p":"a.","m":"의지할 데 없는","f":0,"i":"손 내밀 데 하나 없이 홀로 내던져진 상태 (help-도움 + -less 없음). 의지할 데 없는, 속수무책의."},{"w":"helplessness","p":"n.","m":"무력함, 의지할 데 없음","f":0,"i":"아무것도 못 하고 손 놓고 있을 수밖에 없는 무력한 상태 그 자체. helpless의 명사형."},{"w":"immortality","p":"n.","m":"불멸","f":0,"i":"죽음(mort)이 결코 손댈 수 없는 상태 (im-부정 + mort-죽다 + -ity). 영원히 안 죽는 불멸."},{"w":"inconvenience","p":"n.","m":"불편, 폐","f":0,"i":"일이 함께(con) 매끄럽게 맞아떨어지지 않아(in-부정) 삐걱대며 성가심 (in-부정 + convenience-편리). 불편·폐."},{"w":"indivisible","p":"a.","m":"분할할 수 없는, 불가분의","f":0,"i":"칼로 아무리 갈라도(divide) 더는 쪼갤 수 없는 통짜 덩어리 (in-부정 + divis-나누다). 불가분의."},{"w":"innovative","p":"a.","m":"혁신적인","f":0,"i":"낡은 것 안으로(in) 새것(nov)을 들여와 판을 바꾸는 (in-안으로 + nov-새로운). 혁신적인."},{"w":"innovator","p":"n.","m":"개혁자, 혁신자","f":0,"i":"안에 새것(nov)을 들여와 판을 뒤집는 사람 (in- + nov-새로운 + -or 사람). 개혁자·혁신가."},{"w":"inquiry","p":"n.","m":"질문, 문의","f":0,"i":"속을 파고들어(in) 캐물어(quir-구하다·찾다) 답을 끄집어냄 (in-안으로 + quir-찾다). 질문·문의·조사."},{"w":"jeopardize","p":"v.","m":"위험에 빠뜨리다, 위태롭게 하다","f":0,"i":"승패가 반반인 아슬아슬한 판(jeu parti, 나뉜 게임)에 걸어 위태롭게 만듦. 소중한 걸 위험에 내던지다. (문어체)"},{"w":"latest","p":"a.","m":"최근의","f":0,"i":"시간 줄에서 가장 뒤(late)에 나온 것 — 방금 나온 최신. late의 최상급. '최근의·최신의' 뜻 그대로."},{"w":"long for","p":"phr.","m":"~을 갈망하다","f":0,"i":"무언가를 향해(for) 몸이 길게(long) 늘어나듯 애타게 뻗어감. 손 닿지 않는 걸 간절히 갈망하다."},{"w":"ludicrous","p":"a.","m":"웃기는, 익살맞은","f":0,"i":"장난·놀이(lud-놀다)가 도를 넘어 피식 웃음이 터지는 어이없음 (lud-놀다). 우스꽝스럽고 터무니없는."},{"w":"mandatory","p":"a.","m":"의무적인, 강제적인","f":0,"i":"손(man)에 명령서를 쥐여주며 '반드시 하라' 넘겨받은 것 (man-손 + dat-주다). 안 하면 안 되는 의무적인."},{"w":"manifest","p":"a.","m":"명백한, 분명한 v. 명시하다","f":0,"i":"손(man)으로 탁 잡힐 만큼 눈앞에 훤히 드러난 (man-손 + fest-잡다·치다). 누가 봐도 명백한, 드러내 보이다."},{"w":"moist","p":"a.","m":"축축한, 습기 있는","f":0,"i":"살짝 물기가 촉촉이 배어 축축한 감촉. 특별한 어원 이미지 없음 — 촉촉한 느낌 그대로."},{"w":"mutually","p":"ad.","m":"서로, 상호간에","f":0,"i":"서로 주고받으며 맞바꾸듯(mut-바꾸다) 양쪽 다에게 (mut-변하다·교환). 서로·상호간에."},{"w":"myriad","p":"a.","m":"무수한","f":0,"i":"셀 수 없이 많아 눈앞이 아득한 만(萬) 단위의 무리 (그리스어 myrias=1만). 무수한."},{"w":"noncombatant","p":"n.","m":"일반 시민, 비전투원","f":0,"i":"함께(com) 맞붙어 싸우는(bat-치다) 자가 아닌(non) 사람 (non-부정 + combat-전투). 비전투원·일반 시민."},{"w":"nonexistence","p":"n.","m":"존재하지 않음","f":0,"i":"밖으로(ex) 나와 서 있지(sist) 않음(non) — 아예 없음 (non-부정 + existence-존재). 존재하지 않음."},{"w":"nonprofit","p":"a.","m":"비영리적인 n. 비영리 단체","f":0,"i":"앞으로(pro) 남는 이득(profit)을 챙기지 않는(non) (non-부정 + profit-이익). 비영리의, 비영리 단체."},{"w":"obstacle","p":"n.","m":"장애(물)","f":0,"i":"가는 길목에 맞서(ob) 딱 버티고 선(sta-서다) 걸림돌 (ob-맞서서 + sta-서다). 장애물."},{"w":"oppress","p":"v.","m":"억압하다","f":0,"i":"위에서 맞눌러(ob→op) 짓누름 (op-맞서·위에서 + press-누르다). 짓밟아 억압하다."},{"w":"origin","p":"n.","m":"기원","f":0,"i":"물이 처음 솟아 나오기(ori-떠오르다·생겨나다) 시작하는 발원지 (ori-일어나다). 기원·발단."},{"w":"partially","p":"ad.","m":"부분적으로, 불완전하게","f":0,"i":"전체가 아니라 한 조각(part)만큼만 (part-부분 + -ly). 부분적으로, 불완전하게."},{"w":"permissible","p":"a.","m":"허용되는, 무방한","f":0,"i":"관문을 통과(per)해 지나가도록(miss-보내다) 문을 열어줄 만한 (per-통과 + miss-보내다). 허용되는."},{"w":"positional","p":"a.","m":"위치상의, 지위의","f":0,"i":"어떤 자리에 놓인(pos-놓다) 위치·지위에 관한 (pos-놓다 + -al). 위치상의, 지위의."},{"w":"premature","p":"a.","m":"시기상조의, 너무 이른","f":0,"i":"제대로 익기(mature) 전에(pre) 미리 나와버린 (pre-앞서 + mature-익다). 설익은, 시기상조의."},{"w":"prompt","p":"v.","m":"(성장·발달·진보를) 촉진하다 a. 즉석의","f":0,"i":"무대 뒤에서 앞으로(pro) 밀어(pt) 튀어나오게 부추김 (pro-앞으로 + pt-밀다). 촉진하다, 그리고 지체 없이 즉각의."},{"w":"properly","p":"ad.","m":"적당히, 알맞게","f":0,"i":"제 것(propr-자기·고유)에 딱 맞게, 격에 어울리게 (propr-고유한 + -ly). 적당히·알맞게·제대로."},{"w":"protagonist","p":"n.","m":"리더, 지도자, 주역","f":0,"i":"무대 맨 앞(prot-첫째)에서 겨루는(agon-투쟁) 주인공 (prot-첫 번째 + agon-싸움). 주역·주인공."},{"w":"pure","p":"a.","m":"맑은, 깨끗한, 더럽혀지지 않은","f":0,"i":"다른 것이 하나도 섞이지 않은 맑은 물 한 잔 — 잡티 제로 상태. 그 순수함에서 '깨끗한', 도덕적으로 '순결한', 섞임 없는 '순전한'까지 뻗는다."},{"w":"reckless","p":"a.","m":"무모한","f":0,"i":"reck(신경 쓰다)이 -less(없음). 결과를 아예 신경 안 쓰고 눈 감고 액셀 밟는 상태 — 무모함."},{"w":"reform","p":"v.","m":"개혁하다, 혁신하다","f":0,"i":"re-다시 + form모양. 망가진 것을 다시 빚어 새 모양으로 만듦 — 제도·사람을 뜯어고쳐 바로잡는 개혁."},{"w":"religious","p":"a.","m":"신앙심이 깊은, 종교적인","f":0,"i":"신 앞에 다시(re-) 자신을 묶어(lig=묶다) 매는 마음. 그 묶임의 강도가 곧 신앙심 — 독실한, 종교의."},{"w":"remembrance","p":"n.","m":"기억, 추억, 회상","f":0,"i":"re-다시 + member(마음에 되새김). 지나간 것을 다시 마음속으로 불러오는 행위 — 기억·추억. (다소 문어체, 회화에선 memory)"},{"w":"renovation","p":"n.","m":"수선, 수리","f":0,"i":"re-다시 + nov새롭게(nova=새). 낡은 건물을 다시 새것처럼 갈아엎어 손봄 리 + commuting통근. 사무실까지 멀리 안 가고 집에서 원격으로 일함 — 재택근무."},{"w":"tend to","p":"phr.","m":"~하는 경향이 있다","f":0,"i":"마음이 한쪽으로 자꾸 기울어(tend=뻗다·기울다) 그리로 흘러감 — ~하는 경향이 있다."},{"w":"tip","p":"n.","m":"정보, 비법, 비결","f":0,"i":"귀에 살짝 찔러 넣어주는 뾰족한 끝 정보 한 조각 — 남모르는 비법·귀띔. (끝·팁을 주다에서 파생)"},{"w":"tout","p":"v.","m":"성가시게 권유하다, 강매하다","f":0,"i":"지나가는 사람 소매를 붙잡고 '이거 사세요' 하고 요란하게 밀어붙여 선전함 — 성가시게 권유·강매하다."},{"w":"unfit","p":"a.","m":"부적당한, 걸맞지 않은","f":0,"i":"un-부정 + fit(딱 맞음). 자리에 끼워 넣으려는데 크기·자격이 안 맞아 겉도는 상태 — 부적당한."},{"w":"unintended","p":"a.","m":"고의가 아닌","f":0,"i":"un-부정 + intend(안으로 마음을 겨눔). 겨누지 않았는데 어쩌다 생긴 결과 — 의도치 않은·고의 아닌."},{"w":"upstream","p":"n.","m":"상류","f":0,"i":"up-위로 + stream물줄기. 물이 흘러온 쪽, 즉 강을 거슬러 올라간 위쪽 — 상류."},{"w":"via","p":"prep.","m":"~을 통해서, ~에 의해서","f":0,"i":"'길(way)'이 어원 — 목적지로 곧장이 아니라 중간의 어느 지점·수단을 거쳐 통과함. ~을 거쳐서·~을 통해서."},{"w":"weight","p":"n.","m":"무게","f":0,"i":"저울 위에 얹었을 때 아래로 눌러 내리는 그 묵직함 — 무게. 비유로 발언·증거의 '무게(중요도)'까지."},{"w":"accuracy","p":"n.","m":"정확성","f":0,"i":"ac-쪽으로 + cur(care, 세심함). 과녁 정중앙을 향해 오차 없이 딱 맞힌 정도 — 정확성."},{"w":"Admission Office","p":"phr.","m":"입국심사소","f":0,"i":"admission(ad-쪽으로 + miss들여보냄)의 사무실 — 안으로 들여보낼지 심사하는 곳. (교육 맥락에선 '입학처'가 표준; '입국심사'는 immigration)"},{"w":"admission standards","p":"phr.","m":"입학 기준","f":0,"i":"안으로 들여보낼(admission) 최소 기준선(standards) — 이 선을 넘어야 입학 허가. 입학 기준."},{"w":"advisable","p":"a.","m":"권할 만한, 현명한","f":0,"i":"ad-쪽으로 + vis(보다·조언). 상황을 봤을 때 그리 가라고 권할 만한 — 현명한·바람직한."},{"w":"advisory","p":"a.","m":"조언하는","f":0,"i":"조언(advise)하는 성격의 — 결정권은 없고 옆에서 봐주며 권고만 하는. 자문의·조언하는."},{"w":"appearance","p":"n.","m":"겉모습, 외양","f":0,"i":"ap-쪽으로 + pear(나타나다). 눈앞에 불쑥 드러나 보이는 겉면 — 겉모습·외양, 그리고 '등장'."},{"w":"artificial","p":"a.","m":"인공적인","f":0,"i":"art기술 + fic만듦(fac). 자연이 아니라 사람 손기술로 일부러 만들어낸 것 — 인공적인."},{"w":"astounding","p":"a.","m":"놀라운","f":0,"i":"벼락(thunder)에 맞은 듯 멍하니 입 벌어지게 만드는 — 놀라운·경악스러운. amazing보다 충격이 셈."},{"w":"atop","p":"prep.","m":"~의 꼭대기에 있는","f":0,"i":"a-(on) + top꼭대기. 딱 그 위 정상에 얹혀 있는 — ~의 꼭대기에. (문어·격식체)"},{"w":"behave","p":"v.","m":"행동하다, 처신하다","f":0,"i":"be- + have(자신을 지니다·다루다). 남 앞에서 자기 몸가짐을 어떻게 쥐고 있는지 — 행동하다·처신하다."},{"w":"behavior","p":"n.","m":"태도, 행동거지, 행실, 품행","f":0,"i":"자기 몸가짐을 다루는(behave) 방식의 총체 — 겉으로 드러나는 태도·행실·품행."},{"w":"behavioral","p":"a.","m":"행동의","f":0,"i":"behavior(행동)의 형용사형 — 겉으로 드러난 행동에 관한. 행동의."},{"w":"bishop","p":"n.","m":"주교, 감독","f":0,"i":"교구를 위에서 감독하는 높은 성직자 — 주교. 특별한 감각 이미지 없음, 뜻 그대로. (체스의 '비숍'도 같은 말)"},{"w":"blunt","p":"a.","m":"무딘","f":0,"i":"날이 뭉툭해 잘 안 드는 칼끝 — 무딘. 사람에 쓰면 에두르지 않고 뭉툭하게 직설적인."},{"w":"candle","p":"n.","m":"양초","f":0,"i":"심지에 불붙여 녹아내리며 타는 양초. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"chasm","p":"n.","m":"깊은 구렁, 빈틈","f":0,"i":"발밑 땅이 쩍 갈라져 바닥이 안 보이게 벌어진 깊은 틈 — 깊은 구렁. 비유로 메우기 힘든 견해차·간극."},{"w":"clutter","p":"v.","m":"허둥지둥 달리다, 재잘재잘 지껄이다","f":0,"i":"물건이 아무렇게나 어질러져 발 디딜 틈 없이 뒤엉킴 — 어지럽히다·잡동사니. (제시된 '허둥지둥'은 clatter와 혼동된 뜻)"},{"w":"compartment","p":"n.","m":"구획","f":0,"i":"com-함께 + part나눔. 하나의 공간을 칸막이로 나눠 만든 각각의 방·칸 — 구획."},{"w":"concurrently","p":"ad.","m":"동시에 발생하여","f":0,"i":"con-함께 + cur(흐르다·달리다). 두 일이 나란히 같이 달려감 — 동시에 진행되어. (문어·격식체)"},{"w":"confectionary","p":"a.","m":"과자의, 캔디의","f":0,"i":"con-함께 + fect만듦. 설탕·재료를 함께 버무려 만든 단것에 관한 — 과자의·제과의."},{"w":"conscientious","p":"a.","m":"양심적인","f":0,"i":"con-함께 + sci앎(science). 속에 함께 든 앎(양심)이 자꾸 찔러 대충 못 하게 함 — 양심적인·성실한."},{"w":"contempt","p":"n.","m":"경멸(감), 모욕","f":0,"i":"con-강조 + tempt(경시·업신여김). 상대를 발밑으로 깔아보며 침 뱉듯 낮잡는 마음 — 경멸·모욕."},{"w":"content","p":"n.","m":"내용물, 기사","f":0,"i":"con-함께 + ten(붙잡아 담음, tain). 그릇 안에 담겨 붙잡혀 있는 알맹이 — 내용물·내용. (강세 위치로 뜻 갈림; 형용사 conTENT는 '만족한')"},{"w":"counselor","p":"n.","m":"상담역","f":0,"i":"counsel(조언)을 주는 사람 — 곁에서 고민을 들어주며 방향을 짚어주는 상담역."},{"w":"crib","p":"n.","m":"유아용 침대","f":0,"i":"빗살 같은 난간을 두른 아기 침대. 특별한 감각 이미지 없음 — 뜻 그대로. (미국식; 영국은 cot)"},{"w":"cylinder","p":"n.","m":"원통, 원기둥, 실린더","f":0,"i":"위아래가 똑같은 둥근 관을 쭉 뽑아낸 원통 — 원기둥·실린더. 특별한 비유 없음, 형태 그대로."},{"w":"defiance","p":"n.","m":"도전, 저항","f":0,"i":"de-반대로 + fi(믿음·신뢰, fid). 권위에 등 돌리고 정면으로 맞서 대드는 태도 — 도전·저항."},{"w":"delicately","p":"ad.","m":"섬세하게, 정교하게","f":0,"i":"얇은 유리잔 다루듯 부서질까 봐 손끝에 힘을 뺀 조심스러움 — 섬세하게·정교하게."},{"w":"demanding","p":"a.","m":"힘든, 벅찬","f":0,"i":"상대에게 '더 내놔, 더 해내라'고 끊임없이 손 벌려 요구하는 상태 (demand요구하다 + -ing). 그 요구에 응하느라 진이 빠져서 '벅찬·힘든'."},{"w":"depart","p":"v.","m":"출발하다","f":0,"i":"무리에서 몸을 떼어내(de-분리) 각자 흩어져(part) 제 갈 길로 떠남. 정거장에서 기차가 플랫폼을 떠나는 그 순간."},{"w":"deputy","p":"n.","m":"대리인","f":0,"i":"우두머리가 자기 권한을 아래로 떼어(de-) 대신 짊어지게 맡긴 사람 (put=놓다). 보안관 옆 부관, 2인자가 대신 앉는 자리."},{"w":"disadvantaged","p":"a.","m":"불리한, 혜택받지 못하는","f":0,"i":"출발선에서부터 남들이 가진 이점을 흩어져(dis-반대) 빼앗긴 채 뒤에 서 있는 사람. 그래서 '혜택 못 받은·불리한'."},{"w":"disappoint","p":"v.","m":"실망시키다","f":0,"i":"약속된 자리(appoint)가 흩어져(dis-) 사라짐 — 기대하고 왔는데 정작 채워질 그림이 텅 비어 무너지는 느낌."},{"w":"distance","p":"n.","m":"거리","f":0,"i":"두 점이 서로 떨어져(di-=dis-) 벌어진 채 그 사이에 놓인(sta서다) 빈 공간. 그 간격 자체가 거리."},{"w":"dispel","p":"v.","m":"쫓아 버리다, 없애다","f":0,"i":"한데 뭉친 안개·의심·소문을 확 밀쳐(pel=밀다) 사방으로 흩어(dis-) 날려버림. 안개가 걷히듯 없앰. (문어·격식체)"},{"w":"downstream","p":"a.","m":"하류의","f":0,"i":"물이 흘러 내려가는(down) 쪽, 강물 따라 아래 방향. 특별한 비유 없이 방향 그대로 — 하류의."},{"w":"emit","p":"v.","m":"내뿜다, 발하다","f":0,"i":"안에 갇힌 빛·연기·냄새를 밖으로(e-=ex-) 내보냄(mit보내다). 굴뚝이 연기를 뿜어내듯 밖으로 쏘아 보냄."},{"w":"enrich","p":"v.","m":"풍요롭게 하다","f":0,"i":"안으로(en-) 알맹이를 채워 넣어 부유하게(rich) 만듦. 텅 빈 것에 영양·가치·색을 밀어넣어 풍요롭게."},{"w":"estimate","p":"v.","m":"평가하다, 추정하다, 견적하다","f":0,"i":"저울에 올려 대략 무게값을 매김 — 정확히 재기 전 눈대중으로 '이쯤 되겠다' 값을 세워두는 것. 그래서 추정·견적."},{"w":"evocative","p":"a.","m":"(~을) 환기시키는","f":0,"i":"닫힌 서랍 속 기억을 목소리로 불러(voc부르다) 밖으로(e-=ex-) 끄집어냄. 냄새 하나가 옛 장면을 확 소환하는 그 힘. (문어체)"},{"w":"examine","p":"v.","m":"검사하다, 조사하다","f":0,"i":"저울(exam-)에 올려 바늘이 어느 쪽으로 기우는지 뚫어지게 들여다봄. 하나하나 재보고 따져 조사하다."},{"w":"excellent","p":"a.","m":"우수한, 아주 훌륭한","f":0,"i":"다른 것들 위로(ex-밖으로·넘어) 우뚝 솟아(cel높이) 무리 밖으로 튀어나온 것. 그래서 남보다 뛰어난·우수한."},{"w":"excursion","p":"n.","m":"짧은 여행, 유람","f":0,"i":"일상 궤도 밖으로(ex-) 잠깐 뛰쳐나가(cur달리다) 한 바퀴 돌고 오는 것. 가벼운 당일치기 나들이·유람."},{"w":"exemplary","p":"a.","m":"모범적인, 훌륭한","f":0,"i":"여럿 중에서 밖으로(ex-) 하나 집어(em=잡다) 들어 '이렇게 하는 거야' 하고 내보이는 표본. 그래서 모범적인."},{"w":"fantastic","p":"a.","m":"환상적인","f":0,"i":"머릿속에 빛으로 확 떠오른(phan-보이다) 환영처럼 비현실적으로 멋진 것. 상상 속에나 있을 법한 → 환상적인."},{"w":"fantasy","p":"n.","m":"상상, 공상, 환상","f":0,"i":"눈앞에 실제로는 없는데 머릿속 스크린에 훤히 떠오른(phan-보이다) 그림. 현실 아닌 상상·공상의 장면."},{"w":"feed on","p":"phr.","m":"~을 먹고 살다","f":0,"i":"무언가를 딱 붙어(on) 먹이로 삼아 계속 먹고(feed) 삶. 사자가 먹잇감에, 곰팡이가 습기에 붙어 양분 삼는 그림."},{"w":"fledgling","p":"n.","m":"풋내기, 애송이","f":0,"i":"이제 막 깃털(fledge)이 돋아 첫 날갯짓 하는 어린 새. 아직 서툴러 비틀대는 초보 → 풋내기·애송이."},{"w":"frilly","p":"a.","m":"주름 장식이 있는, 허식이 많은","f":0,"i":"옷단·커튼 가장자리에 물결처럼 잘게 잡힌 주름 장식이 잔뜩 나풀거림. 실용 없이 장식만 많아 '허식이 많은'."},{"w":"govern","p":"v.","m":"다스리다, 통치하다, 지배하다","f":0,"i":"배의 키(gubern-키잡이)를 잡고 방향을 틀어 나라·집단을 원하는 쪽으로 몰아감. 키를 쥔 자가 다스린다."},{"w":"governor","p":"n.","m":"주지사, 통치자","f":0,"i":"그 키(govern-)를 쥔 사람 — 주(州)라는 배를 조종하는 키잡이. 주지사·통치자."},{"w":"hoofed","p":"a.","m":"굽이 있는","f":0,"i":"발끝이 딱딱한 발굽(hoof)으로 된 상태. 말·소처럼 굽 달린. 특별한 비유 없음 — 뜻 그대로."},{"w":"incorporate","p":"v.","m":"통합시키다","f":0,"i":"여러 조각을 하나의 몸통(corpor몸) 안으로(in-) 빨아들여 한 덩어리로 합침. 살에 살을 붙이듯 흡수·통합."},{"w":"inscription","p":"n.","m":"비명, 비문","f":0,"i":"돌·금속 표면을 파고들어(in-안으로) 새겨(scrib쓰다) 넣은 글자. 비석·반지 안쪽에 긁어 남긴 문구."},{"w":"integration","p":"n.","m":"통합, 합병, 융합","f":0,"i":"떨어져 있던 조각들을 건드리지 않은 온전한(integ-손대지않은) 하나로 짜맞춤. 흩어진 부분들이 한 몸이 되는 통합."},{"w":"intervention","p":"n.","m":"개입, 중재","f":0,"i":"다투는 두 사람 사이로(inter-사이) 끼어들어(ven오다) 딱 끼여 섬. 그 틈에 몸을 밀어넣는 개입·중재."},{"w":"intimacy","p":"n.","m":"친밀","f":0,"i":"겉껍질 다 벗고 가장 안쪽(intim-가장안) 속살까지 서로에게 들여보낸 사이. 그래서 깊은 친밀함."},{"w":"introductive","p":"a.","m":"입문적인, 예비","f":0,"i":"본론 안으로(intro-안으로) 손잡고 이끌어(duc이끌다) 들어가는 첫 문. 예비로 살짝 발 들이게 하는 → 입문적인."},{"w":"invariably","p":"ad.","m":"변함없이","f":0,"i":"이리저리 바뀌지(vari변하다) 않고(in-부정) 늘 같은 자리에 딱 붙어 있음. 예외 없이 언제나 → 변함없이."},{"w":"life cycle","p":"phr.","m":"생활 주기","f":0,"i":"태어나 자라 죽고 다시 이어지는(cycle둥근고리) 한 바퀴. 생명이 도는 원형 궤도 → 생활 주기."},{"w":"live out","p":"phr.","m":"삶을 이어가다","f":0,"i":"삶을 끝(out끝까지)까지 다 살아내 밖으로 펼쳐 마침. 남은 여생을, 혹은 상상을 실제로 다 살아 겪음."},{"w":"manipulate","p":"v.","m":"조작하다","f":0,"i":"손(man ,"i":"주먹처럼 뾰족한 것으로 표면을 쿡 찔러 구멍을 냄. 펀치로 종이·표에 뻥 뚫는 그 동작."},{"w":"puncture","p":"n.","m":"구멍","f":0,"i":"뾰족한 것에 찔려(punct-점·찌르다) 생긴 콕 뚫린 구멍. 타이어에 못 박혀 바람 새는 그 자리."},{"w":"rare","p":"a.","m":"드문, 진기한","f":0,"i":"성기게 흩어져 어쩌다 하나 보일까 말까 한 상태. 흔치 않아 귀한 → 드문·진기한."},{"w":"raw material","p":"phr.","m":"원자재","f":0,"i":"아직 손대지 않아 익지·다듬어지지 않은(raw날것) 재료(material). 공장에 들어가기 전 원상태 → 원자재."},{"w":"registered","p":"a.","m":"등록된","f":0,"i":"명부(register)에 이름을 올려 공식 기록에 박아둔 상태 (re-다시 + gest나르다). 등록된."},{"w":"relevance","p":"n.","m":"적절, 타당, 관련성","f":0,"i":"지금 이 얘기 쪽으로(re-) 딱 들어 올려(lev들다) 맞아떨어짐. 다루는 문제와 이어지는 정도 → 관련성·적절."},{"w":"rivet","p":"v.","m":"집중하다, 끌다, 대갈못을 박다","f":0,"i":"대갈못(rivet)을 쾅 박아 두 판을 꼼짝 못하게 고정하듯, 시선을 그 자리에 못박아 붙듦 → 집중시키다·끌다."},{"w":"roughly","p":"ad.","m":"대충, 대략","f":0,"i":"표면이 매끄럽지 않고 거칠게(rough) — 정밀하게 다듬지 않고 대충 어림잡아 → 대략."},{"w":"segregation","p":"n.","m":"분리, 차별","f":0,"i":"무리(greg-떼)에서 특정 부류를 떼어(se-분리) 딴 데로 갈라놓음. 울타리로 갈라 세운 분리·차별."},{"w":"shipping","p":"n.","m":"선적","f":0,"i":"짐을 배(ship)에 실어 바다 건너 보내는 장면. 원래 배로 나르던 것이 지금은 온갖 운송·배송을 다 가리킴."},{"w":"shipwreck","p":"n.","m":"난파선","f":0,"i":"배(ship)가 부서져(wreck) 파도에 널브러진 잔해. 부서진 배 자체 또는 그 난파 사건."},{"w":"squander","p":"v.","m":"탕진하다","f":0,"i":"손에 쥔 모래·동전을 사방으로 흩뿌려 없애버림. 돈·시간·기회를 헤프게 낭비해 날려버리다."},{"w":"stem from","p":"phr.","m":"~에서 기인하다, 일어나다, 생기다","f":0,"i":"식물 줄기(stem)가 뿌리에서 뻗어 나오듯, 어떤 일이 그 뿌리(원인)에서 자라 나옴. ~에서 기인하다."},{"w":"strong indication","p":"phr.","m":"확실한 지표","f":0,"i":"화살표가 한 방향을 강하게 콕 가리키는 느낌. 무언가를 확실히 알려주는 뚜렷한 신호·지표."},{"w":"succumb","p":"v.","m":"굴복하다","f":0,"i":"밑에서(sub-아래로) 밀려드는 무게에 무릎이 꺾여 아래로 주저앉음. 압력·유혹·병에 굴복하다."},{"w":"suicide","p":"n.","m":"자살","f":0,"i":"자기(sui-자신) 자신을 겨눠 베는(cide-죽이다) 행위. 특별한 감각 이미지 없음 — 자살 그 뜻 그대로."},{"w":"sumptuous","p":"a.","m":"호화스러운, 화려한, 값비싼","f":0,"i":"돈을 아낌없이 쏟아부어 눈이 부시게 차려낸 상·궁전. 값비싸고 호화찬란한. (문어·격식체)"},{"w":"surpass","p":"v.","m":"능가하다","f":0,"i":"남들 머리 위(sur-위로)를 넘어 앞질러 지나감(pass). 기준·경쟁자를 능가하다."},{"w":"tempt","p":"v.","m":"유혹하다, 마음을 끌다","f":0,"i":"달콤한 미끼를 눈앞에 살랑살랑 흔들어 손을 뻗게 만듦. 을 그림. 당기는 힘에서 관심을 '끌다', 팽팽히 당겨 비긴 '무승부'까지 파생."},{"w":"duration","p":"n.","m":"내구성, 존속, 지속","f":0,"i":"모래시계 모래가 다 흐를 때까지 딱딱하게(dur-단단하다) 버텨 이어지는 시간 폭. 지속 기간."},{"w":"emerging","p":"a.","m":"최근 생겨난","f":0,"i":"물속에서(e-밖으로+merg잠기다) 수면 위로 막 솟아오르는 순간. 이제 막 떠오르는·신흥의."},{"w":"emotional","p":"a.","m":"감정적인","f":0,"i":"속에 있던 감정이 밖으로(e-밖으로+mot움직이다) 왈칵 밀려 나옴. 감정에 휩쓸린, 감정적인."},{"w":"equipment","p":"n.","m":"장비, 설비","f":0,"i":"일을 하러 배(ship)에 필요한 물건을 고루(equip) 갖춰 실어둔 것. 장비·설비 일습."},{"w":"exception","p":"n.","m":"예외","f":0,"i":"무리에서 하나를 밖으로(ex-밖으로) 집어내(cept-잡다) 따로 빼둠. 규칙 밖에 놓인 예외."},{"w":"exceptionally","p":"ad.","m":"예외적으로, 유난히","f":0,"i":"여럿 중 하나만 밖으로 쏙 빼낼 만큼 유별나게. 예외적으로, 유난히·눈에 띄게."},{"w":"exempt","p":"v.","m":"면제하다 a. 면제된","f":0,"i":"짐을 밖으로(ex-밖으로) 들어내(empt-사다·취하다) 의무에서 벗어나게 함. 면제하다·면제된."},{"w":"expansion","p":"n.","m":"확장, 팽창","f":0,"i":"안에 있던 것이 밖으로(ex-밖으로) 쫙 펼쳐지며(pand-펴다) 부풀어 커짐. 확장·팽창."},{"w":"fancy","p":"a.","m":"화려한","f":0,"i":"머릿속 상상(fantasy)을 잔뜩 얹어 눈길을 끌게 꾸민. 화려한·고급스러운. (구어에선 '멋들어진')"},{"w":"fondness","p":"n.","m":"좋아함, 호감","f":0,"i":"누군가·무언가를 볼 때 마음이 스르르 녹는 따뜻한 애정. 좋아함, 호감."},{"w":"gradual","p":"a.","m":"점차적인, 점진적인","f":0,"i":"계단(grad-걸음·단계)을 한 칸씩 천천히 밟아 올라감. 조금씩 진행되는, 점진적인."},{"w":"guarantee","p":"n.","m":"보증","f":0,"i":"'내가 책임진다'며 도장 꽝 찍어 약속을 뒤에서 받쳐줌. 품질·이행을 보증."},{"w":"harmony","p":"n.","m":"조화","f":0,"i":"여러 음·요소가 서로 딱 맞물려(harm-맞추다·짜맞춤) 어우러지는 울림. 조화."},{"w":"hassle","p":"n.","m":"말다툼, 싸움","f":0,"i":"성가시게 서로 밀고 당기며 옥신각신하는 자잘한 실랑이. 큰 싸움이 아니라 '아 귀찮아' 소리 나오는 번거로운 승강이 — 명사로 '번거로운 일', 동사로 '들볶다'."},{"w":"hitherto","p":"ad.","m":"지금까지는","f":0,"i":"지금 이 지점까지 쭉 끌고 온 시간의 선 — 여기(hither)까지(to). 'hitherto unknown(지금껏 알려지지 않은)'처럼 딱 여기서 끊고 그 뒤는 달라진다는 뉘앙스. (문어·격식체)"},{"w":"impossible","p":"a.","m":"불가능한","f":0,"i":"안으로(im-) 들어갈 문 자체가 없음 — 될(possible) 수가 없게 막힘. 부정 접두사 im-이 possible을 통째로 부정."},{"w":"incorrect","p":"a.","m":"부정확한, 틀린","f":0,"i":"곧게(correct) 뻗어야 할 것이 안(in-) 맞아 어긋남. 정답 선에서 살짝 빗나간 상태."},{"w":"insignia","p":"n.","m":"휘장","f":0,"i":"가슴·어깨에 콕 박아(in-) 넣은 표식(sign) — 계급·소속을 한눈에 알리는 휘장·문장. '이 사람은 이 집단' 도장 같은 마크."},{"w":"interact with","p":"phr.","m":"~와 상호 작용하다","f":0,"i":"두 사람이 사이(inter-)에서 서로에게 작용(act)을 주고받음 — 공을 티키타카 주고받듯 상호로 오감."},{"w":"interference","p":"n.","m":"간섭, 방해","f":0,"i":"두 흐름이 사이(inter-)에서 서로 부딪쳐(fere치다) 원래 가던 길을 막음 — 남의 일에 끼어들어 방해하거나, 전파가 겹쳐 지지직거림."},{"w":"landlord","p":"n.","m":"(여관 따위의) 주인, 집주인","f":0,"i":"그 땅(land)의 주인(lord) — 세입자 위에 군림하며 방세를 걷는 집주인. 특별한 비유 없음, 글자 그대로 '땅의 영주'."},{"w":"landscape","p":"n.","m":"풍경","f":0,"i":"눈앞에 쫙 펼쳐진 땅(land)의 한 폭 그림 — 지평선까지 담긴 풍경. -scape는 '보이는 경치 한 컷'."},{"w":"litter","p":"v.","m":"어질러 놓다","f":0,"i":"여기저기 아무렇게나 흩뿌려 어질러 놓음 — 바닥에 널브러진 쓰레기 조각들. 명사로는 그 흩어진 쓰레기 자체."},{"w":"mansion","p":"n.","m":"대저택","f":0,"i":"머무는(man-) 거대한 저택 — 방이 수십 개인 대저택. 그냥 큰 집이 아니라 위압적으로 웅장한 규모."},{"w":"marble","p":"n.","m":"대리석","f":0,"i":"차갑고 매끈한 대리석 — 무늬가 흐르듯 박힌 흰 돌. 특별한 감각 이미지 없음, 뜻 그대로. (구슬 놀이의 '구슬'도 같은 단어)"},{"w":"naysayer","p":"n.","m":"거부자, 반대자","f":0,"i":"무슨 말만 나오면 '아니(nay)'라고 말하는(say) 사람 — 늘 고개 젓는 반대꾼. 예스맨의 정반대."},{"w":"needle","p":"n.","m":"바늘","f":0,"i":"가늘고 뾰족한 바늘 — 실을 꿴 끝이 콕 찌름. 특별한 감각 이미지 없음, 뜻 그대로."},{"w":"noodle","p":"n.","m":"국수","f":0,"i":"길게 늘어진 국수 가닥. 특별한 감각 이미지 없음, 뜻 그대로."},{"w":"outcast","p":"n.","m":"추방자, 부랑자","f":0,"i":"무리 밖으로(out-) 던져진(cast) 사람 — 공동체가 내던져 버린 추방자. cast=던지다라 '밖으로 내던져진 자'."},{"w":"overcrowd","p":"v.","m":"혼잡하게 하다","f":0,"i":"정원을 넘어(over-) 사람을 꽉꽉 밀어 넣어(crowd) 발 디딜 틈 없이 만듦 — 만원 지하철 상태."},{"w":"overnight","p":"ad.","m":"하룻밤 사이에, 갑자기","f":0,"i":"밤(night)을 하나 넘기는(over-) 사이에 확 바뀜 — 하룻밤 자고 나니 상황이 뒤집힌 느낌. '하룻밤 새 유명해졌다'의 그 갑작스러움."},{"w":"pantry","p":"n.","m":"식료품 저장실","f":0,"i":"부엌 옆 식료품을 쟁여 둔 작은 저장실 — 선반에 통조림·밀가루가 줄지어 쌓인 방. 특별한 비유 없음, 뜻 그대로."},{"w":"perforated","p":"a.","m":"구멍이 뚫린","f":0,"i":"끝까지 관통해(per-) 뚫린(forate) 구멍들이 죽 늘어선 상태 — 우표·노트 뜯는 선처럼 점점이 뚫림."},{"w":"physical abuse","p":"phr.","m":"신체적 학대, 폭행","f":0,"i":"몸(physical)에 직접 가하는 폭력 — 때리고 밀치는 신체적 학대. abuse는 '잘못(ab-빗나간) 쓰다'에서 온 남용·학대."},{"w":"portfolio","p":"n.","m":"서류첩, 접는 가방","f":0,"i":"서류(folio)를 나르는(port-) 납작한 가방 — 작품·자료를 한데 담아 들고 다니는 첩. port=나르다라 '들고 다니는 서류철'. 투자·작품 모음집도 같은 이미지."},{"w":"potent","p":"a.","m":"강력한","f":0,"i":"안에 힘(pot-능력)이 꽉 차 터질 듯한 상태 — 한 방이 세게 먹히는 강력함. 약·술·주장이 '독하고 세다'."},{"w":"preeminent","p":"a.","m":"우수한, 탁월한","f":0,"i":"무리 앞에서(pre-) 머리 하나가 툭 튀어나온(eminent솟은) 존재 — 남들보다 우뚝 솟아 눈에 띄는 최고. (문어·격식체)"},{"w":"privilege","p":"n.","m":"특권, 특전, 특별 취급","f":0,"i":"특정 개인(privi-사적) 한 사람에게만 따로 정해준(lege법) 혜택 — 남은 못 받는 '너만' 누리는 특권."},{"w":"professionally","p":"ad.","m":"직업적으로, 전문적으로","f":0,"i":"돈 받고 하는 프로답게 — 아마추어가 아니라 직업·전문가 수준으로. '취미로'의 반대 감각."},{"w":"pump","p":"v.","m":"펌프로 공기를 넣다","f":0,"i":"손잡이를 위아래로 눌러 공기·물을 밀어 넣거나 뽑아 올림 — 자전거 바퀴에 바람 넣는 그 동작. 리듬 있게 밀어 올리는 감각."},{"w":"range","p":"v.","m":"범위에 이르다","f":0,"i":"산맥이 죽 늘어서듯, 최저점에서 최고점까지 쭉 뻗어 걸침 — 'range from A to B(A부터 B까지 걸치다)'. 활동·거리·범위가 한 줄로 펼쳐짐."},{"w":"rational","p":"a.","m":"합리적인 / 이성적인, 합리적인","f":0,"i":"감정을 빼고 비율(ratio)에 맞춰 계산하듯 따지는 상태 — 머릿속 저울로 앞뒤 재는 이성적임. ratio(비율)에서 온 '계산이 맞는'."},{"w":"reapply","p":"v.","m":"다시 바르다, 다시 적용하다","f":0,"i":"떨어진 것을 다시(re-) 갖다 붙임(apply) — 선크림을 다시 덧바르거나, 지원서를 다시 넣음. apply=쪽으로(ap-) 붙이다."},{"w":"recent","p":"a.","m":"최근의","f":0,"i":"바로 뒤(re-)에 막 지나간 시점 — 손 뻗으면 닿을 최근의 과거. 아주 옛날이 아니라 '요즘·얼마 전'."},{"w":"refined","p":"a.","m":"정교한, 정제된","f":0,"i":"거친 것을 거듭(re-) 걸러 불순물을 뺀 상태 — 기름·설탕을 정제하듯, 말투·취향도 다듬어져 세련됨. fine(고운)에서."},{"w":"regeneration","p":"n.","m":"부활, 갱생","f":0,"i":"죽거나 닳은 것이 다시(re-) 새로 생겨남(generation) — 도마뱀 꼬리가 재생되듯, 낡은 도시가 되살아남. gen=낳다."},{"w":"reinforce","p":"v.","m":"강화하다","f":0,"i":"이미 있는 것에 힘(force)을 다시(re-) 안(in-)으로 부어 더 튼튼히 함 — 벽에 철근 덧대듯 보강. force=힘."},{"w":"relationship","p":"n.","m":"관계","f":0,"i":"두 사람·사물을 이어 뒤로(re-) 묶어 나른(lat) 연결의 끈 — 그 끈이 어떤 상태인지가 관계."},{"w":"relatively","p":"ad.","m":"상대적으로, 비교적","f":0,"i":"홀로 딱 잘라 말고, 다른 것에 견주어(relate) 보았을 때 — '절대적으로'의 반대. '비교하자면' 감각."},{"w":"righteous","p":"a.","m":"정의의, 바른","f":0,"i":"옳음(right)으로 꼿꼿이 선 사람 — 도덕적으로 곧게 바른. 때로 '지나치게 자기가 옳다'는 self-righteous의 뉘앙스도."},{"w":"rotate","p":"v.","m":"회전하다","f":0,"i":"바퀴(rota)처럼 축을 중심으로 빙 돎 — 제자리에서 회전. 당번·작물을 돌려가며 하는 '순환'도 같은 이미지."},{"w":"self-esteem","p":"n.","m":"자존심","f":0,"i":"자기(self) 자신을 값 매겨(esteem) 높이 쳐 줌 — '나는 괜찮은 사람'이라는 스스로에 대한 존중감. esteem=가치를 매기다."},{"w":"showcase","p":"v.","m":"소개하다, 진열하다","f":0,"i":"유리 진열장(case) 안에 넣어 보여줌(show) — 잘난 걸 조명 아래 딱 올려 자랑하듯 선보임."},{"w":"spill","p":"v.","m":"엎지르다, 흩뜨리다","f":0,"i":"담긴 것이 그릇 밖으로 왈칵 넘쳐 쏟아짐 — 우유가 식탁에 좍 퍼짐. 비밀을 '흘리다(spill the beans)'도 같은 새어나감."},{"w":"stereotype","p":"n.","m":"고정 관념, 관례, 전형","f":0,"i":"똑같은 활자판(type)을 딱딱하게(stereo-굳은) 찍어내듯, 한 틀에 박아 다 똑같이 여김 — '○○사람은 다 이래' 하는 굳은 틀."},{"w":"stifle","p":"v.","m":"(~의) 숨을 막다, 질식시키다","f":0,"i":"목·코를 콱 눌러 공기를 못 통하게 막음 — 숨통을 조여 질식시킴. 하품·웃음·반대 의견을 '억눌러 못 나오게' 하는 것도."},{"w":"stretch","p":"v.","m":"뻗다, 펼쳐지다, 퍼지다 n. 직선 코스","f":0,"i":"고무줄을 양끝에서 잡아당겨 쭉 늘임 — 몸·길·시간이 팽팽히 뻗어 펼쳐짐. 명사로는 쭉 뻗은 직선 구간."},{"w":"stricture","p":"n.","m":"제한, 한정","f":0,"i":"꽉 조여(strict) 옥죄는 제한 — 좁게 묶어 놓은 규제. strict(엄격한)와 한 뿌리로 '조여 묶음'. (문어·격식체)"},{"w":"stun","p":"v.","m":"깜짝 놀라게 하다","f":0,"i":"머리를 한 대 얻어맞은 듯 잠깐 멍하니 굳음 — 충격·놀람에 정신이 얼어붙는 순간. 전기충격기 stun gun의 그 '기절'."},{"w":"stunning","p":"a.","m":"놀라운, 매력적인","f":0,"i":"보는 순간 숨이 턱 막혀 멍해질 만큼 — stun(멍하게 하다)에서. '놀랍다'보다 '넋 나갈 만큼 아름답다'로 더 자주 씀."},{"w":"substantiate","p":"v.","m":"실증하다, 증명하다, 구체화하다","f":0,"i":"주장 아래(sub-) 단단한 실체(substance)를 받쳐 넣어 무너지지 않게 함 — 증거로 뒷받침해 실증함. (문어·격식체)"},{"w":"survey","p":"n.","m":"조사 v. 조사하다","f":0,"i":"높은 곳에서 위로(sur-) 전체를 죽 훑어봄(vey보다) — 땅을 측량하듯, 사람들 의견을 넓게 조사. sur-=위에서 내려다보며 스캔."},{"w":"tap water","p":"phr.","m":"수돗물","f":0,"i":"수도꼭지(tap)를 틀면 나오는 물 — 생수가 아니라 그냥 수돗물. 특별한 비유 없음, 뜻 그대로."},{"w":"target","p":"v.","m":"목표로 삼다","f":0,"i":"화살이 꽂혀야 할 과녁의 정중앙 — 눈을 딱 고정하고 겨냥함. 동사로 '그 지점을 노려 겨누다'."},{"w":"temporarily","p":"ad.","m":"일시적으로, 임시(변통)으로","f":0,"i":"시간(temp-)의 한 토막만 잠깐 쓰고 곧 거둘 상태 — 붙박이가 아니라 '지금 잠시만'. permanent(영구)의 반대."},{"w":"throw out","p":"phr.","m":"버리다","f":0,"i":"안에 있던 걸 밖으로(out) 휙 던져(throw) 버림 — 쓰레기통으로 내던지는 동작. 제안·사람을 '내치다'도 같은 바깥으로 던짐."},{"w":"unmatched","p":"a.","m":"비길 데 없는, 무적의","f":0,"i":"짝(match)이 안(un-) 맞을 만큼 상대가 없음 — 견줄 맞수가 없는 독보적 최고. '비길 데 없는'."},{"w":"unpatriotic","p":"a.","m":"비애국적인, 애국심이 없는","f":0,"i":"나라(patri-아버지의 땅)를 향한 마음이 안(un-) 서 있음 — 애국심 없는. patri=조국."},{"w":"unrelenting","p":"a.","m":"가차 없는, 무자비한","f":0,"i":"한 번 물면 결코 힘을 늦추지(relent) 않고(un-) 계속 밀어붙임 — 봐주는 법 없는 가차 없음. 비·추격·압박이 '끈질기게' 몰아침."},{"w":"versatility","p":"n.","m":"융통성이 있음","f":0,"i":"한 몸이 이쪽저쪽으로 자유롭게 방향을 트는(vers=돌다) 능력 — 여러 일에 다 잘 맞는 다재다능·융통성. vert=돌다."},{"w":"warrant","p":"n.","m":"보증","f":0,"i":"이건 확실하다고 뒤를 딱 받쳐 서 주는 보증서 — 법적으로는 '영장'(체포를 보증하는 문서). 동사로 '~할 만한 근거가 되다'."},{"w":"yield","p":"n.","m":"생산 v. 산출하다, 양보하다","f":0,"i":"누르는 힘에 못 이겨 스르르 내어줌 — 땅이 곡식을 내놓듯 산출하고, 힘에 밀려 양보함. '버티다 결국 굽힘'과 '결실을 내놓음'이 한 이미지."},{"w":"zealously","p":"ad.","m":"열심히, 열정적으로","f":0,"i":"속에서 활활 타는 열정(zeal)에 떠밀려 몰두하는 모습 — 눈에 불을 켜고 열심히. zeal=뜨거운 열의."},{"w":"anatomical","p":"a.","m":"해부학상의","f":0,"i":"몸을 칼로 갈라 근육·뼈·장기를 층층이 들여다보는 해부대 위 장면 (ana-따로떼어 + tom자르다). 그래서 '해부학상의'."},{"w":"appreciate","p":"v.","m":"감사하다","f":0,"i":"손안의 것을 가만히 보며 '이거 값나가네' 하고 값(price)을 매겨 올려주는 감각 (ad-쪽으로 + preci값). 값을 알아봐 주니 고마움·감상·가치상승 다 나옴."},{"w":"appreciative","p":"a.","m":"감사의, 감사하는","f":0,"i":"상대가 해준 것의 값을 알아보고 고개를 끄덕이는 표정. appreciate의 형용사형 — 고마워하는·감탄하는."},{"w":"assimilate","p":"v.","m":"흡수하다, 받아들이다, 동화되다","f":0,"i":"먹은 음식이 내 살(similar-같은 것)로 녹아들어 내 몸이 되는 흡수 (ad-쪽으로 + simil닮은). 지식·이민자도 내 것/우리 것으로 동화."},{"w":"attain","p":"v.","m":"달성하다, 이루다, 성취하다","f":0,"i":"손을 끝까지 뻗어 저 높이 걸린 목표에 딱 닿아 붙잡음 (ad-쪽으로 + tain붙잡다). 그래서 달성·성취."},{"w":"authentic","p":"a.","m":"진짜의","f":0,"i":"제작자가 직접 도장을 찍어 '내가 만든 진짜'라고 보증한 상태. 가짜·모조가 아닌 원본."},{"w":"bear","p":"v.","m":"가지다, 몸에 지니다","f":0,"i":"무거운 짐을 등에 얹고 견디며 나름 (fer/bear=나르다). 짐을 나르다→견디다, 몸에 지니다, 열매·아이를 배어 낳다까지 뻗음."},{"w":"biannually","p":"a.","m":"반년마다","f":0,"i":"달력에 1년 안 두 번 동그라미가 찍히는 리듬 (bi-둘 + annu해). 반년마다 한 번씩. 주의: biennially(2년마다)와 헷갈림 — TEPS 함정."},{"w":"blacksmith","p":"n.","m":"대장장이","f":0,"i":"시뻘건 쇠를 모루에 놓고 망치로 두드리는 검은 그을음의 대장장이. 특별한 이미지 없음 — 뜻 그대로 (black검은 쇠 + smith장인)."},{"w":"bold","p":"a.","m":"두드러진, 뚜렷한, 굵은","f":0,"i":"다른 것들 사이에서 확 튀어나와 눈을 찌르는 굵고 진한 획. 글자면 굵게, 사람이면 겁 없이 튀는 대담함."},{"w":"completion","p":"n.","m":"성취, 완성","f":0,"i":"빈칸이 마지막 하나까지 다 채워져 꽉 찬 상태 (com-완전히 + ple채우다). 그래서 완성·성취."},{"w":"conformity","p":"n.","m":"일치, 부합","f":0,"i":"여러 개가 하나의 틀(form)에 맞춰 같은 모양으로 찍혀 나옴 (con-함께 + form모양). 규칙·기준에 딱 들어맞음."},{"w":"consist of","p":"phr.","m":"~으로 구성되다","f":0,"i":"여러 부품이 함께 서서(stand) 하나의 덩어리를 이룸 (con-함께 + sist서다). 'A는 B들로 서 있다'→구성되다."},{"w":"consistently","p":"ad.","m":"일관적으로","f":0,"i":"같은 자리에 계속 함께 서 있어 흔들림 없음 (con-함께 + sist서다). 언제 봐도 한결같은 상태."},{"w":"contradictory","p":"a.","m":"모순된","f":0,"i":"두 말이 서로 맞서서 반대로 말함 (contra-맞서 + dict말하다). 한쪽이 참이면 다른 쪽은 거짓, 함께 설 수 없는 모순."},{"w":"corrupt","p":"a.","m":"부패한","f":0,"i":"속이 완전히 함께 썩어 문드러진 상태 (cor-완전히 + rupt깨지다·부서짐). 도덕이 깨져 무너진 부패."},{"w":"daring","p":"a.","m":"대담한, 혁신적인","f":0,"i":"낭떠러지 앞에서도 '해볼게' 하고 겁 없이 발을 내딛는 감각 (dare-감히 하다). 대담한·과감한·혁신적."},{"w":"debilitate","p":"v.","m":"쇠약하게 하다","f":0,"i":"기둥의 힘(빌리티=강함)을 아래로 빼내려 다리가 후들거리게 만듦 (de-아래로 + bil힘). 병·피로가 몸을 쇠약하게. (문어·격식체)"},{"w":"defense","p":"n.","m":"방어","f":0,"i":"적을 막으려 앞에 방패를 세워 떨어뜨려 놓음 (de-떨어뜨려 + fens치다·방어). 그래서 방어."},{"w":"directory","p":"n.","m":"주소 성명록","f":0,"i":"곧게(direct) 원하는 이름·번지로 곧장 안내해 주는 목록책 (di-따로 + rect곧게). 주소·성명록, 컴퓨터의 디렉터리도 여기서."},{"w":"dispose of","p":"phr.","m":"~을 처리하다, 버리다","f":0,"i":"물건을 여기저기 흩어 내려놓아 손에서 치워버림 (dis-흩어 + pos놓다). of가 붙으면 '없애 버리다·처리하다'."},{"w":"disposition","p":"n.","m":"배열","f":0,"i":"물건들을 여기저기 흩어 제자리에 놓아둔 배열 (dis-흩어 + pos놓다). 마음이 놓인 방식→타고난 성향으로도 뻗음."},{"w":"dominion","p":"n.","m":"지배","f":0,"i":"주인(domin=주인)이 집·영토를 손아귀에 쥐고 다스리는 지배권 (domin주인). 통치·영역."},{"w":"dramatically","p":"ad.","m":"극적으로","f":0,"i":"무대 위 극(drama)처럼 확 뒤바뀌는 큰 폭의 변화. 사소하지 않고 눈에 확 띄게 극적으로."},{"w":"dull","p":"a.","m":"무딘, 둔한","f":0,"i":"날이 뭉툭해 안 잘리고, 색·소리·머리까지 흐릿하게 죽은 감각. 뾰족·선명·재미의 반대 — 무딤·둔함·지루함."},{"w":"emphasize","p":"v.","m":"강조하다, 중시하다","f":0,"i":"여럿 중 하나에 손가락을 꾹 눌러 도드라지게 보여줌 (em-안에 + phas보이다). 그래서 강조."},{"w":"enhancement","p":"n.","m":"향상, 증대","f":0,"i":"받침을 괴어 높이(high) 한 단 더 끌어올림. 원래보다 좋게·크게 만든 향상·증대."},{"w":"entangle","p":"v.","m":"헝클어지게 하다","f":0,"i":"실이 서로 얽혀 안으로 뒤엉켜 못 빠져나오게 됨 (en-안으로 + tangle엉킴). 관계·문제에 얽혀듦."},{"w":"exclusively","p":"ad.","m":"독점적으로, 오로지","f":0,"i":"문을 닫아 다른 것들을 다 밖으로 밀어내고 오직 하나만 안에 들임 (ex-밖으로 + clud닫다). 독점적으로·오로지."},{"w":"experience","p":"n.","m":"경험","f":0,"i":"위험(peri)을 몸으로 뚫고 밖으로 빠져나오며 몸에 새겨진 것 (ex-밖으로 + peri시험·위험). 겪어서 쌓인 경험."},{"w":"explanation","p":"n.","m":"설명","f":0,"i":"구겨진 것을 밖으로 평평하게(plane) 펼쳐 보여줌 (ex-밖으로 + plan평평). 이해되게 펴서 설명함."},{"w":"following step","p":"phr.","m":"다음 단계","f":0,"i":"지금 딛는 발자국 바로 뒤를 따라오는(follow) 다음 걸음. 순서상 다음 단계. 특별한 이미지 없음 — 뜻 그대로."},{"w":"grind","p":"v.","m":"갈다","f":0,"i":"맷돌 두 돌 사이에 넣고 짓눌러 가루가 될 때까지 문질러 갈아냄. 힘든 반복노동(the grind)으로도 뻗음."},{"w":"hindrance","p":"n.","m":"장애, 방해","f":0,"i":"가려는 길에 뒤에서(hind=뒤) 발목을 잡아 못 나아가게 하는 걸림돌 (hind뒤). 장애·방해."},{"w":"hot spring","p":"phr.","m":"온천","f":0,"i":"땅속에서 뜨거운 물이 솟아나는(spring) 온천. 특별한 이미지 없음 — 뜻 그대로."},{"w":"impression","p":"n.","m":"인상","f":0,"i":"물렁한 밀랍에 도장을 꾹 눌러(press) 안쪽에 자국을 남김 (im-안으로 + press누르다). 마음에 찍힌 인상."},{"w":"increase","p":"v.","m":"증가시키다","f":0,"i":"안에서 점점 자라나(cresc=자라다) 부피가 불어남 (in-안으로 + creas자라다). 수·양이 늘어남."},{"w":"invigorate","p":"v.","m":"기운나게 하다, 활기 띠게 하다","f":0,"i":"몸속으로 활기(vigor=힘)를 확 불어넣어 팔팔하게 함 (in-안으로 + vigor힘). 기운나게·활기 띠게. (다소 문어)"},{"w":"invulnerable","p":"a.","m":"죽지 않는, 상하지 않는","f":0,"i":"아무리 찔러도 상처(vulner=상처) 하나 안 나는 무적의 몸 (in-부정 + vulner상처). 죽지·상하지 않는."},{"w":"license","p":"n.","m":"허가증, 인가증","f":0,"i":"권위자가 '해도 좋다'고 자유(licens=허락)를 내준 종이 (lic허락). 허가증·면허."},{"w":"linen","p":"n.","m":"리넨(아마포) a. 리넨처럼 흰","f":0,"i":"아마(flax) 줄기로 짠 시원한 흰 천. 특별한 이미지 없음 — 뜻 그대로. 형용사로 '리넨처럼 흰'."},{"w":"logical","p":"a.","m":"논리적인, (논리상) 필연적인","f":0,"i":"생각(logos=말·이치)이 앞 계단에서 뒤 계단으로 딱딱 이어져 어긋남이 없음 (log이치). 논리적·필연적."},{"w":"mass","p":"a.","m":"대규모의 n. 큰 덩어리, 일반 대중, 질량","f":0,"i":"여기저기 뭉쳐 하나로 뭉텅이진 큰 덩어리. 사람이 뭉치면 대중, 물리에선 질량, 형용사면 대규모의."},{"w":"moral","p":"n.","m":"도덕 a. 도덕적인","f":0,"i":"사회가 정해놓은 관습(mor=풍습)대로 옳게 사는 잣대 (mor풍습). 도덕·도덕적. 이야기 끝의 교훈도 여기서."},{"w":"motionless","p":"a.","m":"부동의, 정지한","f":0,"i":"움직임(motion)이 통째로 빠져(-less) 얼어붙은 듯 딱 멈춘 상태. 부동·정지."},{"w":"motivate","p":"v.","m":"자극하다, 유발하다, 동기를 부여하다","f":0,"i":"등을 툭 밀어(mot=움직이다) 몸이 움직이게 시동을 걸어줌 (mot움직이다). 동기·자극을 부여."},{"w":"motor skill","p":"phr.","m":"운동 기술","f":0,"i":"몸을 움직이는(motor=운동) 손발의 조작 솜씨. 걷기·공잡기 같은 운동 기술. 뜻 그대로."},{"w":"navigate","p":"v.","m":"항해하다, 길을 찾다","f":0,"i":"배(navi=배)를 몰아 물길을 헤쳐 나아감 (nav배 + ag몰다). 항해→길찾기·화면 넘기기로 확장."},{"w":"navigation","p":"n.","m":"항해, 항공","f":0,"i":"배(navi=배)를 몰고 바다·하늘을 가로질러 길을 잡아가는 행위 (nav배). 항해·항공·길안내."},{"w":"navigator","p":"n.","m":"항해사, 항법 장치","f":0,"i":"배(navi=배)의 방향을 잡아 길을 찾는 사람·장치 (nav배). 항해사, 내비 같은 항법 장치."},{"w":"nip","p":"v.","m":"꼬집다, 집다","f":0,"i":"손가락이나 집게로 살짝 꽉 집어 꼬집음. 추위가 살을 물듯 쏘는 것도 nip. 짧고 날카로운 집음."},{"w":"objector","p":"n.","m":"반대자","f":0,"i":"제안 앞에 딱 버티고 서서 '반대'를 내던지는 사람 (ob-맞서서 + ject던지다 + or사람). 반대자."},{"w":"oddball","p":"n.","m":"괴짜 a. 괴짜의, 별난","f":0,"i":"여러 매끈한 공 사이에 굴러다니는 이상하게(odd) 생긴 공 하나. 무리에서 튀는 괴짜."},{"w":"outsource","p":"v.","m":"하청하다","f":0,"i":"일감을 회사 밖(out) 다른 공급원(source)으로 내보내 시킴 (out-밖 + source원천). 하청·외주."},{"w":"overshadow","p":"v.","m":"무색하게 하다, 그늘지게 하다","f":0,"i":"더 큰 것이 위에서 그림자를 드리워(over-위 + shadow그림자) 아래 것을 어둡게 덮어 안 보이게 함. 압도해 무색하게."},{"w":"overt","p":"a.","m":"명백한","f":0,"i":"덮개를 위로 젖혀(over=열려) 속을 드러낸, 숨김없이 훤히 보이는 상태. 명백한·공공연한. covert(은밀한)의 반대."},{"w":"pair","p":"v.","m":"한 쌍이 되다 n. 한 쌍","f":0,"i":"둘이 나란히 붙어 짝을 이룸 (par=동등한). 양말·장갑처럼 두 짝, 동사면 짝짓다."},{"w":"panel","p":"n.","m":"위원단, 심사원단","f":0,"i":"네모난 판때기 하나 — 벽 패널에서, 그 위에 나란히 앉은 심사·토론 사람들 무리로 뻗음. 위원단·심사원단."},{"w":"peninsula","p":"n.","m":"반도","f":0,"i":"거의(pen=거의) 섬(insula=섬)일 만큼 삼면이 물에 둘린, 바다로 삐죽 뻗은 육지 (pen거의 + insul섬). 반도."},{"w":"photogenic","p":"a.","m":"사진이 잘 받는, 사진 촬영에 적합한","f":0,"i":"빛(photo=빛)을 받으면 얼굴이 살아나(gen=생겨남) 사진마다 잘 나오는 (photo빛 + gen생기다). 사진발 잘 받는."},{"w":"pile up","p":"phr.","m":"쌓다, 쌓이다","f":0,"i":"물건을 하나씩 얹어 점점 높이 무더기로 쌓아 올림. 일·빚·차량이 겹겹이 쌓여 산더미가 되는 그림."},{"w":"plumb","p":"v.","m":"이해하다, 측량하다, 수도관을 부설하다","f":0,"i":"추가 달린 납줄(p purious","p":"a.","m":"비논리적인, 그럴싸한","f":0,"i":"겉만 진짜처럼 도금해 놓았지만 속은 가짜인 것 — 그럴싸한 논리·근거처럼 보여도 뿌리가 없어 가짜. 논리가 진짜 연결이 아니라 흉내만 낸 상태. (문어·격식체)"},{"w":"striking","p":"a.","m":"현저한, 두드러진","f":0,"i":"눈을 한 방(strike) 때리듯 확 꽂혀 시선을 못 떼게 하는 것. 그래서 현저한·두드러진. 사람에게 쓰면 '눈에 확 띄게 멋진'."},{"w":"structure","p":"n.","m":"구조, 구성","f":0,"i":"기둥과 뼈대를 세워(struct-세우다) 짜 올린 골조 — 부분들이 특정 방식으로 맞물려 서 있는 짜임새. 건물이든 문장이든 조직이든 그 뼈대."},{"w":"stutterer","p":"n.","m":"말더듬이","f":0,"i":"말을 시작하려다 첫 소리에서 자꾸 걸려 '그-그-그' 튀는 사람. stutter(말 더듬다)에 -er 붙은 그 사람."},{"w":"surrounding","p":"n.","m":"환경","f":0,"i":"나를 빙 둘러(surround) 감싸고 있는 것들 전체 — 사방에서 나를 에워싼 배경·환경. 보통 복수 surroundings로 씀."},{"w":"survival","p":"n.","m":"생존","f":0,"i":"폭풍·재난이 다 휩쓸고 지나간 뒤에도(sur-넘어서 + viv살다) 여전히 목숨이 붙어 넘어와 있음. 끝까지 넘겨 살아남은 상태."},{"w":"survive","p":"v.","m":"살아남다","f":0,"i":"다른 것들은 다 쓰러졌는데 그 위를 넘어(sur-넘어) 계속 살아(viv) 있음. 재난·타인보다 오래 살아남음."},{"w":"survivor","p":"n.","m":"살아남은 사람, 생존자","f":0,"i":"배가 다 가라앉았는데 홀로 물 위로 올라와 있는 사람 — 넘어서 살아남은(survive) 그 사람."},{"w":"temperature","p":"n.","m":"온도","f":0,"i":"따뜻함과 차가움이 섞여(temper-알맞게 섞다) 정해지는 뜨겁고 찬 정도. 특별한 감각 이미지 없음 — 뜻 그대로 온도·체온."},{"w":"tone","p":"v.","m":"(근육을) 탄력 있게 만들다","f":0,"i":"느슨하던 근육 줄을 팽팽히 당겨 탱탱한 긴장을 넣음 — 악기 줄을 조여 소리를 잡듯(tone) 몸을 탄탄하게. tone up으로 자주 씀."},{"w":"unrest","p":"n.","m":"걱정, 불안","f":0,"i":"쉬지(rest) 못하고(un-) 속이 들썩거리며 가라앉지 못하는 상태 — 개인의 불안, 나아가 사회가 안정을 못 찾고 술렁이는 소요."},{"w":"unsightly","p":"a.","m":"보기 흉한","f":0,"i":"눈(sight)에 담기 싫을(un-) 만큼 보기 흉한 것 — 시선이 저절로 피하게 되는 꼴사나움. (문어·격식체, 회화에선 ugly가 흔함)"},{"w":"vandalism","p":"n.","m":"공공 시설물의 파괴, 예술·문화의 파괴","f":0,"i":"남의 공공물·예술품을 재미로 부수고 낙서로 망쳐놓는 짓 — 반달족이 로마를 파괴한 데서 온 말. 특별한 감각 이미지보다 고유 유래 그대로."},{"w":"windshield","p":"n.","m":"(자동차의) 앞유리","f":0,"i":"달릴 때 맞바람(wind)을 막아주는(shield-방패) 자동차 앞 유리 방패. 뜻 그대로. (영국식은 windscreen)"},{"w":"anachronism","p":"n.","m":"시대 착오","f":0,"i":"시대(chron-시간)를 거슬러(ana-거꾸로) 엉뚱한 시간대에 끼어든 것 — 로마 병사가 손목시계 찬 그림처럼 시간이 어긋난 것. (문어·격식체)"},{"w":"anthropology","p":"n.","m":"인류학","f":0,"i":"사람(anthropo-인간)을 학문(-logy)으로 통째로 들여다봄 — 인류의 문화·기원·몸까지 두루 연구하는 인류학."},{"w":"archaeology","p":"n.","m":"고고학","f":0,"i":"아주 오래된(archaeo-태고의) 것을 파고들어(-logy 학) 연구함 — 땅속 옛 흔적을 파헤쳐 옛 삶을 읽는 고고학."},{"w":"archaeologist","p":"n.","m":"고고학자","f":0,"i":"삽과 붓을 들고 땅속 옛 유물을 조심조심 긁어내는 사람 — 고고학(archaeology)을 하는 그 사람."},{"w":"armistice","p":"n.","m":"휴전","f":0,"i":"서로 겨눈 무기(arm-)를 잠시 멈춰(-stice 멈추다) 세워둠 — 전쟁을 완전히 끝낸 게 아니라 총을 잠깐 내려놓은 휴전. (문어·격식체)"},{"w":"artifact","p":"n.","m":"인공 유물, 인공물","f":0,"i":"사람 손(art-기술)이 만들어낸(fact-만들다) 물건 — 자연이 아니라 인간이 빚은 옛 유물·인공물."},{"w":"civil war","p":"phr.","m":"내란, 내전","f":0,"i":"같은 나라(civil-시민의) 사람들끼리 안에서 편이 갈려 총을 겨누는 전쟁 — 밖의 적이 아니라 집안 싸움. 뜻 그대로."},{"w":"civilization","p":"n.","m":"문명","f":0,"i":"사람들이 도시(civil-시민)를 이뤄 제도·문자·기술을 쌓아 올린 상태 — 야생을 벗어나 다듬어진 삶의 큰 덩어리."},{"w":"colony","p":"n.","m":"식민지","f":0,"i":"본국 사람들이 남의 땅에 옮겨가 심듯(col-경작하다) 눌러앉아 지배하는 땅 — 뿌리는 딴 데 두고 그곳을 부리는 식민지."},{"w":"contemporary","p":"n.","m":"동시대인 a. 동시대의, 현대의","f":0,"i":"같은(con-함께) 시간(tempor-시대)을 나란히 사는 것 — 나와 동시대인, 또는 지금 이 시대의(현대적)."},{"w":"crusade","p":"n.","m":"십자군","f":0,"i":"가슴에 십자가(crus-십자) 표를 달고 성지를 향해 우르르 몰려간 원정대 — 신념을 걸고 밀어붙이는 운동이란 뜻으로도 확장."},{"w":"demise","p":"n.","m":"사망, 소멸","f":0,"i":"높은 자리·생명이 아래로(de-아래) 미끄러져 내려가 사라짐(mise-보내다) — 권력·왕조가 넘겨지며 끝나거나 사람이 죽음. (문어·격식체, 회화의 death보다 무겁고 점잖음)"},{"w":"destabilization","p":"n.","m":"불안정화, 약화","f":0,"i":"안정(stable)을 아래로 무너뜨려(de-아래·반전) 흔들리게 만듦 — 굳게 서 있던 것을 흔들어 비틀거리게 하는 불안정화."},{"w":"dynasty","p":"n.","m":"왕조","f":0,"i":"한 핏줄이 힘(dyna-힘)을 대대로 쥐고 이어가는 지배 가문 — 아버지에서 아들로 왕좌가 넘어가는 왕조."},{"w":"enslave","p":"v.","m":"사로잡다, 노예로 만들다","f":0,"i":"사람을 노예(slave) 상태 안으로(en-안으로) 밀어 가둠 — 사슬을 채워 자유를 뺏고 부림."},{"w":"era","p":"n.","m":"시대, 단계","f":0,"i":"역사를 큰 토막으로 뚝 잘라놓은 한 시대 덩어리 — 뚜렷한 색깔로 묶이는 긴 시기. 특별한 감각 이미지보다 뜻 그대로."},{"w":"ethical","p":"a.","m":"윤리적인","f":0,"i":"그 집단이 옳다 여기는 도덕의 결(ethos-품성)을 따르는 것 — 규칙 위반이냐가 아니라 '이게 사람 도리에 맞나'를 재는 윤리적."},{"w":"excavate","p":"v.","m":"발굴하다","f":0,"i":"땅을 파(cav-우묵한 굴) 흙을 밖으로(ex-밖) 퍼내 속을 드러냄 — 유적·유물을 파내는 발굴."},{"w":"excavation","p":"n.","m":"발굴","f":0,"i":"삽질로 파낸(ex-밖 + cav-굴) 움푹한 구덩이와 거기서 캐낸 것 — 발굴 작업 그 자체."},{"w":"feudalism","p":"n.","m":"봉건 제도","f":0,"i":"땅을 봉(封)으로 나눠주고 충성으로 갚는 주종의 사다리 — 영주가 땅을 주면 기사가 칼로 섬기는 봉건 제도."},{"w":"flourish","p":"v.","m":"번성하다","f":0,"i":"꽃(flor-꽃)이 활짝 피어 무성하게 뻗어나가듯 번성함 — 사업·문화가 쭉쭉 피어오르는 왕성함."},{"w":"hierarchical","p":"a.","m":"계급 제도의, 계층제의","f":0,"i":"신성한 서열(hier-신성 + arch-지배)을 위에서 아래로 층층이 쌓은 것 — 윗칸이 아랫칸을 누르는 계층 구조의."},{"w":"hieroglyph","p":"n.","m":"상형 문자","f":0,"i":"신성한(hier-신성) 그림 글자(glyph-새김) — 벽에 새겨진 새·눈·물결 그림이 곧 뜻이 되는 이집트 상형 문자."},{"w":"Industrial Revolution","p":"phr.","m":"산업 혁명","f":0,"i":"손 대신 기계가 돌기 시작하며 세상이 확 뒤집힌(revolut-굴러 돎) 큰 전환 — 공장·증기가 삶을 통째로 바꾼 산업 혁명. 뜻 그대로."},{"w":"intrusive","p":"a.","m":"침입의","f":0,"i":"초대도 안 했는데 안으로(in-안) 밀고(trud-밀다) 들어와 남의 공간을 침범하는 것 — 불쑥 끼어드는 껄끄러운 침입성."},{"w":"K-T extinction","p":"phr.","m":"백악기-제3기 멸종","f":0,"i":"백악기와 제3기 사이(K-T)에서 공룡이 통째로 사라진 그 대멸종 사건 — 특정 지질 경계의 고유 명칭. 뜻 그대로."},{"w":"legendary","p":"a.","m":"전설의","f":0,"i":"입에서 입으로 전해 읽혀온(leg-읽다·모으다) 전설 속 이야기 같은 — 실화인지 아닌지 흐릿해질 만큼 유명하고 신화적인."},{"w":"liberation","p":"n.","m":"해방, 석방","f":0,"i":"묶여 있던 것을 풀어(liber-자유) 훌쩍 자유로 놓아줌 — 억압의 사슬을 끊고 풀려나는 해방."},{"w":"milestone","p":"n.","m":"획기적 사건, 중대 시점, 이정표","f":0,"i":"길가에 박혀 '여기까지 몇 마일'을 알려주던 돌 — 그래서 인생·역사의 여정에서 여기가 큰 지점이라 표시되는 획기적 사건."},{"w":"monarch","p":"n.","m":"군주, 주권자","f":0,"i":"홀로(mon-하나) 맨 위에서 다스리는(arch-지배) 단 한 사람 — 왕좌에 앉은 유일한 군주."},{"w":"myth","p":"n.","m":"신화, 미신","f":0,"i":"누구도 사실 확인은 안 했지만 다들 믿고 전해온 이야기 — 신들의 옛이야기, 나아가 근거 없이 굳어진 속설·미신."},{"w":"mythology","p":"n.","m":"신화","f":0,"i":"신들의 이야기(myth)를 한 덩어리 체계(-logy)로 엮어놓은 것 — 한 문화의 신화 전체 묶음."},{"w":"nationality","p":"n.","m":"국민성, 국적","f":0,"i":"어느 나라(nation)에 뿌리내려 소속돼 있는지의 표식 — 여권에 찍히는 국적, 또는 그 나라다운 기질(국민성)."},{"w":"noble","p":"n.","m":"귀족 a. 귀족의, 고귀한","f":0,"i":"핏줄부터 남들보다 위에 있다고 여겨진 높은 신분 — 그 자리에서 나온 '고귀한·품위 있는' 성품으로도 확장. 귀족/고귀한."},{"w":"oppressive","p":"a.","m":"압제적인, 가혹한","f":0,"i":"위에서(ob-맞서·아래로 누름 + press-누르다) 짓눌러 숨 막히게 하는 것 — 권력이든 더위든 어깨를 짓누르는 압제적·답답함."},{"w":"oracle","p":"n.","m":"신탁","f":0,"i":"신의 입(or-입)을 빌려 흘러나오는 예언 — 신전에서 신이 대신 말해준다는 신탁, 또는 그 말을 전하는 자."},{"w":"plunder","p":"v.","m":"약탈하다, 노략질하다","f":0,"i":"쳐들어가 값나가는 것을 마구 쓸어 담아 들고 튐 — 전쟁·습격 뒤 닥치는 대로 빼앗는 약탈."},{"w":"predecessor","p":"n.","m":"조상","f":0,"i":"나보다 앞서(pre-앞) 그 자리에 앉았다가 물러난(cess-가다) 사람 — 전임자·앞선 세대. (한국어 뜻 '조상'보다 실제론 '전임자'가 1순위)"},{"w":"prehistory","p":"n.","m":"선사 시대","f":0,"i":"글로 기록되기(history) 이전(pre-앞)의 아득한 시절 — 문자가 없어 유물로만 더듬는 선사 시대."},{"w":"primitive","p":"a.","m":"원시의, 원시적인","f":0,"i":"맨 처음(prim-첫) 상태 그대로인 것 — 아직 다듬어지지 않은 원시의·초기의. 사람·기술에 쓰면 '투박하고 원시적인'."},{"w":"propagate","p":"v.","m":"보급시키다, 선전하다, 증식시키다","f":0,"i":"씨앗·소식을 앞으로(pro-앞) 널리 퍼뜨려 불려 나감 — 사상을 선전하고, 소문을 퍼뜨리고, 생물을 번식시킴. (문어·격식체)"},{"w":"Puritan","p":"n.","m":"청교도","f":0,"i":"삶을 티끌 없이 순수하게(pur-깨끗) 지키려 쾌락을 엄격히 눌렀던 사람들 — 청빈·엄격을 신앙으로 삼은 청교도. 뜻 그대로."},{"w":"realm","p":"n.","m":"왕국","f":0,"i":"왕이 손을 뻗어 다스리는 영토 전체가 하나의 영역으로 펼쳐진 그림. 물리적 왕국에서 은유로 확장돼 '학문의 영역, 가능성의 영역'처럼 어떤 힘·활동이 미치는 세계 전체."},{"w":"reconstruct","p":"v.","m":"재건하다, 복구하다","f":0,"i":"무너진 건물의 벽돌을 하나씩 다시(re-) 쌓아(construct지어올림) 원래 모습으로 되돌림. 부순 사건을 증거로 다시 짜맞춰 '재구성하다'로도 확장."},{"w":"reign","p":"n.","m":"군림, 통치, 지배, 통치 기간","f":0,"i":"왕관 쓴 자가 옥좌에서 손을 뻗어 나라 위에 군림하는 그림. 그 힘이 미치는 '기간'까지 포함 — 통치 그 자체이자 통치한 세월."},{"w":"relics","p":"n.","m":"유적","f":0,"i":"옛 사람들이 뒤에 남기고(re-뒤 + lic남겨두다) 세월에 파묻힌 뼈·유물·터. 성인의 유해나 과거의 잔재처럼 '뒤에 남겨져 살아남은 것'."},{"w":"Renaissance","p":"n.","m":"르네상스 시대, (문예·종교 등의) 부흥, 부활","f":0,"i":"죽었던 것이 다시(re-) 태어남(naissance탄생). 중세 이후 고대 예술·학문이 되살아난 그 부활의 물결. 소문자면 어떤 분야든 '부흥·재생'."},{"w":"revolution","p":"n.","m":"혁명, 개혁, 변혁","f":0,"i":"한 바퀴 완전히 굴러(re-다시 + volv돌다) 뒤집힘. 낡은 질서가 통째로 엎어지는 혁명, 그리고 별이 궤도를 한 바퀴 도는 '회전'까지 같은 이미지."},{"w":"revolutionize","p":"v.","m":"혁명을 일으키다","f":0,"i":"그 판을 통째로 한 바퀴 뒤집어엎어 완전히 새 것으로 갈아버림. '~에 혁명을 일으키다' — 스마트폰이 소통 방식을 revolutionize한 것처럼."},{"w":"ritual","p":"n.","m":"의식, 의례","f":0,"i":"정해진 순서대로 한 치 어김없이 반복되는 엄숙한 몸짓의 흐름. 종교 의식에서 출발해, 매일 똑같이 치르는 습관적 절차까지."},{"w":"sovereignty","p":"n.","m":"주권, 통치권","f":0,"i":"누구의 위에도 없이 홀로 꼭대기(super-위에서 유래)에 앉아 최종 결정을 내리는 최고 권력. 나라가 스스로를 다스릴 '주권'."},{"w":"the Enlightenment","p":"phr.","m":"계몽 운동 종교","f":0,"i":"머릿속 어둠에 등불을 켜(en-넣다 + light빛) 이성으로 세상을 밝힌 18세기 사상 운동. 미신·권위의 어둠을 이성의 빛으로 몰아냄."},{"w":"apotheosis","p":"n.","m":"신격화, 숭배","f":0,"i":"인간을 신(theo-)의 자리로(apo-떨어져 위로) 끌어올려 떠받듦. 신격화, 그리고 '어떤 것의 완벽한 정점·극치'로 확장. (문어·격식체)"},{"w":"atheism","p":"n.","m":"무신론","f":0,"i":"신(theo-)이 없다(a-부정)고 못박는 입장. 위를 올려다봐도 아무 신도 걸리지 않는 텅 빈 하늘의 감각."},{"w":"believer","p":"n.","m":"신봉자","f":0,"i":"가슴에 확신을 품고 흔들림 없이 따르는 사람. 종교 신자이자, 어떤 생각·사람을 굳게 신봉하는 이."},{"w":"Buddhism","p":"n.","m":"불교, 불도, 불법","f":0,"i":"깨달은 자(Buddha) 붓다의 가르침을 따르는 종교. 특별한 감각 이미지 없음 — 뜻 그대로 불교."},{"w":"cathedral","p":"n.","m":"대성당","f":0,"i":"주교의 의자(cathedra좌석)가 놓인, 그 교구에서 가장 크고 높이 솟은 성당. 하늘을 찌르는 첨탑의 웅장함."},{"w":"Catholic","p":"a.","m":"천주교의","f":0,"i":"온 세상 두루(cata-전체에 걸쳐) 미치는 보편 교회. 대문자면 로마 가톨릭(천주교)의, 소문자면 '폭넓은·보편적인'."},{"w":"divine","p":"a.","m":"신의, 신성한","f":0,"i":"인간 세상 위에서 내려오는 신(div-신)의 광채가 서린 상태. 신성하다, 그리고 '기막히게 훌륭하다'로도 감탄에 씀."},{"w":"fanatic","p":"n.","m":"광신자, 열광자","f":0,"i":"신전(fanum)에 홀려 눈에 불을 켜고 한 방향으로만 미친 듯 몰두하는 사람. 광신자·열광적 팬. (일상에선 줄여서 fan)"},{"w":"Hinduism","p":"n.","m":"힌두교","f":0,"i":"인도(Hindu) 땅에서 자라난 다신교. 특별한 감각 이미지 없음 — 뜻 그대로 힌두교."},{"w":"Islam","p":"n.","m":"이슬람교","f":0,"i":"유일신 앞에 자신을 온전히 내려놓고 복종(salam복종·평화)하는 종교. 특별한 감각 이미지 없음 — 뜻 그대로 이슬람교."},{"w":"nun","p":"n.","m":"수녀","f":0,"i":"머리 가리고 수도원에 스스로 들어가 신께 삶을 바친 여인. 특별한 감각 이미지 없음 — 뜻 그대로 수녀."},{"w":"pagan","p":"a.","m":"이교도의, 무종교의 n. 이교도, 무종교자","f":0,"i":"도시 밖 시골(paganus시골사람)에 남아 옛 토속신을 섬기던 사람들. 그래서 '이교도·비기독교도'. 지금은 다소 옛말투."},{"w":"persecution","p":"n.","m":"(종교상의) 박해","f":0,"i":"권력이 끝까지(per-끝까지관통) 쫓아와(secut뒤따르다) 짓밟음. 신앙 때문에 도망쳐도 놓아주지 않고 뒤쫓는 박해."},{"w":"rite","p":"n.","m":"의식, 제전","f":0,"i":"정해진 순서대로 치르는 격식 있는 의식 그 자체. ritual이 반복되는 관습이라면 rite는 통과의례처럼 '한 건의 예식'."},{"w":"Taoism","p":"n.","m":"도교","f":0,"i":"길(道 Tao)을 따라 자연에 순응해 흐르는 노자의 가르침. 특별한 감각 이미지 없음 — 뜻 그대로 도교."},{"w":"temple","p":"n.","m":"신전, 성당, 절, 사원","f":0,"i":"신이 머무는 성스러운 공간으로 구획해(tem-잘라 구획) 세운 건물. 신전·절·사원 두루."},{"w":"aesthetic","p":"a.","m":"심미적인, 미적 감각이 있는","f":0,"i":"눈과 감각(aisthe-감각으로 느끼다)으로 아름다움을 직접 맛보는 감식안. 미(美)에 관한, 미적 감각이 있는."},{"w":"architecture","p":"n.","m":"건축 (양식), 건축물","f":0,"i":"으뜸(archi-최고) 장인이 짜(tect짓다) 올린 큰 구조물. 건물 자체이자 그 '짜임새·양식', 나아가 시스템의 '구조'."},{"w":"avant-garde","p":"a.","m":"아방가르드의, 전위적인","f":0,"i":"부대 맨 앞(avant-앞 + garde부대)에 서서 남보다 먼저 새 땅을 밟는 선봉대. 예술의 전위·실험적 최전선. (불어 그대로)"},{"w":"beige","p":"a.","m":"베이지 색의 n. 베이지 색","f":0,"i":"물 안 들인 양모의 옅은 흙빛 누런 회백색. 특별한 감각 이미지 없음 — 뜻 그대로 베이지색."},{"w":"canvas","p":"n.","m":"캔버스, 화포","f":0,"i":"팽팽히 당겨진 거친 삼베 천 — 화가가 그 위에 물감을 얹는 화포. 여기서 '펼쳐진 작업 바탕'으로도 확장."},{"w":"choreography","p":"n.","m":"안무","f":0,"i":"무용수들의 동선을 춤(choreo-춤)으로 미리 써(graph기록) 짜둔 설계도. 안무."},{"w":"composition","p":"n.","m":"작곡, 음악 작품, 악곡","f":0,"i":"여러 조각을 함께(com-) 제자리에 놓아(pos놓다) 하나로 짜맞춘 것. 곡을 짜면 작곡, 그림 속 배치면 구도, 글이면 작문."},{"w":"concerto","p":"n.","m":"협주곡, 콘체르토","f":0,"i":"독주 악기 하나가 오케스트라와 겨루듯 함께(con-) 어울려 주고받는 곡. 협주곡."},{"w":"costume","p":"n.","m":"의상","f":0,"i":"그 시대·배역의 관습(custom과 한 뿌리)을 몸에 걸쳐 보여주는 옷. 무대·행사용 의상."},{"w":"curator","p":"n.","m":"큐레이터, 전시 책임자","f":0,"i":"전시품을 정성껏 돌보고(cur-보살피다) 골라 배치하는 관리자. 박물관·미술관의 큐레이터."},{"w":"fabric","p":"n.","m":"직물, 천, 구성","f":0,"i":"실을 엮어(fabr-만들다) 짜낸 천. 거기서 '짜임새·구성'으로 확장 — '사회의 fabric(짜임새)'."},{"w":"faded","p":"a.","m":"시든, 색이 바랜, 쇠퇴한","f":0,"i":"햇빛에 오래 노출돼 색이 스르르 빠져나가 흐릿해진 상태. 시든 꽃, 바랜 사진, 쇠락한 영광."},{"w":"Fauvism","p":"n.","m":"야수파","f":0,"i":"야수(fauve들짐승)처럼 원색을 거칠게 내지른 20세기 초 화풍. 강렬한 색채의 야수파. (미술 전문어)"},{"w":"filmmaker","p":"n.","m":"영화 제작자, 영화 회사","f":0,"i":"필름(영화)을 손수 만드는(maker) 사람. 특별한 감각 이미지 없음 — 뜻 그대로 영화 제작자."},{"w":"genre","p":"n.","m":"장르, 양식, 형식","f":0,"i":"같은 종류(gen-태생·종류)끼리 묶은 갈래. 소설·재즈·공포처럼 예술의 '장르'. (불어 발음 그대로)"},{"w":"inspiration","p":"n.","m":"영감","f":0,"i":"밖에서 숨을 안으로(in-안 + spir숨쉬다) 훅 불어넣어 마음에 불이 확 켜지는 순간. 영감. (원래 '신이 숨을 불어넣음')"},{"w":"impressionism","p":"n.","m":"인상주의","f":0,"i":"빛의 순간적 인상(im-안으로 + press눌러찍다)만 붓자국으로 재빨리 눌러 찍어낸 화풍. 인상주의."},{"w":"instrumental","p":"a.","m":"악기의, 기계의","f":0,"i":"도구·악기(instrument)로 연주하는. 그리고 '어떤 일에 결정적 도구가 된' — 'instrumental in the deal(성사에 큰 역할)'."},{"w":"naturalistic","p":"a.","m":"자연주의적인, 사실적인","f":0,"i":"꾸밈없이 자연 그대로를 있는 그대로 옮긴. 실물처럼 사실적인 묘사·양식."},{"w":"painting","p":"n.","m":"회화, 그림","f":0,"i":"붓으로 물감을 발라(paint칠하다) 완성한 그림. 특별한 감각 이미지 없음 — 뜻 그대로 회화."},{"w":"performer","p":"n.","m":"연기자","f":0,"i":"무대 위에서 관객 앞에 완성해(per-끝까지 + form형태를 갖춤) 보여주는 사람. 연기자·연주자."},{"w":"performance","p":"n.","m":"연주, 연기","f":0,"i":"속에 준비한 것을 끝까지(per-) 실행해 형태로(form) 관객 앞에 펼쳐냄. 공연·연기, 그리고 기계·사람의 '성능·실적'."},{"w":"phonograph","p":"n.","m":"축음기","f":0,"i":"소리(phono-소리)를 홈에 새겨(graph기록) 되살리는 옛 기계. 축음기. (옛말·고풍)"},{"w":"pottery","p":"n.","m":"도자기, 도기류","f":0,"i":"진흙을 물레에서 빚어 불에 구운 그릇. 도자기, 그리고 그것을 만드는 도예 일 전체."},{"w":"ragtime","p":"n.","m":"래그타임 (재즈의 일종)","f":0,"i":"박자를 일부러 어긋나게(ragged찢긴) 튕겨 통통 튀게 만든 초기 재즈풍 음악. (음악 전문어)"},{"w":"realism","p":"n.","m":"리얼리즘, 사실주의","f":0,"i":"환상 걷어내고 현실(real)을 있는 그대로 담아내려는 태도. 미술·문학의 사실주의, 그리고 냉철한 현실주의."},{"w":"script","p":"n.","m":"(연극·영화 등의) 대본, 각본","f":0,"i":"손으로 죽 써 내려간(scrib쓰다) 대사 뭉치 — 배우가 그대로 읽는 대본. 원래 '쓰인 것'이라 필기체·문자 체계도 script."},{"w":"texture","p":"n.","m":"구조, 질감","f":0,"i":"손끝으로 표면을 쓸었을 때 걸리는 실의 짜임새(text짜다) 감각. 천의 결·질감, 나아가 음식·소리의 '결'."},{"w":"virtuosity","p":"n.","m":"미술 애호, 묘기, 기교","f":0,"i":"손가락이 눈에 안 보일 만큼 완벽히 부리는 신기(神技) 수준의 기량. 명연주자(virtuoso)의 화려한 기교. (예술 전문어)"},{"w":"visually","p":"ad.","m":"시각적으로","f":0,"i":"귀·손이 아니라 눈으로 딱 보이게. '시각적으로' — visually striking(눈에 확 띄는)처럼 보는 감각에 걸어 서술."},{"w":"vivid","p":"a.","m":"선명한","f":0,"i":"살아있는(viv-살다) 듯 색과 인상이 눈앞에 팔딱거리는 상태. 쨍한 색, 생생한 기억·묘사."},{"w":"autobiography","p":"n.","m":"자서전","f":0,"i":"자기(auto-스스로)가 자기 인생(bio-삶)을 직접 써 내려간(graph쓰다) 기록. 자서전 (남이 쓰면 biography)."},{"w":"cliché","p":"n.","m":"진부한 표현","f":0,"i":"활자를 찍고 또 찍어 닳아버린 인쇄판(원래 '판 찍는 소리')에서 온, 하도 써서 신선함이 다 빠진 진부한 표현. (불어 그대로)"},{"w":"commentary","p":"n.","m":"기록, 회고록","f":0,"i":"사건 옆에 나란히 붙여 함께(com-) 풀어 쓴(ment마음·생각) 설명·논평. 실황 해설이나 회고·기록으로도."},{"w":"connotation","p":"n.","m":"함축, 내포, 어감","f":0,"i":"단어 겉뜻 옆에 딸려 오는 감정의 그림자 (con-함께 + not-표시). 'home'이 '집'만이 아니라 '아늑함'까지 함께 데려오는 그 곁뜻."},{"w":"critique","p":"n.","m":"비평, 평론","f":0,"i":"작품을 저울에 올려놓고 조목조목 갈라 재는 정식 평가문 (cri-가르다·판단). 단순 험담이 아니라 근거 있는 비평."},{"w":"description","p":"n.","m":"묘사","f":0,"i":"대상을 따라 손끝으로 윤곽을 죽 써 내려가 상대 머릿속에 그림을 그려줌 (de-따라 + scrib쓰다)."},{"w":"digest","p":"n.","m":"요약본, 개요","f":0,"i":"먹은 것을 잘게 갈라 흡수하듯, 긴 글을 소화해 핵심만 뽑아낸 요약본 (di-분리 + gest나르다)."},{"w":"encyclopedia","p":"n.","m":"백과사전","f":0,"i":"아이 교육의 원을 한 바퀴 빙 둘러 모든 지식을 담은 큰 책 (en-안에 + cyclo-원 + ped-교육). 두툼한 백과사전."},{"w":"emendation","p":"n.","m":"교정, 수정","f":0,"i":"글의 흠·오류를 밖으로 집어내 바로잡음 (e-밖으로 + mend-고치다). (문어·격식체) 흔히 correction을 씀."},{"w":"extravaganza","p":"n.","m":"괴이한 이야기","f":0,"i":"정상 틀 밖으로 마구 넘쳐 흐르는 화려하고 과장된 대형 쇼 (extra-밖으로 + vag-헤매다). 삐까번쩍 초호화 볼거리."},{"w":"fable","p":"n.","m":"우화, 전설","f":0,"i":"동물이 말을 하며 교훈을 물어다 주는 짧은 옛이야기 (fa-말하다). 이솝 우화 같은 도덕 담긴 우화."},{"w":"fictional","p":"a.","m":"소설의, 허구의","f":0,"i":"실제가 아니라 머릿속에서 빚어 만들어낸 (fic만들다). 소설 속에만 있는 허구의."},{"w":"fictionalize","p":"v.","m":"소설화하다","f":0,"i":"실제 사건을 붙잡아 소설로 빚어 각색함 (fic만들다 + -ize하게하다). 실화를 픽션으로 주무름."},{"w":"hyperbole","p":"n.","m":"과장법","f":0,"i":"던진 말을 사실 위 높이 넘어서까지 훌쩍 쏘아 올린 과장 (hyper-위로넘어 + bol던지다). '백만 번 말했잖아' 같은 과장법."},{"w":"indication","p":"n.","m":"지시, 암시","f":0,"i":"손가락으로 안쪽을 콕 가리켜 '이거야'라고 짚어 보여줌 (in-안으로 + dic-가리키다). 방향을 알려주는 표시·낌새."},{"w":"irony","p":"n.","m":"풍자, 반어법","f":0,"i":"말의 겉과 속이 정반대로 뒤집혀, 칭찬하는 척 비꼬는 반어. 상황이 기대와 딴판으로 흐르는 아이러니."},{"w":"literacy","p":"n.","m":"글을 읽고 쓰는 능력","f":0,"i":"글자(litera)를 읽고 쓸 줄 아는 능력. 글맹을 벗어난 문해력."},{"w":"literal","p":"a.","m":"문자(상)의, 글자 그대로의","f":0,"i":"글자(litera) 그 자체에 딱 붙어, 비유 없이 곧이곧대로. '문자 그대로'의 뜻."},{"w":"literary","p":"a.","m":"문학의","f":0,"i":"글자(litera)로 지어진 세계, 즉 문학에 관한. 격식 있는 문어적인."},{"w":"literate","p":"a.","m":"글을 읽고 쓸 줄 아는","f":0,"i":"글자(litera)를 손에 쥐고 읽고 쓸 줄 아는 사람. 교양 있는."},{"w":"manuscript","p":"n.","m":"원고","f":0,"i":"인쇄 전, 손(manu)으로 직접 써 내려간(scrib) 원본 글뭉치. 손으로 쓴 원고."},{"w":"metaphor","p":"n.","m":"은유","f":0,"i":"한 뜻을 다른 사물 위에 얹어 저편으로
