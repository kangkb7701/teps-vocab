서 아래로 깔아 포갠 한 겹. 케이크·지층처럼 겹겹이 쌓인 층 하나."},{"w":"mileage","p":"n.","m":"연비, 주행 거리","f":1,"i":"달린 거리를 마일로 쌓은 총량. 주행거리, 또는 기름 1갤런으로 가는 연비."},{"w":"mock","p":"a.","m":"가짜의, 모조의 v. 조롱하다","f":1,"i":"진짜인 척 흉내만 낸 가짜 / 남을 우스꽝스럽게 따라 하며 놀림. 모의고사(mock exam)의 그 mock."},{"w":"nourish","p":"v.","m":"영양분을 주다, 기르다","f":1,"i":"젖을 물려 쑥쑥 키움 (nutrire젖먹이다). 몸에 영양을 채워 기르다, 감정·희망을 키우다."},{"w":"obfuscate","p":"v.","m":"혼란시키다, 알기 어렵게 만들다","f":1,"i":"보려는 것 앞에 어둠(안개)을 맞세워 씌워 안 보이게 함 (ob-맞서 + fusc어둡게). 일부러 흐리게 만들다. (문어·격식체)"},{"w":"occlude","p":"v.","m":"막다, 메우다, 차단하다","f":1,"i":"앞을 가로막고 문을 닫아버림 (oc=ob-맞서 + clud닫다). 혈관·기도를 막아 차단. (전문·의학체)"},{"w":"offender","p":"n.","m":"위반자, 범죄자","f":1,"i":"정해진 선에 맞서 부딪쳐 넘은 사람 (of=ob-맞서 + fend치다). 위반자·범죄자."},{"w":"on my second thought","p":"phr.","m":"다시 생각해보니","f":1,"i":"처음 생각 위에 두 번째 생각을 다시 얹어봄. 다시 생각해보니."},{"w":"on the fence","p":"phr.","m":"형세를 관망하는","f":1,"i":"울타리 위에 걸터앉아 이쪽도 저쪽도 안 내려옴. 어느 편도 안 정하고 관망."},{"w":"on the tip of one’s tongue","p":"phr.","m":"기억이 날 듯 말 듯 생각나지 않는","f":1,"i":"단어가 혀끝까지 나와 맴도는데 입 밖으로 안 떨어짐. 기억이 날 듯 말 듯."},{"w":"opportunistic","p":"a.","m":"기회주의적인","f":1,"i":"순풍 타고 배가 항구로 딱 들어오기 좋은 그 타이밍만 노림 (ob+port항구). 기회다 싶을 때만 냉큼 챙기는 기회주의적."},{"w":"order status","p":"phr.","m":"주문 상태","f":1,"i":"주문이 지금 어느 단계에 있는지 상태. 특별한 이미지 없음 — 뜻 그대로."},{"w":"outside line","p":"phr.","m":"외부로 거는 전화","f":1,"i":"건물 내부망을 벗어나 바깥 세상으로 이어지는 전화선. 외부로 거는 전화."},{"w":"parched","p":"a.","m":"목이 타는, 바싹 마른","f":1,"i":"물기가 싹 증발해 바싹 말라 쩍쩍 갈라진 흙바닥·목구멍. 목이 타는·메마른."},{"w":"pass on","p":"phr.","m":"나아가다, 지나가다","f":1,"i":"손에서 손으로 넘겨 지나감. 정보를 전달하다, 지나쳐 가다, (완곡히) 세상을 뜨다."},{"w":"pedantic","p":"a.","m":"현학적인, 박식한 체하는","f":1,"i":"사소한 규칙·지식을 하나하나 들이대며 박식한 체 티 냄. 잘난 척하는 현학적 태도."},{"w":"perspiration","p":"n.","m":"땀, 발한","f":1,"i":"피부 구멍을 끝까지 뚫고 밖으로 배어 나온 물방울 (per-관통 + spir숨쉬다·내뿜다). 땀. (문어·격식체, 일상은 sweat)"},{"w":"prodigy","p":"n.","m":"천재, 신동","f":1,"i":"보는 이가 깜짝 놀랄 만큼 앞서 튀어나온 경이로운 존재 (pro-앞으로). 특히 어린 나이에 재능이 폭발한 신동."},{"w":"qualification","p":"n.","m":"자격, 능력","f":1,"i":"이 자리에 들 만한 질(質)을 갖췄다는 조건·증표 (qual질·어떤). 자격·능력."},{"w":"reach a pinnacle","p":"phr.","m":"정점에 도달하다","f":1,"i":"뾰족한 첨탑(pinnacle) 꼭대기 끝에 손이 닿음. 최정점에 도달."},{"w":"reach an arrangement","p":"phr.","m":"합의에 이르다","f":1,"i":"서로 어긋난 조각을 나란히 맞춰 정리에 이름 (arrange정렬). 합의·타결에 이르다."},{"w":"reassuring","p":"a.","m":"위안을 주는, 용기를 주는","f":1,"i":"흔들리는 마음을 다시 단단히 눌러 안심시켜 줌 (re-다시 + assure확신시키다). 위안·용기를 주는."},{"w":"rely on","p":"phr.","m":"~에 의지하다","f":1,"i":"받침대에 몸을 다시 묶어 기댐 (re + ly묶다 ligare). ~에 의지하다."},{"w":"repressive","p":"a.","m":"억압하는, 억제하는","f":1,"i":"튀어나오려는 것을 도로 뒤로 꽉 눌러 못 나오게 함 (re-뒤로 + press누르다). 억압적인."},{"w":"save a bundle","p":"phr.","m":"크게 절약하다","f":1,"i":"돈 뭉치(bundle) 한 다발을 통째로 안 쓰고 아낌. 왕창 절약하다. (구어)"},{"w":"scattering","p":"n.","m":"흩뿌리기, 살포","f":1,"i":"한 줌을 확 뿌려 알갱이들이 사방으로 흩어져 떨어진 모습. 그래서 '흩뿌리기', 나아가 여기저기 드문드문 흩어진 소량('a scattering of~')."},{"w":"sharp contrast","p":"phr.","m":"뚜렷한 차이","f":1,"i":"두 색이 흐릿한 경계 없이 칼로 자른 듯 딱 붙어 눈을 찌르는 대비. sharp(날카로운)라서 차이가 무디지 않고 선명하게 도드라짐."},{"w":"sharp dresser","p":"phr.","m":"옷을 잘 입는 사람","f":1,"i":"옷 주름·핏이 칼날처럼 각 잡혀 딱 떨어지는 사람. sharp의 '날카로운 각'이 옷맵시로 옮겨가 '쫙 빼입은 멋쟁이'."},{"w":"slip one’s mind","p":"phr.","m":"잊어버리다","f":1,"i":"머릿속에 얹어둔 생각이 미끄러져(slip) 스르륵 빠져나가 사라짐. 붙잡으려던 게 손에서 미끄러지듯 깜빡 잊음."},{"w":"slip through","p":"phr.","m":"빠져나가다","f":1,"i":"틈 사이로 몸을 스윽 미끄러뜨려 빠져나감 (slip미끄러지다 + through관통). 그물·검문을 몰래 통과하는 그림."},{"w":"span","p":"v.","m":"뻗다, 미치다","f":1,"i":"두 지점 사이에 다리를 쫙 걸쳐 놓듯 양 끝을 잇고 그 폭 전체를 덮음. 그래서 시간·공간에 걸쳐 '뻗다·미치다'."},{"w":"sprawl","p":"v.","m":"불규칙하게 뻗다","f":1,"i":"사람이 팔다리를 아무렇게나 쫙 벌리고 널브러진 모습. 도시가 그렇게 계획 없이 사방으로 퍼지면 '난개발로 뻗다'."},{"w":"sterilize","p":"v.","m":"불임화하다, 살균하다","f":1,"i":"생명이 자랄 씨(-ile)를 없애(ster-메마름) 무균·불임 상태로 만듦. 균도 못 자라게 태워 죽이면 '살균', 못 낳게 하면 '불임화'."},{"w":"subsidy","p":"n.","m":"보조금, 장려금","f":1,"i":"위에서 밑을 받쳐 앉혀 주는 돈방석 (sub-아래 + sid앉다). 정부가 밑에서 떠받쳐 주는 보조금·장려금."},{"w":"tactile","p":"a.","m":"촉각의, 촉감의","f":1,"i":"손끝이 표면에 닿아 결·온도를 느끼는 감각 (tact닿다, contact의 그 tact). 촉각의·손으로 만져지는."},{"w":"take the cake","p":"phr.","m":"대단하다, 뛰어나다, 이기다","f":1,"i":"1등에게 상으로 케이크를 통째로 집어가던 옛 대회 장면. 그래서 '최고다'인데, 어이없을 만큼 심할 때 반어로도 씀."},{"w":"take the initiative","p":"phr.","m":"앞장서서 하다","f":1,"i":"남보다 먼저 첫발(init-들어가다·시작)을 손에 쥐고 치고 나감. 시키기 전에 앞장서서 먼저 움직임."},{"w":"tentative","p":"a.","m":"일시적인, 불확실한","f":1,"i":"천막(tent)을 임시로 툭 쳐놓은 상태 — 확정 아니라 언제든 걷을 수 있음. 그래서 '잠정적·조심스러운·불확실한'."},{"w":"undergo","p":"v.","m":"겪다, 경험하다","f":1,"i":"고생·변화의 밑을(under) 통과해 지나감(go). 위에서 덮치는 걸 밑으로 통과하며 몸소 '겪다·경험하다'."},{"w":"unmistakable","p":"a.","m":"틀림없는, 명백한","f":1,"i":"잘못 집으려야(mistake) 집을 수 없을(un-, -able) 만큼 딱 하나로 튐. 헷갈릴 여지가 0인 '명백한·틀림없는'."},{"w":"withstand","p":"v.","m":"견디어 내다, 버티다","f":1,"i":"밀려오는 힘에 맞서(with-맞서서) 두 발 딛고 버텨 섬(stand). 파도·압력을 안 밀리고 견뎌 냄."},{"w":"wreck","p":"v.","m":"좌절시키다, 난파시키다, 엉망으로 파괴하다","f":1,"i":"배가 암초에 부딪혀 산산조각 나 뒤틀린 잔해(wr-비틀림). 그 파괴 이미지가 계획·인생을 '엉망으로 부수다'로 확장."},{"w":"a wide range of","p":"phr.","m":"넓은 ~, 광범위한 ~","f":1,"i":"손을 활짝 벌려 그 넓은 폭(range) 안에 온갖 것을 다 쓸어 담음. '폭넓은 다양한 ~'."},{"w":"acceptance","p":"n.","m":"수용, 수락","f":1,"i":"내민 것을 손으로 받아 안으로 들여 품음 (ac-쪽으로 + cept잡다). 물건이면 수락, 사람·생각이면 받아들여 인정함."},{"w":"addicted","p":"a.","m":"중독된","f":1,"i":"어떤 것에 자기를 딱 갖다 붙여(ad-쪽으로 + dict) 못 떼는 상태. 그쪽으로 계속 끌려가 '중독된'."},{"w":"attribute","p":"v.","m":"~에 돌리다, ~의 탓으로 하다","f":1,"i":"이 결과를 저 원인 쪽으로(ad-쪽으로 + tribute배분) 딱지 붙여 몰아줌. 공·탓을 '~에게 돌리다'. (명사면 '속성')"},{"w":"belated","p":"a.","m":"뒤늦은, 시대에 뒤진","f":1,"i":"늦음(late)에 흠뻑 절어(be-) 이미 시간이 지나버린 뒤 도착. 생일 지나 온 '뒤늦은' 축하."},{"w":"bloat","p":"v.","m":"팽창하다, 우쭐하게 하다","f":1,"i":"공기·물이 안에 차 풍선처럼 빵빵하게 부풀어 오름. 배가 더부룩하게 붓거나, 조직·자존심이 헛되이 불음."},{"w":"camouflage","p":"n.","m":"변장, 위장","f":1,"i":"주변 무늬를 몸에 발라 배경 속에 녹여 눈을 속임. 군복 얼룩무늬처럼 '위장·변장'. (프랑스어 유래)"},{"w":"chip in","p":"phr.","m":"제 몫을 내다","f":1,"i":"각자 칩(작은 조각·돈) 하나씩 판에 툭 던져 넣어 보탬. 다 같이 조금씩 갹출하거나 대화에 한마디 끼어듦."},{"w":"coagulate","p":"v.","m":"응고시키다, 굳히다","f":1,"i":"따로 흐르던 것들이 함께(co-) 엉겨붙어 한 덩어리로 굳음. 피·우유가 몽글몽글 응고됨. (문어·의학체)"},{"w":"cohesive","p":"a.","m":"결합력 있는, 단결된","f":1,"i":"입자들이 함께(co-) 착 달라붙어(hes붙다) 안 흩어지는 상태. 팀이 똘똘 뭉쳐 '결속된'."},{"w":"come down with","p":"phr.","m":"(병에) 걸리다","f":1,"i":"병이 위에서 몸으로 내려앉으며(down) 함께 딸려 옴. 감기 기운이 스멀스멀 덮쳐 '(병에) 걸리다'. (구어)"},{"w":"come up with","p":"phr.","m":"생각해 내다, 다가가다, 제안하다","f":1,"i":"머릿속 밑바닥에서 아이디어를 위로(up) 건져 올려 눈앞에 내놓음. '생각해 내다·제안하다'. (구어)"},{"w":"companion","p":"n.","m":"친구, 동료, 상대","f":1,"i":"빵(pan)을 함께(com-) 나눠 먹는 사이. 한 상에서 밥 나누던 그 사람이 '동료·친구·길동무'."},{"w":"decent","p":"a.","m":"단정한, 알맞은, 기준에 맞는","f":1,"i":"튀지 않고 상황에 딱 맞게(dec-어울림) 갖춰진 상태. 옷차림이면 단정한, 수준이면 '남부끄럽지 않게 괜찮은'."},{"w":"deliberation","p":"n.","m":"숙고, 고려","f":1,"i":"저울(libra)에 양쪽을 올려 무게를 재며 천천히 따짐 (de-+liber저울). 급히 안 정하고 곱씹는 '숙고'."},{"w":"deliver a message","p":"phr.","m":"메시지를 전하다","f":1,"i":"손에 든 소식을 상대에게 건네 풀어 놓음(de-+liber자유롭게 풀다). 메시지를 전달함."},{"w":"delivery charge","p":"phr.","m":"배송료","f":1,"i":"물건을 실어다 풀어놓아 주는(deliver) 대가로 무는 돈(charge). 배송료."},{"w":"dig in","p":"phr.","m":"입장을 고수하다, 열심히 하다","f":1,"i":"발뒤꿈치를 땅에 콱 박아(dig파다) 안 밀리게 버팀. 참호를 파고 들어앉아 입장을 고수하거나, 밥에 파고들어 먹음."},{"w":"effuse","p":"v.","m":"방출하다, 발산하다","f":1,"i":"액체·감정이 안에서 밖으로(ef-<ex-밖으로) 콸콸 쏟아져 나옴(fus붓다). '방출·발산하다'. (문어체)"},{"w":"effusive","p":"a.","m":"심정을 토로하는","f":1,"i":"감정이 둑을 넘어 밖으로(ef-밖) 넘쳐흐르듯(fus붓다) 쏟아지는. 칭찬·감사를 주체 못 하고 과하게 토로하는."},{"w":"evasive","p":"a.","m":"회피하는, 애매한","f":1,"i":"손에 잡히려는 순간 옆으로(e-<ex-밖) 빠져(vas가다) 미끄러져 달아남. 질문에 정면으로 안 답하고 요리조리 '회피하는'."},{"w":"excessive","p":"a.","m":"과도한, 과다한","f":1,"i":"선(cess가다)을 밖으로(ex-) 넘어(-ex+cess) 지나쳐 감. 적정선을 뚫고 나간 '과도한'."},{"w":"flippant","p":"a.","m":"경솔한, 경박한","f":1,"i":"혀를 가볍게 톡톡 튕기듯(flip) 진지함 없이 나불대는. 무거운 일도 가볍게 농담으로 넘기는 '경박한'."},{"w":"fluctuate","p":"v.","m":"계속 변화하다, 오르내리다","f":1,"i":"파도(flu흐름)에 얹힌 배처럼 위아래로 계속 출렁임. 물가·기분이 오르내리며 '변동하다'. (fluid의 그 flu)"},{"w":"fly off the handle","p":"phr.","m":"자제심을 잃다, 발끈하다","f":1,"i":"도끼머리가 자루(handle)에서 확 튕겨 날아가듯 통제를 잃음. 갑자기 발끈 폭발함. (구어)"},{"w":"foundation","p":"n.","m":"기초, 근거, 근원","f":1,"i":"건물을 떠받치려 땅을 파 다져 부어(found-바닥에 붓다) 놓은 기초. 그 위에 모든 게 서는 '토대·근거'."},{"w":"fret","p":"v.","m":"초조해 하다, 고민하다","f":1,"i":"속을 갉아먹듯(fret닳게 하다) 자잘한 걱정이 마음을 쓸며 안달함. 사소한 일에 안절부절 '초조해하다'."},{"w":"give the cold shoulder","p":"phr.","m":"쌀쌀하게 대하다, 냉대하다","f":1,"i":"따뜻이 마주 보지 않고 차가운 어깨만 슬쩍 돌려 내보임. 등 돌리듯 쌀쌀맞게 '냉대하다'. (구어)"},{"w":"give the green light","p":"phr.","m":"정식 허가를 내주다","f":1,"i":"신호등 초록불을 켜 주듯 '가도 좋다' 통과시킴. 정식으로 '허가·승인'을 내줌."},{"w":"hesitance","p":"n.","m":"주저, 망설임","f":1,"i":"발을 뗐다 붙였다 하며 앞으로 못 나가고 들러붙어(haes붙다) 머뭇거림. '주저·망설임'."},{"w":"hold one’s tongue","p":"phr.","m":"잠자코 있다","f":1,"i":"튀어나오려는 말을 혀째로 꽉 붙잡아 눌러 둠. 하고 싶어도 참고 '잠자코 있다'."},{"w":"idle","p":"a.","m":"일하지 않는, 게으른","f":1,"i":"엔진은 켜져 헛돌지만 아무 일도 안 하는 상태. 놀리는 기계·빈둥대는 사람 — '일 안 하는·게으른'."},{"w":"in hindsight","p":"phr.","m":"지나고 나서 보니","f":1,"i":"사냥 끝난 뒤 뒤(hind)를 돌아보며 겨눔(sight). 다 지나고 나서야 보이는 '돌이켜 보니'. (구어)"},{"w":"in retrospect","p":"phr.","m":"뒤돌아 보면, 회상하면","f":1,"i":"고개를 뒤로(retro-) 돌려 지나온 길을 바라봄(spec보다). 회상하며 '뒤돌아보면'. (in hindsight보다 격식체)"},{"w":"indent","p":"v.","m":"들여서 쓰다, 움푹 들어가게 하다","f":1,"i":"종이 안쪽으로(in-) 이빨(dent치아) 자국처럼 한 칸 움푹 밀어 넣음. 문단 첫 줄 '들여쓰기'."},{"w":"inexplicable","p":"a.","m":"설명할 수 없는, 불가사의한","f":1,"i":"접힌 것을 밖으로 펴서(ex-+plic접다) 풀어낼(explain) 수 없는(in-부정). 아무리 펼쳐도 설명 안 되는 '불가사의한'."},{"w":"infinite","p":"a.","m":"헤아릴 수 없는, 무한한","f":1,"i":"끝(fin경계)이 없어(in-부정) 아무리 가도 선이 닫히지 않고 계속 뻗음. '무한한·헤아릴 수 없는'."},{"w":"ingenious","p":"a.","m":"정교한, 영리한","f":1,"i":"타고난 재능(gen-낳다)이 속에서(in-) 번뜩여 남다른 꾀를 냄. 발상이 기발하고 '영리한·정교한'. (genius의 그 gen)"},{"w":"irremissible","p":"a.","m":"용서할 수 없는, 면하기 어려운","f":1,"i":"죄를 뒤로(re-) 돌려보내(mis보내다) 없던 걸로 풀어줄 수 없는(ir-부정). '용서할 수 없는'. (드문 문어)"},{"w":"keep up with the pace","p":"phr.","m":"보조를 맞추다, 뒤쳐지지 않다","f":1,"i":"앞선 사람 걸음(pace) 옆에 딱 붙어 위로(up) 처지지 않게 유지. 속도에 '보조를 맞춰 뒤처지지 않다'."},{"w":"lowbrow","p":"a.","m":"교양 없는, 저속한","f":1,"i":"이마(brow)가 낮은 = 지적 수준이 낮다던 옛 관상 발상. 교양 없고 '저속한'. (반대는 highbrow)"},{"w":"make a fortune","p":"phr.","m":"큰돈을 벌다","f":1,"i":"굴러온 큰 운(fortune)을 손으로 빚어 재산 더미로 만듦. '큰돈을 벌다'."},{"w":"make a living","p":"phr.","m":"생계를 꾸리다","f":1,"i":"매일의 삶(living)을 스스로 벌어 지어냄. 밥벌이로 '생계를 꾸리다'."},{"w":"mediate","p":"v.","m":"중재하다","f":1,"i":"싸우는 두 사람 한가운데(med-가운데)에 끼어들어 양쪽을 잇는 다리 역할. 중간에 서서 갈등을 풀어줌."},{"w":"medicate","p":"v.","m":"약으로 치료하다, 투약하다","f":1,"i":"몸에 약(medic-)을 넣어 다스림. mediate(중재)와 철자만 비슷할 뿐 뜻은 완전히 다름 — 약으로 치료·투약."},{"w":"mince","p":"v.","m":"말을 삼가서 하다","f":1,"i":"고기를 잘게 다지듯 말도 잘게 썰어 조심조심 내놓음. 흔히 'not mince words'(돌려 말하지 않고 직설적으로)."},{"w":"mode","p":"n.","m":"양식, 방법","f":1,"i":"물건을 찍어내는 하나의 '틀·거푸집'(mod-). 그 틀대로 나오는 방식·양식·방법."},{"w":"notify","p":"v.","m":"통지하다, 알리다","f":1,"i":"상대에게 표시(not-알림, note)를 콕 찍어 알려줌 (-fy만들다). '통지하다'라는 격식체."},{"w":"objective","p":"a.","m":"객관적인 n. 목표, 목적","f":1,"i":"내 눈앞에 툭 던져진(ob-맞서서 + ject던지다) 바깥 대상 그 자체. 내 감정 뺀 '객관적'. 명사로는 던져진 그 표적 = 목표."},{"w":"occupation","p":"n.","m":"직업, 점유","f":1,"i":"어떤 공간이나 시간을 통째로 붙잡아 차지함(ob-+cap잡다). 땅을 잡으면 점유, 하루를 잡아먹는 일이면 직업."},{"w":"offhand","p":"a.","m":"즉석의","f":1,"i":"손(hand)에서 툭 떼어내(off) 준비 없이 즉석에서 내뱉음. 미리 안 챙기고 그 자리에서 나온."},{"w":"oppose","p":"v.","m":"반대하다","f":1,"i":"상대 앞에 딱 마주 서서(ob-맞서서 + pos놓다) 길을 막음. 정면으로 반대함."},{"w":"organize","p":"v.","m":"조직하다, 편성하다","f":1,"i":"흩어진 부품들을 하나의 '기관(organ)'처럼 제자리에 짜 맞춤. 유기적으로 조직·편성."},{"w":"pace","p":"n.","m":"걸음걸이, 속도","f":1,"i":"한 발 한 발 내딛는 보폭 그 자체. 그 발걸음의 빠르기가 곧 속도."},{"w":"pathetic","p":"a.","m":"형편없는, 측은한, 불쌍한","f":1,"i":"보는 사람 가슴을 아프게 찌르는 감정(path-느낌, 고통). 딱해서 측은하거나, 한심해서 '수준이 형편없는'."},{"w":"piety","p":"n.","m":"(종교적인) 경건","f":1,"i":"신 앞에 무릎 꿇고 경건히 머리 숙인 자세. 종교적 경건·독실함. (문어·격식체)"},{"w":"pique","p":"v.","m":"화나게 하다, 감정을 해치다","f":1,"i":"뾰족한 것에 콕 찔린(창끝 pike) 듯 자존심이 상해 발끈함. 호기심을 '콕 찔러' 자극할 때도 씀(pique one's curiosity)."},{"w":"pretend","p":"v.","m":"가장하다, 사칭하다","f":1,"i":"남들 앞에(pre-앞) 가짜 얼굴을 쭉 펼쳐(tend뻗다) 내밈. 실제와 다른 척 가장·사칭."},{"w":"pretentious","p":"a.","m":"자만하는, 건방진","f":1,"i":"실속보다 앞으로(pre-) 자기를 잔뜩 뻗어(tend) 부풀려 내보임. 있는 척·잘난 척하는 허세."},{"w":"prodigal","p":"a.","m":"낭비하는, 방탕한","f":1,"i":"돈을 앞으로(pro-앞) 마구 흩뿌려 쏟아냄. 물 쓰듯 낭비하는·방탕한. (문어체, 성경의 '탕자' prodigal son으로 유명)"},{"w":"push oneself","p":"phr.","m":"스스로를 채찍질하다","f":1,"i":"제 등을 스스로 밀어붙여 한계 너머로 몰아감. 자신을 채찍질함."},{"w":"quest","p":"n.","m":"목표, 탐색","f":1,"i":"무언가를 찾아(quer-구하다) 길을 나 hr.","m":"돌려 말하다, 요점을 피하다","f":1,"i":"덤불(bush) 속 새를 바로 안 몰고 주변만 툭툭 두드림. 핵심은 안 건드리고 빙빙 둘러 말함."},{"w":"bestow","p":"v.","m":"수여하다, 증여하다","f":1,"i":"윗사람이 아랫사람에게 격식 있게 얹어(be- + stow쌓아두다) 내려줌. 상·명예·선물을 정중히 수여."},{"w":"booking","p":"n.","m":"예약","f":1,"i":"장부(book)에 이름과 자리를 적어 넣어 잡아두는 것. 예약. (영국식이 더 흔함, 미국은 reservation)"},{"w":"calculative","p":"a.","m":"계획적인, 신중한","f":1,"i":"머릿속 주판알(calcul=돌·계산)을 하나하나 튕겨 득실을 재보는. 신중하지만 때론 잇속만 따지는 느낌."},{"w":"common interests","p":"phr.","m":"공통의 이익, 공통의 관심사","f":1,"i":"여러 사람이 함께(common) 공유하는 이익·관심사. 뜻 그대로."},{"w":"concierge","p":"n.","m":"(호텔의) 안내 직원","f":1,"i":"호텔 로비에 서서 손님의 온갖 요청을 처리해주는 안내 직원. 프랑스어 그대로 — 특별한 분해 이미지 없음."},{"w":"connecting flight","p":"phr.","m":"연결편, 연결 비행기","f":1,"i":"한 비행기에서 내려 다음 비행기로 이어(connect) 갈아타는 편. 뜻 그대로."},{"w":"contradiction","p":"n.","m":"모순, 반박","f":1,"i":"한 입에서 나온 두 말이 서로 맞받아(contra-맞서서) 정면충돌(dict=말하다). 앞말과 뒷말이 서로를 부정함."},{"w":"contravene","p":"v.","m":"반대하다, (법률·규칙을) 어기다","f":1,"i":"규칙이 세운 선에 맞서서(contra-) 반대편으로 건너가(ven=오다) 어김. 법·규정을 정면으로 위반. (문어·법률)"},{"w":"convolute","p":"v.","m":"뒤얽히다, 둘둘 말다","f":1,"i":"실이나 종이를 함께(con-) 둘둘 말아(volut=구르다) 뒤엉키게 함. 단순한 걸 배배 꼬아 복잡하게."},{"w":"convolution","p":"n.","m":"나선, 소용돌이","f":1,"i":"안으로 함께 말려 들어간 나선·소용돌이. 뇌 주름처럼 배배 꼬인 굴곡."},{"w":"crestfallen","p":"a.","m":"풀이 죽은, 의기소침한","f":1,"i":"수탉의 곧추선 볏(crest)이 축 떨어진(fallen) 모습. 기세등등하던 게 풀 죽어 고개 숙인 상태."},{"w":"criminality","p":"n.","m":"범죄","f":1,"i":"범죄(crime)라는 성질·행위 그 자체를 가리키는 추상명사. 죄스러움·범죄성."},{"w":"defector","p":"n.","m":"탈주자, 망명자","f":1,"i":"속했던 진영에서 떨어져 나와(de-분리) 등지고 넘어간 사람. 조직·국가를 버린 탈주자·망명자."},{"w":"delicate","p":"a.","m":"섬세한, 우아한","f":1,"i":"손가락에 힘주면 바스러질 듯 얇고 섬세한 것. 유리·레이스처럼 조심조심 다뤄야 하는 연약함·정교함."},{"w":"depose","p":"v.","m":"면직하다, 퇴위시키다","f":1,"i":"높은 자리에 놓인(pos=놓다) 사람을 아래로(de-) 끌어내려 자리에서 치움. 왕·권력자를 퇴위·면직."},{"w":"desolate","p":"a.","m":"황량한, 황폐한","f":1,"i":"사람 하나 없이(de- 완전히 + sol홀로) 텅 비어 바람만 부는 벌판. 버림받아 황량하고 쓸쓸한."},{"w":"diagnose","p":"v.","m":"진단하다","f":1,"i":"증상을 꿰뚫어(dia-가로질러) 그 속을 알아내(gnose=알다) 병명을 짚음. 관통해 원인을 집어내는 감각."},{"w":"differ","p":"v.","m":"다르다, 의견이 다르다","f":1,"i":"두 개를 서로 다른 방향으로 떼어(dif-흩어짐 + fer나르다) 놓으니 같지 않음. 다르다·의견이 갈리다."},{"w":"disciplined","p":"a.","m":"훈련받은, 규율 바른","f":1,"i":"제자(disciple)가 스승 밑에서 반복 훈련받아 몸에 밴 상태. 흐트러짐 없이 규율이 잡힌."},{"w":"discrepancy","p":"n.","m":"불일치","f":1,"i":"두 소리가 서로 어긋나(dis- + crep삐걱대다) 딱 안 맞음. 숫자·진술이 서로 안 들어맞는 불일치."},{"w":"discrimination","p":"n.","m":"차별 (대우), 구별","f":1,"i":"한데 섞인 것을 갈라(dis-흩어짐 + crimin가르다) 골라냄. 좋게 쓰면 구별, 나쁘게 쓰면 편 갈라 차별."},{"w":"disentangle","p":"v.","m":"얽힌 것을 풀다, 해방시키다","f":1,"i":"얽혀(tangle) 뭉친 실을 반대로(dis-) 풀어냄. 뒤엉킨 매듭이나 복잡한 문제를 한 가닥씩 풀어헤침."},{"w":"emulator","p":"n.","m":"경쟁자, 모방자","f":1,"i":"앞서가는 자를 따라잡으려(emul=겨루다) 똑같이 흉내 내며 경쟁하는 자. 모방자이자 경쟁자."},{"w":"enclose","p":"v.","m":"에워싸다, 둘러싸다","f":1,"i":"울타리로 안에(en-) 완전히 둘러 닫음(close). 봉투 안에 편지를 넣어 동봉하는 것도 이 이미지."},{"w":"endangered species","p":"phr.","m":"멸종 위기에 처한 종","f":1,"i":"위험(danger) 속에 놓여(en-) 곧 사라질 처지의 종. 멸종 위기종. 뜻 그대로."},{"w":"exclude","p":"v.","m":"제외하다, 배제하다","f":1,"i":"문을 닫아(clud=닫다) 밖으로(ex-) 내쳐 못 들어오게 함. 명단·모임에서 빼버림."},{"w":"execute","p":"v.","m":"실행하다, 집행하다","f":1,"i":"계획을 끝까지(ex- 완전히) 밀고 나가 실행함(secu=따라가다). 명령·형벌을 끝까지 집행하는 감각."},{"w":"fastidious","p":"a.","m":"까다로운","f":1,"i":"먼지 하나까지 눈에 걸려 못 참는, 시시콜콜 트집 잡는 까다로움. 완벽해야 만족하는 예민함. (문어체)"},{"w":"fertile","p":"a.","m":"기름진, 비옥한","f":1,"i":"씨만 뿌리면 쑥쑥 열매 맺는(fer나르다=열매를 냄) 기름진 땅. 상상력·발상이 풍부하다는 뜻으로도 확장."},{"w":"fertilize","p":"v.","m":"기름지게 하다, 수정시키다","f":1,"i":"메마른 땅에 거름을 부어 열매 맺게(fertile) 만듦. 흙을 기름지게 하거나, 정자가 난자를 수정시킴."},{"w":"foster","p":"v.","m":"촉진하다, 육성하다","f":1,"i":"남의 새끼도 품어 먹여(foster=기르다) 자라게 함. 재능·관계를 정성껏 길러 북돋우는 감각."},{"w":"fritter","p":"v.","m":"조금씩 낭비하다, 잘게 썰다","f":1,"i":"큰 덩어리를 부스러기(fritter=조각)로 잘게 흩어 조금씩 날려버림. 돈·시간을 티끌처럼 낭비."},{"w":"get away","p":"phr.","m":"휴가를 떠나다","f":1,"i":"붙잡던 일상에서 몸을 빼내(away) 멀리 벗어남. 훌쩍 떠나는 휴가의 느낌."},{"w":"get in with","p":"phr.","m":"~와 어울리다, ~와 가까이 지내다","f":1,"i":"어떤 무리 안으로(in) 슬쩍 끼어들어(with) 친해짐. 특히 이득 보려 가까이 지내는 뉘앙스."},{"w":"hang a sign","p":"phr.","m":"간판을 걸다","f":1,"i":"간판을 못이나 고리에 걸어(hang) 내다 붙임. 뜻 그대로."},{"w":"hardy","p":"a.","m":"건장한, 내구력이 강한","f":1,"i":"혹한과 고생을 견뎌내는 단단함(hard). 추위에도 안 죽는 강인한 식물·사람의 억센 내구력."},{"w":"immure","p":"v.","m":"가두다, 한정하다","f":1,"i":"사람을 벽(mur=벽) 안에(im-) 가둬 못 나오게 함. 담장 안에 갇혀 세상과 단절된 느낌. (문어체)"},{"w":"incline","p":"v.","m":"마음을 기울이다","f":1,"i":"마음이 한쪽으로 비스듬히(clin=기울다) 안으로 기욺(in-). 물리적 경사이자, 마음이 쏠리는 성향."},{"w":"indigenous","p":"a.","m":"토착의, 그 지역 고유의","f":1,"i":"그 땅 안에서(indi- + gen태어나다) 처음부터 나고 자란. 외부에서 온 게 아닌 토박이·토착의."},{"w":"inform","p":"v.","m":"알리다, 알려 주다","f":1,"i":"상대 머릿속에 형태(form)를 만들어(in-) 넣어줌. 정보를 넣어 모양 잡아주는 것 — 알리다."},{"w":"inhibit","p":"v.","m":"금하다","f":1,"i":"앞으로 나가려는 걸 안에서(in-) 붙잡아(hibit=쥐다) 못 하게 막음. 억눌러 금하는 제동의 감각."},{"w":"innocuous","p":"a.","m":"악의 없는, 무해한","f":1,"i":"손을 대도 아무 해도 못 끼치는, 이빨 빠진 상태 (in-부정 + noc해치다, nocere). 독도 가시도 없어 '무해한'. 말·농담이 innocuous면 상처 안 남."},{"w":"inscribe","p":"v.","m":"새기다","f":1,"i":"펜촉이나 끌을 표면 '안으로' 파고들어 글자를 새겨 넣음 (in-안으로 + scrib쓰다). 반지 안쪽·비석·책 속표지에 새기는 그림."},{"w":"integrate","p":"v.","m":"통합하다","f":1,"i":"흩어진 조각들을 빈틈 없이 맞물려 하나의 온전한 덩어리로 만듦 (어근 integ=손대지 않은·온전한, entire와 한뿌리). 통합의 핵심은 '하나로 온전해짐'."},{"w":"invade","p":"v.","m":"침입하다","f":1,"i":"남의 경계선을 밟고 안으로 밀고 들어감 (in-안으로 + vade가다). 군대·질병·잡초가 남의 영역을 침범해 밀려 들어오는 그림."},{"w":"invaluable","p":"a.","m":"매우 귀중한","f":1,"i":"값을 매기려 해도 저울이 안 먹혀 값을 못 붙일 만큼 귀함 (in-부정 + value). '가치 없음'이 아니라 '너무 귀해 값 산정 불가'. 함정 주의: valuable보다 더 강함."},{"w":"irresistible","p":"a.","m":"저항할 수 없는, 사랑스러운","f":1,"i":"밀어내려 버텨봐도 힘없이 끌려가는 자석 같은 끌림 (ir-부정 + resist저항 + ible). 유혹·매력에 저항선이 무너지는 그림."},{"w":"juvenile","p":"a.","m":"나이 어린, 젊은, 유치한","f":1,"i":"아직 다 안 여문 어린 티가 묻어나는 상태 (어근 juven=young). 나이가 어리거나, 어른이 어린애처럼 굴면 '유치한'. 청소년 범죄 juvenile crime."},{"w":"keep one’s fingers crossed","p":"phr.","m":"행운을 빌다, 좋은 결과를 빌다","f":1,"i":"검지 위에 중지를 X자로 포개 걸어두고 행운을 비는 손동작. 결과가 나올 때까지 그 손가락을 '계속 걸어둔' 채 마음 졸이는 그림."},{"w":"kin","p":"n.","m":"친척, 친족","f":1,"i":"같은 핏줄로 묶인 사람들 무리 (king·kind와 한뿌리, '같은 씨'). next of kin=가장 가까운 친족. relatives가 더 흔한 일상어."},{"w":"lethal","p":"a.","m":"죽음에 이르는, 치사의","f":1,"i":"닿기만 해도 목숨 줄을 끊어버리는 치명성 (그리스 신화 망각의 강 Lethe, 죽음의 이미지). lethal dose=치사량, lethal weapon=흉기."},{"w":"loose","p":"a.","m":"자유로운","f":1,"i":"묶여 있던 매듭이 풀려 헐렁하게 늘어진 상태. 조임·구속이 풀림 → 헐거운·풀린·자유로운. 함정: lose(잃다)와 철자·발음 혼동 주의."},{"w":"make mincemeat of","p":"phr.","m":"~을 호되게 야단치다","f":1,"i":"고기를 다지듯 상대를 잘게 갈아버림 (mincemeat=다진 고기 소). 토론·경기에서 완패시키거나 호되게 박살내는 그림."},{"w":"make the best of","p":"phr.","m":"~을 최대한 이용하다","f":1,"i":"주어진 최악의 패에서도 가장 좋은 것만 뽑아 써먹음. 상황이 나빠도 그 안에서 최선을 짜내 활용하는 태도."},{"w":"meet a deadline","p":"phr.","m":"마감을 맞추다","f":1,"i":"달려오는 마감선(deadline)에 늦지 않게 딱 마주쳐 도달함. meet은 '만나다'가 아니라 기준선에 '맞춰 닿다'."},{"w":"minimal","p":"a.","m":"최소량의, 최소한도의","f":1,"i":"더는 못 줄이는 바닥까지 깎아낸 최소치 (어근 min=작은, minimum). 딱 최소한만 있는 상태. minimal effort=최소한의 노력."},{"w":"modest","p":"a.","m":"겸손한, 신중한","f":1,"i":"자기를 적당한 크기로 눌러 잡아 튀지 않게 하는 태도 (어근 mod=치수·절제, moderate와 한뿌리). 겸손·수수함, 규모가 '많지 않은'."},{"w":"nominate","p":"v.","m":"지명하다","f":1,"i":"여럿 앞에서 누군가의 '이름을 불러' 그 자리 후보로 세움 (어근 nomin=이름, name). 지명·추천. 오스카 nominee=후보."},{"w":"parole","p":"v.","m":"가석방시키다","f":1,"i":"간수 앞에서 '말(약속)'을 담보로 형기를 다 안 채우고 풀려남 (어근 parole=말, 프랑스어). 원래 '명예를 건 말'. 조건부 석방."},{"w":"perpetrate","p":"v.","m":"잘못을 저지르다","f":1,"i":"나쁜 짓을 끝까지 밀어붙여 저질러 버림 (per-끝까지관통). commit과 달리 범죄·악행에만 쓰는 딱딱한 법률어. (문어·격식체)"},{"w":"pertinacity","p":"n.","m":"불굴의 의지, 끈기 있음","f":1,"i":"한번 문 것을 죽어도 안 놓고 끝까지 붙들고 늘어짐 (per-끝까지 + tin붙잡다=hold). 집요할 정도의 끈기. (문어체) 회화선 persistence."},{"w":"pledge","p":"v.","m":"약속하다, 서약하다","f":1,"i":"남들 앞에서 손 얹고 '무조건 하겠다'고 자신을 걸어 묶는 서약. 약속보다 무겁고 공식적. 기부·충성 서약에 자주."},{"w":"post","p":"v.","m":"공고하다, 공표하다","f":1,"i":"게시판에 종이를 탁 붙여 모두가 보게 내걸음. 기둥(post)에 공고를 못박던 데서. 요즘은 온라인에 글을 '올리다'."},{"w":"prescription","p":"n.","m":"처방전","f":1,"i":"의사가 '미리 써서(pre-앞서 + scrib쓰다)' 약사에게 건네는 지시 종이. 앞서 적어둔 처방. 접두어 혼동: prescribe(처방) vs proscribe(금지)."},{"w":"pull off","p":"phr.","m":"사라지다, 달성하다, 성공하다","f":1,"i":"빡빡해서 안 될 것 같던 일을 확 잡아당겨 기어이 벗겨내듯 해냄. '어려운 걸 용케 성공시키다'가 핵심. 옷을 벗기다에서 확장."},{"w":"pull through","p":"phr.","m":"극복하다","f":1,"i":"위독한 사람을 병의 터널 반대편으로 끌어당겨 통과시킴 (through-관통). 고비를 넘겨 살아남다·회복하다."},{"w":"ramification","p":"n.","m":"결과, 파생물","f":1,"i":"나뭇가지(ram=branch)가 갈라지고 또 갈라져 뻗어나가듯, 한 행동에서 줄줄이 뻗는 파생 결과들. 보통 복잡한 후폭풍을 뜻함."},{"w":"receive a refund","p":"phr.","m":"환불받다","f":1,"i":"냈던 돈이 되(re-뒤로) 흘러(fund) 내 손으로 돌아와 받음. 돌려받는 환불금을 수령하는 그림."},{"w":"receive a scholarship","p":"phr.","m":"장학금을 받다","f":1,"i":"학자(scholar)에게 주는 돈배(-ship)를 받아 챙김. 장학금을 수여받는 장면. 그대로 '장학금 받다'."},{"w":"recycled paper","p":"phr.","m":"재생 용지","f":1,"i":"썼던 종이를 다시(re-) 순환(cycle)의 고리로 돌려 새 종이로 태어나게 함. 재생 용지. 뜻 그대로."},{"w":"regain health","p":"phr.","m":"건강을 회복하다","f":1,"i":"잃었던 건강을 다시(re-) 손에 움켜쥐어(gain) 되찾음. 앓다 회복해 예전 몸 상태로 돌아오는 그림."},{"w":"repudiate","p":"v.","m":"거부하다, 거절하다","f":1,"i":"부끄러운 것을 밀쳐내듯 '난 그것과 무관하다'며 공식적으로 내침 (어근 pud=부끄러움, 라틴 repudiare). 주장·책임·조약을 단호히 거부. (문어·격식체)"},{"w":"saturate","p":"v.","m":"담그다, 흠뻑 적시다","f":1,"i":"스펀지가 물을 더 못 먹을 때까지 빨아들여 뚝뚝 흐르는 포화 상태 (라틴 satur=배부른, satisfy와 한뿌리). 흠뻑 적심·시장 포화."},{"w":"saturation","p":"n.","m":"침투, 충만, 포화","f":1,"i":"스펀지가 더는 못 빨아들일 만큼 꽉 찬 포화 그 자체. 색·시장·수분이 한계까지 가득 찬 상태."},{"w":"service provision","p":"phr.","m":"서비스 제공","f":1,"i":"필요할 때 대비해 미리(pro-앞으로 + vis보다) 마련해 대주는 서비스 공급 (provide의 명사). 서비스를 제공하는 것."},{"w":"sophisticated","p":"a.","m":"정교한, 세련된","f":1,"i":"때 묻지 않은 순진함을 벗고 세상 물정에 닳고닳아 정교해진 상태 (그리스 sophos=지혜, 원래 '궤변으로 물들다'). 기술이면 정교한, 사람이면 세련된."},{"w":"spare the details","p":"phr.","m":"자세하게 이야기하지 않다","f":1,"i":"듣는 이가 굳이 안 겪게 세세한 부분을 덜어내(spare) 봐줌. 자잘한 내막은 생략하고 넘어감. Spare me the details=시시콜콜 됐어."},{"w":"squeeze","p":"v.","m":"압착하다, 짜내다","f":1,"i":"손아귀로 꽉 눌러 즙·물기를 밖으로 짜내는 압박. 좁은 틈으로 몸을 비집어 넣을 때도. 물리적 '쥐어짬'이 핵심."},{"w":"strategic","p":"a.","m":"전략상의, 전략상 중요한","f":1,"i":"전장을 위에서 내려다보며 큰 그림으로 수를 놓는 (그리스 stratos=군대 + agein이끌다=장군의 기술). 눈앞이 아닌 판 전체를 보는 전략적."},{"w":"tardy","p":"a.","m":"느린, 지각한","f":1,"i":"출발이 굼떠 제 시각보다 뒤처져 도착함 (라틴 tardus=느린, retard와 한뿌리). 지각한·굼뜬. 미국 학교에서 '지각' 표시로 흔함."},{"w":"take one’s time","p":"phr.","m":"천천히 하다, 서두르지 않다","f":1,"i":"쫓기지 않고 자기 몫의 시간을 넉넉히 챙겨 천천히 함. 서두르지 말라는 여유의 그림. Take your time=천천히 해."},{"w":"testify","p":"v.","m":"증명하다, 증언하다 / 증언하다, 증명하다","f":1,"i":"증인석에서 진실을 '증거로 만들어(test증거 + fy만들다)' 내보임. 법정에서 손 얹고 증언하는 그림. 사실이 뭔가를 입증할 때도."},{"w":"tickle","p":"v.","m":"간질이다, 만족시키다","f":1,"i":"겨드랑이·발바닥을 살살 건드려 웃음이 터지게 간질임. 감각을 콕콕 자극. 확장: 흥미·기분을 살살 건드려 즐겁게 함(tickle one’s fancy)."},{"w":"undulate","p":"v.","m":"물결치다, 기복지다","f":1,"i":"잔물결(라틴 unda=파도)이 오르내리며 넘실대듯 완만한 굴곡이 물결침. 언덕·천·바다가 파도처럼 기복지는 그림. (문어체)"},{"w":"validate","p":"v.","m":"유효하게 하다, 타당성을 보여 주다","f":1,"i":"힘(라틴 val=강하다, value·valid와 한뿌리)을 실어 '이건 진짜 유효하다'고 도장 찍어 확정함. 표·주장·주차권을 공식 인증."},{"w":"a shot in the dark","p":"phr.","m":"억측, 막연한 추측","f":1,"i":"캄캄한 어둠 속에 겨냥 없이 총 한 발 쏘듯, 맞을지 모르는 막연한 추측. 근거 없이 던지는 억측."},{"w":"accommodate","p":"v.","m":"편의를 도모하다, 숙박시키다","f":1,"i":"손님이 딱 맞게(라틴 com-함께 + mod치수) 지낼 크기의 자리를 내어 맞춰 줌. 숙박시키다·편의를 봐주다. 철자 c·m 둘씩 함정."},{"w":"acquaint","p":"v.","m":"알려 주다, 전하다","f":1,"i":"누군가/무언가를 '알게(quaint=알다, cognize와 한뿌리)' 붙여 소개해 익숙해지게 함. acquaint A with B=A에게 B를 알려 주다."},{"w":"agitate","p":"v.","m":"흔들다, 선동하다","f":1,"i":"액체를 마구 흔들어 휘젓듯(ag-몰다 + it가다, act와 한뿌리) 마음·군중을 뒤흔들어 동요시킴. 흔들다 → 선동하다·불안하게 하다."},{"w":"allowance","p":"n.","m":"수당","f":1,"i":"정기적으로 '허락되어(allow)' 딱 떼어 주어지는 돈. 용돈·수당. 부모가 매주 주는 용돈이 전형적 그림."},{"w":"aphrodisiac","p":"a.","m":"성적 흥분을 일으키는, 최음의","f":1,"i":"사랑의 여신 아프로디테(Aphrodite)의 이름에서 온, 욕정에 불을 붙이는 것. 최음제·성욕 자극제. 뜻 그대로, 어원이 곧 이미지."},{"w":"asset","p":"n.","m":"유용한 것, 이점, 자산","f":1,"i":"손에 쥐면 도움이 되는 값나가는 밑천 (라틴 ad satis=충분히 있음). 돈·재산뿐 아니라 '유용한 강점'도 asset. He’s an asset to the team."},{"w":"be one’s own boss","p":"phr.","m":"누구의 지배도 안 받다, 독립해 있다","f":1,"i":"위에 상사가 없고 자기 자신이 곧 사장인 상태. 남 지시 안 받고 스스로 결정하는 독립·자영의 그림."},{"w":"bloom","p":"v.","m":"꽃이 피다, 번영하다","f":1,"i":"꽃봉오리가 활짝 벌어져 만개함. 거기서 확장: 사람·사업이 한창때로 활짝 피어 번영함. in full bloom=만발한."},{"w":"brew tea","p":"phr.","m":"차를 끓이다","f":1,"i":"찻잎을 뜨거운 물에 담가 성분을 우려냄 (brew=끓여 우리다). 차·맥주·커피를 우려/양조하는 그림. 그대로 '차를 끓이다·우리다'."},{"w":"complimentary","p":"a.","m":"무료의, 칭찬의","f":1,"i":"칭찬(compliment)하듯 공짜로 얹어 주는 호의의 선물. 무료의·칭찬의. 함정: complement(보완)와 철자·뜻 혼동 주의."},{"w":"concur","p":"v.","m":"동의하다, 일치하다","f":1,"i":"여러 사람의 생각이 한 점을 향해 '함께 달려(con-함께 + cur달리다=run)' 딱 만남. 의견이 일치하다·동의하다. (문어·격식체)"},{"w":"conglomerate","p":"v.","m":"둥글게 뭉치다 n. 거대 기업","f":1,"i":"여러 알갱이가 한 덩어리로 뭉쳐 굳은 상태 (con-함께 + glomer둥근덩이). 자갈이 굳은 역암, 확장: 여러 회사가 뭉친 거대 복합기업."},{"w":"congregate","p":"v.","m":"모이다, 집합하다","f":1,"i":"흩어진 무리(greg=떼, gregarious와 한뿌리)가 한곳으로 함께(con-) 모여듦. 사람·동물이 떼지어 집합하는 그림."},{"w":"consolation","p":"n.","m":"위로, 위안","f":1,"i":"혼자(sol) 무너진 사람 곁에 함께(con-) 붙어 마음을 다독여 위로함 (solace와 한뿌리). consolation prize=위로상(패자상)."},{"w":"contemptible","p":"a.","m":"경멸할 만한","f":1,"i":"발밑에 놓고 침 뱉듯 깔볼 만한 (con-강조 + tempt=경멸하다, contempt). 경멸받아 마땅한. 혼동: contemptuous(경멸하는-주체) vs contemptible(경멸당하는-대상)."},{"w":"credence","p":"n.","m":"신뢰, 믿음","f":1,"i":"믿음을 상대에게 건네주는 것 (cred믿다). 남의 말에 '그렇다'고 무게를 실어주는 신뢰. give credence to(~을 믿다)로 자주 씀. (문어·격식체)"},{"w":"credential","p":"n.","m":"증명서","f":1,"i":"'이 사람 믿어도 됩니다'라고 보증해 주는 종이 (cred믿다). 자격·신원을 믿게 만드는 증명서. 보통 복수 credentials."},{"w":"dedicate","p":"v.","m":"바치다, 헌정하다","f":1,"i":"자기 전부를 떼어 신·목적·사람에게 아래로 바쳐 올림 (de-완전히 + dic선언하다). 그 대상에만 통째로 헌정·전념함."},{"w":"deviate","p":"v.","m":"(진로를) 벗어나다, 빗나가다, 일탈하다","f":1,"i":"곧게 난 길(via길)에서 옆으로 삐끗 벗어남 (de-떨어져 + via길). 정해진 궤도·규범에서 빗나감."},{"w":"discord","p":"n.","m":"불일치, 다툼","f":1,"i":"여러 마음(cord심장)이 뿔뿔이 흩어져 삐걱대는 상태 (dis-흩어짐 + cord마음). 불협화음처럼 안 맞고 다툼."},{"w":"dismal","p":"a.","m":"비참한, 참담한","f":1,"i":"빛 한 줌 없이 축축하고 음산한 지하 같은 분위기. 성적·전망이 참담할 만큼 형편없을 때도 씀."},{"w":"dismiss an employee","p":"phr.","m":"직원을 해고하다","f":1,"i":"직원을 손짓 한 번으로 '나가'하고 떨쳐 내보냄 (dis-떨어져 + miss보내다). 밀어내 해고함."},{"w":"distinctive","p":"a.","m":"뚜렷이 구별되는, 독특한","f":1,"i":"다른 것들과 확 갈라서서(stinct찌르다) 딱 구별되게 튀는 특징. 한눈에 '어 저건 다르다' 싶은 고유함."},{"w":"doctrine","p":"n.","m":"교의, 교리","f":1,"i":"스승(doct가르치다)이 제자에게 내려주는 고정된 가르침 덩어리. 종교·정치의 확립된 교리·신조."},{"w":"draft","p":"n.","m":"외풍, 통풍, 초고, 초안","f":1,"i":"문 틈으로 훅 끌려 들어오는 찬 공기 줄기 (draw끌다). 그 '끌어당김'에서 초안(글을 끌어냄)·징집(사람을 끌어옴)까지 뻗음."},{"w":"duplicitous","p":"a.","m":"일구이언의, 사기의","f":1,"i":"얼굴이 둘(dupl두 배)로 접힌 사람 — 앞뒤가 다른 겉과 속. 겉으로 웃으며 뒤로 속이는 이중적."},{"w":"elongate","p":"v.","m":"연장하다, 잡아 늘이다","f":1,"i":"양끝을 잡고 밖으로 죽 잡아당겨 길게(long긴) 늘임 (e-밖으로 + long). (문어·과학체) 회화에선 stretch가 흔함."},{"w":"endorse","p":"v.","m":"(상품을) 홍보하다, 배서하다","f":1,"i":"서류 뒤(dorse등)에 이름을 얹어 '내가 보증한다' 도장 찍음 (en-위에 + dorse등). 상품·후보를 공개 지지·홍보."},{"w":"evoke","p":"v.","m":"(기억을) 되살려내다, (물의·웃음 따위를) 일으키다","f":1,"i":"묻혀 있던 기억·감정을 밖으로 불러내는 목소리 (e-밖으로 + voc부르다). 안에 잠든 것을 불러 깨움."},{"w":"exertion","p":"n.","m":"노력, 발휘","f":1,"i":"안에 있는 힘을 밖으로 쥐어짜 밀어냄 (ex-밖으로 + sert밀다). 땀 흘리는 육체적·정신적 애씀."},{"w":"exfoliate","p":"v.","m":"벗겨내다, 벗겨지다","f":1,"i":"피부·바위에서 얇은 잎(foli잎)을 밖으로 한 겹씩 떼어냄 (ex-밖으로 + foli잎). 각질을 벗겨냄."},{"w":"familiarize","p":"v.","m":"친숙하게 하다","f":1,"i":"낯선 것을 자주 마주쳐 '우리 식구(famili가족)'처럼 편해지게 만듦. familiarize oneself with(~에 익숙해지다)."},{"w":"ferry","p":"v.","m":"(사람·화물 등을) 나룻배로 건네다","f":1,"i":"강 이쪽에서 저쪽으로 사람·짐을 배에 실어 실어 나름 (fer나르다). 왕복하며 건네주는 나룻배 동작."},{"w":"formula","p":"n.","m":"공식, 인습적 방식","f":1,"i":"빈칸에 값만 갈아 끼우면 되는 고정된 틀(form형태). 늘 똑같이 굴러가는 공식·판에 박힌 방식."},{"w":"frisk","p":"v.","m":"몸수색하다","f":1,"i":"손바닥으로 몸을 톡톡 훑어 숨긴 것 없나 더듬는 검문. 원래 '팔짝거리다'에서 온 잽싼 손놀림."},{"w":"gawky","p":"a.","m":"멍청한, 얼빠진","f":1,"i":"팔다리만 길쭉 자라 어색하게 삐걱대는 촌뜨기 자세. 멀뚱히 입 벌리고 얼빠진 모습. (구어)"},{"w":"have trouble with","p":"phr.","m":"~에 문제가 있다","f":1,"i":"무언가와 계속 엉겨 붙어 애먹는 상태. '~ 때문에 골치 앓다'. have trouble -ing로도 씀."},{"w":"hypocritical","p":"a.","m":"위선적인","f":1,"i":"무대 위 배우처럼 가면을 쓰고 아닌 척 연기함 (hypo-아래 + crit판단, 원래 '연기하다'). 말과 행동이 딴판인 위선."},{"w":"impart","p":"v.","m":"나누어 주다","f":1,"i":"자기 몫을 떼어(part부분) 상대 안으로 밀어 넣어 줌 (im-안으로 + part). 지식·비밀·특성을 나눠 전함. (문어체)"},{"w":"incite","p":"v.","m":"(어떤 감정을) 불러일으키다, 조장하다","f":1,"i":"상대 안에 불을 지펴 확 움직이게 부추김 (in-안으로 + cite자극하다). 감정·폭동을 부채질해 일으킴."},{"w":"incredulous","p":"a.","m":"의심 많은, 회의적인","f":1,"i":"'그걸 믿으라고?'하며 눈썹 치켜뜬 얼굴 (in-부정 + cred믿다). 못 믿겠다는 회의적 표정. cf. incredible(믿기지 않는=대상)."},{"w":"indispensable","p":"a.","m":"필수의, 없어서는 안 되는","f":1,"i":"빼면(dispense나눠주다) 안 되는, 도저히 없이는 못 굴러가는 핵심 부품 (in-부정 + dispensable없어도 됨). 필수불가결."},{"w":"infrastructure","p":"n.","m":"하부 조직, 사회 기반 시설","f":1,"i":"겉으로 안 보이지만 도시 아래(infra-아래) 깔려 떠받치는 뼈대(structure구조). 도로·전기·수도 같은 기반 시설."},{"w":"inscrutable","p":"a.","m":"헤아릴 수 없는, 불가사의한","f":1,"i":"아무리 안을 들여다봐도(scrut살피다) 속을 읽어낼 수 없는 (in-부정 + scrut). 표정 없는 얼굴처럼 헤아릴 길 없음. (문어체)"},{"w":"intend","p":"v.","m":"의도하다, 기도하다","f":1,"i":"마음의 활을 어떤 목표 쪽으로 팽팽히 겨눔 (in-쪽으로 + tend당기다). 그쪽을 향해 하려고 벼름."},{"w":"intention","p":"n.","m":"목적, 의도, 계획","f":1,"i":"마음을 한 곳으로 당겨(tend) 겨눈 화살의 방향 (in-쪽으로 + tend). 하려는 속뜻·목적."},{"w":"intentional","p":"a.","m":"고의적인","f":1,"i":"우연이 아니라 마음을 딱 겨누고 한 (tend당기다). '일부러' 한 고의적 행동."},{"w":"invalidate","p":"v.","m":"무효로 하다","f":1,"i":"효력의 힘(valid유효)을 꺼뜨려 못 쓰게 만듦 (in-부정 + valid). 계약·주장을 무효로 만듦."},{"w":"justification","p":"n.","m":"정당화, 변호","f":1,"i":"'이래서 옳았다'며 자기 행동을 곧게(just올바른) 세워 변호함. 정당하다고 근거 대는 것."},{"w":"latency","p":"n.","m":"숨어 있음, 잠복","f":1,"i":"겉엔 안 보이고 아래 납작 엎드려(lat숨다) 기회를 기다리는 상태. 잠복기, 혹은 반응까지의 지연 시간(IT)."},{"w":"let up","p":"phr.","m":"정리되다, 느슨해지다","f":1,"i":"꽉 누르던 손을 위로 놓아(up) 힘을 뺌. 비·압박·기세가 누그러져 느슨해짐. (구어)"},{"w":"loophole","p":"n.","m":"틈새, (법률 따위의) 허점","f":1,"i":"성벽에 뚫린 화살 쏘는 좁은 구멍 — 거기로 빠져나갈 틈. 법·규정의 빈틈, 빠져나갈 허점."},{"w":"make out","p":"phr.","m":"이해하다, 알아듣다","f":1,"i":"흐릿한 것을 애써 짜맞춰(make) 형체를 알아봄. 멀리 간판 글씨를 겨우 알아보듯 이해·식별함. (구어)"},{"w":"make up","p":"phr.","m":"화해하다","f":1,"i":"틀어졌던 사이를 다시 이어 붙여(make) 하나로 만듦. 화해하다. (또 지어내다·화장하다로도)"},{"w":"meld","p":"v.","m":"혼합시키다","f":1,"i":"melt(녹다)+weld(용접)의 느낌 — 둘이 녹아 이음매 없이 하나로 섞임. 자연스럽게 융합됨."},{"w":"miraculously","p":"ad.","m":"기적적으로","f":1,"i":"도저히 안 될 일이 기적처럼 딱 성사되는 (mir놀라 보다). '거짓말처럼' 살아난 순간에 씀."},{"w":"moldy","p":"a.","m":"곰팡이 난","f":1,"i":"빵·벽에 퍼런 곰팡이(mold)가 피어 눅눅하고 쿰쿰한 상태. 오래 방치돼 상한 느낌."},{"w":"nitpick","p":"v.","m":"사소한 일로 트집잡다","f":1,"i":"머리카락에서 서캐(nit이의 알)를 한 알씩 집어내듯 사소한 흠만 콕콕 집어냄. 시시콜콜 트집. (구어)"},{"w":"obsessive","p":"a.","m":"강박 관념의, 망상의","f":1,"i":"어떤 생각이 머릿속에 눌러앉아(ob-맞서 + sess앉다) 안 비켜나는 상태. 강박적으로 집착하는."},{"w":"originate","p":"v.","m":"일어나다, 시작되다 / 시작하다, 일으키다","f":1,"i":"샘의 첫 물이 솟는 근원(origin기원)에서 처음 흘러나옴. 무언가가 거기서 비롯·시작됨."},{"w":"panoptic","p":"a.","m":"모든 것이 한눈에 보이는","f":1,"i":"높은 감시탑에서 모든 것(pan-전부)을 한눈에 훑어보는(opt보다) 시야. 사방이 다 보임. (문어·학술체)"},{"w":"penalize","p":"v.","m":"벌하다","f":1,"i":"규칙 어긴 자에게 벌(pen벌)을 딱 물림. 반칙에 대가를 치르게 함."},{"w":"penalty","p":"n.","m":"형벌, 처벌, 벌금","f":1,"i":"잘못에 매겨진 값 — 물어야 할 벌·벌금 (pen벌). 죗값을 치르는 대가."},{"w":"pick on","p":"phr.","m":"~를 괴롭히다","f":1,"i":"여럿 중 유독 한 명만 콕 집어(pick) 계속 쪼아댐. 만만한 상대를 골라 괴롭힘. (구어)"},{"w":"picky","p":"a.","m":"까다롭게 구는","f":1,"i":"음식·물건을 하나하나 집었다(pick) 놨다 하며 까탈 부림. 유난히 가려 받는 까다로움. (구어)"},{"w":"react","p":"v.","m":"반작용하다, 반응하다","f":1,"i":"자극에 맞받아(re-되받아) 즉각 튕겨 나오는 움직임 (act행동). 밀면 되미는 반응·반작용."},{"w":"recognition","p":"n.","m":"인식, 인정","f":1,"i":"예전에 알던 것을 다시(re-다시) 마음속에서 알아봄(cogn알다). '아, 그 사람!' 하는 인식, 혹은 공로 인정."},{"w":"remain calm","p":"phr.","m":"냉정을 유지하다","f":1,"i":"파도가 쳐도 수면 아래처럼 잔잔한(calm) 상태를 그대로 유지함. 흔들리지 않고 침착함 지키기."},{"w":"restate","p":"v.","m":"다시 말하다, 고쳐 말하다","f":1,"i":"이미 한 말을 다시(re-다시) 세워(state말하다) 또렷이 고쳐 말함. 헷갈릴 때 요점을 다시 진술."},{"w":"resurrect","p":"v.","m":"되살아나게 하다, 소생시키다","f":1,"i":"죽어 누웠던 것을 다시(re-다시) 위로 일으켜 세움 (sur-위로 + rect세우다). 부활·되살림."},{"w":"root for","p":"phr.","m":"~을 응원하다","f":1,"i":"나무뿌리(root)처럼 그 자리에 박혀 응원팀 편에 딱 붙어 밀어줌. 열렬히 응원함. (구어)"},{"w":"set out","p":"phr.","m":"시작하다","f":1,"i":"짐을 챙겨 문밖으로 딱 놓고(set) 길을 나섬. 여정·일을 개시함. set out to do(~하려 나서다)."},{"w":"set the alarm","p":"phr.","m":"알람을 맞추다","f":1,"i":"알람의 바늘·시각을 원하는 자리에 딱 맞춰 고정함(set). 울리게 세팅함."},{"w":"set the record straight","p":"phr.","m":"오해를 풀다","f":1,"i":"삐뚤어진 기록(record)을 곧게(straight) 바로 놓음. 잘못 알려진 사실을 바로잡아 오해를 풂."},{"w":"solicitor","p":"n.","m":"간청하는 사람","f":1,"i":"'제발요' 하며 끈질기게 매달려 청하는 사람 (soli전체 + cit부르다). 간청·권유하는 이. 영국선 사무변호사."},{"w":"solidify","p":"v.","m":"고체로 만들다, 일치 단결시키다","f":1,"i":"출렁이던 액체가 굳어 단단한 덩어리로 뭉침 (solid단단한). 물질이 고체가 되듯, 흩어진 사람·계획도 하나로 뭉쳐 단단해짐."},{"w":"sphere","p":"n.","m":"구체, 구, 영역","f":1,"i":"완벽하게 둥근 공. 그 공의 표면 전체가 '한 세력이 미치는 둘레'로 은유 확장되어, 활동 영역·분야를 뜻함."},{"w":"spill the beans","p":"phr.","m":"비밀을 누설하다","f":1,"i":"손에 쥔 콩을 와르르 쏟아 바닥에 흩뿌림 — 감춰둔 걸 죄다 흘려버림. 그래서 비밀 누설. (구어)"},{"w":"stay up","p":"phr.","m":"밤늦게까지 자지 않다","f":1,"i":"잠자리에 눕지 않고 몸을 위로(up) 세운 채 버팀. 그래서 밤늦게까지 안 자고 깨어 있음."},{"w":"stick up","p":"phr.","m":"지지하다, 변호하다","f":1,"i":"쓰러지려는 사람 옆에 막대기처럼 딱 서서(stick) 위로 받쳐줌. 'stick up for'로 편들어 변호함. (구어)"},{"w":"strident","p":"n.","m":"귀에 거슬리는, (빛깔 등이) 야한","f":1,"i":"쇠 긁는 소리처럼 날카롭게 삐져나와 귀를 후벼파는 소리. 색이면 눈을 찌르듯 야함. (문어·격식체)"},{"w":"supernatural power","p":"phr.","m":"초능력","f":1,"i":"자연 법칙 위(super-위에)를 넘어서는 힘. 자연으로 설명 안 되는 초자연적 능력. 뜻 그대로."},{"w":"supersede","p":"v.","m":"지위를 빼앗다","f":1,"i":"낡은 자를 밀치고 그 자리 위에 올라앉아(super-위에 + sed앉다) 대신 차지함. 구식을 밀어내고 대체함."},{"w":"take for a ride","p":"phr.","m":"남을 속이다","f":1,"i":"차에 태워 빙 둘러 데려가는 척하며 엉뚱한 데로 데려가 골탕먹임. 그래서 속여먹음. (구어)"},{"w":"thoughtless","p":"a.","m":"경솔한, 부주의한","f":1,"i":"머릿속 생각(thought)이 텅 비어(-less) 앞뒤 안 재고 툭 저지름. 그래서 경솔·부주의."},{"w":"titillate","p":"v.","m":"기분 좋게 자극하다, 간질이다","f":1,"i":"깃털로 살살 간질이듯 감각을 콕콕 자극해 기분 좋게 들뜨게 함. (문어·격식체)"},{"w":"touching","p":"a.","m":"감동시키는, 마음에 와 닿는","f":1,"i":"가슴 한복판을 손끝으로 톡 건드리는(touch) 느낌 — 마음을 살짝 찔러 뭉클하게 함. 그래서 감동적인."},{"w":"tractable","p":"a.","m":"다루기 쉬운, 온순한","f":1,"i":"고삐를 당기면(tract끌다) 순순히 끌려오는 말. 저항 없이 다루기 쉽고 온순함. (문어·격식체)"},{"w":"tyrannical","p":"a.","m":"전제적인, 폭군의","f":1,"i":"권좌에서 아래를 짓누르는 폭군(tyrant)의 손아귀. 남을 억누르고 제멋대로 휘두름."},{"w":"unconscious","p":"a.","m":"의식이 없는","f":1,"i":"정신의 스위치가 툭 꺼져(un-부정 + conscious의식) 아무것도 못 느낌. 의식이 나간 상태."},{"w":"unflagging","p":"a.","m":"지칠 줄 모르는","f":1,"i":"깃발이 축 처지듯(flag기가 꺾이다) 늘어지는 법 없이(un-) 계속 팽팽함. 그래서 지칠 줄 모름. (문어체)"},{"w":"varnish","p":"v.","m":"니스를 칠하다","f":1,"i":"붓으로 투명한 니스를 쓱 발라 표면에 반들반들 광 막을 씌움. 겉을 코팅해 번드르르하게 함."},{"w":"accord","p":"n.","m":"일치, 조화","f":1,"i":"두 심장(cord심장·마음)이 서로 향해 딱 맞물림 (ac-쪽으로 + cord마음). 그래서 일치·조화·합의."},{"w":"admittance","p":"n.","m":"입장, 허가","f":1,"i":"문지기가 안으로(ad-쪽으로 + mit보내다) 들여보내 줌 — 들어가도 좋다는 허락, 입장."},{"w":"ambience","p":"n.","m":"분위기","f":1,"i":"공간을 빙 둘러 감싸며 떠도는 공기의 느낌 (ambi-둘레). 그 자리에 배어 있는 분위기."},{"w":"attendant","p":"n.","m":"시중드는 사람, 참석자","f":1,"i":"곁에 딱 붙어 서서(at-쪽으로 + tend뻗다) 손길이 필요하면 즉시 시중드는 사람."},{"w":"banishment","p":"n.","m":"추방","f":1,"i":"마을 밖으로 손가락질하며 내쫓아 못 돌아오게 함. 그래서 추방."},{"w":"beguile","p":"v.","m":"현혹하다, 속이다","f":1,"i":"달콤한 속임수(guile교활)로 상대를 홀려 정신을 앗아감. 매혹하며 동시에 속임. (문어체)"},{"w":"boast","p":"v.","m":"자랑하다","f":1,"i":"가슴을 앞으로 쑥 내밀고 '봐라!' 하며 부풀려 떠벌림. 그래서 자랑하다."},{"w":"broil","p":"v.","m":"석쇠에 굽다","f":1,"i":"이글거리는 열원 아래 석쇠에 고기를 얹어 지글지글 직화로 구움. 뜻 그대로."},{"w":"cajole","p":"v.","m":"구슬리다, 감언이설로 속이다","f":1,"i":"달콤한 말로 살살 어르고 등을 쓰다듬으며 마음을 녹여 원하는 걸 하게 함. 감언으로 구슬림."},{"w":"chastise","p":"v.","m":"벌하다, 몹시 비난하다","f":1,"i":"회초리를 들어 잘못을 따끔하게 후려쳐 바로잡음. 벌하고 호되게 나무람. (문어체)"},{"w":"chintzy","p":"a.","m":"싸구려의, 값싼, 초라한","f":1,"i":"얇고 값싼 무늬 천(chintz)처럼 싸구려 티가 줄줄 남. 초라하고 인색함. (구어)"},{"w":"coexistent","p":"a.","m":"공존하는","f":1,"i":"둘이 같은 시간·공간에 나란히(co-함께 + exist존재) 부딪힘 없이 함께 있음. 공존하는."},{"w":"compound","p":"n.","m":"혼합물, 합성물","f":1,"i":"여러 재료를 한데 쏟아 함께(com-) 이겨(pound찧다) 뭉친 것. 그래서 혼합물·합성물."},{"w":"conduct an investigation","p":"phr.","m":"수사하다","f":1,"i":"수사의 흐름을 앞장서 이끌어(con-함께 + duct이끌다) 진행함. 조사를 수행함."},{"w":"conjoined","p":"a.","m":"결합된, 연합한","f":1,"i":"두 개를 딱 맞대 하나로 잇대어 붙임 (con-함께 + join잇다). 결합된·연결된."},{"w":"deride","p":"v.","m":"비웃다, 조롱하다","f":1,"i":"상대를 발아래로 깔아뭉개듯(de-아래로 + ride웃다) 비웃음. 위에서 내려다보며 조롱함. (문어체)"},{"w":"dilatory","p":"a.","m":"꾸물대는, 더딘","f":1,"i":"일을 옆으로 질질 늘여(dilate넓히다) 좀처럼 안 끝냄. 꾸물대고 더딤. (문어·격식체)"},{"w":"disposable income","p":"phr.","m":"가처분 소득","f":1,"i":"이미 세금·필수비를 다 치우고(dispose처분) 마음대로 쓸 수 있게 남겨둔 소득. 가처분 소득."},{"w":"disposal","p":"n.","m":"처분, 처치","f":1,"i":"필요 없는 걸 정해진 자리로 치워 버림 (dis-떨어져 + pos놓다). 처분·폐기."},{"w":"distraction","p":"n.","m":"주의 산만, 정신 산란","f":1,"i":"집중하던 줄이 옆으로 홱 끌려가(dis-흩어짐 + tract끌다) 마음이 사방으로 흩어짐. 주의 산만."},{"w":"dredge","p":"v.","m":"(스캔들·사실 등을) 들추어 내다, 긁어내다","f":1,"i":"강바닥을 갈퀴로 긁어 진흙 속에 묻힌 걸 억지로 퍼올림. 묻힌 스캔들을 들추어냄."},{"w":"enervated","p":"a.","m":"활력을 잃은, 무기력한","f":1,"i":"몸속 힘줄(nerve힘)을 쭉 빼내(e-밖으로) 축 늘어짐. 활력이 빠져 무기력함. (문어체)"},{"w":"engage","p":"v.","m":"관여하다, 종사하다, 약속하다, 약혼하다","f":1,"i":"톱니바퀴가 서로 맞물리듯(en-안으로 + gage맞물림) 발을 담가 얽힘. 관여·종사, 약속으로 묶임, 약혼."},{"w":"engagement","p":"n.","m":"약속, 서약, 약혼","f":1,"i":"서로 맞물려 단단히 묶인 상태 (en-안으로 + gage). 그래서 약속·서약·약혼."},{"w":"exhibition","p":"n.","m":"전시, 표명","f":1,"i":"감춰둔 걸 밖으로(ex-) 꺼내 앞에 쭉 펼쳐 보임 (hibit붙잡다→내놓음). 전시·표명."},{"w":"expectation","p":"n.","m":"기대","f":1,"i":"눈을 밖으로(ex-) 향해 뻗어(spect보다) 올 것을 미리 내다봄. 그래서 기대."},{"w":"expecting","p":"v.","m":"임신 중인, 출산 예정인","f":1,"i":"곧 태어날 아기를 밖으로(ex-) 나오길 기다리는(spect) 중 — 임신 중인. (완곡 표현)"},{"w":"falter","p":"v.","m":"약해지다, 뒷걸음치다","f":1,"i":"발이 삐끗 휘청하며 앞으로 못 나가고 흔들림. 기세가 약해지고 뒷걸음침."},{"w":"fixate","p":"v.","m":"고정시키다","f":1,"i":"시선이나 마음을 한 점에 못박아(fix고정) 딱 붙여 뗄 수 없게 함. 고정시킴·집착함."},{"w":"forge","p":"v.","m":"위조하다","f":1,"i":"대장간에서 쇠를 두드려 만들듯, 진짜인 척 감쪽같이 만들어냄. 그래서 위조하다."},{"w":"fraudulent","p":"a.","m":"사기의","f":1,"i":"거짓 미끼로 남을 속여 등쳐먹는(fraud사기) 수작이 밴 것. 그래서 사기의. (문어·격식체)"},{"w":"fretful","p":"a.","m":"조마조마해 하는, 초조해 하는","f":1,"i":"속을 갉아먹듯(fret갉다) 안절부절 애를 태움. 조마조마하고 초조해함."},{"w":"gaze","p":"v.","m":"응시하다","f":1,"i":"한 곳에 눈을 딱 박고 넋 놓은 채 오래도록 바라봄. 그래서 응시하다."},{"w":"gratuity","p":"n.","m":"팁, 축의금","f":1,"i":"고마운 마음(grat감사)에 얹어 슬쩍 쥐여주는 웃돈. 그래서 팁·축의금. (격식체, 회화선 tip)"},{"w":"gutted","p":"a.","m":"극도로 지친, 싫증난","f":1,"i":"속 창자(gut)를 다 꺼내 텅 빈 생선처럼 진이 다 빠짐. 극도로 지치고 허탈함. (영국 구어)"},{"w":"have a grudge","p":"phr.","m":"원한을 품다","f":1,"i":"가슴속에 무거운 응어리를 꾹 눌러 담아 두고 안 풀림. 그래서 원한을 품음."},{"w":"heritage","p":"n.","m":"유산, 천성","f":1,"i":"조상이 손에서 손으로 물려 내려준 것 — 물려받은 유산, 타고난 천성."},{"w":"impassable","p":"a.","m":"지나갈 수 없는, 통행할 수 없는","f":1,"i":"길이 콱 막혀(im-부정 + pass지나감) 도저히 통과 못 함. 지나갈 수 없는."},{"w":"incremental","p":"a.","m":"증가의","f":1,"i":"계단을 한 칸씩 위로 밟아 올라가듯(cre자라다) 조금씩 쌓여 늘어남. 점진적 증가의."},{"w":"indistinct","p":"a.","m":"분간할 수 없는","f":1,"i":"안개 속처럼 윤곽이 뭉개져(in-부정 + distinct또렷한) 이거저거 갈라볼 수 없음. 흐릿한."},{"w":"insecure","p":"a.","m":"자신이 없는, 불안한","f":1,"i":"발밑 땅이 안 단단해(in-부정 + secure안전) 언제 무너질지 몰라 불안함. 자신 없는."},{"w":"insensitive","p":"a.","m":"무신경한, 둔감한","f":1,"i":"감각의 안테나가 꺼져(in-부정 + sensitive예민한) 남의 아픔을 못 느낌. 무신경·둔감."},{"w":"interest","p":"v.","m":"흥미를 갖게 하다","f":1,"i":"네 일과 내 일 사이(inter-사이)에 걸쳐 있어(est있다) 마음이 그리로 쏠림. 흥미를 갖게 함."},{"w":"invent","p":"v.","m":"발명하다","f":1,"i":"세상에 없던 것을 '안으로 들어와(in-) 발견'하듯 머릿속에서 새로 찾아내 만듦 (in-안으로 + ven오다). 없던 게 마음속으로 굴러들어와 탄생."},{"w":"irreversible","p":"a.","m":"돌이킬 수 없는, 회복할 수 없는","f":1,"i":"이미 아래로 확 뒤집혀버려 다시(re-) 되돌릴(vert돌다) 수 없는 상태 (ir-부정). 엎질러진 물처럼 원위치가 봉쇄됨."},{"w":"jump the gun","p":"phr.","m":"성급하게 행동하다","f":1,"i":"출발 총성(gun)이 울리기도 전에 몸이 먼저 튀어나감. 신호를 기다리지 못하고 앞질러 뛰는 부정출발 → 성급하게 행동함. (구어 흔함)"},{"w":"knot","p":"v.","m":"매듭을 짓다","f":1,"i":"끈 두 가닥을 서로 감아 조여 단단한 혹처럼 뭉쳐 묶음. 그 오돌토돌한 매듭 덩어리가 knot."},{"w":"late fee","p":"phr.","m":"연체료, 시간 외 특별 요금","f":1,"i":"정해진 기한을 넘겨(late) 지각한 벌로 얹혀 붙는 추가 요금(fee). 늦은 만큼 물어내는 벌금 스티커."},{"w":"legislate","p":"v.","m":"법률을 제정하다, 입법하다","f":1,"i":"법(leg=lex 법)을 문서로 실어 날라(-late 나르다) 세상에 공식으로 내놓음. 국회에서 법을 찍어내는 행위."},{"w":"look down on","p":"phr.","m":"~를 얕보다, ~를 경멸하다","f":1,"i":"높은 데서 상대를 내려다보며(look down) 발밑의 작은 것 취급함. 시선의 높낮이가 곧 무시·경멸."},{"w":"malleable","p":"a.","m":"두들겨 펼 수 있는, 융통성 있는","f":1,"i":"망치(malleus)로 두들기면 부서지지 않고 얇게 쭉 펴지는 금속. 그 순순히 펴지는 성질 → 사람이면 잘 휘어지는 융통성."},{"w":"memoir","p":"n.","m":"회고록, 전기","f":1,"i":"자기 기억(memor 기억)의 서랍을 열어 꺼내 적은 글. 개인 삶의 한 조각을 회상해 남긴 회고록."},{"w":"memorial","p":"n.","m":"기념물","f":1,"i":"죽은 이를 기억(memor 기억)하도록 세워둔 돌·비석. 잊지 말라고 박아놓은 기억의 표식."},{"w":"miscreant","p":"a.","m":"고약한, 사악한","f":1,"i":"믿음(cred 믿다)을 잘못(mis-) 가진 자 → 원래 이단자, 지금은 못된 악당. 신의를 저버린 고약한 인물. (문어·격식체)"},{"w":"moot","p":"a.","m":"논쟁의 소지가 있는, 미결의","f":1,"i":"옛날 마을 회의(moot)에서 서로 갑론을박하던 안건. 결론 안 난 채 계속 논쟁 붙는, 혹은 이제 따져봐야 실익 없는 문제."},{"w":"obstruct","p":"v.","m":"방해하다, 훼방 놓다","f":1,"i":"길 한복판에 맞서서(ob-) 구조물(struct 쌓다)을 턱 세워 통행을 막음. 앞을 가로막는 장애물이 곧 방해."},{"w":"ornament","p":"n.","m":"꾸밈, 장식","f":1,"i":"밋밋한 것 위에 반짝이·장식을 덧붙여 꾸밈 (orn 꾸미다). 크리스마스트리에 매다는 그 장식품."},{"w":"overwrought","p":"a.","m":"극도로 긴장한","f":1,"i":"감정이 지나치게(over-) 세공되어(wrought=work의 과거) 팽팽히 당겨진 상태. 너무 만지작거려 신경이 곤두선 긴장."},{"w":"pare","p":"v.","m":"조금씩 줄이다, 껍질을 벗기다","f":1,"i":"칼로 사과 껍질을 얇게 빙 돌려 벗기듯 겉을 조금씩 깎아냄. 예산을 pare down하면 살살 잘라 줄임."},{"w":"pay dearly for","p":"phr.","m":"~ 때문에 큰 대가를 치르다","f":1,"i":"그 대가로 값비싸게(dearly) 지불함. 잘못 하나 때문에 뼈아프게 큰 값을 치르는 장면."},{"w":"permeable","p":"a.","m":"침투할 수 있는, 투과성의","f":1,"i":"물·공기가 막을 뚫고 끝까지 관통해(per-) 스며 지나갈(mea 지나가다) 수 있는 상태. 구멍 뚫린 스펀지처럼 투과됨."},{"w":"plunge","p":"v.","m":"뛰어들다, 돌진하다","f":1,"i":"높은 데서 물속으로 머리부터 곤두박질쳐 풍덩 처박힘. 망설임 없이 깊이 뛰어들거나 값이 급락하는 그 낙하."},{"w":"profile","p":"n.","m":"옆얼굴, 측면, 인물 소개","f":1,"i":"얼굴을 옆에서 본 윤곽선(pro-앞으로 + fil 실/선). 옆으로 그은 실루엣 → 인물의 옆모습, 개요 소개."},{"w":"providence","p":"n.","m":"신의 섭리, 천우","f":1,"i":"미리(pro-앞으로) 멀리 내다보고(vid 보다) 다 챙겨두는 큰 손길. 앞일을 봐두는 신의 배려·섭리. (문어·격식체)"},{"w":"provident","p":"a.","m":"선견지명이 있는, 신중한","f":1,"i":"미리(pro-) 앞을 내다보고(vid 보다) 대비해두는 사람. 겨울 올 걸 알고 도토리 모으는 다람쥐 같은 신중함."},{"w":"punctilious","p":"a.","m":"격식을 차리는, 딱딱한","f":1,"i":"바늘 끝(punct 찌르다)처럼 사소한 격식 하나까지 콕콕 짚어 따짐. 예법·절차를 깐깐히 챙기는 딱딱함. (문어·격식체)"},{"w":"recollect","p":"v.","m":"생각해 내다, 회상하다","f":1,"i":"흩어진 기억 조각들을 다시(re-) 한데 그러모음(collect 모으다). 창고 구석 물건 다시 주워 담듯 회상함."},{"w":"revert","p":"v.","m":"되돌아가다, 복귀하다","f":1,"i":"왔던 길로 몸을 돌려(vert돌다) 다시(re-) 원래 상태로 되돌아감. 원점으로 핸들을 꺾어 복귀."},{"w":"rinse","p":"v.","m":"헹구다, 가볍게 씻다","f":1,"i":"비누 거품 묻은 것을 맑은 물에 촤악 흘려 헹궈냄. 세제 없이 물로만 가볍게 씻어내는 마무리."},{"w":"rout","p":"v.","m":"완패시키다, (~에) 대승하다","f":1,"i":"적을 완전히 무너뜨려 뿔뿔이 도망치게 흩어버림. 대패시켜 전열이 와해되는 압도적 승리."},{"w":"ruggedly","p":"ad.","m":"투박하게, 울퉁불퉁하게","f":1,"i":"바위산 표면처럼 울퉁불퉁 거칠게. 매끈함 없이 투박하고 험하게 각진 느낌으로."},{"w":"scant","p":"a.","m":"불충분한, 부족한","f":1,"i":"가까스로 바닥에 조금 남은 양. 넉넉함과는 거리가 먼, 아슬아슬 부족한 얄팍한 분량. (문어체)"},{"w":"scrape","p":"v.","m":"문지르다, 긁어 벗기다","f":1,"i":"딱딱한 표면을 날 세워 드윽 문질러 겉을 긁어 벗김. 냄비 눌은밥 긁어내는 그 거친 마찰."},{"w":"sequester","p":"v.","m":"격리하다, 은퇴시키다","f":1,"i":"무리에서 떼어내 뒤따르는 것 없이 홀로 가둠 (sequ 따르다). 배심원·자산을 세상과 차단해 격리. (문어·격식체)"},{"w":"shelve","p":"v.","m":"보류하다, 선반에 얹다","f":1,"i":"책을 선반(shelf) 위에 얹어두듯, 일을 당장 안 건드리고 위에 치워둠. 나중으로 미뤄 보류함."},{"w":"slipshod","p":"a.","m":"단정치 못한, 무성의한","f":1,"i":"신발(shod)이 발에서 미끄러지듯(slip) 헐렁하게 대충 신은 꼴. 마무리 없이 대충 흘린 무성의함."},{"w":"smudge","p":"v.","m":"더럽히다","f":1,"i":"젖은 잉크·숯을 손가락으로 문질러 번지고 지저분한 얼룩을 남김. 그 뭉개진 검댕 자국."},{"w":"spuriousness","p":"n.","m":"가짜, 위조","f":1,"i":"겉만 진짜인 척, 속은 가짜인 상태. 짝퉁 명품처럼 근거 없이 위조된 성질. (문어·격식체)"},{"w":"stunt growth","p":"phr.","m":"성장을 저해하다","f":1,"i":"쑥쑥 자라야 할 것의 성장을 뚝 눌러 키가 안 크게 막음. 새싹 위에 돌을 얹은 것처럼 발육을 저해."},{"w":"stymie","p":"v.","m":"좌절시키다","f":1,"i":"골프에서 상대 공이 내 길을 딱 막아 칠 수 없게 된 상황. 앞이 콱 막혀 옴짝달싹 못하게 좌절시킴."},{"w":"technical skills","p":"phr.","m":"전문 기술","f":1,"i":"특정 분야에서 손에 익힌 전문 기술(technic 기술). 코딩·용접처럼 훈련으로 다듬은 실무 능력."},{"w":"timid","p":"a.","m":"겁 많은, 소심한","f":1,"i":"낯선 것 앞에서 움츠러들어 선뜻 못 나서는 성격. 겁이 앞서 뒷걸음질 치는 소심함."},{"w":"timidly","p":"ad.","m":"겁 많게, 소극적으로","f":1,"i":"겁먹어 움츠린 채 조심조심. 눈치 보며 소극적으로 살금살금 하는 태도."},{"w":"unfold","p":"v.","m":"펼치다, 펴다","f":1,"i":"접혀(fold) 있던 것을 반대로(un-) 착착 펼침. 편지·지도가 펴지듯, 이야기·사건이 서서히 전개됨."},{"w":"veracious","p":"a.","m":"진실을 말하는, 정직한","f":1,"i":"속에 진실(ver 진실)만 담아 말하는 사람. 거짓 한 톨 없이 사실 그대로 내놓는 정직함. (문어·격식체)"},{"w":"wild guess","p":"phr.","m":"무모한 추측","f":1,"i":"아무 근거 없이 야생마처럼(wild) 마구 던지는 짐작. 눈 감고 찍는 무모한 추측. (구어 흔함)"},{"w":"wont","p":"a.","m":"~에 익숙한, ~하는 것이 습관인","f":1,"i":"몸에 밴 습관처럼 늘 그렇게 하기 마련인 상태. 'as is his wont(늘 그러하듯)'로 굳은 옛투. (고풍·문어체)"},{"w":"climate change","p":"phr.","m":"기후 변화","f":1,"i":"지구 전체의 기후(climate)가 서서히 딴판으로 바뀜(change). 특별한 이미지 없음 — 뜻 그대로 기후 변화."},{"w":"absence","p":"n.","m":"부재, 출타","f":1,"i":"있어야 할 자리에서 떨어져(ab-떨어져) 빠져 있음 (es 있다). 텅 빈 그 빈자리가 곧 부재."},{"w":"acclaim","p":"v.","m":"갈채하다, 환호하다","f":1,"i":"군중이 한쪽(ac-쪽으로)을 향해 소리쳐(claim 외치다) 박수와 환호를 퍼부음. 함성으로 치켜세우는 갈채."},{"w":"accomplice","p":"n.","m":"공범","f":1,"i":"함께(com-) 접혀 얽힌(plic 접다) 한패 → 범죄에 같이 손 담근 짝. 나쁜 일을 함께 꾸민 공범."},{"w":"acquittal","p":"n.","m":"(의무의) 해제, 변제, 무죄 방면","f":1,"i":"죄의 짐에서 벗어나 깨끗이(quit 놓아주다) 풀려남 (ac-쪽으로). 법정이 혐의를 벗겨 자유롭게 놓아주는 무죄."},{"w":"aggravate","p":"v.","m":"악화시키다","f":1,"i":"이미 무거운(grav 무거운) 것 위에 더(ag-쪽 :"prestige","p":"n.","m":"위신, 명성","f":1,"i":"눈을 홀리는 마술 같은 광채가 사람·기관을 감싸 우러러보게 함. 위신·명성."},{"w":"posit","p":"v.","m":"놓다, 설치하다","f":1,"i":"논의의 출발점으로 하나의 전제를 탁 놓아둠 (pos놓다). ~라고 상정·가정함. (학술체)"},{"w":"preoccupied","p":"a.","m":"몰두한, 여념이 없는","f":1,"i":"마음의 방을 딴 생각이 미리(pre-) 점령해(occupy) 다른 게 안 들어옴. 딴 데 정신 팔린."},{"w":"proliferate","p":"v.","m":"증식하다, 급증하다","f":1,"i":"새싹(proli자손)이 앞으로 마구 뻗어(fer나르다) 수가 폭발적으로 불어남. 급증·증식함. (문어체)"},{"w":"recant","p":"v.","m":"철회하다, 취소하다","f":1,"i":"공개적으로 했던 노래(cant노래)를 뒤로(re-) 거둬들여 말을 뒤집음. 주장·신념을 철회함. (문어체)"},{"w":"reference","p":"n.","m":"참조, 참고","f":1,"i":"궁금할 때 다시(re-) 그쪽으로 나르며(fer) 들춰보는 근거. 참조·참고. 특별한 이미지 없음."},{"w":"resistant","p":"a.","m":"내성이 있는, 저항하는","f":1,"i":"밀려오는 힘에 맞서(re-) 버티고 서서(sist서다) 안 뚫림. 저항력·내성이 있는."},{"w":"round off","p":"phr.","m":"마무리 짓다","f":1,"i":"울퉁불퉁한 모서리를 둥글게(round) 다듬어 매끈히 끝맺음. 마무리 짓다·반올림하다."},{"w":"sculpt","p":"v.","m":"새기다","f":1,"i":"돌·나무를 깎고 파내(scalp긁다) 형상을 빚어냄. 조각함. 특별한 이미지 없음 — 뜻 그대로."},{"w":"seclude","p":"v.","m":"은둔시키다, 격리하다","f":1,"i":"문을 걸어 잠가(clud닫다) 세상과 떨어뜨려(se-따로) 가둠. 외딴 곳에 격리·은둔시킴."},{"w":"sling","p":"n.","m":"삼각붕대, 삼각건, 고무줄 새총","f":1,"i":"팔을 목에 매다는 삼각건, 또는 돌을 넣어 휙 던지는 새총·투석기. 특별한 이미지 없음 — 뜻 그대로."},{"w":"sober","p":"v.","m":"술이 깨게 하다 a. 술에 취하지 않은","f":1,"i":"술기운이 빠져나가 머리가 맑고 흐트러짐 없는 상태. 취하지 않은·진지한."},{"w":"sobriety","p":"n.","m":"취하지 않은 상태, 맑은 정신","f":1,"i":"술 한 방울 안 든 맑은 정신 상태 (sober의 명사). 냉철·절제. (문어체)"},{"w":"stump","p":"v.","m":"당황하게 하다, 바싹 베다","f":1,"i":"밑동만 남은 나무 그루터기에 발이 턱 걸려 오도 가도 못함 — 질문에 말문 막혀 얼어붙음. 쩔쩔매게 함."},{"w":"sublimate","p":"v.","m":"승화시키다","f":1,"i":"고체가 액체 단계를 건너뛰고 곧장 위로(sub-아래에서 위로) 증기로 오름 — 원초적 충동을 고상한 것으로 승화시킴."},{"w":"sway","p":"v.","m":"흔들리다, 동요하다","f":1,"i":"바람에 나뭇가지가 좌우로 크게 흔들흔들 — 마음·여론이 이리저리 기울어 흔들림."},{"w":"sympathize","p":"v.","m":"동정하다, 공감하다","f":1,"i":"상대와 함께(sym-함께) 같은 감정(path느낌)을 느껴 마음이 겹침. 동정·공감함."},{"w":"take after","p":"phr.","m":"~를 닮다","f":1,"i":"부모 뒤를 따라(after) 그 생김새·성격을 그대로 물려받아 걸어감. 그래서 '~를 닮다' — 특히 핏줄 닮음에 씀."},{"w":"tame","p":"a.","m":"길들여진, 온순한","f":1,"i":"야생의 사나움이 손길에 눌려 순하게 가라앉은 상태. 짐승이 길들여지면 온순, 재미·자극이 죽으면 '밋밋한·시시한'으로도 확장."},{"w":"tolerate","p":"v.","m":"관대하게 다루다, 참다, 견디다","f":1,"i":"거슬리는 것을 밀어내지 않고 무게를 견디며 그냥 버텨줌 (tol=견디다). 좋아서가 아니라 참고 봐주는 뉘앙스."},{"w":"transmit a message","p":"phr.","m":"메시지를 전송하다","f":1,"i":"메시지를 이쪽에서 저쪽으로 가로질러 보냄 (trans-가로질러 + mit보내다). 전파·신호를 실어 건너보내는 그림."},{"w":"turbulent","p":"a.","m":"거친, 사나운","f":1,"i":"물·공기가 소용돌이치며 마구 뒤엉켜 요동침 (turb=휘저어 어지럽히다). 비행기 흔들리는 난기류, 격동의 시대."},{"w":"viable","p":"a.","m":"실행 가능한","f":1,"i":"갓 태어난 생명이 혼자 숨쉬고 살아남을 수 있는 상태 (vi=생명). 계획이 '살아서 굴러갈' 만하면 실행 가능한."},{"w":"appraisal","p":"n.","m":"평가, 감정, 견적","f":1,"i":"물건 앞에 서서 값(price)을 매기려 위아래로 훑어보는 눈길 (ap-쪽으로 + prais값매기다). 감정·평가·견적."},{"w":"authenticate","p":"v.","m":"인증하다, 증명하다","f":1,"i":"'이건 진짜다'라고 도장을 쾅 찍어 진품임을 확정함 (authent=진짜). 신원·문서·작품의 진위를 공식 확인."},{"w":"avert","p":"v.","m":"돌리다, (사고·위험을) 막다","f":1,"i":"닥쳐오는 위험에서 고개·눈을 홱 돌려 딴 데로 비켜나게 함 (a-떨어져 + vert돌다). 시선을 돌리다, 사고를 미리 피하다."},{"w":"blockage","p":"n.","m":"봉쇄, 방해","f":1,"i":"관·통로 안에 뭔가 콱 막혀 흐름이 멈춘 상태. 파이프 막힘, 혈관 막힘처럼 '꽉 틀어막힌 덩어리'."},{"w":"burst at the seams","p":"phr.","m":"대만원이다","f":1,"i":"옷이 꽉 차서 봉제선(seam)이 터질 지경. 사람·물건이 넘쳐 공간이 미어터짐 — 대만원."},{"w":"by what means","p":"phr.","m":"어떻게","f":1,"i":"어떤 수단(means)이라는 도구를 거쳐서. '무엇을 통해서 = 어떻게'. (다소 격식체 의문)"},{"w":"conclude","p":"v.","m":"결론짓다, 완료하다","f":1,"i":"흩어진 이야기를 한데 몰아 문을 닫아 잠금 (con-함께 + clud닫다). 매듭지어 결론짓다·마무리하다."},{"w":"consign","p":"v.","m":"넘겨주다, 인도하다","f":1,"i":"물건에 '너에게 넘긴다'는 서명을 붙여 통째로 상대 손에 맡겨버림 (con-함께 + sign서명). 위탁·인도·(운명에) 떠넘김."},{"w":"constrain","p":"v.","m":"강제하다, 감금하다","f":1,"i":"밧줄로 온몸을 함께 꽉 조여 움직임을 옭아맴 (con-함께 + strain조이다). 억지로 시키다, 옴짝달싹 못하게 가두다."},{"w":"convivial","p":"a.","m":"연회의, 쾌활한","f":1,"i":"함께(con) 먹고 마시며 웃는 잔칫상의 흥겨운 분위기 (viv=살다·생기). 연회의, 유쾌하고 사교적인. (문어·격식체)"},{"w":"cordial","p":"a.","m":"진심에서 우러나는","f":1,"i":"가슴속 심장(cord=heart)에서 우러나 상대에게 건네는 따뜻함. 형식적이 아니라 진심 어린 환대."},{"w":"crack up","p":"phr.","m":"크게 웃다","f":1,"i":"웃음을 못 참고 표정이 쫙 갈라지며(crack) 빵 터짐. 크게 웃다·웃겨 죽다. (구어)"},{"w":"culminate","p":"v.","m":"최고조에 이르다","f":1,"i":"산길을 오르고 올라 마침내 꼭대기(culmen=정상)에 딱 닿음. 모든 흐름이 정점으로 치달아 절정에 이르다."},{"w":"customary","p":"a.","m":"관습적인, 관행의, 통상적인","f":1,"i":"늘 해오던 습관(custom)대로 몸에 밴 그대로 함. 굳어진 관습·관행·통상적인 방식."},{"w":"curve","p":"v.","m":"구부리다","f":1,"i":"직선이 부드럽게 휘어 활처럼 굽음. 특별한 어원 이미지보다 '곡선으로 구부러진 선' 그대로."},{"w":"cynically","p":"ad.","m":"냉소적으로","f":1,"i":"세상 좋은 말은 다 못 믿겠다는 듯 입꼬리 비틀며 코웃음. 냉소적으로 — 진심을 의심하는 태도."},{"w":"delineate","p":"v.","m":"윤곽을 그리다, 서술하다","f":1,"i":"대상의 가장자리를 따라 선(line)을 쭉 그어 윤곽을 또렷이 떠냄 (de-완전히 + line선). 그림/말로 세밀히 묘사하다. (문어체)"},{"w":"desecration","p":"n.","m":"신성 모독","f":1,"i":"성스럽게(sacr) 모신 것을 밟고 더럽혀 거룩함을 벗겨냄 (de-반전 + sacr신성). 신성모독·성물 훼손."},{"w":"devote one’s life","p":"phr.","m":"일생을 바치다","f":1,"i":"자기 삶을 통째로 어떤 대의 앞에 바쳐 실어 보냄 (de-완전히 + vot맹세). 일생을 헌신하다."},{"w":"discomfort","p":"n.","m":"불쾌, 고통","f":1,"i":"몸에 딱 맞던 편안함(comfort)이 흩어져 사라진 상태 (dis-반대). 불편·거북함·가벼운 고통."},{"w":"dispensable","p":"a.","m":"없어도 되는, 베풀어 줄 수 있는","f":1,"i":"필요할 때 나눠주고(dispense) 없애도 그만인 것 — 흩어 버려도 무방함 (dis-흩어짐). 없어도 되는, 불필요한."},{"w":"distribute","p":"v.","m":"분배하다, 나누어 주다","f":1,"i":"한 무더기를 여러 몫으로 흩어 각자에게 나눠줌 (dis-흩어짐 + tribute할당). 배분·유통."},{"w":"doze off","p":"phr.","m":"깜빡 졸다","f":1,"i":"의식이 스르르 미끄러져(off) 잠 속으로 빠짐. 앉은 채 깜빡 졸다. (구어)"},{"w":"ductile","p":"a.","m":"연성이 있는, 유순한","f":1,"i":"금속을 잡아끌면(duct=이끌다) 끊기지 않고 실처럼 죽 늘어남. 연성이 있는; 사람이면 '말 잘 듣는·유순한'. (전문·문어)"},{"w":"engrain","p":"v.","m":"스며들게 하다","f":1,"i":"나뭇결(grain) 속까지 물감이 배어들 듯 습관·신념이 깊이 스며 박힘 (en-안으로). 보통 ingrained 형태로 흔함."},{"w":"ensnare","p":"v.","m":"덫에 걸리게 하다, 유혹하다","f":1,"i":"덫(snare)의 올가미 속으로 걸려들게 함 (en-안으로). 함정에 빠뜨리다, 꾀어 옭아매다. (문어체)"},{"w":"entail","p":"v.","m":"수반하다, 필요로 하다","f":1,"i":"어떤 일에 다른 부담·결과가 꼬리표처럼 딸려 따라옴. 필연적으로 수반하다·필요로 하다. (문어·격식체)"},{"w":"exploit","p":"v.","m":"이용하다, 개발하다, 착취하다","f":1,"i":"속에 접혀 있던 가치를 밖으로 펼쳐 끝까지 짜냄 (ex-밖으로 + pli접다). 잘 쓰면 활용·개발, 나쁘게 쓰면 착취."},{"w":"extend a deadline","p":"phr.","m":"마감 기한을 연장하다","f":1,"i":"마감선(deadline)을 밖으로 쭉 잡아 늘임 (ex-밖으로 + tend뻗다). 기한을 연장하다."},{"w":"fallacy","p":"n.","m":"잘못, 오류","  것도 gush."},{"w":"hang out with","p":"phr.","m":"~와 어울리다, ~와 가까이 지내다","f":1,"i":"특별한 목적 없이 그냥 같이 늘어져(hang) 시간을 죽이며 어울림. 회화에서 '친구랑 논다'의 1순위 표현."},{"w":"heir","p":"n.","m":"상속인","f":1,"i":"앞사람이 죽으면 그 자리와 재산을 이어받으려 뒤에 서 있는 사람. h는 묵음, 발음은 'air(에어)'."},{"w":"hypothetical","p":"a.","m":"가설의, 가설에 근거한","f":1,"i":"아직 땅에 발 안 붙은 '만약에'의 가정을 아래에 깔아둔(hypo-아래 + thesis놓음) 상태. 실제가 아니라 '가령 이렇다면' 위에 세운 이야기."},{"w":"immeasurable","p":"a.","m":"헤아릴 수 없는, 끝없는","f":1,"i":"자로 재려 해도 끝이 안 잡혀 측정 자체가 불가능함 (im-부정 + measure재다). 크기·깊이가 자를 벗어나 무한대로 뻗음."},{"w":"impetuous","p":"a.","m":"맹렬한, 열렬한","f":1,"i":"안에서(im-안으로) 밀어붙이는(pet=향해 돌진) 충동에 떠밀려 앞뒤 안 재고 확 튀어나감. 열정적이지만 성급·경솔한 쪽."},{"w":"implant","p":"v.","m":"꽂아 넣다, 주입하다","f":1,"i":"씨앗을 흙 속에(im-안으로) 콱 심듯, 물건이나 생각을 안쪽 깊이 박아 넣음 (plant심다). 뽑기 어렵게 자리 잡게 함."},{"w":"impractical","p":"a.","m":"비실용적인","f":1,"i":"머리로는 그럴듯한데 실제 손에 쥐면 안 굴러가는 것 (im-부정 + practical실용적). 현실 바닥에 안 닿는 탁상공론."},{"w":"instability","p":"n.","m":"불안정","f":1,"i":"받침이 안(in-부정) 서서(sta=서다) 자꾸 흔들려 무너지려는 상태. 균형이 안 잡혀 언제 쓰러질지 모름."},{"w":"insulate","p":"v.","m":"격리시키다, 절연시키다","f":1,"i":"섬(insula=섬)처럼 뚝 떼어내 바깥과의 통로를 끊음 — 열·전기·소음·영향이 못 넘어오게 벽으로 둘러쌈."},{"w":"intertwine","p":"v.","m":"서로 뒤엉키게 하다","f":1,"i":"두 가닥이 서로(inter-사이) 꼬여(twine꼬다) 하나처럼 얽힘. 손가락 깍지 끼듯 떼어내기 힘들게 엉킴."},{"w":"intimate","p":"a.","m":"친밀한","f":1,"i":"남을 못 들이는 가장 안쪽(in최상급, 안으로) 공간까지 서로 들여보낸 사이. 물리적·심리적 거리가 거의 0인 친밀함."},{"w":"intrepid","p":"a.","m":"용기 있는","f":1,"i":"위험 앞에서도 안이 떨리지(trep=떨다) 않는(in-부정) 사람. 두려움에 움찔하는 진동이 아예 없는 대담함. (문어체)"},{"w":"languish","p":"v.","m":"기력이 없어지다, 시들다","f":1,"i":"물 못 받은 화초처럼 기운이 축 빠져 서서히 시들어 감. 방치되어 나아지지 못하고 처져 있는 상태."},{"w":"leg room","p":"phr.","m":"(좌석에서) 다리를 뻗을 공간","f":1,"i":"앞좌석과 내 무릎 사이, 다리를 쭉 뻗을 수 있는 그 틈새 공간. 비행기·차 좌석에서 딱 느끼는 그 여유."},{"w":"lofty","p":"a.","m":"고상한, 매우 높은","f":1,"i":"천장(loft다락)까지 까마득히 높이 솟음. 물리적 높이에서 '고매한 이상' '거만하게 내려다봄'으로 확장."},{"w":"luxuriant","p":"a.","m":"무성한, 기름진, 비옥한","f":1,"i":"잎과 가지가 주체 못 할 만큼 무성하게 뻗어 넘쳐남. 풍성함이 흘러넘치는 초록의 밀림. luxurious(사치스러운)와 혼동 주의."},{"w":"maneuver","p":"v.","m":"연습시키다, 교묘히 이동시키다, 조종하다","f":1,"i":"손(man=손)으로 일일이(oeuvre작업) 방향을 틀어 좁은 틈으로 요리조리 몰아 넣음. 차를 주차하듯 교묘히 조종하는 움직임."},{"w":"manipulation","p":"n.","m":"조작, 조종","f":1,"i":"손(man=손)으로 남 몰래 주물러 원하는 대로 움직임. 기계 조작도, 뒤에서 사람 마음을 조종하는 것도."},{"w":"meritorious","p":"a.","m":"칭찬할 만한, 가치 있는","f":1,"i":"받을 만한 값어치(merit공로)를 톡톡히 쌓아 상 줄 만함. 그냥 좋은 게 아니라 '표창감'인 공로. (문어·격식체)"},{"w":"mixture","p":"n.","m":"혼합물","f":1,"i":"여러 재료를 한 그릇에 섞어(mix) 만든 혼합물. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"mortal","p":"a.","m":"죽어야 할 운명의, 치명적인","f":1,"i":"언젠가 반드시 죽음(mort=죽음)에 닿을 운명을 짊어진. 그래서 '치명적인(목숨을 앗는)' 뜻도. immortal(불멸)의 반대."},{"w":"naughty","p":"a.","m":"장난꾸러기인, 음란한","f":1,"i":"말 안 듣고 선을 살짝 넘어 장난치는 아이의 짓궂음. 맥락 따라 '야한·음란한'으로도 슬쩍 미끄러짐."},{"w":"obtuse","p":"a.","m":"무딘","f":1,"i":"칼끝이 뭉툭하게(ob-맞서 + tus=두드려 뭉갬) 무뎌진 상태. 각도로는 둔각, 사람에 쓰면 '눈치 없이 둔한'."},{"w":"orient","p":"v.","m":"향하게 하다","f":1,"i":"해 뜨는 동쪽(Orient)을 기준으로 몸의 방향을 맞춤. 낯선 곳에서 '어디가 어딘지' 방향을 잡게 해줌."},{"w":"pessimistic","p":"a.","m":"염세적인, 비관적인","f":1,"i":"최악(pessimus=가장 나쁜)의 바닥부터 먼저 그려보는 시선. 컵의 빈 반쪽만 보이는 마음."},{"w":"philanthropic","p":"a.","m":"인정 많은, 인자한, 박애주의의","f":1,"i":"인류(anthropo=인간)를 사랑하는(phil=사랑) 마음으로 베풂. 돈·시간을 남 위해 내놓는 자선의 손길. (문어·격식체)"},{"w":"postpone","p":"v.","m":"연기하다, 늦추다","f":1,"i":"일을 뒤(post-뒤)로 놓아(pon=놓다) 나중으로 미룸. 지금 자리에서 빼서 시간축 뒤쪽에 다시 놓는 것."},{"w":"pronounce","p":"v.","m":"발음하다, 낭독하다","f":1,"i":"말을 사람들 앞으로(pro-앞으로) 또렷이 내보냄(nounce=알리다). 소리 내 발음하다 + 공식적으로 선언·판결하다."},{"w":"pseudonym","p":"n.","m":"가명, 익명","f":1,"i":"가짜(pseudo=거짓) 이름(nym=이름)을 진짜 대신 앞에 내세움. 작가 필명처럼 본명을 가린 딴 이름."},{"w":"pursuit","p":"n.","m":"추구","f":1,"i":"앞서 달아나는 것을 바짝 뒤쫓아(pur-앞으로 + suit=따르다) 끝까지 좇음. 도망자 추격에서 '꿈·행복의 추구'로 확장."},{"w":"push up the daisies","p":"phr.","m":"죽어서 매장되다","f":1,"i":"땅에 묻혀 그 위로 데이지 꽃을 밀어 올린다 — 죽어서 매장됨을 에둘러 농담처럼 말하는 완곡어. (구어·유머)"},{"w":"regulation","p":"n.","m":"규칙, 규정","f":1,"i":"자(regul=자, 곧게 다스림)로 재듯 딱 정해 놓은 규칙. 모두가 그 선에 맞춰 움직이게 하는 공식 규정."},{"w":"reject a motion","p":"phr.","m":"부결하다","f":1,"i":"회의에서 올라온 안건(motion동의)을 도로(re-뒤로) 던져(ject=던지다) 되돌려보냄 — 표결로 부결시킴."},{"w":"remuneration","p":"n.","m":"보수, 보답","f":1,"i":"일해 준 대가로 되돌려(re-) 쥐여주는 보수 (munus=선물·의무). salary보다 딱딱한 격식·문어체, 계약서에 나옴."},{"w":"reprimand","p":"v.","m":"견책하다, 징계하다","f":1,"i":"잘못을 도로(re-) 눌러(prim=누르다) 공식적으로 꾸짖음. 상사가 아랫사람을 정식으로 견책하는 무게. (격식체)"},{"w":"retinue","p":"n.","m":"수행원, 시종","f":1,"i":"높은 사람 뒤에 줄줄이 붙어(retin=붙잡아 두다) 따라다니는 수행원 무리. 왕·귀족을 둘러싼 시종단. (문어체)"},{"w":"rigid","p":"a.","m":"휘지 않는, 완고한","f":1,"i":"쇠막대처럼 절대 휘지 않고 뻣뻣하게 굳음. 물체의 단단함에서 '규칙·태도가 융통성 없이 완고한'으로."},{"w":"scarcity","p":"n.","m":"부족, 결핍","f":1,"i":"구하려 해도 드물어(scarce) 손에 잘 안 잡히는 부족 상태. 수요는 많은데 물량이 씨가 마른 귀함."},{"w":"screening","p":"n.","m":"검사, 심사, 선발","f":1,"i":"체(screen)에 걸러 통과할 것만 골라냄 — 건강검진·서류심사·후보 선발 다 '거르는' 그림. 영화 상영도 같은 단어."},{"w":"skirt law","p":"phr.","m":"법망을 피하다","f":1,"i":"치맛자락처럼 법 가장자리(skirt=가장자리·빙 돌다)를 살짝 비껴 돌아 정면 위반은 피함 — 법망을 요리조리 피함."},{"w":"speculate","p":"v.","m":"사색하다, 깊이 생각하다","f":1,"i":"망원경으로 멀리(spec=보다) 내다보듯 근거 없이 이리저리 추측함. 머릿속 사색 + 시세를 예측해 투기함."},{"w":"speculative","p":"a.","m":"명상적인, 이론적인","f":1,"i":"확실한 게 아니라 '보기(spec)'에 기댄 추정 위에 세운. 검증 안 된 이론적·투기적 성격. (문어체)"},{"w":"statute","p":"n.","m":"법령, 법규","f":1,"i":"돌에 세워(sta=서다) 굳혀 놓은 성문법 — 의회가 문서로 딱 정해 세운 법령. 흔들리지 않게 서 있는 규범."},{"w":"stimulation","p":"n.","m":"자극, 격려","f":1,"i":"뾰족한 막대(stimulus=찌르는 막대)로 콕 찔러 반응을 깨움. 신경·의욕을 쿡 건드려 활기를 일으킴."},{"w":"suppose","p":"v.","m":"가정하다, 상상하다","f":1,"i":"머릿속에 '이렇다 치고'를 아래에 깔아(sub-아래 + pos=놓다) 놓음. 확정 아닌 가정을 밑에 두고 이야기 시작."},{"w":"suspicious","p":"a.","m":"의심스러운, 수상쩍은","f":1,"i":"밑에서(sus-아래 + spic=보다) 곁눈으로 슬쩍 올려다보며 '뭔가 이상한데' 하는 눈초리. 믿지 못해 훑어보는 의심."},{"w":"switch off","p":"phr.","m":"무기력해지다, 흥미를 잃다","f":1,"i":"스위치를 탁 내려 불 끄듯, 마음의 스위치를 꺼버려 흥미·집중이 나가버림. 딴 세상으로 전원 off. (구어)"},{"w":"taciturn","p":"a.","m":"말이 적은, 과묵한","f":1,"i":"입을 꾹 다물고(tac=조용하다) 좀처럼 말을 안 꺼내는 과묵함. 침묵이 몸에 밴 성격. (문어체)"},{"w":"treatable","p":"a.","m":"치료할 수 있는","f":1,"i":"손대어 다룰(treat) 수 있는 — 즉 치료가 가능한. 방법이 있어 고칠 수 있는 상태."},{"w":"visible","p":"a.","m":"눈에 보이는, 분명한","f":1,"i":"눈으로(vis=보다) 실제로 잡히는, 보이는 상태. 안 숨고 드러나 '분명한'으로도. invisible의 반대."},{"w":"willingly","p":"ad.","m":"기꺼이","f":1,"i":"누가 시키지 않아도 마음(will의지)이 먼저 앞으로 기울어 기꺼이 나섬. 억지가 아니라 스스로 원해서."},{"w":"acclimate","p":"v.","m":"순응하다, 적응하다","f":1,"i":"낯선 기후(clima=기후) 쪽으로(ac-쪽으로) 몸을 서서히 맞춰 감. 고지대·새 환경에 적응해 편해짐. 미국식, 영국은 acclimatize."},{"w":"acquisition","p":"n.","m":"획득, 습득","f":1,"i":"손을 뻗어(ac-쪽으로 + quir=구하다) 제 것으로 끌어와 챙김. 지식 습득도, 기업 인수도 '손에 넣음'."},{"w":"adroit","p":"a.","m":"능숙한","f":1,"i":"오른손(droit=오른쪽, right)이 향하듯(ad-쪽으로) 매끄럽고 능란하게 해냄. 손놀림이 노련한 솜씨. (문어체)"},{"w":"alike","p":"a.","m":"서로 닮은","f":1,"i":"두 개를 나란히 놓으니 판박이처럼 닮아 보임. 서술적으로 'A and B are alike'로 쓰고, 명사 앞엔 안 씀."},{"w":"allegory","p":"n.","m":"상징, 우화","f":1,"i":"겉이야기 밑에 딴(allos=다른) 뜻을 숨겨 통째로 빗댄 이야기 — 등장인물 하나하나가 다른 개념을 대신하는 우화."},{"w":"amenity","p":"n.","m":"기분에 맞음, 쾌적함","f":1,"i":"몸이 편안해지도록 마련된 편의시설 (amen=쾌적한, 라틴 amoenus). 호텔 수영장·헬스장처럼 '있으면 기분 좋아지는 것'. 보통 복수 amenities로 편의시설."},{"w":"anticipatory","p":"a.","m":"예측의","f":1,"i":"일이 닥치기 전에 미리 앞으로 손을 뻗어 잡으려는 자세 (anti-=앞서 + cip잡다). 곧 올 걸 예상하고 몸이 먼저 반응하는 느낌. (문어·격식체)"},{"w":"appease","p":"v.","m":"달래다, 진정시키다","f":1,"i":"성난 상대에게 다가가 평화(peace)를 쥐여주며 화를 가라앉힘 (ap-=쪽으로 + pease평화). 특히 요구를 들어줘서 달램 — 양보의 뉘앙스."},{"w":"browse","p":"v.","m":"훑어보다","f":1,"i":"소가 풀밭을 한 잎씩 뜯듯, 서두름 없이 여기저기 눈으로 훑으며 골라봄. 서점·웹페이지를 목적 없이 슬슬 둘러보는 그림."},{"w":"brute","p":"a.","m":"짐승의, 야만적인","f":1,"i":"이성 없이 힘만 쓰는 짐승. 머리 대신 근육만 있는 야수의 이미지 — brute force(순수 완력)처럼 '거칠고 무식한 힘'."},{"w":"burgeon","p":"v.","m":"급격히 성장하다, 발전하다","f":1,"i":"새싹(bud)이 봉오리를 터뜨리며 왈칵 돋아나 퍼지는 장면. 갑자기 무성하게 불어남 — 산업·인구가 급성장. (문어체)"},{"w":"catch on","p":"phr.","m":"~을 붙잡다, 인기를 얻다","f":1,"i":"공중에 던져진 것(유행)에 사람들이 손을 뻗어 착 걸려듦 → 인기를 얻음. 또는 머릿속에 걸려들어 '아 이거구나' 하고 알아챔."},{"w":"catch up with","p":"phr.","m":"~을 따라잡다","f":1,"i":"앞서 가던 사람 뒤를 쫓아가 나란히 붙잡음 (catch up=따라잡다). 밀린 일·뒤처진 격차를 메워 따라붙는 그림."},{"w":"certify","p":"v.","m":"증명하다, 인증하다","f":1,"i":"'확실하다(cert=certain)'고 공식 도장을 찍어 보증함 (cert확실 + fy만들다). 서류에 인증 마크를 눌러주는 장면."},{"w":"coerce","p":"v.","m":"구속하다, 억압하다","f":1,"i":"사방에서 우리(cage)처럼 조여 도망 못 가게 가둬 억지로 시킴 (co-=함께 + erce가두다). 물리·심리적 압박으로 강제."},{"w":"condolence","p":"n.","m":"애도, 문상","f":1,"i":"남의 슬픔(dol=고통) 옆에 함께(con-) 서서 아픔을 나눔 (con-함께 + dol슬픔). 장례식에서 건네는 위로의 말. 보통 복수."},{"w":"conjecture","p":"n.","m":"짐작, 추측","f":1,"i":"확실한 근거 없이 조각들을 함께(con-) 던져 맞춰본 추측 (con-함께 + ject던지다). '아마 이럴 것이다'하고 던져보는 짐작. (문어체)"},{"w":"convey a point","p":"phr.","m":"의미를 전달하다","f":1,"i":"요점을 상대 머릿속까지 실어 날라 건네줌 (con-함께 + vey길·나르다). 뜻이 온전히 전달되는 그림."},{"w":"controversy","p":"n.","m":"논쟁, 논의","f":1,"i":"양쪽이 서로 반대(contro-) 방향으로 돌아서서(vers) 맞부딪침 (contra-맞서 + vers돌다). 여론이 갈려 시끄럽게 다투는 논쟁."},{"w":"correct","p":"v.","m":"고치다, 바로잡다","f":1,"i":"삐뚤어진 것을 똑바로(rect=곧은) 함께 잡아 펴줌 (cor-완전히 + rect곧은). 틀린 걸 바른 방향으로 되돌려 놓는 그림."},{"w":"crass","p":"a.","m":"우둔한, 어리석은","f":1,"i":"얇은 감수성 없이 두껍고 둔한(라틴 crassus=두꺼운) 무신경함. 상황 파악 못 하는 무례하고 우둔한 태도. (문어체)"},{"w":"deny","p":"v.","m":"거부하다, 부인하다","f":1,"i":"상대가 내민 것을 '아니다(ne-)'라며 손으로 밀쳐 안 받음 (de-분리 + ny아니). 사실을 부인하거나 요청을 거부."},{"w":"desensitize","p":"v.","m":"감도를 줄이다, 냉담하게 하다","f":1,"i":"감각(sense)을 아래로 깎아내려 무뎌지게 함 (de-아래로·제거 + sensit감각). 반복 노출로 자극에 무감각해지는 그림."},{"w":"dispute","p":"n.","m":"논쟁, 논의","f":1,"i":"양쪽이 서로 반대로 흩어져(dis-) 저마다 옳다고 따짐 (dis-흩어짐 + pute따지다·생각하다). 말로 맞서는 논쟁."},{"w":"doleful","p":"a.","m":"슬픔에 잠긴","f":1,"i":"슬픔(dole=고통)이 가득 차 축 늘어진 표정 (dole슬픔 + ful가득). 눈물 그렁그렁 처량한 분위기. (문어·시적)"},{"w":"entice","p":"v.","m":"유혹하다, 꼬드기다","f":1,"i":"부드러운 미끼로 슬쩍 안으로(en-) 끌어들여 꾀어냄 (en-안으로 + tice불붙이다·유혹). 달콤한 것으로 살살 유혹."},{"w":"entrench","p":"v.","m":"자기 입장을 굳히다, 참호로 에워싸다","f":1,"i":"땅을 파 참호(trench) 안에 자리 잡고 안(en-) 깊이 박힘 (en-안으로 + trench참호). 입장을 절대 안 물러날 만큼 굳힘."},{"w":"evacuate","p":"v.","m":"철수시키다, 피난시키다, 비우다","f":1,"i":"안을 텅 비게(vac=empty) 밖으로 몽땅 빼냄 (e-밖으로 + vac비우다). 위험지역 사람들을 죄다 밖으로 대피시킴."},{"w":"exposure","p":"n.","m":"폭로, 노출","f":1,"i":"덮개를 걷어 밖으로(ex-) 내놓아 훤히 드러냄 (ex-밖으로 + pos놓다). 숨겨진 것의 폭로, 또는 햇빛·위험에 그대로 노출됨."},{"w":"expunge","p":"v.","m":"지우다, 삭제하다","f":1,"i":"바늘·펜으로 콕콕 찔러 밖으로(ex-) 완전히 긁어 없앰 (ex-밖으로 + pung찌르다). 기록을 흔적 없이 삭제. (문어·격식체)"},{"w":"extinct","p":"a.","m":"멸종한","f":1,"i":"타오르던 불이 밖으로(ex-) 완전히 꺼져 사라짐 (ex-밖으로 + tinct끄다). 종이 남김없이 소멸한 상태 — extinguish와 한뿌리."},{"w":"figure","p":"n.","m":"사람의 모양, 숫자","f":1,"i":"빚어 만든 사람 형상의 윤곽. 몸매·인물상에서 출발해, 종이에 그려낸 도형·숫자·도표까지 '눈에 보이는 형태' 전반."},{"w":"fill a position","p":"phr.","m":"일할 사람을 충당하다","f":1,"i":"비어 있는 자리(빈 칸)를 사람으로 채워 넣음. 공석에 딱 맞는 인력을 부어 메우는 그림."},{"w":"fill out","p":"phr.","m":"작성하다, 기입하다","f":1,"i":"빈 칸을 밖 테두리까지 남김없이 가득(out) 채움. 서류 양식의 모든 항목을 채워 작성하는 그림."},{"w":"fracture","p":"v.","m":"부러뜨리다 n. 골절","f":1,"i":"단단한 뼈·물체가 뚝 갈라져 금이 감 (frac부수다, fragment과 한뿌리). 부러지거나 쪼개지는 그림."},{"w":"franchise","p":"n.","m":"선거권, 특권, 가맹 사업","f":1,"i":"'자유(frank=free)'를 공식 부여받은 권리. 투표할 자유(선거권), 또는 브랜드를 쓸 자유를 넘겨받은 가맹 사업."},{"w":"gouge","p":"v.","m":"사기 치다, 둥근 끌로 파다","f":1,"i":"둥근 끌을 깊이 박아 홈을 푹 파냄. 살점을 도려내듯 파는 이미지에서 → 바가지로 남 돈을 깊이 뜯어내는 사기."},{"w":"grotto","p":"n.","m":"굴, 동굴","f":1,"i":"바위 속에 뚫린 아늑한 작은 동굴. 특별한 감각 이미지 없음 — 뜻 그대로 (grotesque와 한뿌리)."},{"w":"gyrate","p":"v.","m":"선회하다, (나선형으로) 회전하다","f":1,"i":"팽이처럼 한 축을 중심으로 빙글빙글 나선을 그리며 도는 동작 (gyr=원·회전). 격하게 돌리는 춤 동작 등."},{"w":"hedge against inflation","p":"phr.","m":"인플레이션에 대한 방지책","f":1,"i":"인플레이션이란 바람을 막으려 산울타리(hedge)를 둘러 재산을 보호함. 금·부동산으로 손실을 방어하는 대비책."},{"w":"implement","p":"v.","m":"이행하다, 수행하다","f":1,"i":"계획을 실제 도구(라틴 implere=채우다)로 채워 실행에 옮김. 말뿐인 정책을 현장에 부어 이행하는 그림."},{"w":"imprint","p":"v.","m":"(도장을) 찍다, 강하게 인상지우다","f":1,"i":"도장을 안으로(im-) 꾹 눌러(print) 자국을 남김 (im-안으로 + print찍다). 종이의 인쇄 자국, 또는 마음에 깊이 새겨진 인상."},{"w":"instinctual","p":"a.","m":"본능의, 본능적인","f":1,"i":"배우지 않아도 안에서(in-) 콕콕 찌르며 튀어나오는 본능 (in-안 + stinct찌르다). 몸이 저절로 반응하는 것. instinctive가 더 흔함."},{"w":"interval","p":"n.","m":"간격, 막간, 휴식 시간","f":1,"i":"두 벽(vallum) 사이(inter-)에 벌어진 틈 (inter-사이 + val벽). 시간·공간의 간격, 공연 중간의 막간 휴식."},{"w":"intrinsic","p":"a.","m":"본질적인, 고유의","f":1,"i":"겉이 아니라 사물 안쪽(intra-) 깊숙이 원래부터 박혀 있는 성질 (intra-안으로). 떼어낼 수 없는 본질적 속성. (문어체)"},{"w":"intrude","p":"v.","m":"침입하다, 강요하다","f":1,"i":"허락 없이 안으로(in-) 밀고 들어와 남의 영역을 짓밟음 (in-안으로 + trud밀다). 불청객처럼 끼어드는 그림."},{"w":"job prospects","p":"phr.","m":"취업 전망","f":1,"i":"앞을(pro-) 내다봤을 때(spect보다) 펼쳐진 일자리 전망 (pro-앞 + spect보다). 취업 가능성이 밝냐 어둡냐의 그림."},{"w":"lane","p":"n.","m":"좁은 길, 샛길","f":1,"i":"차 한 대·사람 한 줄만 지날 좁은 오솔길. 넓은 도로를 세로로 나눈 '차선'도 이 좁은 띠의 이미지."},{"w":"leftover","p":"n.","m":"나머지, 남은 음식","f":1,"i":"다 쓰고 남아(left) 넘어온(over) 것. 식탁에 남은 음식이 대표 이미지 — 먹고 남긴 잔여분."},{"w":"lie","p":"v.","m":"거짓말하다","f":1,"i":"사실이 아닌 걸 사실인 척 말함. (같은 철자 lie=눕다와 구별 필요) 여기선 거짓말 — 특별한 이미지 없음, 뜻 그대로."},{"w":"locate","p":"v.","m":"찾아내다, 가리키다","f":1,"i":"지도 위 한 지점(loc=장소)에 콕 찍어 자리를 잡아냄 (loc장소). 어디 있는지 위치를 찾아내거나 놓는 그림."},{"w":"lure","p":"v.","m":"유혹하다, 유인하다","f":1,"i":"낚시 미끼(lure)를 흔들어 물고기를 홀리듯 끌어당김. entice보다 직접적이고 강한 유인 — 덫으로 꾀어냄."},{"w":"mantle","p":"n.","m":"망토, 덮개","f":1,"i":"어깨를 덮어 감싸는 두꺼운 망토. 그 '덮어 감쌈'에서 → 지구 맨틀(속을 덮은 층), 책임을 물려받아 '뒤집어쓰는' 비유."},{"w":"mortgage","p":"n.","m":"저당, 주택 융자","f":1,"i":"'죽음(mort=death)의 서약(gage)' — 빚 다 갚으면 소멸하는 담보 (mort죽음 + gage서약). 집을 담보로 잡힌 주택 융자."},{"w":"natural habitat","p":"phr.","m":"자연 서식지","f":1,"i":"그 생물이 원래(natural) 사는(habit=살다) 자연 보금자리 (habit살다). 야생 동식물의 고유 서식지."},{"w":"overjoyed","p":"a.","m":"미칠 듯이 기쁜","f":1,"i":"기쁨(joy)이 그릇을 넘쳐(over-) 흘러 주체 못 할 만큼 기쁨 (over-넘어). 펄쩍 뛸 정도로 황홀한 상태."},{"w":"pack a bag","p":"phr.","m":"가방을 싸다, 꾸리다","f":1,"i":"가방 안에 짐을 차곡차곡 눌러 담아 꽉 채움. 여행 떠나기 전 짐 꾸리는 그림."},{"w":"parallel","p":"v.","m":"평행시키다","f":1,"i":"두 선이 나란히 같은 간격으로 끝까지 만나지 않고 감 (para-옆에 + llel선). 두 현상을 나란히 견주거나 필적시킴."},{"w":"perfect fit","p":"phr.","m":"꼭 맞는 것, 꼭 맞는 사람","f":1,"i":"빈틈 하나 없이 완벽히(perfect) 딱 맞아떨어짐 (per-끝까지 + fect만들다). 옷·사람·역할이 아귀가 꼭 맞는 그림."},{"w":"perfunctory","p":"a.","m":"형식적인, 마지못한, 겉치레만의","f":1,"i":"임무(function)를 끝까지(per-) 겉핥기로 대충 해치움 (per-관통 + funct직무). 마음 없이 형식만 채우는 성의 없는 태도. (문어체)"},{"w":"perplexed","p":"a.","m":"당황한, 난처한","f":1,"i":"생각의 실이 끝까지(per-) 얽히고설켜(plex) 풀 길 없어 멍함 (per-완전히 + plex엮다). 뭐가 뭔지 몰라 어리둥절한 상태."},{"w":"placate","p":"v.","m":"달래다, 진정시키다","f":1,"i":"성난 상대를 다독여 평온(plac=평온, please와 한뿌리)하게 가라앉힘. appease와 거의 동의 — 화를 누그러뜨림. (문어체)"},{"w":"reckon","p":"v.","m":"세다, 계산하다, 생각하다","f":1,"i":"머릿속 주판을 튕겨 하나하나 헤아려 셈함. 셈에서 확장돼 '~라고 판단·생각한다'는 구어(주로 영국·미국 남부)."},{"w":"refusal","p":"n.","m":"거절, 사퇴","f":1,"i":"내민 것을 되받아(re-) 도로 부어 되돌려줌 → 안 받음 (re-뒤로 + fus붓다). 거절하는 행위의 명사형."},{"w":"renewal","p":"n.","m":"재개, 갱신","f":1,"i":"낡은 것을 다시(re-) 새것(new)으로 되살림 (re-다시 + new새로운). 계약을 다시 갱신하거나 활동을 재개하는 그림."},{"w":"reserve a right","p":"phr.","m":"권리를 보유하다","f":1,"i":"권리 하나를 남이 못 건드리게 뒤로 빼서 내 몫으로 챙겨둠 (re-뒤로 + serve간직). 지금 안 써도 나중을 위해 손에 쥐고 있음."},{"w":"sales volume","p":"phr.","m":"판매량","f":1,"i":"팔린 물건이 창고에 쌓여 차지하는 부피(volume). 낱개가 아니라 덩어리 총량으로 본 판매의 크기."},{"w":"sentence","p":"v.","m":"판결을 내리다, 형을 선고하다","f":1,"i":"판사가 피고에게 형벌을 한 문장으로 '이 사람은 몇 년'이라고 선언해 못박음. 명사 문장과 같은 단어 — 최종 선고문 한 줄."},{"w":"splash","p":"v.","m":"(물 등을) 튀기다","f":1,"i":"물이 '철퍼덕' 사방으로 튀어 흩어지는 순간의 소리와 물방울. 뜻 그대로의 의성어적 이미지."},{"w":"spotlight","p":"v.","m":"스포트라이트로 비추다, 돋보이게 하다","f":1,"i":"무대 위 딱 한 점만 동그란 빛 기둥으로 도려내 밝히고 나머지는 어둠에 묻음. 그래서 '돋보이게 하다'."},{"w":"suited","p":"a.","m":"알맞은, 어울리는","f":1,"i":"옷이 몸에 딱 맞춰 재단된 것처럼(suit=한 벌 정장) 사람·상황이 서로 치수가 맞아떨어짐. 'be suited to/for'."},{"w":"supervise","p":"v.","m":"감독하다, 관리하다","f":1,"i":"위에서(super-위에) 내려다보며(vise=보다, spec와 친척) 전체를 감독함. 아랫사람 어깨너머로 살피는 관리자의 시선."},{"w":"supplant","p":"v.","m":"대신하다","f":1,"i":"남이 심어둔(plant) 자리에 슬쩍 파고들어 그 자리를 밀어내고 대신 차지함 (sub-아래로 파고들어). 힘으로 자리를 갈아치움. (문어체)"},{"w":"surface","p":"n.","m":"표면, 지표면","f":1,"i":"위에(sur-위) + 면(face). 물체의 맨 바깥 껍질 면. 물속에서 위로 떠올라 수면에 닿는 그림도 여기서 나옴."},{"w":"swear","p":"v.","m":"맹세하다","f":1,"i":"한 손 들거나 성경에 손 얹고 목소리 실어 '반드시'라고 무겁게 선언함. 그래서 맹세, 또 감정 실린 욕설도 swear."},{"w":"take one’s pick","p":"phr.","m":"마음에 드는 것을 선택하다","f":1,"i":"여러 개 앞에서 손을 뻗어(pick=집어들다) 내가 원하는 딱 하나를 골라 가짐. 선택권이 나에게 있음."},{"w":"tamper-proof","p":"a.","m":"밀봉된, 부정 조작이 안 되는","f":1,"i":"손대려는(tamper=몰래 조작) 시도를 막아내는(-proof=~에 견디는) 봉인. 뜯으면 표가 나서 함부로 못 건드림."},{"w":"thwart","p":"v.","m":"반대하다, 방해하다","f":1,"i":"앞으로 가려는 걸 가로질러 가로막대를 턱 걸쳐 못 나가게 함. 원래 '가로지른'이라는 뜻 — 진로를 딱 끊는 방해."},{"w":"topple","p":"v.","m":"쓰러지다","f":1,"i":"위가 무거운 것이 꼭대기(top)부터 휘청 기울어 통째로 넘어감. 정권·거인이 무너져 쓰러지는 그림."},{"w":"trial","p":"n.","m":"재판, 시도","f":1,"i":"시험 삼아 한번 굴려보는(try) 과정. 법정에서 진실을 시험대에 올려 가려내면 재판, 제품을 시험하면 시도."},{"w":"triangle","p":"n.","m":"삼각형","f":1,"i":"세(tri-3) + 각(angle). 각이 셋인 도형. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"try on","p":"phr.","m":"(사기 전에) 입어 보다, 신어 보다","f":1,"i":"사기 전에 몸에 '얹어(on)' 시험(try)해봄. 옷을 몸 위에 걸쳐 맞나 확인하는 동작."},{"w":"turn in","p":"phr.","m":"제출하다","f":1,"i":"손에 든 것을 안쪽(in)으로 돌려(turn) 담당자에게 넘김 = 제출. 또 자기 몸을 이불 속으로 넣으면 잠자리에."},{"w":"turn in for the night","p":"phr.","m":"잠자리에 들다","f":1,"i":"하루를 접고 몸을 이불 속(in)으로 돌려 넣음(turn) = 잠자리에 들다. 구어에서 흔함."},{"w":"turn over","p":"phr.","m":"방향을 바꾸다","f":1,"i":"물체를 뒤집어(over) 반대면이 위로 오게 돌림. 뒤집기·넘기기의 기본 동작."},{"w":"vacillate","p":"v.","m":"주저하다, 흔들리다","f":1,"i":"빈(vac=비어있는) 저울처럼 이쪽저쪽으로 계속 흔들려 어디에도 못 앉음. 마음이 좌우로 왔다갔다 못 정함. (문어체, 회화선 waver가 흔함)"},{"w":"volatile market","p":"phr.","m":"(가격 등이) 불안정한 시장","f":1,"i":"새(volat=날다, volare)처럼 가격이 언제 훌쩍 날아오르고 곤두박질칠지 모르는 시장. 잡히지 않고 요동침."},{"w":"wade","p":"v.","m":"(강 등을) 걸어서 건너다","f":1,"i":"물이 허벅지까지 차는 강을 첨벙첨벙 무겁게 저항을 밀며 걸어 건넘. 헤엄이 아니라 발로 버티며 나아감."},{"w":"without reservation","p":"phr.","m":"무조건, 솔직히","f":1,"i":"뒤로 빼서 감춰둔(reserve) 부분이 하나도 없이 전부 내놓음 = 유보 없이, 조건 없이, 솔직하게."},{"w":"a unilateral decision","p":"phr.","m":"독단적인 결정","f":1,"i":"한쪽(uni-하나 + lateral옆면)만 움직여 내린 결정. 상대 의견은 빼고 한 편이 일방적으로 밀어붙임."},{"w":"aloof","p":"ad.","m":"떨어져서, 멀어져서","f":1,"i":"무리에서 한 발 뒤로 물러나 팔짱 끼고 거리를 둔 자세. 차갑게 떨어져 안 섞이려 함."},{"w":"arguable","p":"a.","m":"논증할 수 있는, 의심스러운","f":1,"i":"'따져볼(argue) 여지가 있는' 상태. 확정이 아니라 양쪽으로 논쟁이 붙을 만함 → 그래서 의심스럽기도."},{"w":"assent","p":"v.","m":"동의하다, 찬성하다","f":1,"i":"상대 의견 쪽으로(ad-쪽으로 + sent느끼다/생각하다) 내 마음을 나란히 붙여 '그렇지' 하고 끄덕임. 격식 있는 동의. (문어체)"},{"w":"be left (out) in the cold","p":"phr.","m":"따돌림을 당하다","f":1,"i":"다들 따뜻한 방 안에 있는데 나만 문밖 추운 데 홀로 남겨짐. 무리에서 배제돼 소외된 그림."},{"w":"becoming","p":"a.","m":"잘 어울리는","f":1,"i":"옷·태도가 그 사람에게 자연스럽게 '되어(become)' 붙어 잘 어울림. 마치 원래 그 사람의 일부인 듯. (약간 예스러움)"},{"w":"breathe down one’s neck","p":"phr.","m":"주시하여 지켜보다, 감시하다","f":1,"i":"바로 뒤에 딱 붙어 목덜미에 숨결이 닿을 만큼 가까이서 감시함. 숨 막히게 지켜보는 압박."},{"w":"bribe","p":"n.","m":"뇌물 v. 매수하다","f":1,"i":"탁자 밑으로 슬쩍 찔러주는 돈봉투로 상대 마음을 사서 내 편으로 돌림. 뇌물, 매수."},{"w":"bureaucratic","p":"a.","m":"관료적인, 관료주의의","f":1,"i":"책상(bureau) 뒤에서 규정·서류·도장만 따지는 관청 방식. 융통성 없이 절차에 갇힌."},{"w":"check in luggage","p":"phr.","m":"짐을 부치다","f":1,"i":"공항 카운터에서 가방을 넘기며 '접수(check in)' 처리해 비행기 짐칸으로 부침. 내 손을 떠나 맡겨짐."},{"w":"cheer up","p":"phr.","m":"기운을 내다","f":1,"i":"축 처진 기분을 위로(up) 끌어올려 환호(cheer)하듯 밝아짐. '기운 내!'."},{"w":"circumvent","p":"v.","m":"포위하다, 책략에 빠뜨리다","f":1,"i":"정면 돌파 대신 둘레(circum-둘레)를 빙 돌아 와서(vent=오다) 장애물을 살짝 피해 넘음. 규정을 우회함. (문어체)"},{"w":"coalesce","p":"v.","m":"하나로 되다, 합동하다","f":1,"i":"따로 떠다니던 물방울들이 서로 붙어(co-함께) 하나의 큰 덩어리로 합쳐짐. 녹아 하나로 뭉침. (문어체)"},{"w":"compelling","p":"a.","m":"강력한","f":1,"i":"멱살 잡듯 억지로 안 봐도 시선이 끌려 들어가게(com-강하게 + pel밀다) 만드는 힘. 거부 못할 만큼 설득력·매력 있음."},{"w":"conjugate","p":"v.","m":"(동사를) 활용시키다, 결합시키다","f":1,"i":"하나의 동사를 인칭·시제별로 함께(con-함께) 짝지어(jug=멍에로 묶다) 형태를 쭉 펼침. 활용표를 엮어냄."},{"w":"correlation","p":"n.","m":"상관 관계, 상호 관련","f":1,"i":"두 값이 서로(co-함께) 손잡고(relate) 한쪽이 오르면 다른 쪽도 따라 움직이는 관계. 나란히 연동됨."},{"w":"cumulative","p":"a.","m":"누적되는, 쌓이는","f":1,"i":"쌓이고(cumul=더미) 또 쌓여 눈덩이처럼 점점 불어나는 것. 앞의 것에 계속 얹혀 누적됨."},{"w":"cursory","p":"a.","m":"서두르는, 피상적인","f":1,"i":"달리며(curs=달리다, cursor와 친척) 스치듯 훑고 지나가 겉만 봄. 꼼꼼함 없이 후딱 대충. (문어체)"},{"w":"discreet","p":"a.","m":"분별 있는, 신중한","f":1,"i":"말·행동을 따로 떼어(dis-분리) 조심스레 가려내 함부로 흘리지 않음. 눈치껏 입 무겁게 처신함. (혼동: discrete=별개의)"},{"w":"distend","p":"v.","m":"넓히다, 부풀게 하다","f":1,"i":"안에서 밖으로(dis-흩어져 + tend뻗다) 압력이 밀어 배·풍선이 팽팽히 부풀어 오름. 늘어나 부풂. (문어·의학)"},{"w":"downhearted","p":"a.","m":"기가 죽은, 낙담한","f":1,"i":"심장(heart)이 아래로(down) 축 처져 가라앉은 상태. 기가 꺾여 풀죽음."},{"w":"drug overdose","p":"phr.","m":"약물 과다 복용","f":1,"i":"몸이 감당할 선을 넘어(over-초과) 약을 들이부음(dose=복용량). 과다 복용."},{"w":"entwine","p":"v.","m":"휘감기게 하다, 혼란시키다","f":1,"i":"두 가닥이 서로 안으로(en-) 배배 꼬여(twine=꼬다) 풀기 힘들게 휘감김. 얽힘."},{"w":"erode","p":"v.","m":"부식하다","f":1,"i":"물·바람이 갉아먹으며(rod=갉다, rodent과 친척) 조금씩 표면을 벗겨내려 깎음(e-밖으로). 서서히 침식·잠식."},{"w":"eulogize","p":"v.","m":"칭찬하다, 찬사를 보내다","f":1,"i":"좋은(eu-좋은 + log말) 말만 골라 높이 쌓아 바침. 특히 죽은 이나 대상을 크게 기림. (문어·격식)"},{"w":"expound","p":"v.","m":"상세히 설명하다","f":1,"i":"접혀 있던 내용을 밖으로(ex-밖) 펼쳐(pound=놓다, pon계열) 조목조목 상세히 풀어냄. (문어체)"},{"w":"extol","p":"v.","m":"칭찬하다","f":1,"i":"대상을 밖으로(ex-) 높이 들어올려(tol=들다) 치켜세움. 하늘 높이 칭찬함. (문어체)"},{"w":"extract","p":"v.","m":"뽑아내다","f":1,"i":"박혀 있는 것을 밖으로(ex-밖) 끌어(tract=끌다) 뽑아냄. 이빨·즙·핵심을 빼내는 그림."},{"w":"extroverted","p":"a.","m":"외향적인","f":1,"i":"마음의 에너지가 밖으로(extro-밖) 돌아(vert=돌다) 사람들 쪽으로 향함. 밖을 향해 열린 성격."},{"w":"feasibility","p":"n.","m":"실행할 수 있음, 가능성","f":1,"i":"실제로 해낼(feas=하다, fac계열) 수 있는가 하는 '됨직함'의 정도. 계획이 땅에 발붙일 수 있는지. (문어·비즈니스)"},{"w":"flank","p":"v.","m":"측면에 서다, 측면을 지키다","f":1,"i":"짐승·군대의 옆구리(flank). 그 옆구리에 딱 붙어 양옆을 지키거나 둘러쌈. 'flanked by 둘 사이에 낀'."},{"w":"fray","p":"v.","m":"(신경이) 곤두서다","f":1,"i":"천의 올이 낡아 실오라기가 삐져나와 너덜너덜 닳음. 그 마모된 가장자리처럼 신경도 닳아 곤두섬."},{"w":"fume","p":"v.","m":"노발대발하다, 연기를 내다","f":1,"i":"부글부글 끓어 매운 연기(fume)를 뿜어냄. 그 연기가 곧 속에서 치미는 분노 — 씩씩거림."},{"w":"gout","p":"n.","m":"통풍, (피의) 방울","f":1,"i":"엄지발가락 관절에 요산이 뭉쳐 벌겋게 붓고 쑤시는 통풍. 특별한 감각 이미지 없음 — 병명 그대로."},{"w":"graft","p":"n.","m":"접목, 접지","f":1,"i":"한 나무의 가지를 잘라 다른 나무 몸통에 붙여 자라게 함(접목). 살점·조직을 이식하는 데도 씀."},{"w":"ground","p":"n.","m":"근거, 이유","f":1,"i":"발밑의 땅바닥. 주장이 딛고 서는 '땅' = 근거·이유. 논리가 발붙일 지반."},{"w":"heap","p":"v.","m":"산처럼 쌓이다, 모이다","f":1,"i":"삽으로 퍼 던진 흙·빨래·동전이 봉긋한 산더미로 쌓여 올라감. 마구잡이로 겹겹이 포개는 이미지."},{"w":"implication","p":"n.","m":"함축, 암시","f":1,"i":"말 밖으로 안 내뱉고 안으로 접어 넣어둔 속뜻 (im-안으로 + plic접다). 겉말에 딸려 들어와 접혀 있어, 파장·연루의 뜻도 여기서 나옴."},{"w":"instruct","p":"v.","m":"가르치다, 교육하다","f":1,"i":"머릿속에 지식을 벽돌처럼 차곡차곡 쌓아 지어 올림 (in-안으로 + struct세우다). 그래서 가르치다·지시하다."},{"w":"introverted","p":"a.","m":"내성적인","f":1,"i":"에너지의 화살표가 밖이 아니라 자기 안쪽으로 돌아 들어간 사람 (intro-안으로 + vert돌다). 그래서 내성적."},{"w":"jammed","p":"a.","m":"끼인, 궁지에 몰린","f":1,"i":"좁은 틈에 억지로 끼어 옴짝달싹 못 함. 문·기계·교통이 꽉 물려 멈춘 그림, 그래서 궁지에 몰림도."},{"w":"lag behind","p":"phr.","m":"뒤지다, 낙후되다","f":1,"i":"무리가 앞서 가는데 혼자 뒤로 처져 간격이 벌어짐. 기술·성적이 남들 뒤꽁무니에 남는 그림."},{"w":"leakage","p":"n.","m":"누출","f":1,"i":"미세한 틈으로 물·가스·정보가 야금야금 새어 나감 (leak새다). 새어 빠져나간 그 양·현상."},{"w":"liability","p":"n.","m":"의무, 부채","f":1,"i":"내 어깨에 묶여 언제든 갚아야 할 무게추. 법적 책임·빚, 넓게는 짐이 되는 골칫거리."},{"w":"locality","p":"n.","m":"장소","f":1,"i":"지도 위 특정 지점에 콕 찍힌 동그라미 — 그 일대·지역 (local그 자리의). 특별한 감각 이미지 적음, 뜻 그대로."},{"w":"lucid","p":"a.","m":"빛나는, 명료한","f":1,"i":"안개 걷힌 유리처럼 속이 훤히 비쳐 보이는 (luc빛). 빛이 통과해 논리가 투명하게 보임 → 명료한. (문어·격식체)"},{"w":"mark one’s words","p":"phr.","m":"~의 말을 잘 듣다, ~의 말에 주목하다","f":1,"i":"손가락으로 상대 말에 밑줄 쫙 그으며 '이 말 잘 새겨둬'. 나중에 맞을 테니 기억해 두라는 경고조."},{"w":"mete","p":"v.","m":"배분하다, 할당하다","f":1,"i":"됫박으로 정확히 계량해 각자에게 딱딱 떼어 나눠 줌. 주로 mete out으로 벌·정의를 배분. (문어체)"},{"w":"meticulous","p":"a.","m":"꼼꼼한, 세심한","f":1,"i":"핀셋으로 먼지 하나까지 집어내듯 겁날 만큼 세밀하게 챙김. 빈틈 하나 못 견디는 꼼꼼함."},{"w":"mortify","p":"v.","m":"억제하다, 분하게 하다","f":1,"i":"얼굴이 죽은 듯 새하얗게 질려 쥐구멍 찾고 싶은 창피 (mort죽음). 자존심이 죽는 감각 → 굴욕감."},{"w":"mournful","p":"a.","m":"슬픔에 잠긴, 한탄하는","f":1,"i":"고개 숙이고 상복 입은 채 낮게 흐느끼는 분위기. 슬픔이 무겁게 내려앉은 애도의 얼굴."},{"w":"nail clipper","p":"phr.","m":"손톱깎이","f":1,"i":"손톱을 지렛대로 눌러 똑 잘라내는 작은 집게. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"ordain","p":"v.","m":"운명 짓다, 임명하다, 제정하다","f":1,"i":"높은 권위가 위에서 '이렇게 될지어다' 하고 순서·자리를 딱 정해 내려줌 (ord질서). 그래서 성직 임명·운명 지음·법 제정."},{"w":"over the top","p":"phr.","m":"허풍으로, 과장하여","f":1,"i":"참호 밖 꼭대기를 넘어 무모하게 돌격하듯, 적정선을 훌쩍 넘어버림. 도가 지나친·과장된."},{"w":"overseas demand","p":"phr.","m":"해외 수요","f":1,"i":"바다 건너 저편에서 손 뻗어 '이거 달라'고 당기는 힘. 해외 시장의 수요. 특별한 이미지 없음."},{"w":"procure","p":"v.","m":"얻다, 획득하다, 조달하다, 구하다","f":1,"i":"발품 팔아 앞장서 챙겨 손에 넣음 (pro-앞으로 + cure돌보다·챙기다). 그냥 사다보다 격식·수고가 든 조달."},{"w":"prosecute","p":"v.","m":"기소하다, 고소하다","f":1,"i":"법정에서 피고를 끝까지 앞으로 밀어붙여 몰아세움 (pro-앞으로 + secut쫓다). 쫓아가 죄를 묻는 기소."},{"w":"purloin","p":"v.","m":"훔치다","f":1,"i":"남의 것을 슬쩍 멀리로 빼돌려 감춤 (pur-멀리 + loin밀다). steal의 격식·고풍 버전. (문어·드묾)"},{"w":"reclusive","p":"a.","m":"은둔한, 쓸쓸한","f":1,"i":"세상에 문 닫아걸고 다시 안쪽 방으로 틀어박힌 (re-뒤로 + clus닫다). 은둔한."},{"w":"release a brake","p":"phr.","m":"브레이크를 풀다","f":1,"i":"꽉 잡고 있던 브레이크에서 손을 떼 억눌린 걸 풀어 굴러가게 함. 특별한 이미지 없음 — 뜻 그대로."},{"w":"restrained","p":"a.","m":"삼가는, 자제하는","f":1,"i":"고삐를 뒤로 당겨 튀어나가려는 걸 꾹 눌러 잡은 상태 (re-뒤로 + strain당기다). 감정·행동을 자제한."},{"w":"resume","p":"v.","m":"재개하다","f":1,"i":"잠깐 내려놨던 걸 다시 집어 들고 하던 데서 이어감 (re-다시 + sum취하다). 중단됐던 게 재개됨."},{"w":"rub","p":"v.","m":"문지르다, 비비다","f":1,"i":"손바닥이나 천을 표면에 대고 문질러 마찰을 일으킴. 비비는 물리적 감각 그대로."},{"w":"rub salt in the wound","p":"phr.","m":"사태를 더욱 악화시키다","f":1,"i":"가뜩이나 벌어진 상처에 소금을 문질러 넣어 더 쓰라리게 함. 안 좋은 상황을 더 후벼 악화."},{"w":"shoddy","p":"a.","m":"조잡한, 가짜의","f":1,"i":"겉만 그럴싸하고 속은 싸구려 천 조각을 이어 붙인 듯 조잡함. 대충 만든·엉터리인."},{"w":"shun","p":"v.","m":"피하다, 비키다","f":1,"i":"그 사람·상황을 몸을 홱 틀어 일부러 멀리 피해 감. 회피보다 의도적으로 등지는 뉘앙스."},{"w":"speed limit","p":"phr.","m":"제한 속도","f":1,"i":"도로 표지판에 박힌 숫자, 이 선을 넘지 말라는 속도의 천장. 특별한 이미지 없음 — 뜻 그대로."},{"w":"straighten","p":"v.","m":"똑바르게 하다, 정리하다","f":1,"i":"구부러지고 흐트러진 걸 손으로 쫙 펴 일직선으로 반듯하게 만듦 (straight곧은). 그래서 정리하다."},{"w":"stringent","p":"a.","m":"엄격한, 엄중한","f":1,"i":"밧줄을 팽팽히 당겨 조이듯 여유 없이 빡빡한 (string끈·당김). 규정·기준이 조여든 엄격함. (문어체)"},{"w":"stubborn","p":"a.","m":"완고한, 고집 센","f":1,"i":"말뚝처럼 땅에 박혀 아무리 밀어도 꿈쩍 안 함. 제 뜻을 안 굽히는 완고함."},{"w":"superior","p":"a.","m":"상위의, 우수한","f":1,"i":"남들 머리 위에 올라서 내려다보는 위치 (super-위에). 그래서 상위의·더 우수한."},{"w":"supple","p":"a.","m":"나긋나긋한, 유연한","f":1,"i":"잘 다룬 가죽·버들가지처럼 부드럽게 휘어지는. 뻣뻣함 없이 나긋나긋한 유연함."},{"w":"swindle","p":"v.","m":"사기 치다","f":1,"i":"달콤한 말로 상대 눈을 어지럽게 흔들어 돈을 슬쩍 빼감. 신뢰를 이용한 사기."},{"w":"tactic","p":"n.","m":"전법","f":1,"i":"장기판 위 말을 어디에 둘지 짜는 그 한 수의 배치 (tact닿아 다룸). 목적 달성용 구체적 수법."},{"w":"temporize","p":"v.","m":"우물쭈물하다, 사태를 관망하다","f":1,"i":"결정을 안 내리고 시간만 질질 끌며 상황 눈치 봄 (tempor시간). 어물쩍 시간 벌기. (문어체)"},{"w":"threatening","p":"a.","m":"위협하는","f":1,"i":"먹구름이 머리 위로 낮게 밀려와 곧 덮칠 듯한 긴장. 위협하는·으름장 놓는."},{"w":"toast","p":"n.","m":"건배, 축배","f":1,"i":"잔을 높이 들어 '위하여' 하고 다 같이 부딪치는 순간. 축하의 건배."},{"w":"token of appreciation","p":"phr.","m":"감사의 표시","f":1,"i":"'고마워요'를 담아 건네는 작은 정표 하나 (token징표). 마음의 증표로서의 선물. 특별한 이미지 없음."},{"w":"tooth decay","p":"phr.","m":"충치","f":1,"i":"이가 안에서부터 서서히
