<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEPS 350+ 30일 단어</title>
</head>
<body>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --fg:#1f2430; --sub:#6b7280;
    --border:#e3e6ec; --muted:#eef1f5; --accent:#2563eb; --accent-fg:#ffffff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --imgbg:#eef4ff; --imgfg:#1e3a8a; --done:#dcfce7; --done-fg:#166534;
    --shadow:0 1px 3px rgba(20,25,40,.06),0 1px 2px rgba(20,25,40,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14161c; --card:#1e222b; --fg:#e9ebf1; --sub:#98a0b2;
      --border:#2c313c; --muted:#262b35; --accent:#5b9dff; --accent-fg:#0b1220;
      --good:#3ac47d; --warn:#e5a53c; --bad:#f2687a;
      --imgbg:#1a2340; --imgfg:#bcd2ff; --done:#183a2a; --done-fg:#8fe3b4;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8; --card:#ffffff; --fg:#1f2430; --sub:#6b7280;
    --border:#e3e6ec; --muted:#eef1f5; --accent:#2563eb; --accent-fg:#ffffff;
    --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --imgbg:#eef4ff; --imgfg:#1e3a8a; --done:#dcfce7; --done-fg:#166534;
    --shadow:0 1px 3px rgba(20,25,40,.06),0 1px 2px rgba(20,25,40,.04);
  }
  :root[data-theme="dark"]{
    --bg:#14161c; --card:#1e222b; --fg:#e9ebf1; --sub:#98a0b2;
    --border:#2c313c; --muted:#262b35; --accent:#5b9dff; --accent-fg:#0b1220;
    --good:#3ac47d; --warn:#e5a53c; --bad:#f2687a;
    --imgbg:#1a2340; --imgfg:#bcd2ff; --done:#183a2a; --done-fg:#8fe3b4;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .wrap{max-width:640px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
        padding:0 16px calc(env(safe-area-inset-bottom) + 16px); }
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; gap:10px; padding:14px 2px 10px;
    border-bottom:1px solid var(--border);}
  .topbar .ttl{font-weight:700; font-size:17px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .iconbtn{background:var(--muted); color:var(--fg); border:1px solid var(--border);
    border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer}
  .sub{color:var(--sub); font-size:13px}
  .content{flex:1; padding-top:14px}
  h1{font-size:22px; font-weight:800; margin:6px 0 2px; text-wrap:balance}

  /* buttons */
  .btn{display:block; width:100%; border:none; border-radius:14px; padding:15px;
    font-size:16px; font-weight:700; cursor:pointer; margin:8px 0;
    background:var(--accent); color:var(--accent-fg); box-shadow:var(--shadow)}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--card); color:var(--fg); border:1px solid var(--border); box-shadow:none}
  .btn.warn{background:var(--warn); color:#fff}
  .btn.danger{background:var(--card); color:var(--bad); border:1px solid var(--border); box-shadow:none}
  .btn:disabled{opacity:.5; cursor:default}

  /* day grid */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px}
  .tile{background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 8px; text-align:center; cursor:pointer; box-shadow:var(--shadow)}
  .tile .d{font-weight:700; font-size:15px}
  .tile .s{font-size:12px; color:var(--sub); margin-top:3px}
  .tile.done{background:var(--done)} .tile.done .d,.tile.done .s{color:var(--done-fg)}
  .tile.prog{border-color:var(--accent)} .tile.prog .s{color:var(--accent); font-weight:600}

  /* study card */
  .card{background:var(--card); border:1px solid var(--border); border-radius:20px;
    box-shadow:var(--shadow); padding:26px 20px; margin-top:12px; text-align:center;
    display:flex; flex-direction:column; justify-content:center; min-height:44vh}
  .word{font-size:40px; font-weight:800; letter-spacing:-.5px; word-break:break-word}
  .hint{color:var(--sub); font-size:13px; margin-top:14px}
  .pos{color:var(--accent); font-style:italic; font-size:15px; margin-top:6px}
  .mean{font-size:22px; font-weight:600; margin:8px 0}
  .imgbox{background:var(--imgbg); color:var(--imgfg); border-radius:14px;
    padding:14px 15px; font-size:15px; text-align:left; margin:10px 0; line-height:1.55}
  .meta{color:var(--sub); font-size:12px; margin-top:4px}
  .spk{display:inline-flex; align-items:center; gap:7px; background:var(--muted); color:var(--fg);
    border:1px solid var(--border); border-radius:12px; padding:10px 16px; font-size:15px;
    font-weight:600; cursor:pointer; margin-top:12px}
  .progline{color:var(--sub); font-size:13px; text-align:center; margin-top:10px;
    font-variant-numeric:tabular-nums}

  /* eval bar */
  .evalbar{position:sticky; bottom:0; background:var(--bg); padding:12px 0 6px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px}
  .ev{border:none; border-radius:14px; padding:16px 6px; font-size:15px; font-weight:800;
    color:#fff; cursor:pointer; box-shadow:var(--shadow); line-height:1.25}
  .ev small{display:block; font-size:11px; font-weight:600; opacity:.9}
  .ev.b1{background:var(--bad)} .ev.b2{background:var(--warn)} .ev.b3{background:var(--good)}
  .ev:active{transform:translateY(1px)}

  /* list */
  .listgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:6px}
  .wchip{display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--card); border:1px solid var(--border); border-radius:11px;
    padding:11px 12px; cursor:pointer; font-size:15px; text-align:left}
  .wchip .n{color:var(--sub); font-size:12px; margin-right:2px}
  .dot{font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; white-space:nowrap}
  .dot.d0{color:var(--sub); background:var(--muted)}
  .dot.d1{color:#fff; background:var(--bad)}
  .dot.d2{color:#fff; background:var(--warn)}
  .dot.d3{color:#fff; background:var(--good)}
  .detail{position:sticky; top:56px; z-index:10; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:15px 16px; box-shadow:var(--shadow); margin:6px 0 12px}
  .detail .dw{font-size:24px; font-weight:800}
  .detail .dm{font-size:15px; margin-top:3px}
  .detail .di{font-size:14px; color:var(--imgfg); margin-top:7px; line-height:1.5}

  .rowbtns{display:flex; gap:9px} .rowbtns .btn{margin:8px 0}
  .toolrow{display:flex; gap:9px; flex-wrap:wrap; margin:6px 0 2px}
  .toolrow .iconbtn{flex:0 0 auto}
  .center{text-align:center}
  .statbox{display:flex; gap:10px; justify-content:center; margin:14px 0}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 20px; text-align:center; box-shadow:var(--shadow)}
  .stat .v{font-size:30px; font-weight:800}
  .stat .l{font-size:12px; color:var(--sub); margin-top:2px}
  .footnote{color:var(--sub); font-size:12px; text-align:center; margin:14px 0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <button class="iconbtn" id="backBtn" style="display:none">‹ 뒤로</button>
    <div class="ttl" id="topTitle">TEPS 단어</div>
    <button class="iconbtn" id="themeBtn" title="테마">◑</button>
  </div>
  <div class="content" id="app"></div>
</div>

<script>
"use strict";
const RAW = /*__DATA__*/[{"w":"reserve","p":"v.","m":"예약하다 / 보존하다, 보유하다","f":3,"i":"남이 못 건드리게 뒤로 빼서 따로 챙겨둠 (re-뒤로 + serve간직). 자리를 미리 빼두면 '예약', 자원을 빼두면 '비축·보존'."},{"w":"supply","p":"v.","m":"용품; 제공하다 / 공급하다, 지급하다 n. 공급, 지급 / 양, 재고품, 비축물자","f":3,"i":"필요한 곳 밑에서 위로 계속 대주어 채움 (sub-아래서 + ply채우다). 파이프로 물 대주는 그림 → 명사로는 '대주는 것 = 재고·비축'."},{"w":"replace","p":"v.","m":"교환하다 / 대신하다, 대체하다 / 대체하다","f":3,"i":"있던 걸 빼고 그 빈'자리'에 다른 걸 도로 놓음 (re-다시 + place자리). 핵심은 자리(place)는 그대로, 놓이는 것만 바뀐다는 것."},{"w":"raise","p":"v.","m":"인상하다, 올리다 / 올리다, 세우다, 모으다","f":3,"i":"바닥의 것을 손으로 들어 위로 끌어올림. 이 '올리는' 동작 하나로 → 값을 인상, 아이를 키우다(위로 자라게), 돈을 모으다(그러모아 올림), 문제를 제기하다(수면 위로 띄움)."},{"w":"wonder","p":"v.","m":"알고 싶어하다, 의아하게 여기다 / 궁금해 하다, 놀라다 n. 경이, 놀라움","f":3,"i":"알 수 없는 것 앞에서 입이 벌어진 채 멈칫. 그 멈칫이 '궁금함'도 '경탄'도 됨 — 머리로 다 담지 못해 멎는 순간."},{"w":"remind","p":"v.","m":"상기시키다","f":3,"i":"잊고 있던 걸 '상대' 마음속에 도로 갖다 놓음 (re-다시 + mind마음). 내가 떠올리는 게 아니라 남 머릿속에 띄워주는 것 → remind A of B."},{"w":"obtain","p":"v.","m":"달성하다, 얻다 / 얻다, 획득하다","f":3,"i":"손을 뻗어 꽉 붙잡아 내 쪽으로 가져옴 (ob-향해 + tain붙잡다/hold). 그냥 받는 게 아니라 노력해 '거머쥐는' 느낌. 격식체."},{"w":"complete","p":"v.","m":"완성하다 / 완성하다, 끝내다","f":3,"i":"빈 곳 없이 끝까지 가득 채워 마침 (com-완전히 + plete채우다/fill). 마지막 한 칸까지 메워 더 넣을 데 없는 상태."},{"w":"commit","p":"v.","m":"저지르다 / 전념하다, 헌신하다 / 범하다, 저지르다","f":3,"i":"자신을 통째로 어느 쪽에 실어 보내 되돌릴 수 없게 함 (com-함께 + mit보내다/send). 그 방향이 나쁘면 '(죄를) 저지르다', 좋으면 '헌신·전념'."},{"w":"benefit","p":"v.","m":"이롭다, 도움이 되다 n. 이익, 편의 / 이점","f":3,"i":"좋은 것이 누군가에게 작용해 득이 굴러들어옴 (bene-좋게 + fit행하다/do). 나에게 이로움이 돌아오는 그림."},{"w":"migrate","p":"v.","m":"이주하다, (새·짐승·물고기가) 철 따라 이동하다 / 이동하다, 이주하다","f":3,"i":"무리가 계절 따라 살던 터를 통째로 옮겨 감. 새 떼가 하늘을 가로질러 이동하는 장면 — 잠깐 여행이 아니라 '터전을 옮김'."},{"w":"promote","p":"v.","m":"촉진하다, 장려하다, 승진시키다 / 승진시키다 / 장려하다; 촉진하다 / 장려하다","f":3,"i":"앞으로 밀어 올려줌 (pro-앞으로 + mote움직이다/move). 사람을 밀어 올리면 '승진', 일·상품을 밀어주면 '촉진·홍보'."},{"w":"deduce","p":"v.","m":"추론하다, (결론·진리를) 연역하다 / 추론하다","f":3,"i":"큰 전제에서 논리의 줄을 타고 아래로 끌어내려 결론에 닿음 (de-아래로 + duce이끌다/lead). 위의 원리에서 아래 결론으로 내려오는 그림."},{"w":"identify","p":"v.","m":"(신원을) 확인하다, 식별하다 / 식별하다","f":3,"i":"눈앞의 것을 머릿속 '바로 그것'과 딱 포개어 같은 것임을 짚어냄 (ident-같음/same). 대조해서 일치를 찍는 동작."},{"w":"provide","p":"v.","m":"공급하다 / 제공하다","f":3,"i":"필요할 걸 미리 내다보고 앞에 대령해 둠 (pro-미리 + vide보다/see). 미리 봐두고 준비해 내놓는 것 → provide for = 대비하다."},{"w":"contain","p":"v.","m":"가지다, 포함하다 / 포함하다","f":3,"i":"테두리 안에 다 함께 붙잡아 둠 (con-함께 + tain붙잡다/hold). 그릇이 내용물을 안 새게 잡아두는 그림 — 감정을 contain하면 '억누르다'."},{"w":"credit","p":"n.","m":"신용, 신뢰 v. 믿다, 신뢰하다 / 믿다, 신용하다","f":3,"i":"상대를 믿고(cred믿다) 돈·명예·공을 먼저 맡겨 줌. 믿음이 곧 신용."},{"w":"recognize","p":"v.","m":"알아보다, 인정하다 / 알아보다 / 인식하다","f":3,"i":"전에 알던 것을 다시 머릿속에서 알아봄 (re-다시 + cognize알다). 그 알아봄이 곧 인정."},{"w":"remain","p":"v.","m":"남다, 잔존하다 n. 유해, 유물 / 남다, ~대로이다","f":3,"i":"남들 다 떠난 뒤에도 그 자리에 그대로 머물러 있음 (re-뒤에 + main머물다)."},{"w":"convert","p":"v.","m":"변환하다, 개조하다, 개종시키다 / 전환하다","f":3,"i":"방향을 홱 돌려 아예 딴 것으로 바꿈 (con- + vert돌다). 형태·종교·통화까지 돌려버림."},{"w":"critical","p":"a.","m":"중대한, 결정적인, 비판적인 / 중대한 / 결정적인, 중대한","f":3,"i":"칼날 같은 갈림길 위에 선 상태 (crit가르다·판단). 잘못 디디면 끝장이라 중대하고, 그 판단이 곧 비판."},{"w":"adjust","p":"v.","m":"조절하다 / 적용하다","f":3,"i":"딱 맞을 때까지(ad-쪽으로 + just맞다) 조금씩 틀어 미세하게 맞춤."},{"w":"feature","p":"v.","m":"특색으로 삼다, (배우를) 주연시키다 / 볼거리, 특별 프로","f":3,"i":"얼굴에서 유독 도드라진 이목구비. 그 도드라짐을 앞세워 특징으로 내세우거나 주연으로 세움."},{"w":"impose","p":"v.","m":"(세금·의무를) 지우다, 강요하다 / 강요하다, 부과하다 / 부과하다","f":3,"i":"위에서 아래로 눌러 얹어 놓음 (im-위에 + pose놓다). 세금·의무를 얹으니 부과, 억지로 얹으니 강요."},{"w":"appoint","p":"v.","m":"임명하다, 지명하다 / 임명하다","f":3,"i":"손가락으로 한 사람을 콕 찍어(ap-쪽으로 + point가리키다) 그 자리에 세움. 그래서 임명·지명."},{"w":"handle","p":"v.","m":"다루다, 처리하다 / 처리하다","f":3,"i":"손잡이(hand)를 손으로 쥐고 능숙하게 다룸. 사물도 상황도 손아귀에 쥐고 처리."},{"w":"interrupt","p":"v.","m":"방해하다 / 도중에 방해하다, 가로막다 / 방해하다, 훼방 놓다 / 중단하다","f":2,"i":"흐르던 것 사이를 뚝 끊어 깨뜨림 (inter-사이 + rupt깨다). 말·흐름을 중간에서 깸."},{"w":"source","p":"n.","m":"출처, 근거 / 근본, 원인 / 원천","f":2,"i":"물이 처음 땅에서 솟아나는 샘구멍. 모든 것이 거기서 흘러나오니 출처·원천."},{"w":"submit","p":"v.","m":"제출하다 / 제출하다, 복종시키다","f":2,"i":"고개를 아래로 숙여 바침 (sub-아래 + mit보내다). 서류를 내려 바치면 제출, 몸을 낮추면 복종."},{"w":"encounter","p":"v.","m":"맞닥뜨리다 / 우연히 만나다, (곤란·반대에) 부닥치다 / 만남, 우연히 만나다 / 마주치다","f":2,"i":"모퉁이에서 상대와 정면으로 맞닥뜨림 (en- + counter맞서서). 반갑든 곤란하든 딱 마주침."},{"w":"separate","p":"v.","m":"독립된 / 분리하다, 떼어놓다","f":2,"i":"둘 사이에 칸막이를 끼워 떨어뜨려 놓음 (se-떨어져 + par나누다). 붙어 있던 걸 갈라놓는 그림."},{"w":"committee","p":"n.","m":"위원회","f":2,"i":"어떤 일을 맡겨 보낸(commit) 사람들의 무리. 위임받은 자들의 모임이 위원회."},{"w":"compensate","p":"v.","m":"보상하다, 배상하다 / 보상하다","f":2,"i":"양쪽 저울이 수평이 되게 모자란 쪽에 무게를 채워 갚음 (com-함께 + pens무게 달다)."},{"w":"compress","p":"v.","m":"압축하다","f":2,"i":"사방에서 함께 눌러 부피를 쥐어짬 (com-함께 + press누르다)."},{"w":"lifespan","p":"n.","m":"수명","f":2,"i":"태어나 죽을 때까지 한 뼘처럼 쭉 뻗은 시간의 폭 (life삶 + span뼘·폭). 특별한 비유 없이 뜻 그대로."},{"w":"operate","p":"v.","m":"작동하다, 움직이다 / 작동하다","f":2,"i":"손을 대 기계를 실제로 굴려 돌림 (oper일·작동). 몸에 손대 굴리면 수술도 됨."},{"w":"premise","p":"n.","m":"건물","f":2,"i":"본론 앞에 미리 깔아둔 바닥돌 (pre-앞서 + mise놓다) = 전제. 미리 잡아 둔 땅·건물이란 뜻도 여기서 갈림."},{"w":"related","p":"a.","m":"혈연 관계가 있는, 관련된 / 친척의","f":2,"i":"실로 뒤로 이어져 서로 묶여 있음 (re- + late나르다·이어짐). 피로 이어지면 친척, 내용이 이어지면 관련."},{"w":"spokesperson","p":"n.","m":"대변인","f":2,"i":"남을 대신해 입으로 말해 주는 사람 (spoke말한 + person). 뜻 그대로."},{"w":"complain","p":"v.","m":"불평하다, 항의하다 / 불평하다","f":2,"i":"가슴을 치며 앓는 소리를 밖으로 쏟아냄 (com- + plain가슴치다). 그 하소연이 불평·항의."},{"w":"establish","p":"v.","m":"설립하다, (법률·제도 등을) 제정하다 / 건설하다","f":2,"i":"기둥을 땅에 단단히 세워 박아 굳힘 (sta서다). 흔들리지 않게 세우니 설립·제정."},{"w":"maintain","p":"v.","m":"지속하다, 유지하다 / 유지하다","f":2,"i":"손으로 계속 붙잡고 있어 무너지지 않게 그대로 둠 (man-손 + tain붙잡다)."},{"w":"preserve","p":"v.","m":"보존하다, 보호하다 / 보호하다","f":2,"i":"상하기 전에 미리 감싸 지켜 둠 (pre-앞서 + serve지키다). 원래 모습 그대로 보존."},{"w":"delegate","p":"v.","m":"대표로 파견하다, 위임하다 / 대리인, 대표, 사절 / 대표, 사절","f":2,"i":"내 권한 일부를 떼어 남에게 맡겨 보냄 (de- + leg맡기다). 그 맡겨 보낸 사람이 대표·사절."},{"w":"task","p":"n.","m":"직무, 사업 / 직무, 과제","f":2,"i":"손에 쥐여진 해내야 할 일 덩어리. 특별한 비유 없이 뜻 그대로 — 맡겨진 과제."},{"w":"declare","p":"v.","m":"세관 신고하다, 선언하다 / 신고하다","f":2,"i":"덮개를 걷어 확 밝혀 드러내 알림 (de-완전히 + clare밝히다). 공개적으로 못박아 선언·신고."},{"w":"run out of","p":"phr.","m":"~을 다 써버리 본문에 앞서(pre-앞서) 얼굴(face)처럼 맨 먼저 내미는 글. 책의 서문·머리말."},{"w":"prevalent","p":"a.","m":"널리 퍼진, 우세한 / 만연한","f":1,"i":"힘(val힘, value)이 앞서(pre-) 나가 널리 우세하게 퍼진 상태. 여기저기 만연함. (문어·격식)"},{"w":"recollection","p":"n.","m":"상기, 기억 / 기억","f":1,"i":"흩어졌던 기억 조각을 다시(re-다시) 한데 모아(collect모으다) 떠올림. 상기·회상."},{"w":"comfort","p":"n.","m":"위로, 위안 / 안락함","f":1,"i":"곁에서 함께(com-함께) 힘(fort힘, force)을 북돋아 마음을 풀어줌. 위로, 그리고 몸이 편한 안락함."},{"w":"complicated","p":"a.","m":"복잡한, 뒤섞인 / 복잡한","f":1,"i":"여러 가닥이 함께(com-) 겹겹이 접혀(plic접다) 얽힌 상태. 풀기 어렵게 뒤엉킨 복잡함."},{"w":"concrete","p":"a.","m":"구체적인, 명확한 / 구체적인","f":1,"i":"여럿이 함께(con-) 굳어 자라 붙어(cre자라다) 단단한 덩어리가 된 것. 손에 잡히는 구체적임(=콘크리트)."},{"w":"confirm","p":"v.","m":"확실하게 하다 / 확인하다","f":1,"i":"흔들리던 것을 함께(con-강조) 단단히(firm굳다) 눌러 굳혀 확정. 사실임을 확인·확정."},{"w":"definite","p":"a.","m":"명확한, 일정한 / 명확한","f":1,"i":"가장자리에 끝(de-완전히 + fin끝, finish) 선을 딱 그어 경계를 못박음. 흐릿함 없이 명확함."},{"w":"overtake","p":"v.","m":"따라잡다 / 추월하다; 따라잡다","f":1,"i":"뒤에서 쫓아와 상대 위를 넘어(over-위로) 잡아채(take) 앞질러 감. 추월·따라잡음."},{"w":"prolific","p":"a.","m":"다작의, 풍부한 / 다작의","f":1,"i":"앞으로(pro-앞으로) 계속 새끼·열매를 만들어(fic만들다) 쏟아냄. 작품을 왕성하게 찍어내는 다작의. (문어)"},{"w":"sustain","p":"v.","m":"떠받치다, 지탱하다 / 살아갈 수 있게 하다","f":1,"i":"아래에서(sus-=sub 아래) 떠받쳐 붙잡아(tain붙잡다) 무너지지 않게 계속 버팀. 지탱·유지."},{"w":"underlying","p":"a.","m":"밑에 있는, 잠재적인 / 근본적인","f":1,"i":"겉으로 안 보이게 아래에(under-아래) 깔려 누워(lying) 있는 것. 표면 밑에 숨은 근본 원인."},{"w":"urge","p":"v.","m":"재촉하다 / 권하다; 격려하다","f":1,"i":"등을 세게 떠밀며(urge=압박하다) 어서 하라고 몰아붙임. 강하게 재촉·권함. 명사면 속에서 치미는 충동."},{"w":"vulnerable","p":"a.","m":"상처받기 쉬운, 저항력이 없는 / 취약한","f":1,"i":"갑옷 틈으로 상처(vulner상처)가 그대로 뚫려 들어올 수 있는 무방비 상태. 공격에 약한 취약함. (문어)"},{"w":"warranty","p":"n.","m":"보증, 보증서 / 보충","f":1,"i":"'문제 생기면 내가 책임진다'고 판매자가 걸어둔 보증. 물건 뒤에 붙은 보증서."},{"w":"attempt","p":"n.","m":"시도 / 시도하다","f":1,"i":"손을 뻗어 될지 안 될지 시험 삼아(tempt시도하다, tempt) 해봄. 결과 불확실한 시도."},{"w":"flexible","p":"a.","m":"구부리기 쉬운, 유연성 있는 / 구부리기 쉬운; 탄력적인 / 유동적인","f":1,"i":"손으로 구부려도 부러지지 않고 휘었다 돌아오는 나뭇가지 (flex구부리다 + -ible될수있는). 몸이든 일정이든 딱딱하지 않고 상황에 맞춰 휘어짐."},{"w":"fusion","p":"n.","m":"융합","f":1,"i":"두 금속을 불에 녹여 경계가 사라지고 한 덩어리로 흘러 붙음 (fus녹아흐르다). 그래서 융합 — 원래 둘이던 게 녹아 하나 됨."},{"w":"host","p":"v.","m":"주최하다 / 개최하다","f":1,"i":"손님을 자기 집에 들여 상 차려 대접하는 집주인. 그 집주인 노릇을 행사·대회에 하면 주최하다."},{"w":"inspire","p":"v.","m":"영감을 주다","f":1,"i":"누군가의 마음속으로 숨을 훅 불어넣어 불씨를 지핌 (in-안으로 + spire숨쉬다). 그 입김에 없던 의욕·아이디어가 살아남."},{"w":"interpret","p":"v.","m":"해석하다, 번역하다 / 해석하다","f":1,"i":"두 사람 사이에 서서 한쪽 말을 받아 다른 쪽이 알아듣게 넘겨줌 (inter-사이에). 언어 사이면 통역, 의미 사이면 해석."},{"w":"presence","p":"n.","m":"존재, 출석 / 존재, 주둔","f":1,"i":"지금 이 자리에 실체가 딱 버티고 있음 (pre-앞에 + ess있다). 그 자리에 있다는 사실, 나아가 뿜어져 나오는 존재감."},{"w":"abruptly","p":"adv.","m":"갑자기, 불시에 / 갑자기","f":1,"i":"매끈히 가던 길이 절벽처럼 뚝 끊겨 훅 꺾임 (ab-떨어져 + rupt깨지다). 예고 없이 갑자기."},{"w":"charity","p":"n.","m":"자선 행사 / 자선 단체","f":1,"i":"가진 자가 못 가진 이에게 따뜻하게 손을 펴 나눠줌 (car소중히여김). 그 마음이 모이면 자선·자선단체."},{"w":"drastic","p":"a.","m":"대담한, 맹렬한 / 급격한","f":1,"i":"미지근한 조치가 아니라 살을 도려내듯 확 뒤집는 극약처방. 그래서 급격한·과감한."},{"w":"ensure","p":"v.","m":"확실하게 하다, 보증하다 / 확보하다, 보증하다","f":1,"i":"결과가 새어나가지 않게 확실히 못박아 안심 상태로 만듦 (en-되게하다 + sure확실). 헷갈림: ensure(확실히)/insure(보험)/assure(사람안심)."},{"w":"import","p":"v.","m":"수입하다","f":1,"i":"외국의 물건을 배에 실어 우리 항구 안으로 나름 (im-안으로 + port나르다). 반대는 export(밖으로). 참고 important는 '무게있게 안으로 들어옴'."},{"w":"participant","p":"n.","m":"참가자","f":1,"i":"한 부분을 손에 쥐고 자리에 끼어든 사람 (part부분 + cip잡다). 구경꾼이 아니라 몫을 잡고 들어온 참가자."},{"w":"arrogant","p":"a.","m":"건방진, 교만한 / 거만한","f":1,"i":"자기 권리를 남 앞에 척 내세우며 콧대 높이 쳐든 자세 (ad-쪽으로 + rog요구하다). 그래서 거만한."},{"w":"breed","p":"v.","m":"(새끼를) 낳다, 양육하다 / 알을 낳다, 번식하다","f":1,"i":"따뜻한 둥지에서 알을 품어 새끼를 까고 대를 이어감. 동물이 새끼치기, 확장하면 갈등 등을 낳다."},{"w":"expose","p":"v.","m":"드러내다, 노출시키다 / 드러내다","f":1,"i":"덮개를 걷어 안에 있던 것을 밖에 그대로 내놓음 (ex-밖으로 + pos놓다). 살갗을 햇빛에, 비밀을 세상에 노출."},{"w":"impress","p":"v.","m":"인상을 주다, 감동시키다 / 감명을 주다","f":1,"i":"도장을 마음 위에 꾹 눌러 자국을 새겨넣음 (im-안으로 + press누르다). 그 눌린 자국이 인상·감명."},{"w":"instinct","p":"n.","m":"본능","f":1,"i":"배우지 않았는데 몸 안에서 콱 찌르듯 튀어나오는 행동 충동 (in-안 + stinct찌르다). 그래서 본능."},{"w":"suitable","p":"a.","m":"적당한, 적절한 ":"갖다 놓다","f":0,"i":"가던 길에 짐이나 사람을 툭 떨어뜨려 내려놓고 그냥 감. 갖다 놓다, 내려주다."},{"w":"somehow","p":"","m":"어떻게든","f":0,"i":"길이 안 보이는데도 어떻게든 손을 더듬어 방법을 찾아내는 느낌. 방식은 불분명하지만 어쨌든 '어떻게든'."},{"w":"cause","p":"","m":"목적, 이유","f":0,"i":"사건들을 밀어 굴러가게 만든 최초의 손 — 결과의 뿌리. 그 '뿌리'가 확장돼 사람들이 목숨 거는 '대의·명분(the cause)'도 됨."},{"w":"degree","p":"n.","m":"학위","f":0,"i":"계단을 한 칸씩 밟아 내려간 눈금 (de-아래로 + gree걸음grade). 온도·각도의 '도', 한 단계씩 올라간 '학위·정도'."},{"w":"certainly","p":"","m":"확실히","f":0,"i":"흔들림 없이 딱 걸러져 확정된 상태 (cert=거르다·판가름 나다, 체로 걸러 확실해짐). 조금의 의심도 없이 '확실히'."},{"w":"eventually","p":"ad.","m":"결국은 / 결국","f":0,"i":"여러 사건(event)들이 줄줄이 지나간 맨 끝에 마침내 도착하는 지점. 우여곡절 끝에 '결국은'."},{"w":"opportunity","p":"","m":"기회","f":0,"i":"순풍이 항구(port) 입구를 향해 딱 불어와 배가 들어갈 수 있는 그 짧은 창 (ob/op-쪽으로 + port항구). 놓치면 닫히는 '기회'."},{"w":"in person","p":"","m":"직접","f":0,"i":"화면·전화·대리인 말고 그 사람의 몸뚱이 자체가 그 자리에 딱 있음. '직접, 몸소'."},{"w":"client","p":"","m":"고객 / 의뢰인","f":0,"i":"몸을 기울여(clin기울다) 전문가에게 기대며 도움을 청하는 사람. 변호사·회계사에게 의뢰하는 '의뢰인, 고객'."},{"w":"regret","p":"v.","m":"후회하다, 유감으로 여기다 / 유감으로 여기다 / 유감으로 생각하다","f":0,"i":"지나간 일을 되짚으며 마음이 다시 뒤로 끌려가 울컥 아파오는 느낌 (re-뒤로 + gret울다·탄식). '후회하다, 유감이다'."},{"w":"finance","p":"n.","m":"재정 / 금융, 재정","f":0,"i":"빚을 다 갚아 장부를 딱 마감(fin=끝)짓고 돈줄을 정산하는 그림. 돈의 흐름을 끝맺고 관리하는 '재정, 금융'."},{"w":"aware of","p":"","m":"~을 알고 있는","f":0,"i":"레이더가 켜져 주변의 뭔가를 딱 포착해 경계하는 상태 (ware=지켜보다, beware와 한뿌리). '~을 알아채고 있는'."},{"w":"article","p":"n.","m":"기사 / 기사, 글 / 논설, 기사","f":0,"i":"하나의 관절(art=마디)처럼 딱 떨어지는 독립된 한 토막. 신문의 한 '기사', 조항의 한 '조', a/the 같은 '관사'."},{"w":"publish","p":"","m":"출판하다, 간행하다 / 출판하다","f":0,"i":"안에 담겨있던 것을 대중(publ=people) 앞에 확 밖으로 내놓아 공개함. 책·글을 '출판·공표하다'."},{"w":"under warranty","p":"","m":"보증 기간 중인","f":0,"i":"제품이 아직 보증(warranty)이라는 우산 아래 덮여 보호받는 기간. '보증 기간 중인'."},{"w":"keep up with","p":"","m":"~을 유지하다","f":0,"i":"앞서가는 사람 등을 놓치지 않게 나란히 속도를 맞춰 따라붙음. 뒤처지지 않고 흐름·유행·소식을 계속 좇음."},{"w":"garage","p":"","m":"차고","f":0,"i":"차를 넣어두는 지붕 있는 칸 — 특별한 감각 이미지 없음, 뜻 그대로 '차고·정비소'. (프랑스어 유래, 강세 g에 붙음)"},{"w":"stackable","p":"","m":"쌓을 수 있 p":"n.","m":"임원, 경영진 / 경영 간부, 중역, 임원, 이사","f":0,"i":"일을 끝까지 밀어붙여 실행해 완수하는(ex-밖으로 + secut따라가다) 사람. 결정을 집행하는 '임원, 경영진'."},{"w":"valuable","p":"","m":"귀중한, 가치 있는","f":0,"i":"값(value)이 묵직하게 매겨져 함부로 못 버리는 것. '귀중한, 가치 있는'."},{"w":"corruption","p":"","m":"부패","f":0,"i":"속이 완전히(cor=com-강조) 깨지고 썩어 문드러짐 (rupt깨지다·터지다). 권력·도덕이 안에서 곪은 '부패'."},{"w":"hire","p":"v.","m":"고용하다","f":0,"i":"돈을 쥐여주고 남의 손·시간을 잠시 빌려 씀. 사람을 '고용하다', 물건을 '빌리다'."},{"w":"illegal","p":"a.","m":"불법적인 / 불법의, 위법의, 비합법적인","f":0,"i":"법(leg)의 선을 넘어 밖으로 삐져나감 (il-=in-부정). '불법의, 위법의'."},{"w":"look for","p":"","m":"찾다","f":0,"i":"뭔가를 향해(for) 시선을 뻗어 두리번거리며 뒤짐. '~을 찾다'."},{"w":"realistic","p":"","m":"사실적인, 현실적인","f":0,"i":"허황된 꿈 대신 실제(real) 현실의 땅을 밟고 판단하는 눈. '현실적인', 그림이 실물처럼 '사실적인'."},{"w":"expect","p":"","m":"예상하다, 기대하다","f":0,"i":"목을 빼고 밖을 내다보며(ex-밖으로 + spect보다) 올 것을 기다림. '예상하다, 기대하다'."},{"w":"favorable","p":"","m":"호의적인","f":0,"i":"상대에게 마음을 기울여 호의(favor)의 바람을 등 뒤에서 불어줌. '호의적인, 유리한'."},{"w":"critic","p":"n.","m":"비평가","f":0,"i":"칼로 옥석을 갈라(cri=가르다·판별, crisis와 한뿌리) 좋고 나쁨을 판정하는 사람. '비평가'. (-cism은 비평, -que는 평론)"},{"w":"bracelet","p":"","m":"팔찌","f":0,"i":"손목(brac=팔)을 감싸 도는 작은 고리 장식. 특별한 감각 이미지 없음 — 뜻 그대로 '팔찌'."},{"w":"check","p":"","m":"수표","f":0,"i":"왕을 몰아세워 '장군!' 멈춰 세우듯, 흐름을 딱 멈춰 확인·저지함. 그 '멈춰 확인' 감각이 확인·점검·저지, 그리고 돈을 멈춰 지정하는 '수표'로 뻗음."},{"w":"limited","p":"","m":"제한된","f":0,"i":"문지방(limit=문턱·경계) 선을 넘지 못하게 딱 그어놓은 상태. '제한된, 한정된'."},{"w":"pleasant","p":"","m":"즐거운","f":0,"i":"마주한 사람의 마음을 부드럽게 어루만져 기분 좋게 하는(plea=please기쁘게) 느낌. 날씨·사람이 '유쾌한, 쾌적한'."},{"w":"restrictive","p":"","m":"구속하는, 제한적인","f":0,"i":"밧줄로 뒤에서 꽉 조여(re-뒤로 + strict조이다) 못 움직이게 함. '제한하는, 구속적인'."},{"w":"fortunate","p":"","m":"운이 좋은","f":0,"i":"운명(fortune)의 수레바퀴가 마침 내 쪽으로 좋게 굴러온 상태. '운이 좋은'. (lucky의 격식체)"},{"w":"brief","p":"","m":"간략한, 짧은","f":0,"i":"길게 늘어질 것을 짧게 뚝 잘라낸(brief=짧은, abbreviate와 한뿌리) 상태. 시간·글이 '간략한, 짧은'. 명사로는 요약 서류."},{"w":"military","p":"","m":"군사의, 군용의 / 군용의, 군사의; 군대","f":0,"i":"무기를 든 병사(milit=군인)들이 대열지어 선 집단. '군사의, 군용의; 군대'."},{"w":"abandon","p":"v.", ,"i":"남에게 진 것을 아직 갚지 못해 등에 얹혀 있는 무게. 갚아야 할 빚·부채."},{"w":"merge","p":"v.","m":"합병하다, 병합하다","f":0,"i":"두 물줄기가 하나로 잠겨 섞여 한 흐름이 됨 (merg잠기다). 회사끼리 합병."},{"w":"aggressive","p":"a.","m":"공격적인, 적극적인 / 공격적인","f":0,"i":"상대를 향해 발을 성큼 내디디며 밀고 들어감 (ag-쪽으로 + gress걷다). 공격적인, (좋게는) 적극적인."},{"w":"nutritious","p":"a.","m":"영양가가 높은 / 영양분이 풍부한","f":0,"i":"먹으면 몸을 든든히 길러 살찌우는 영양이 꽉 찬 (nutri기르다). 영양가 높은."},{"w":"conventional","p":"","m":"기존의, 전통적인","f":0,"i":"사람들이 함께 모여(con-ven-) 관례로 굳힌 틀. 다들 따르는 기존의·전통적인 방식."},{"w":"measure","p":"","m":"측정하다","f":0,"i":"자를 대고 크기를 재어 값으로 매김 (mens재다). 측정하다; 명사로는 조치·척도."},{"w":"significant","p":"a.","m":"중요한; 의미 있는 / 주목할 만한, 중요한, 의미있는","f":0,"i":"그냥 지나칠 게 아니라 신호(sign)를 보내 의미를 만들어내는 (sign표시 + fic만들다). 중요한, 의미 있는."},{"w":"premium","p":"n.","m":"높은 금액, 할증금 / 할부금, 상여금, 보험료 a. 고급의 / 고급의","f":0,"i":"남보다 먼저(pre-) 값을 얹어 집는 웃돈. 그래서 할증금·보험료, 형용사로는 고급의."},{"w":"shelter","p":"","m":"집, 피난처","f":0,"i":"비바람을 지붕으로 막아 몸을 가려주는 은신처. 피난처, 보금자리."},{"w":"transportation","p":"n.","m":"교통수단, 수송 기관 / 수송, 운송","f":0,"i":"짐을 이쪽에서 저쪽으로 가로질러 실어 나름 (trans-가로질러 + port나르다). 수송·교통수단."},{"w":"insufficient","p":"","m":"불충분한, 부족한","f":0,"i":"밑에서 채워 올려도(suffic) 선에 못 미쳐(in-부정) 모자란. 불충분한, 부족한."},{"w":"adequate","p":"","m":"충분한 / 알맞은, 충분한","f":0,"i":"요구되는 만큼에 딱 맞춰(ad-쪽으로 + equ같게) 수평이 맞음. 부족하지도 넘치지도 않게 충분한."},{"w":"drop out","p":"","m":"중퇴하다, 낙오하다","f":0,"i":"대열·과정에서 아래로 떨어져(drop) 밖으로(out) 빠져나옴. 중퇴·낙오하다."},{"w":"remarkable","p":"a.","m":"주목할 만한","f":0,"i":"다시(re-) 눈길이 되돌아가 표시(mark)를 남길 만큼 도드라짐. 주목할 만한, 놀라운."},{"w":"focus on","p":"","m":"~에 초점을 맞추다","f":0,"i":"흩어진 빛을 한 점으로 모아 태우듯 시선을 한곳에 모음. ~에 초점을 맞추다."},{"w":"varied","p":"","m":"다양한, 다채로운","f":0,"i":"하나가 여러 모습으로 이리저리 변해 갈라진 (vari변하다). 다양한, 다채로운."},{"w":"consist of","p":"","m":"~로 구성되다","f":0,"i":"여러 부품이 함께 서서(stand) 하나의 덩어리를 이룸 (con-함께 + sist서다). 'A는 B들로 서 있다'→구성되다."},{"w":"element","p":"n.","m":"요소; 성분 / 요소","f":0,"i":"더는 쪼갤 수 없는 밑바탕 낱조각. 전체를 이루는 기본 요소·성분."},{"w":"gender","p":"n.","m":"성별","f":0,"i":"태어난 갈래(gen낳다)로 나뉜 남·여의 구분. 성별."},{"w":"variation","p":"n.","m":"변화 / 변화, 변동","f":0,"i":"본래 모습에서 이리저리 방향을 틀어 달라진 변형 (vari변하다). 변화, 변동."},{"w":"resort","p":"","m":"휴양지","f":0,"i":"다른 데가 막히면 다시(re-) 발길을 돌려(sort나가다) 찾아가는 곳. 마지막 수단, 또 즐겨 찾는 휴양지."},{"w":"exclusive","p":"a.","m":"전용의, 배타적인 / 유일한, 독점적인","f":0,"i":"문을 잠가 남을 밖으로 밀어 닫아버림 (ex-밖으로 + clus닫다). 배타적인, 그래서 나만 쓰는 전용·독점."},{"w":"equality","p":"n.","m":"평등","f":0,"i":"저울 양쪽이 똑같이(equ같은) 수평을 이룬 상태. 평등."},{"w":"deny","p":"","m":"(줄 것을) 주지 않다; 부정하다","f":0,"i":"상대가 내민 것을 '아니다(ne-)'라며 손으로 밀쳐 안 받음 (de-분리 + ny아니). 사실을 부인하거나 요청을 거부."},{"w":"prejudice","p":"","m":"편견","f":0,"i":"제대로 보기도 전에(pre-먼저) 미리 판결(judice재판)을 내려버림. 앞서 굳어버린 편견."},{"w":"tolerance","p":"","m":"관용","f":0,"i":"거슬리는 것을 밀어내지 않고 내 안에 견디며 담아둠 (toler견디다). 남의 다름을 참고 받아들이면 관용, 기계·약이 버텨내는 범위면 허용오차·내성."},{"w":"flood","p":"v.","m":"홍수 / 범람하다, 홍수가 나다 n. 홍수","f":0,"i":"둑을 넘어 물이 사방으로 흘러넘쳐 온 땅을 덮어버림. 그 이미지가 은유로 번져 '주문이 밀려들다', '눈물이 쏟아지다'처럼 감당 못 할 만큼 쏟아짐도 flood."},{"w":"rescue","p":"","m":"구조하다","f":0,"i":"위험 속에 갇힌 사람을 낚아채 밖으로 확 빼내옴. 불·물·손아귀에서 잡아당겨 끌어내는 급박한 구출의 그림."},{"w":"resident","p":"n.","m":"주민 / 거주자","f":0,"i":"한곳에 눌러앉아 계속 머무는 사람 (re-계속 + sid앉다). 잠깐 들르는 방문자가 아니라 그 자리에 자리 잡고 사는 거주자."},{"w":"alert","p":"v.","m":"경고하다 / 경고하다, 주의하다 n. 경보, 경계 태세 / 알림","f":0,"i":"귀를 쫑긋 세우고 눈 크게 뜬 채 위험에 대비하는 팽팽한 긴장 상태. 그 긴장을 남에게 쏘아 보내면 '경고하다', 상태 자체면 '경계 태세'."},{"w":"recently","p":"","m":"최근에","f":0,"i":"지금에서 시간을 살짝 뒤로 되감으면 바로 닿는 가까운 과거. '얼마 전'이라는 손 뻗으면 닿을 거리감."},{"w":"victim","p":"n.","m":"희생자 / 희생자, 피해자 / 피해자, 희생자","f":0,"i":"제단에 바쳐진 제물처럼, 남의 힘·재난에 일방적으로 당해 쓰러진 사람. 스스로 원한 게 아니라 당한 쪽이라는 게 핵심."},{"w":"trap","p":"","m":"거두다, 덫으로 잡다","f":0,"i":"먹잇감이 밟는 순간 철컥 닫혀 빠져나갈 수 없게 가두는 덫. 그 닫힘의 이미지가 '함정에 빠뜨리다', '옴짝달싹 못 하게 가두다'로 확장."},{"w":"tomb","p":"","m":"무덤","f":0,"i":"땅속에 시신을 넣고 돌로 봉해 닫은 무덤방. 특별한 감각 이미지 없음 — 뜻 그대로 (grave보다 크고 격식 있는 무덤·묘실)."},{"w":"tenant","p":"","m":"거주자, 주민","f":0,"i":"남의 건물을 붙잡고 세 들어 사는 사람 (ten붙잡다). 소유가 아니라 빌려서 점유한다는 게 핵심 — 세입자."},{"w":"due to","p":"","m":"~때문에","f":0,"i":"저울이 '이 원인 쪽'으로 정확히 기울어 값을 치러야 할 몫이 정해짐 (due 마땅히 치를). 결과가 어느 원인에 '달려 있다'는 지목."},{"w":"habitat","p":"n.","m":"서식지","f":0,"i":"그 생물이 늘 습관처럼 머물며 사는 자리 (habit살다). 특정 동식물에게 딱 맞는 자연 거주 공간."},{"w":"replant","p":"","m":"다시 심다; 옮겨 심다","f":0,"i":"뽑은 것을 다시 흙에 꽂아 넣음 (re-다시 + plant심다). 같은 자리에 다시 심거나, 뿌리째 옮겨 다른 곳에 심음."},{"w":"reproduce","p":"","m":"번식하다","f":0,"i":"이미 있는 것을 되풀이해 또 만들어냄 (re-다시 + produce생산). 생물이 자기 복제로 새끼를 치면 번식, 그림·소리를 똑같이 다시 찍어내면 복제·재생."},{"w":"theme","p":"","m":"주제","f":0,"i":"여러 갈래를 하나로 꿰는 밑바탕 실 — 곡·글·행사 전체를 관통하는 중심 가락. 표면 소재가 아니라 밑을 관통하는 주제."},{"w":"relevant","p":"","m":"관련된","f":0,"i":"지금 다루는 것과 보이지 않는 끈으로 팽팽히 이어져 딸려 나옴 (re-+lev들어올리다). 끈이 걸려 있으면 관련됨, 끊겨 따로 놀면 무관함."},{"w":"obligation","p":"n.","m":"의무","f":0,"i":"보이지 않는 끈으로 나를 그 일에 꽁꽁 묶어놓아 벗어날 수 없게 함 (ob-맞서 + lig묶다). 안 하면 안 되게 묶인 의무."},{"w":"fascinated","p":"","m":"매료된","f":0,"i":"마법에 걸린 듯 눈을 못 떼고 그 자리에 붙들려버린 상태 (fascin홀리다). 단순 관심이 아니라 넋 놓고 빨려든 매혹."},{"w":"struggle","p":"v.","m":"고군분투하다, 애쓰다 / 싸우다, 분투하다","f":0,"i":"빠져나오려 온몸을 비틀고 버둥거리며 힘겹게 몸부림침. 상대와 맞붙어 싸우거나, 어려움 속에서 안간힘 쓰며 발버둥."},{"w":"widespread","p":"","m":"광범위한, 널리 퍼진","f":0,"i":"손바닥을 활짝 펴 넓게 벌리듯, 넓은 면적에 고루 쫙 펼쳐져 퍼짐 (wide넓게 + spread펼치다). 한 점이 아니라 전방위로 번진 상태."},{"w":"gather","p":"","m":"모이다 / 모으다","f":0,"i":"흩어져 있던 것들을 한 지점으로 그러모아 한데 뭉침. 사람이 모이거나 물건·정보를 긁어모으는 수렴의 그림."},{"w":"attendee","p":"","m":"참석자, 출석자","f":0,"i":"그 자리에 몸을 두고 마음을 향해 '참석당하는' 쪽의 사람 (attend참석 + -ee받는이). 행사에 와 있는 참가자."},{"w":"organizer","p":"","m":"주최자","f":0,"i":"흩어진 사람·일정을 부위별로 짜맞춰 하나의 몸통(organ)으로 굴러가게 만드는 사람. 판을 짜고 굴리는 주최자."},{"w":"agriculture","p":"n.","m":"농업","f":0,"i":"밭(agri)을 갈고 돌보아(culture) 작물을 길러내는 일. 땅을 경작해 먹을 것을 키우는 농업. 특별한 비유 없음 — 어근 그대로."},{"w":"collapse","p":"v.","m":"무너지다 n. 붕괴 / 붕괴","f":0,"i":"지지대가 무너져 위 구조물이 함께 와르르 안쪽으로 주저앉음 (col-함께 + laps무너지다). 건물·조직·건강이 한꺼번에 폭삭 붕괴."},{"w":"combat","p":"v.","m":"싸우다","f":0,"i":"서로 맞부딪쳐 정면으로 치고받음 (com-함께 + bat때리다). 물리적 전투뿐 아니라 질병·부패 같은 것에 맞서 싸울 때도 combat."},{"w":"destination","p":"n.","m":"목적지","f":0,"i":"출발한 발걸음이 최종적으로 콱 못 박혀 멈추는 지점 (de-완전히 + stin세우다·고정). 향해 가는 길의 끝, 목적지."},{"w":"effect","p":"n.","m":"효과 / 영향, 효과","f":0,"i":"안에서 밖으로 튀어나와 실제로 만들어진 결과물 (ef-밖으로 + fect만들다). 원인이 밀어내어 세상에 나타난 효과·영향."},{"w":"effective","p":"a.","m":"효과적인 / 효과가 있는, 효과적인","f":0,"i":"원인이 밖으로 밀어내 실제 결과를 확실히 만들어내는 (ef-밖 + fect만들다). 헛돌지 않고 결과로 이어지는 효과적인."},{"w":"founder","p":"n.","m":"설립자 / 설립자, 창시자","f":0,"i":"건물의 바닥(found토대)을 처음 다져 세운 사람. 맨 밑돌을 놓아 조직을 처음 일으킨 설립자·창시자."},{"w":"generation","p":"n.","m":"세대","f":0,"i":"같은 시기에 한꺼번에 태어나(gen낳다) 함께 자라는 사람들의 한 무리·층. 부모-자식으로 층층이 쌓이는 세대."},{"w":"illustrate","p":"v.","m":"설명하다","f":0,"i":"어두운 개념 위에 빛(lustr빛)을 비춰 또렷이 드러내 보여줌 (il-안으로 + lustr빛). 예·그림으로 환히 밝혀 설명함."},{"w":"passport","p":"n.","m":"여권","f":0,"i":"국경 항구(port)를 통과(pass)하도록 허락하는 증표. 문을 지나가게 해주는 통행 서류 — 여권. 어근 그대로."},{"w":"persuade","p":"v.","m":"설득하다 / 납득시키다; 설득하다","f":0,"i":"상대의 마음속을 끝까지 파고들어 달콤하게 밀어붙여 내 쪽으로 움직임 (per-끝까지 + suad권하다). 강요가 아니라 스며들어 설득."},{"w":"poverty","p":"n.","m":"빈곤, 가난 / 가난","f":0,"i":"손에 쥔 게 텅 비어 아무것도 없는 헐벗은 상태 (pover가난). 물질이 바닥나 부족한 빈곤."},{"w":"refund","p":"v.","m":"환불하다 n. 환불 / 환불 / 환불하다","f":0,"i":"받았던 돈을 근원(fund)으로 도로 부어 되돌려줌 (re-뒤로 + fund붓다·기금). 낸 값을 원래 낸 사람에게 되돌리는 환불."},{"w":"resign","p":"v.","m":"사직하다, 사임하다 / 사임하다","f":0,"i":"이미 서명(sign)한 자리를 도로 무르고 손 떼며 물러남 (re-뒤로 + sign서명). 도장을 거두고 직에서 내려오는 사임."},{"w":"resistance","p":"n.","m":"저항, 반대 / 내성, 저항","f":0,"i":"밀려오는 힘에 맞서 그 자리에 버티고 서서 안 밀림 (re-맞서 + sist서다). 힘에 대드는 저항, 약·병에 안 지는 내성."},{"w":"territory","p":"n.","m":"영토, 영역 / 영역, 영토","f":0,"i":"말뚝 박아 '여기부터 여긴 내 땅'이라 금 그은 흙(terr땅) 구역. 짐승·국가·부서가 지키는 세력 범위·영토."},{"w":"violate","p":"v.","m":"어기다, 위반하다","f":0,"i":"울타리·선을 힘으로 짓밟고 넘어 안을 침범함 (viol폭력·짓밟다). 법·약속·경계를 거칠게 깨뜨려 어김."},{"w":"canal","p":"n.","m":"운하, 수로 / 운하, 인공 수로","f":0,"i":"땅을 길게 파서 물을 흐르게 만든 인공 수로. 특별한 감각 이미지 없음 — 뜻 그대로 (자연 강이 아니라 사람이 판 물길)."},{"w":"conclusion","p":"n.","m":"결론","f":0,"i":"논의의 문을 함께 닫아 딱 봉해버리는 마지막 매듭 (con-함께 + clus닫다). 열려 있던 이야기를 닫는 결론."},{"w":"negotiate","p":"v.","m":"협상하다","f":0,"i":"서로 밀고 당기며 조건을 주고받아 접점을 찾음 (neg-아니 + oti여유·한가함 = 한가하지 않은 거래 일). 이해가 엇갈린 둘이 합의로 좁혀가는 협상."},{"w":"observe","p":"v.","m":"목격하다, 관찰하다 / 관찰하다","f":0,"i":"대상에서 눈을 떼지 않고 앞에 딱 붙잡아두고 계속 지켜봄 (ob-앞에 + serv지키다). 그냥 보는 게 아니라 주의 깊게 관찰·준수."},{"w":"patrol","p":"v.","m":"순찰하다, 순시하다, 순회하다 / 순찰하다; 순찰대","f":0,"i":"정해진 구역을 발로 밟아(patr밟다) 빙빙 돌며 이상 없나 살핌. 왔던 길을 반복해 도는 순찰의 그림."},{"w":"propose","p":"v.","m":"제안하다, 제출하다 / 제안하다","f":0,"i":"상대 앞에 내 생각을 탁 내놓아 앞으로 밀어 보임 (pro-앞으로 + pos놓다). 검토하라고 앞에 놓는 제안."},{"w":"reward","p":"n.","m":"보수 / 보상하다","f":0,"i":"잘한 행동을 눈여겨보고(ward지켜봄) 그에 되갚아(re-) 되돌려주는 것. 수고에 값하는 보상."},{"w":"seasonal","p":"a.","m":"주기적인, 정기적인, 계절의 / 계절에 따른","f":0,"i":"계절이 돌 때마다 딱 그 철에만 나타났다 사라지는 리듬을 탐. 봄·여름·겨울에 맞춰 오르내리는 계절성."},{"w":"stamp","p":"v.","m":"도장을 찍다 / 우표","f":0,"i":"발을 쿵 굴러 찍듯, 힘주어 눌러 자국을 콱 박음 (stamp짓밟다·찍다). 도장·발자국을 찍는 눌러 새김. 우표도 종이에 눌러 붙이는 도장."},{"w":"tremendous","p":"a.","m":"거대한, 엄청난, 엄청나게 큰 / 아주 멋있는","f":0,"i":"보는 사람이 몸을 떨(trem떨다) 정도로 압도적으로 거대함. 원래 '무서워 떨리는'에서 나와, 규모가 엄청난·굉장한으로 확장."},{"w":"coordinate","p":"a.","m":"동등한, 동격의 / 통합하다","f":0,"i":"여러 것을 같은 등급(ordin순서)으로 나란히 함께 맞춰 어긋남 없이 굴림 (co-함께 + ordin질서). 손발을 맞추는 조율."},{"w":"department","p":"n.","m":"(행정 조직의) 부서, 학과 / 부서","f":0,"i":"전체에서 따로 떼어내(de-분리 + part부분) 나눠놓은 한 부분·구획. 조직 안에서 갈라놓은 부서·학과."},{"w":"detect","p":"v.","m":"발견하다, 인지하다 / 발견하다, 탐지하다","f":0,"i":"덮여 가려진 것의 지붕을 벗겨(de-제거 + teg덮다) 숨은 것을 들춰냄. 안 보이던 것을 찾아 탐지·발견."},{"w":"escape","p":"v.","m":"탈출하다 / 벗어나다","f":0,"i":"망토(cape)를 벗어 던지듯 붙잡힌 상태에서 빠져나옴 (es-밖으로 + cape망토). 손아귀·위험 밖으로 빠져나가는 탈출."},{"w":"indicate","p":"v.","m":"나타내다, 가리키다 / 표시하다, 나타내다","f":0,"i":"손가락을 들어 '저기다' 하고 콕 가리켜 보임 (in-향해 + dic말하다·가리키다). 방향·사실을 짚어 나타냄."},{"w":"modify","p":"v.","m":"수정하다, 조절하다 / 바꾸다, 변경하다","f":0,"i":"이미 있는 것의 틀(mod형태·척도)을 조금 손봐 다르게 만듦 (mod형태 + fy만들다). 통째로 바꾸는 게 아니라 부분 수정."},{"w":"positive","p":"a.","m":"호의적인, 긍정적인 / 긍정적인","f":0,"i":"'있다'고 확실히 놓아둔 상태 (pos놓다). 의심 없이 딱 박아 확신하거나, 밝은 쪽으로 놓인 긍정적. 검사에서 반응이 '나타남'도 양성."},{"w":"recommendation","p":"n.","m":"추천장, 추천 / 추천장","f":0,"i":"'이 사람 믿고 맡겨도 된다'며 남에게 되짚어 맡겨(re-+commend맡기다) 밀어주는 말·글. 추천서."},{"w":"regularly","p":"ad.","m":"정기적으로","f":0,"i":"자로 잰(regul자·규칙) 듯 일정한 간 ,"p":"","m":"수평선","f":0,"i":"하늘과 땅(바다)이 맞닿아 눈으로 볼 수 있는 가장 먼 경계선. 그 선 너머로 시야가 넓어지면 '시야·전망(horizons)'."},{"w":"response","p":"","m":"반응","f":0,"i":"누가 던진 것(질문·자극)에 되받아 다시 보내는 것 (re-다시·되받아 + spons응답). 자극을 받으면 튀어나오는 반응."},{"w":"influence","p":"","m":"영향을 끼치다","f":0,"i":"위에서 물이 스며 흘러들어와(in-안으로 + flu흐르다) 나도 모르게 물들어 감. 강압이 아니라 은근히 흘러들어 바꾸는 힘."},{"w":"expensive","p":"","m":"비싼","f":0,"i":"지갑에서 돈이 밖으로 왕창 흘러 빠져나감 (ex-밖으로 + pens달아 재다·쓰다). 값을 치르느라 돈이 크게 나가는 느낌."},{"w":"manufacturer","p":"","m":"제조업체, 제조업자","f":0,"i":"손(manu-손)으로 만들어(fac만들다) 물건을 찍어내는 주체 — 공장 돌려 대량으로 제조하는 업체·업자."},{"w":"discovery","p":"","m":"발견","f":0,"i":"덮여(cover) 있던 뚜껑을 확 걷어내(dis-흩어짐·제거) 숨어 있던 것이 드러남. 그 벗겨내는 순간이 발견."},{"w":"retired","p":"","m":"은퇴한","f":0,"i":"쓰던 사람이 일선에서 뒤로 물러나(re-뒤로 + tire끌어당기다) 빠진 상태. 현역 줄에서 스스로 뒤로 당겨 앉음."},{"w":"punish","p":"","m":"혹사하다 / 처벌하다","f":0,"i":"잘못한 자에게 대가를 매섭게 물림. 몸이 견디기 힘들 만큼 몰아붙이면 '혹사하다', 죄값으로 내리치면 '처벌하다'."},{"w":"book","p":"","m":"예약하다","f":0,"i":"장부(book)에 이름을 적어 그 자리를 내 것으로 못박음. 적어두면 남이 못 가져가니 곧 '예약하다'."},{"w":"incredibly","p":"","m":"대단히, 굉장히","f":0,"i":"믿을(cred믿다) 수 없을(in-부정) 정도라 입이 떡 벌어지는 지점. 도를 넘어 '대단히·굉장히'."},{"w":"annual","p":"","m":"연간의, 해마다의 / 연간의","f":0,"i":"지구가 태양을 한 바퀴 돌아 제자리에 오는 그 주기(ann해). 해마다 한 번씩 돌아오는 것."},{"w":"auditorium","p":"","m":"강당","f":0,"i":"많은 사람이 앉아 소리를 듣는(audi듣다) 큰 공간 — 무대 앞으로 좌석이 펼쳐진 강당·객석."},{"w":"correction","p":"","m":"교정, 수정","f":0,"i":"삐뚤어진 것을 다시 똑바로(cor-완전히 + rect곧은) 펴 맞춤. 틀린 데를 바로잡는 교정·수정."},{"w":"reality","p":"","m":"현실","f":0,"i":"머릿속 상상이 아니라 실제로(re사물·실체) 손에 만져지고 눈앞에 버티고 선 세계. 그냥 있는 그대로의 현실."},{"w":"rate","p":"","m":"요금 / 비율","f":0,"i":"일정 기준에 견줘 매겨진 비율·값 (한 단위당 얼마). 단위당 매긴 값이면 요금, 두 양의 비면 비율."},{"w":"medicine","p":"","m":"약","f":0,"i":"몸의 병을 고치려 삼키거나 바르는 것. 특별한 감각 이미지 없음 — 뜻 그대로 '약'."},{"w":"revise","p":"","m":"개정하다, 수정하다 / 수정하다","f":0,"i":"이미 쓴 것을 다시(re-다시) 눈으로 훑어보며(vis보다) 고쳐 다듬음. 다시 봐서 손보는 개정·수정."},{"w":"talented","p":"","m":"재능이 있는","f":0,"i":"타고난 재능(talent)이 몸에 장착된 상태. 남보다 잘하는 능력이 이미 갖춰져 있음."},{"w":"pass","p":"","m":"합격하다","f":0,"i":"가로막힌 관문을 통과해 반대편으로 빠져나감. 시험이라는 문을 넘어가면 '합격하다'."},{"w":"formally","p":"","m":"정식으로","f":0,"i":"정해진 틀(form형식)에 딱 맞춰, 격식 갖춰 공식적으로. 반대는 격식 없이 편하게 하는 것."},{"w":"casually","p":"","m":"약식으로; 우연히","f":0,"i":"격식 틀 없이 툭툭 편하게 — 우연히 스치듯. '약식으로', 또 '어쩌다 우연히'."},{"w":"lift","p":"","m":"들다, 들어올리다","f":0,"i":"무거운 것을 아래에서 위로 번쩍 들어 공중에 띄움. 아래→위로 끌어올리는 동작."},{"w":"straight","p":"","m":"곧장, 직접","f":0,"i":"휘거나 꺾이지 않고 한 방향으로 쭉 뻗은 선. 그 선을 따라가듯 '곧장·직접'."},{"w":"regular","p":"","m":"규칙적인, 정기적인 / 보통의, 통상의","f":0,"i":"자(reg-곧은 자·규칙)로 잰 듯 일정한 간격으로 반복됨. 규칙적·정기적, 또 튀지 않는 보통의."},{"w":"author","p":"","m":"작가, 저자 / 작가","f":0,"i":"글을 처음 지어낸 원천이 되는 사람 (auct-불려 키운 창시자). 작품을 낳은 저자·작가."},{"w":"breathing","p":"","m":"호흡","f":0,"i":"가슴이 부풀었다 꺼지며 공기가 들락날락하는 흐름. 숨을 들이쉬고 내쉬는 그 호흡."},{"w":"refrigerator","p":"","m":"냉장고","f":0,"i":"안을 다시(re-) 차갑게(frigor추위) 만들어 음식 상하지 않게 가둬두는 상자 — 냉장고."},{"w":"traffic","p":"","m":"교통량","f":0,"i":"길 위에 차·사람이 오가며 흐르는 양. 그 흐름이 빽빽하면 '교통량 많다'."},{"w":"decorate","p":"","m":"장식하다","f":0,"i":"밋밋한 것 위에 예쁜 것을 덧붙여 보기 좋게 꾸밈 (decor장식). 겉을 치장하는 것."},{"w":"seawall","p":"","m":"방파제","f":0,"i":"밀려드는 바닷물을 맞받아 막으려 쌓은 벽 (sea바다 + wall벽) — 방파제."},{"w":"neighborhood","p":"","m":"근처, 이웃","f":0,"i":"내 집 가까이(neigh-가까운) 이웃들이 옹기종기 모여 사는 동네 일대. 근처·이웃 동네."},{"w":"stair","p":"","m":"계단","f":0,"i":"한 칸씩 높이를 밟고 올라가게 만든 발판들 — 위아래를 잇는 계단."},{"w":"count","p":"","m":"수를 세다","f":0,"i":"손가락 하나씩 짚어가며 수를 하나·둘 세어 나감. 개수를 헤아리는 것."},{"w":"assist","p":"","m":"돕다, 원조하다","f":0,"i":"쓰러지려는 사람 곁에 딱 붙어 서서(as-쪽으로 + sist서다) 받쳐 줌. 옆에 서서 거드는 도움."},{"w":"put down","p":"","m":"~을 내려놓다","f":0,"i":"손에 들고 있던 것을 아래로 내려 바닥에 놓음. 들고 있던 걸 놓아 내려놓다."},{"w":"borrow","p":"","m":"빌리다","f":0,"i":"남의 것을 잠시 내 쪽으로 가져와 쓰고 나중에 돌려줌. 받아 쓰는 쪽."},{"w":"stay over","p":"","m":"하룻밤 묵다","f":0,"i":"그날 집에 안 돌아가고 남의 집에 눌러앉아(over-넘겨) 밤을 넘김 — 하룻밤 묵다."},{"w":"lend","p":"","m":"빌려 주다 / 빌려주다","f":0,"i":"내 것을 남의 쪽으로 잠시 건네주고 나중에 돌려받음. borrow의 반대 — 빌려주는 쪽."},{"w":"chemistry","p":"","m":"화학","f":0,"i":"물질을 쪼개고 섞어 무엇으로 이뤄졌나 파고드는 학문. 특별한 감각 이미지 없음 — 뜻 그대로 '화학'."},{"w":"cut short","p":"","m":"단축하다","f":0,"i":"길게 이어질 것을 중간에서 싹둑 잘라 짧게 끝냄. 예정보다 짧게 끊어 '단축하다'."},{"w":"architect","p":"","m":"건축가","f":0,"i":"건물의 큰 뼈대·설계를 총괄해 짜는 우두머리 장인 (archi-으뜸 + tect짓다) — 건축가."},{"w":"unfinished","p":"","m":"미완성인","f":0,"i":"끝(finish)까지 못 가고(un-부정) 중간에 멈춰 남겨진 상태 — 미완성."},{"w":"figure out","p":"","m":"~을 발견하다 / 을 알아내다","f":0,"i":"머릿속 흐릿하던 것의 윤곽(figure)이 또렷이 밖으로(out) 잡혀 나옴. 궁리 끝에 알아내다."},{"w":"willing","p":"","m":"기꺼이 ~하는","f":0,"i":"누가 시키기 전에 마음(will의지)이 먼저 그쪽으로 기울어 있음. 등 떠밀 필요 없이 기꺼이."},{"w":"thoughtful","p":"","m":"사려 깊은","f":0,"i":"생각(thought)이 가득 차(-ful) 남의 사정까지 미리 헤아림. 속 깊게 배려하는 사려 깊음."},{"w":"enter","p":"","m":"~에 들어가다","f":0,"i":"밖에 있다가 문지방을 넘어 안(enter-안으로) 공간으로 발을 들여놓음 — 들어가다."},{"w":"burning","p":"","m":"불타는","f":0,"i":"불길이 확 붙어 활활 타오르는 상태. 뜨겁게 타는 모습, 나아가 '타는 듯 간절한'."},{"w":"ideal","p":"","m":"이상적인 / 이상","f":0,"i":"머릿속 그림(idea)처럼 흠 하나 없이 딱 들어맞는 완벽한 상태. 현실 아닌 이상, 그런 이상적인."},{"w":"fight off","p":"","m":"격퇴하다","f":0,"i":"달려드는 적을 맞서 싸워(fight) 저 멀리 밀쳐내(off) 떨어뜨림 — 격퇴하다."},{"w":"in decline","p":"","m":"쇠퇴하여","f":0,"i":"정점에서 아래로(de-아래) 기울어(cline기울다) 내리막을 타는 중 — 쇠퇴하여."},{"w":"leading","p":"","m":"손꼽히는, 일류의","f":0,"i":"맨 앞에서 무리를 이끌고(lead) 나가는 위치 — 그래서 손꼽히는·일류의."},{"w":"light bulb","p":"","m":"백열 전구","f":0,"i":"유리 안에 필라멘트가 든 둥근 전구. 켜면 빛(light)이 확 들어옴 — 백열 전구."},{"w":"electric bill","p":"","m":"전기 요금","f":0,"i":"한 달간 쓴 전기(electric)를 돈으로 청구한 종이(bill) — 전기 요금 고지서."},{"w":"turn on","p":"","m":"~을 켜다","f":0,"i":"스위치를 딸깍 돌려(turn) 전류가 통하게 함 — (기기를) 켜다."},{"w":"turtle","p":"","m":"거북이","f":0,"i":"등에 딱딱한 껍데기를 지고 느릿느릿 기는 거북. 특별한 이미지 없음 — 뜻 그대로."},{"w":"spare time","p":"","m":"여가 시간","f":0,"i":"빽빽한 일정에서 남겨(spare-여분) 자유롭게 쓸 수 있는 틈새 시간 — 여가."},{"w":"manmade","p":"","m":"인공의","f":0,"i":"자연이 아니라 사람 손(man)으로 만들어낸(made) 것 — 인공의."},{"w":"waterway","p":"","m":"수로","f":0,"i":"물(water)이 지나다니게 낸 길(way) — 배가 다니는 수로·물길."},{"w":"trace","p":"","m":"(원인, 출처 등을) 밝혀내다","f":0,"i":"땅에 찍힌 발자국 선을 손끝으로 하나씩 되짚어 근원까지 따라감 (tract끌다). 흔적을 더듬어 추적, 얇게 남은 자취가 '미량'."},{"w":"adventurer","p":"","m":"모험가","f":0,"i":"위험 쪽으로(ad-쪽으로 + ven오다) 스스로 뛰어들어 미지를 찾아 나서는 사람 — 모험가."},{"w":"the Pacific Ocean","p":"","m":"태평양","f":0,"i":"지구에서 가장 넓은 바다, 태평양. Pacific은 '평온한(peaceful)'이란 뜻 — 마젤란이 잔잔한 그 물을 보고 붙인 이름. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"overall","p":"","m":"전반적으로, 종합적으로","f":0,"i":"옷 위에 통째로 뒤집어쓰는 작업복(overall)처럼, 부분들을 다 덮어 하나로 싸잡아 봄 (over-위에서 전체를 덮음). 그래서 '전반적으로, 종합해서'."},{"w":"personnel","p":"","m":"(총)직원; 사람들","f":0,"i":"한 조직 안에 배치된(personnel은 프랑스어에서 온 집합명사) 사람들 전체를 한 덩어리로 묶은 인력 명단. person과 달리 개인이 아니라 '인원 전체'. (강세도 뒤 -nel)."},{"w":"nationwide","p":"","m":"전국적인","f":0,"i":"한 나라(nation) 폭(wide)만큼 좌우로 쫙 펼쳐진 그림 — 전국 끝에서 끝까지 덮음. -wide는 '그 폭 전체에 걸쳐'."},{"w":"assume","p":"","m":"~라고 생각하다, 추측하다","f":0,"i":"증거 없이 '이럴 것'이라 미리 집어(sum잡다) 제 것으로 삼음 (as-쪽으로). 추정·가정, 또 책임·역할을 떠맡다."},{"w":"period","p":"","m":"기간, 시기","f":0,"i":"한 바퀴 빙 돌아 제자리로 돌아오는 원(peri-둘레 + hodos길) — 그 한 바퀴가 곧 하나의 기간·주기. 문장 끝 마침표(.)도 '여기서 한 바퀴 끝'이라 period."},{"w":"inhale","p":"","m":"흡입하다, 들이쉬다","f":0,"i":"숨을 몸 안으로 훅 빨아들임 (in-안으로 + hale숨쉬다). 반대는 exhale(밖으로 내쉼). 담배·냄새를 '들이마시다'에도."},{"w":"cactus","p":"","m":"선인장","f":0,"i":"사막에서 물을 꽉 품고 가시를 뻗은 통통한 선인장. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"adaption","p":"","m":"적응 형태, 적응 구조; 적응","f":0,"i":"환경에 맞게 몸·형태를 뜯어고쳐 딱 들어맞게 함 (ad-쪽으로 + apt맞다). adaptation의 축약형 — 생물이 환경에 맞춰 갖춘 적응 구조."},{"w":"outraged","p":"","m":"분개하는","f":0,"i":"속에서 분노(rage)가 밖으로(out-) 확 터져 나와 얼굴이 벌게진 상태. 단순히 화난 게 아니라 '어떻게 이럴 수가' 하고 치미는 격분."},{"w":"toughen","p":"","m":"강화하다","f":0,"i":"질기고 단단한(tough) 상태로 만듦 (-en 동사화). 가죽을 두드려 질기게 하듯, 규제·사람을 더 강하고 빡세게 만들다."},{"w":"lawmaker","p":"","m":"국회의원, 입법자","f":0,"i":"법(law)을 만드는(maker) 사람 — 그 자리에서 법을 찍어내는 국회의원. 뜻 그대로의 합성어, 특별한 이미지 없음."},{"w":"furry","p":"","m":"털이 있는","f":0,"i":"손으로 쓰다듬으면 폭신한 털(fur)이 잔뜩 덮인 감촉. 동물 인형처럼 털북숭이인 상태."},{"w":"break into","p":"","m":"침입하다","f":0,"i":"잠긴 문·경계를 부수고(break) 안으로(into) 밀고 들어감 — 도둑이 창을 깨고 침입하는 장면."},{"w":"track down","p":"","m":"~의 뒤를 쫓다","f":0,"i":"발자국(track)을 따라 끝까지 쫓아 결국 아래로(down) 몰아 잡아냄. 그냥 쫓는 게 아니라 '끝내 찾아내 붙잡음'까지."},{"w":"agent","p":"","m":"수사관, 대리인","f":0,"i":"누군가를 대신해 직접 움직여 일을 처리하는 사람 (ag행하다 + -ent하는 자). 그 '행동하는 대리자'가 수사관·대리인·중개인."},{"w":"constantly","p":"","m":"끊임없이","f":0,"i":"한자리에 딱 붙어 서서(con-함께 + sta서다) 멈추지 않고 계속됨 — 끊임없이. constant는 '변함없이 서 있는' 상태."},{"w":"consist","p":"","m":"이루어져 있다","f":0,"i":"여러 요소가 함께 나란히 서서(con-함께 + sist서다) 하나를 이룸. consist of ~로 '~로 구성되다'. 그 부품들이 서서 버텨 전체가 됨."},{"w":"insult","p":"","m":"모욕","f":0,"i":"상대에게 대놓고 확 뛰어들어(in-안으로 + sult뛰다) 자존심을 밟는 말·행동. 그 '위로 뛰어올라 짓밟는' 느낌이 모욕."},{"w":"put aside","p":"","m":"제쳐놓다","f":0,"i":"지금 안 쓸 것을 옆으로(aside) 슥 밀어 치워둠 — 문제를 잠시 제쳐두거나, 돈을 따로 떼어 모으다."},{"w":"typically","p":"","m":"전형적으로 / 대체로, 일반적으로","f":0,"i":"그 종류(type)의 딱 대표적인 본보기대로 — '전형적으로'. 또 '보통 이런 식이지' 하고 흔한 패턴을 가리켜 '대체로'."},{"w":"pronoun","p":"","m":"대명사","f":0,"i":"명사(noun) 대신(pro-대신·앞에) 그 자리에 세워두는 말 — he, it처럼 이름을 대신 세우는 대타. 그래서 대명사."},{"w":"formal","p":"","m":"공식적인","f":0,"i":"정해진 틀·형식(form)에 딱 맞춰 갖춰 입은 상태 — 격식 차린, 공식적인. 반대는 casual(편한)."},{"w":"scold","p":"","m":"꾸중하다","f":0,"i":"잘못한 사람에게 목소리를 높여 따갑게 몰아붙임 — 특히 어른이 아이를 야단치는 장면. 특별한 어원 이미지 없음."},{"w":"overuse","p":"","m":"남용","f":0,"i":"적정선을 넘어(over-) 지나치게 써버림 — 남용. over-가 '한도 초과'를 얹음."},{"w":"no longer","p":"","m":"더 이상 ~않다","f":0,"i":"이제 시간 길이(longer)가 더는 남지 않음 — 지금부터는 아님. '더 이상 ~않다'."},{"w":"unnecessary","p":"","m":"불필요한","f":0,"i":"꼭 있어야 할(necessary) 것이 아님 (un-부정) — 없어도 되는, 군더더기. necess-는 '피할 수 없는'."},{"w":"fellow","p":"","m":"동료의","f":0,"i":"같은 배·같은 처지에 함께 올라탄 사람 (원래 '돈을 함께 낸 동업자'). 그래서 동료의, 같은 편의. fellow workers처럼 앞에 붙음."},{"w":"mark","p":"","m":"표시하다","f":0,"i":"표면에 콕 눌러 남긴 자국·표시. 그 흔적을 남기는 동작이 '표시하다', 시험 점수를 매기는 것도 mark."},{"w":"thought","p":"","m":"사고, 생각","f":0,"i":"머릿속에서 think가 이미 한 번 굴러가 굳은 결과물 — 떠오른 생각·사고. think의 과거형이자 명사."},{"w":"modern","p":"","m":"현대적인 / 현대의","f":0,"i":"'바로 지금(라틴 modo-방금)'에 속한 — 옛것과 선을 긋고 최신에 발 딛은. 그래서 현대의, 현대적인."},{"w":"wisely","p":"","m":"현명하게","f":0,"i":"앞뒤를 훤히 내다보는 지혜(wise)로 판단해 행동함 — 현명하게. 손해 안 볼 선택을 하는 느낌."},{"w":"analyst","p":"","m":"분석가","f":0,"i":"얽힌 것을 낱낱이 풀어헤쳐(ana-따로 + lyein풀다) 뜯어보는 사람 — 분석가. 실을 한 올씩 풀듯 쪼갬."},{"w":"tool","p":"","m":"도구","f":0,"i":"손에 쥐고 일을 처리하는 도구·연장. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"chop","p":"","m":"(도끼, 식칼 등으로) 썰다","f":0,"i":"도끼·식칼을 위에서 아래로 '탁!' 내리쳐 툭툭 토막 냄. 그 짧고 강한 내리치는 동작이 chop."},{"w":"flint","p":"","m":"수석, 단단한 돌","f":0,"i":"부딪치면 불꽃이 튀는 단단하고 날카로운 부싯돌. 원시인이 이걸 깨서 칼날을 만들었다. 특별한 비유 없음 — 실물 그대로."},{"w":"axe","p":"","m":"도끼","f":0,"i":"긴 자루 끝에 무거운 쇠날이 달려, 휘둘러 나무를 쪼개는 도끼. 뜻 그대로."},{"w":"develop","p":"","m":"발달시키다","f":0,"i":"돌돌 말려 감춰진 것을 풀어헤쳐(de-반전 + velop감싸다) 속을 펼쳐 자라게 함. 그래서 발달시키다, 개발하다. envelop(감싸다)의 반대."},{"w":"bone","p":"","m":"뼈","f":0,"i":"몸을 안에서 받치는 딱딱한 흰 뼈. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"horn","p":"","m":"뿔","f":0,"i":"동물 머리에서 단단하게 솟은 뿔. 그 뾰족함에서 '경적(뿔피리)'까지 뻗음. 실물 그대로."},{"w":"dig","p":"","m":"파다","f":0,"i":"삽을 땅에 박고 흙을 퍼내 구멍을 파는 동작. 뜻 그대로의 몸동작."},{"w":"underwater","p":"","m":"수면 아래의, 수중의","f":0,"i":"수면 아래(under-) 물속(water)에 잠긴 세계 — 잠수부·물고기의 공간. 뜻 그대로."},{"w":"long-term","p":"","m":"장기적인","f":0,"i":"기간(term)이 길게(long) 뻗은 — 먼 미래까지 이어지는. 반대는 short-term. term은 '정해진 기한'."},{"w":"academic","p":"","m":"학문의","f":0,"i":"고대 아테네에서 플라톤이 가르치던 숲(Akademeia)에서 온 말 — 그 학문의 전당에 속한, 학구적인. 실용보다 이론 쪽 뉘앙스도."},{"w":"amount","p":"","m":"양","f":0,"i":"쌓아 올려(a-쪽으로 + mount산·오르다) 산더미가 된 총량 — 셀 수 없는 것의 '양'. mountain과 한 뿌리."},{"w":"lighting","p":"","m":"조명","f":0,"i":"공간에 빛(light)을 어떻게 깔지 배치한 것 — 조명. 무대·사진의 빛 세팅."},{"w":"consideration","p":"","m":"고려 사항","f":0,"i":"여러 별(sider별)을 함께(con-) 올려다보며 요모조모 재봄 — 고려. 그렇게 따져볼 '고려 사항' 하나하나."},{"w":"fade","p":"","m":"바래다","f":0,"i":"색·소리·기억이 서서히 힘을 잃고 옅어져 사라짐 — 오래된 사진처럼 빛이 바래는 장면."},{"w":"shoot","p":"","m":"촬영","f":0,"i":"카메라로 순간을 '탁' 쏘아 담는 것 — 총을 쏘듯 셔터를 누르는 데서 온 '촬영'. 화살처럼 튀어나가는 느낌."},{"w":"exist","p":"","m":"존재하다","f":0,"i":"밖으로(ex-) 나와 서 있음(sist서다) — 어둠 속이 아니라 세상에 실제로 서 있는 상태가 '존재하다'."},{"w":"outfit","p":"","m":"의상","f":0,"i":"머리부터 발끝까지 밖(out-)에 딱 맞춰(fit) 갖춰 입은 한 벌 세트 — 코디한 의상 전체."},{"w":"enormous","p":"","m":"막대한, 엄청난","f":0,"i":"정상적 기준(norm)을 아득히 벗어난(e-밖으로) 크기 — 규격 밖으로 튀어나올 만큼 거대한. 그냥 큰 게 아니라 '어마어마하게'."},{"w":"appeal t "i":"격식 없이 사람들 앞에서 풀어놓는 이야기. 강연·좌담. lecture보다 가볍고 편한 발표 뉘앙스."},{"w":"bank account","p":"","m":"은행 계좌","f":0,"i":"은행(bank)에 내 돈을 세어(account=셈) 담아둔 칸. 특별한 비유 없음 — 은행 계좌, 그대로."},{"w":"reimbursement","p":"","m":"(비용) 상환","f":0,"i":"지갑(bursa돈주머니) 속으로 도로(re-뒤로) 돈을 다시 넣어줌. 남이 대신 쓴 돈을 채워 갚는 변상·상환. (문어·격식체)"},{"w":"shipping fee","p":"","m":"배송비","f":0,"i":"물건을 배·택배로 실어 보내는(ship) 값(fee). 특별한 이미지 없음 — 배송비, 그대로."},{"w":"bury","p":"","m":"매장하다, 묻다","f":0,"i":"흙 속에 넣고 위를 덮어 안 보이게 파묻음. '매장하다·묻다'. 서류·감정을 파묻어 숨기는 데도 확장."},{"w":"abstract","p":"","m":"추상적인","f":0,"i":"구체적 사물에서 본질만 끌어내(abs-떨어져+tract끌다) 손에 안 잡히게 뽑아낸 것. '추상적인'. 실물을 떼어낸 개념만 남은 상태."},{"w":"regain","p":"","m":"되찾다","f":0,"i":"잃었던 것을 다시(re-) 손에 넣어(gain) 되찾음. '되찾다·회복하다'. 체력·의식·신뢰를 도로 얻는 그림."},{"w":"colonial","p":"","m":"식민의","f":0,"i":"본국에서 사람을 심어(colon=경작민) 세운 식민지의. '식민의'. 지배국이 남의 땅에 자기 사람·제도를 옮겨 심은 색."},{"w":"play a part","p":"","m":"역할을 하다","f":0,"i":"무대에서 한 배역(part)을 맡아 연기하듯, 어떤 일에 제 몫의 역할을 함. '역할을 하다·기여하다'. play a role와 같음."},{"w":"take away","p":"","m":"빼앗아가다","f":0,"i":"손을 뻗어 쥐고 멀리(away) 가져가 버림. '빼앗아 가다·치우다'. 영국선 포장 음식도 takeaway."},{"w":"maid","p":"","m":"하녀","f":0,"i":"집안일을 맡아 하는 하녀·가정부. 특별한 어원 비유 없음 — 미혼 처녀(maiden)에서 온 하인 호칭, 뜻 그대로."},{"w":"be based on","p":"","m":"~에 기반을 둔","f":0,"i":"건물을 바닥(base) 위에 딱 얹어 세움. 그 바닥이 없으면 무너지니, ~을 토대로 삼다."},{"w":"tongue","p":"","m":"언어, 말","f":0,"i":"입안의 혀 — 그 혀로 굴려내는 말·언어. '모국어'는 mother tongue. 혀가 곧 말이라는 은유."},{"w":"spending","p":"","m":"소비","f":0,"i":"지갑에서 돈을 밖으로 흘려보내(spend) 쓰는 행위·액수. '소비·지출'. consumer spending=소비자 지출."},{"w":"retailer","p":"","m":"소매 상인","f":0,"i":"도매로 받은 물건을 잘게 잘라(tail=자르다) 낱개로 소비자에게 파는 상인. '소매상'. wholesaler(도매)의 반대."},{"w":"genetic","p":"","m":"유전적인","f":0,"i":"부모에게서 태어날(gen=낳다) 때 유전자에 새겨져 물려받은. '유전적인'. gene의 형용사, 타고난 설계도 색."},{"w":"magnetic","p":"","m":"자기의, 자석의","f":0,"i":"쇠를 스르르 끌어당기는 자석(magnet)의 성질. '자기의·자석의'. 사람을 끌어당기는 매력에도 magnetic으로 확장."},{"w":"wooded","p":"","m":"수목이 우거진","f":0,"i":"언덕 사면이 나무들로 빽빽이 뒤덮여 초록으로 우거진 풍경. wood(숲)+-ed(그 상태를 뒤집어쓴). '나무 심긴' 땅."},{"w":"anonymous","p":"","m":"익명의","f":0,"i":"이름표를 떼어낸 얼굴 없는 그림자 (an-없음 + onym이름). 누군지 밝혀지지 않아 정체가 지워진 상태."},{"w":"death penalty","p":"","m":"사형","f":0,"i":"국가가 죄값으로 목숨 자체를 걷어가는 최고형. 특별한 감각 이미지 없음 — 뜻 그대로 '사형'."},{"w":"legal case","p":"","m":"소송","f":0,"i":"법정 책상 위에 올려진 하나의 분쟁 서류 뭉치. 법(legal)의 틀 안에서 다투는 한 건(case)의 사건·소송."},{"w":"rubber","p":"","m":"고무","f":0,"i":"손가락으로 눌렀다 놓으면 원래대로 튕겨 돌아오는 말랑·탱탱한 물질. 특별한 이미지 없음 — 뜻 그대로 '고무'."},{"w":"for now","p":"","m":"우선은, 당분간은","f":0,"i":"일단 지금 이 순간만 손에 쥔 임시 조치. '나중엔 바뀔 수 있지만 현재로선'이라는 잠정성이 핵심."},{"w":"mass produce","p":"","m":"대량 생산하다","f":0,"i":"공장 컨베이어벨트에서 똑같은 물건이 무더기(mass)로 쏟아져 나옴. 대량으로 찍어냄."},{"w":"prey","p":"","m":"먹이","f":0,"i":"포식자의 이빨 앞에 놓인, 잡아먹히려고 쫓기는 약한 동물. 사냥의 표적이 된 '먹잇감'."},{"w":"bride","p":"","m":"신부","f":0,"i":"면사포를 쓰고 식장에 들어서는 결혼식의 여자 주인공 — 신부. 특별한 이미지 없음 — 뜻 그대로."},{"w":"groom","p":"","m":"신랑","f":0,"i":"턱시도 차림으로 신부를 기다리는 결혼식의 남자 주인공 — 신랑. (말·머리를 손질하다는 다른 뜻도 있음)"},{"w":"skip","p":"","m":"빠지다","f":0,"i":"돌 하나를 건너뛰고 껑충 지나감. 순서·차례 중 하나를 빼먹고 넘어가거나, 참석을 안 하고 건너뜀."},{"w":"fortune","p":"","m":"재산","f":0,"i":"운명의 수레바퀴가 굴러 한꺼번에 굴러들어온 거대한 부(富)의 더미. 큰 재산, 혹은 운·운명."},{"w":"fund","p":"","m":"기금","f":0,"i":"특정 목적을 위해 한곳에 모아 쌓아둔 돈주머니. 그 돈을 대주는 게 동사 fund(자금을 대다)."},{"w":"adverse","p":"","m":"부정적인","f":0,"i":"내가 가려는 방향으로 맞바람이 정면으로 불어옴 (ad-쪽으로 + verse돌다·향하다). 나를 거스르는·불리한."},{"w":"inactive","p":"","m":"활동하지 않는","f":0,"i":"스위치가 꺼진 채 멈춰 아무 움직임도 없는 상태 (in-부정 + active활동적). 작동·활동을 안 함."},{"w":"partial","p":"","m":"일부분의","f":0,"i":"케이크 전체가 아니라 잘라낸 한 조각만 (part부분 + -ial). 일부분의, 또는 한쪽으로 치우친(편파적)."},{"w":"room","p":"","m":"공간","f":0,"i":"물건이나 사람이 더 들어갈 수 있게 비어 있는 여백의 공간. 방(room)이라는 뜻에서 '들어설 자리·여지'로 확장."},{"w":"funding","p":"","m":"지원금","f":0,"i":"기금(fund)이 실제로 흘러들어와 사업에 붓는 자금 지원 행위. 대주는 돈."},{"w":"expiration","p":"","m":"만기","f":0,"i":"숨을 마지막으로 내쉬고 유효기간이 끝나 소멸함 (ex-밖으로 + spir숨쉬다). 기한이 다해 효력이 밖으로 빠져나감."},{"w":"criteria","p":"","m":"기준","f":0,"i":"합격·불합격을 가르는 기준선이 그어진 잣대들 (criterion의 복수). 판단을 재는 여러 기준."},{"w":"slipped one’s mind","p":"","m":"잊어버리다","f":0,"i":"붙잡아 뒀던 생각이 마음(mind)에서 스르르 미끄러져(slip) 빠져나감. 깜빡 잊어버림."},{"w":"make it up to","p":"","m":"~을 보상하다","f":0,"i":"빚처럼 남은 미안함을 채워 원래대로 메꿔줌 (make up 메우다 + to 상대에게). 잘못을 보상함."},{"w":"be not on speaking terms","p":"","m":"말을 건네는 사이가 아니다","f":0,"i":"서로 말을 트고 지내는 관계선(terms) 위에 올라 있지 않음. 사이가 틀어져 말도 안 하는 사이."},{"w":"gain the upper hand","p":"","m":"우위에 서다","f":0,"i":"팔씨름에서 상대 손 위로 내 손이 올라타 짓누르는 우세한 위치. 우위를 쥠."},{"w":"treat oneself to","p":"","m":"즐기다","f":0,"i":"평소엔 아끼다가 자기 자신에게 특별 선물처럼 대접해 줌. 큰맘 먹고 스스로를 즐겁게 함."},{"w":"hold one’s tongue","p":"","m":"~의 입을 다물다","f":0,"i":"튀어나오려는 말을 혀째로 꽉 붙잡아 눌러 둠. 하고 싶어도 참고 '잠자코 있다'."},{"w":"get the hang of","p":"","m":"~의 요령을 터득하다","f":0,"i":"처음엔 어색하던 도구가 손에 딱 걸리는(hang) 감을 잡음. 요령·감을 터득함."},{"w":"across the board","p":"","m":"전면적으로, 전역에 걸쳐","f":0,"i":"게시판·판(board) 전체를 가로질러(across) 예외 없이 쫙. 하나도 빠짐없이 전면적으로."},{"w":"Let’s keep in touch.","p":"","m":"우리 연락하고 지내요.","f":0,"i":"손끝이 닿는(touch) 연결을 계속 유지하자. 헤어지며 '연락 끊지 말고 지내자'."},{"w":"I don’t have the faintest idea.","p":"","m":"저는 전혀 모르겠어요.","f":0,"i":"머릿속에 가장 희미한(faintest) 생각 한 조각조차 없음. '전혀·눈곱만큼도 모르겠다'."},{"w":"I have other plans.","p":"","m":"저는 다른 계획이 있어요.","f":0,"i":"이미 다른 일정이 잡혀 있는 손. 초대·제안을 부드럽게 거절하는 정중한 표현."},{"w":"What a pity!","p":"","m":"정말 유감이네요!","f":0,"i":"안타까운 상황에 혀를 차며 내뱉는 감탄. '아, 저런! 정말 아깝네/유감이네!'"},{"w":"That works for me.","p":"","m":"저는 좋아요.","f":0,"i":"그 안(案)이 내 쪽에서 톱니처럼 맞물려 잘 돌아감(work). '저는 그거 좋아요/괜찮아요'."},{"w":"Please hold the line.","p":"","m":"끊지 말고 기다리세요.","f":0,"i":"전화선(line)을 끊지 말고 그대로 붙잡고(hold) 계세요. 통화 중 '잠시만 기다리세요'."},{"w":"Give my best wishes.","p":"","m":"안부 전해주세요.","f":0,"i":"내 가장 좋은 바람(best wishes)을 상대에게 전해 주세요. '안부 전해줘요'."},{"w":"Hang in there.","p":"","m":"버텨봐요.","f":0,"i":"벼랑에서 줄에 매달려(hang) 버티는 사람에게 '거기 놓지 말고 견뎌봐'. 힘든 사람 격려."},{"w":"This is my treat.","p":"","m":"제가 내는 거에요.","f":0,"i":"이번 대접(treat)은 내 몫이다. '이건 내가 쏠게/내가 낼게'."},{"w":"Go for it.","p":"","m":"어서 해봐.","f":0,"i":"망설임 던지고 목표를 향해(for it) 곧장 달려들어(go). '한번 해봐, 밀어붙여!'"},{"w":"pay off","p":"","m":"성과를 내다","f":0,"i":"쏟아부은 노력이 마침내 돈처럼 결실로 갚아짐(pay off). 고생 끝에 성과가 남. (빚을 갚다는 뜻도 있음)"},{"w":"confess","p":"","m":"자백하다","f":0,"i":"가슴에 눌러 담아둔 걸 한꺼번에 밖으로 털어놓음 (con-완전히 + fess말하다). 죄·속마음을 자백·고백함."},{"w":"voice","p":"","m":"표현하다","f":0,"i":"속에 있던 생각을 목소리(voice)에 실어 밖으로 냄. 명사 목소리가 동사로 '소리 내어 표현하다'."},{"w":"appraise","p":"","m":"감정하다","f":0,"i":"감정사가 물건에 값(price)을 매겨 가치를 재는 눈길 (ap-쪽으로 + praise값매김). 평가·감정하다."},{"w":"occupy","p":"","m":"(장소를) 차지하다","f":0,"i":"빈 공간에 몸이나 물건이 들어가 꽉 붙잡아 차지함 (oc-쪽으로 + cupy붙잡다). 자리를 점유함."},{"w":"court","p":"","m":"끌다","f":0,"i":"상대의 환심을 사려 애정 어린 몸짓으로 다가가 끌어당김. 구애하다 → 관심·지지를 끌어들이다."},{"w":"panic","p":"","m":"공포에 질리다","f":0,"i":"숲의 신 판(Pan)이 일으킨 갑작스러운 공포에 사방으로 흩어지듯 이성을 잃음. 순간적 공황에 질림."},{"w":"revive","p":"","m":"되살리다","f":0,"i":"꺼져가던 생명·활기가 다시(re-) 살아남(vive생명). 죽은 듯하던 것을 되살리거나 되살아남."},{"w":"insist","p":"","m":"주장하다","f":0,"i":"발을 그 자리에 딱 딛고 물러서지 않고 밀어붙임 (in-위에 + sist서다). 굽히지 않고 주장·고집함."},{"w":"landmark","p":"","m":"명소","f":0,"i":"멀리서도 눈에 딱 띄어 위치를 알려주는 땅(land) 위의 표지(mark). 랜드마크·명소·이정표."},{"w":"advantage","p":"","m":"유리한 점","f":0,"i":"남보다 한 발 앞선(advant-앞으로) 유리한 고지에 선 위치. 이득·유리한 점."},{"w":"turn","p":"","m":"차례","f":0,"i":"돌림판이 내 쪽으로 한 바퀴 돌아와 온 순서. 돌다에서 '차례'로 — 이제 내가 할 차례."},{"w":"vote","p":"","m":"투표","f":0,"i":"손을 들거나 종이를 함에 넣어 내 의사를 던짐. 표를 던지는 투표."},{"w":"operation","p":"","m":"수술","f":0,"i":"의사의 손이 몸속으로 들어가 병소를 다루는 작업 (oper일하다). 기계 조작·작전에서 '수술'로 확장."},{"w":"cancelation","p":"","m":"취소","f":0,"i":"그어놓은 계획에 X자를 쫙 그어 지워 없앰 (cancel 줄 긋다). 예약·일정의 취소. (철자 cancellation이 더 흔함)"},{"w":"duty","p":"","m":"의무","f":0,"i":"내 어깨에 얹혀 마땅히(due) 짊어져야 하는 짐. 해야만 하는 의무·직무. (관세라는 뜻도 있음)"},{"w":"layover","p":"","m":"경유","f":0,"i":"긴 여정 중간에 잠깐 내려(lay) 넘어가며(over) 쉬는 환승 대기. 비행 중간 경유·기착."},{"w":"outcome","p":"","m":"결과","f":0,"i":"일이 굴러가 마침내 밖으로(out) 나온(come) 최종 결말. 과정 끝에 튀어나온 결과."},{"w":"optional","p":"","m":"선택 가능한","f":0,"i":"골라도 되고 안 골라도 되는 선택지 (option선택). 강제가 아닌, 마음대로 고르는."},{"w":"frustrating","p":"","m":"좌절하게 하는","f":0,"i":"벽에 자꾸 부딪혀 뜻대로 안 풀려 속이 꽉 막히는 답답함 (frustra헛되이). 사람을 좌절·짜증 나게 하는."},{"w":"personally","p":"","m":"직접","f":0,"i":"남을 거치지 않고 그 사람(person) 본인이 직접 나서서. '개인적으로는' 또는 '직접·몸소'."},{"w":"bland","p":"","m":"풍미 없는","f":0,"i":"간도 향도 없이 밋밋해 혀에 아무 자극이 없는 맛. 심심한·풍미 없는, 나아가 개성 없는."},{"w":"accomplished","p":"","m":"뛰어난","f":0,"i":"어려운 과제를 이미 다 이뤄내(ac-쪽으로+com-완전히+pli채우다) 몸에 밴 사람. 그래서 '노련한·뛰어난' — 결과물이 이미 완성된 실력자."},{"w":"dense","p":"","m":"농후한, 농밀한","f":0,"i":"빈틈 하나 없이 알갱이가 빽빽이 들어차 묵직한 상태. 안개면 짙고, 인구면 밀집, 글이면 어렵고, 사람이면 머리가 꽉 막혀 둔한."},{"w":"awfully","p":"","m":"대단히","f":0,"i":"'끔찍할(awful) 정도로'가 강조로 굳어진 것. 무섭도록 심하다는 감각만 남아 '엄청·대단히'. 구어에서 very 대신 흔함."},{"w":"outgoing","p":"","m":"외향적인","f":0,"i":"안에 있지 않고 바깥(out)으로 뻗어나가는(going) 에너지. 남에게 먼저 다가가니 '외향적'. 자리에서 나가는 방향이면 '퇴임하는'."},{"w":"virtually","p":"","m":"실질적으로","f":0,"i":"겉껍질만 빼면 사실상 그것인 상태. 100퍼센트는 아니지만 실질은 다 됨. '거의 다·사실상' — almost의 격식·강조판."},{"w":"hostile","p":"","m":"적대적인","f":0,"i":"손님(host의 반대편) 아닌 적으로 낯을 세워 창을 겨눈 태도. 노골적 적개심이 뿜어져 나오는. 차가운 냉대까지 포함."},{"w":"firm","p":"","m":"단호한, 견고한","f":0,"i":"눌러도 안 들어가고 밀어도 안 흔들리는 단단함. 물건이면 견고, 태도면 흔들림 없이 단호. 회사(firm)도 '단단히 묶인 조직'."},{"w":"resolved","p":"","m":"결심한","f":0,"i":"마음속 갈등을 풀어(re-완전히+solve풀다) 하나로 딱 굳혀버린 상태. 더 흔들리지 않게 결론 낸 '결심한'."},{"w":"connect","p":"","m":"연결하다","f":0,"i":"떨어진 두 끝을 함께(con-) 묶어(nect) 하나의 선으로 이음. 선이 이어지면 통화 연결, 사람끼리면 유대, 논리면 관련."},{"w":"question","p":"","m":"질문하다","f":0,"i":"구하다(quest추구)에서 온, 답을 캐내려 던지는 물음표. 몰라서 캐물으면 질문, 미심쩍어 캐물으면 '의문을 제기하다'."},{"w":"control","p":"","m":"통제하다","f":0,"i":"고삐를 손에 쥐고 대상을 내 뜻대로 끌고 가는 장악. 원래 대조 장부(contra-roll)로 대조·검사하던 데서 '통제'로."},{"w":"alleviate","p":"","m":"완화하다, 덜다","f":0,"i":"무거운 짐을 들어(lev가볍게, levity와 한 뿌리) 가볍게 덜어줌 (al-쪽으로+leviate가볍게). 통증·부담을 완전히는 아니고 '완화'. 참고: elevate(들어올리다)."},{"w":"afford","p":"v.","m":"~할 수 있다, ~할 여유가 있다","f":3,"i":"여유가 앞으로(af-쪽으로) 나와 손이 닿음. 돈·시간·감정의 곳간이 충분해 '~할 형편이 됨'. 보통 can afford로 씀."},{"w":"channel","p":"n.","m":"경로, 수로, 해협","f":3,"i":"물이 한 길로만 흐르도록 파낸 좁은 물길. 그 홈을 따라 흐르니 TV 채널, 유통 경로, 두 바다 사이 해협까지."},{"w":"hold the line","p":"phr.","m":"전화를 끊지 않고 기다리다","f":3,"i":"전화선(line)을 손에 쥔 채 끊지 말고 붙들고 있으라 — '끊지 말고 잠깐 기다리세요'. 비유로 '방어선을 사수하다'도."},{"w":"illustration","p":"n.","m":"삽화, 설명","f":3,"i":"어둠 속 대상에 빛(lustr빛)을 비춰(il-안으로) 환히 밝혀 보여줌. 그림으로 밝히면 삽화, 예로 밝히면 설명·예시."},{"w":"issue","p":"v.","m":"발급하다 n. 논점, 문제, 발행 / 발행본, 호 v. 발행하다","f":3,"i":"안에서 밖으로(ex→iss) 콸콸 뿜어져 나오는 것. 밖으로 내보내면 발급·발행(그 호), 문제로 불거져 나오면 논점·쟁점."},{"w":"sanction","p":"v.","m":"인가하다, 찬성하다 n. 허가, 인가","f":3,"i":"권위가 쾅 찍는 공식 도장 (sanct신성한). 그 도장이 허가도(인가) 되고, 반대로 벌을 확정하면 제재도 됨 — 양날."},{"w":"tally","p":"v.","m":"기록하다, 계산하다 n. 계산, 눈금","f":3,"i":"막대에 칼금을 하나씩 새겨(원래 tally stick 눈금 막대) 수를 헤아림. 그 눈금들이 서로 딱 맞으면 '일치하다'로도."},{"w":"uphold","p":"v.","m":"떠받치다, 지지하다","f":3,"i":"무너지려는 것을 아래에서 위로(up) 받쳐 붙잡음(hold). 물리적으로 떠받치고, 판결·원칙을 무너지지 않게 '지지·유지'."},{"w":"place","p":"v.","m":"놓다, 배치하다 n. 장소, 위치","f":3,"i":"손에 든 것을 특정 지점에 탁 내려놓아 자리 잡게 함. 그 놓인 지점이 '장소·위치'. 주문·배치도 '자리에 놓는' 것."},{"w":"celebrate the new year","p":"phr.","m":"새해를 경축하다","f":3,"i":"묵은해를 보내고 새해를 다 함께 떠들썩하게 맞이하며 축하함. 뜻 그대로 '새해를 경축하다'."},{"w":"note","p":"v.","m":"알아차리다, 주목하다, 메모하다","f":3,"i":"귀·눈에 딱 걸린 것에 표시(not-표시)를 콕 찍어 둠. 머리에 찍으면 알아차리다·주목, 종이에 찍으면 메모."},{"w":"grant","p":"v.","m":"주다, 수여하다, 동의하다","f":3,"i":"윗사람이 손을 내려 아래로 '그래, 주마' 하고 얹어줌. 권리·돈을 내려주면 수여, 상대 말을 받아들이면 '인정하다'."},{"w":"option","p":"n.","m":"선택권, 선택","f":3,"i":"여러 갈래 앞에서 하나를 골라잡을(opt고르다) 수 있는 권리. 손에 쥔 선택 카드 한 장."},{"w":"transport","p":"v.","m":"수송하다, 옮기다 n. 수송, 운송","f":3,"i":"짐을 이쪽에서 저쪽으로 가로질러(trans-) 나름(port나르다). 물건을 가로질러 옮기면 수송, 감정을 옮기면 '황홀하게 하다'."},{"w":"bored","p":"a.","m":"지루한, 따분한","f":3,"i":"송곳으로 구멍을 뚫듯(bore뚫다) 같은 자극이 계속 파고들어 속이 텅 비고 지침. 그래서 '지루한'. cf. boring(지루하게 하는)."},{"w":"phase","p":"n.","m":"단계, 모습","f":3,"i":"달이 차고 기우는 한 국면처럼, 전체 과정 중 지금 드러나 있는 한 '단면·단계'. 시간 위의 한 토막."},{"w":"prepare","p":"v.","m":"준비하다","f":3,"i":"일이 닥치기 전에 미리(pre-앞서) 재료를 갖춰(pare마련) 놓음. 미리 손봐 두는 준비. cf. repair(다시 고치다)."},{"w":"rescind","p":"v.","m":"무효로 하다, 폐지하다","f":3,"i":"이미 그어진 것을 도로(re-) 찢어(scind자르다) 없던 일로 만듦. 명령·계약을 싹둑 잘라 '무효화'. (문어·법률체)"},{"w":"distraught","p":"a.","m":"마음이 산란해진, 심란한","f":3,"i":"마음이 사방으로(dis-흩어져) 잡아당겨져(draught=draw) 갈가리 찢긴 상태. 정신이 산란해 어쩔 줄 모르는. (문어체)"},{"w":"neutral","p":"a.","m":"중립적인 / 중성의","f":3,"i":"어느 편(둘 중 어느 쪽도 아닌, ne-부정) 쪽으로도 안 기운 딱 가운데. 편 안 들면 중립, 성질이 없으면 중성."},{"w":"apply","p":"v.","m":"바르다, 적용하다","f":3,"i":"표면에 대고(ap-쪽으로) 착 눌러 붙임(ply접다·겹치다). 약을 살에 붙이면 바르다, 규칙을 상황에 붙이면 적용, 자기를 자리에 붙이면 지원."},{"w":"burden","p":"v.","m":"~에게 짐을 지우다 n. 짐, 부담","f":3,"i":"등에 얹혀 짓누르는 무거운 짐(bear나르다에서). 물리적 짐이든 책임·부담이든 어깨를 눌러 내리는 무게."},{"w":"contusion","p":"n.","m":"타박상","f":3,"i":"부딪혀(con-세게+tus두드리다) 살갗은 안 터졌는데 속에서 피가 뭉쳐 시퍼렇게 든 멍 — 타박상. (의학 용어)"},{"w":"fit","p":"v.","m":"꼭 맞다, 적합하다 a. 적당한, 꼭 맞는","f":3,"i":"빈 공간에 딱 맞아 들어가 틈이 없음. 크기가 맞으면 꼭 맞다, 조건이 맞으면 적합, 몸이 딱 맞게 다져지면 건강한."},{"w":"greet","p":"v.","m":"인사하다, 경의를 표하다","f":3,"i":"다가온 상대를 향해 반갑게 맞아 인사말을 건넴. 문을 열고 손님을 맞이하는 그 순간의 인사."},{"w":"induce","p":"v.","m":"야기하다, 유발하다","f":3,"i":"밖에 있던 결과를 안으로(in-) 이끌어(duce이끌다) 들여 일어나게 함. 상태를 끌어들이면 유발, 사람을 끌어들이면 설득."},{"w":"insert","p":"v.","m":"끼워 넣다, 삽입하다 n. 삽입물","f":3,"i":"틈 사이 안으로(in-) 밀어 끼워(sert꽂다) 넣음. 열쇠를 구멍에 꽂듯. cf. desert(버리다), exert(밖으로 힘쓰다)."},{"w":"remove","p":"v.","m":"제거하다, 옮기다","f":3,"i":"있던 자리에서 도로(re-) 들어(move옮기다) 딴 데로 치움. 그 자리에서 빼내니 제거, 통째로 옮기면 이동."},{"w":"adopt","p":"v.","m":"채택하다, 채용하다, 입양하다","f":3,"i":"밖의 것을 내 쪽으로(ad-) 골라(opt고르다) 데려와 내 것으로 삼음. 방법을 데려오면 채택, 아이를 데려오면 입양. cf. adapt(맞춰 바꾸다)."},{"w":"indulge","p":"v.","m":"빠지다, 탐닉하다","f":3,"i":"욕구 안으로(in-) 흠뻑 몸을 담가 마음껏 즐김. 브레이크 없이 빠져드는 탐닉. oneself를 붙여 '호강하다'로도."},{"w":"stand","p":"v.","m":"참다, 견디다, 세우다 n. 기립","f":3,"i":"무너지지 않고 두 발로 버티고 선 상태. 서 있으면 stand up, 압력에도 안 무너지고 버티면 '참다·견디다'."},{"w":"tangible","p":"a.","m":"만져서 알 수 있는, 실체가 있는","f":3,"i":"손을 뻗으면 실제로 만져지는(tang닿다) 것. 잡히니 '실체가 있는·구체적인'. cf. tangent(접선), contact(맞닿음)."},{"w":"arrange","p":"v.","m":"정리하다, 배열하다","f":3,"i":"흩어진 것들을 줄(range줄·범위)에 맞춰 가지런히 세워 정돈함. 물건이면 배열, 일이면 '마련·계획하다'."},{"w":"due","p":"a.","m":"마감 기한인, 지불 기일이 된","f":3,"i":"빚(due빚진)이 만기가 되어 갚아야 할 시점이 딱 도래함. 돈이면 지불 기일, 일이면 마감. due to면 '~때문에·~예정인'."},{"w":"line","p":"n.","m":"줄, 선, 금","f":3,"i":"한 점에서 쭉 그어진 가느다란 선·줄. 늘어선 줄, 전화선, 경계 금, 대사 한 줄까지 다 '길게 이어진 것'."},{"w":"resignation","p":"n.","m":"사직, 사임, 퇴직","f":3,"i":"쥐고 있던 자리를 도로(re-) 서명해(sign) 내려놓음 — 사직. 동시에 운명 앞에 손을 놓아버린 '체념'도 한 뿌리."},{"w":"treat","p":"v.","m":"다루다, 대우하다 n. 한턱 내기","f":3,"i":"대상을 어떤 식으로 손대어 다룸(tract끌다에서). 사람을 다루면 대우, 병을 다루면 치료, 남에게 베풀면 '한턱'."},{"w":"update","p":"v.","m":"갱신하다, 개정하다","f":3,"i":"지금 시점(date)까지 위로(up) 끌어올려 최신으로 맞춤. 오래된 정보를 현재에 붙여 새로 고침."},{"w":"deserve","p":"v.","m":"~을 받을 만하다","f":3,"i":"받을 자격을 아래서 든든히(de-완전히+serve섬기다) 쌓아 마땅히 값을 받을 만함. 노력한 만큼 '받아 마땅한'."},{"w":"discharge","p":"v.","m":"방출하다, 짐을 내리다","f":3,"i":"잔뜩 실린 짐(charge)을 흩어(dis-) 확 풀어 내보냄. 짐 내리기, 액체 방출, 사람이면 방면·제대·해고까지."},{"w":"obscure","p":"v.","m":"흐리게 하다 a. 분명하지 않은","f":3,"i":"앞을 가로막고(ob-맞서서) 뒤덮어 안 보이게 흐림. 시야를 막으면 흐리게 하다, 뜻이 안 보이면 '모호한·무명의'."},{"w":"spot","p":"v.","m":"알아보다, 찾아내다 n. 장소, 지점, 얼룩, 오점","f":3,"i":"넓은 배경 위에 콕 찍힌 한 점. 그 점을 눈으로 콕 집어내면 '알아보다', 점 그 자체면 지점·얼룩·오점."},{"w":"spread","p":"v.","m":"퍼뜨리다, 보급시키다","f":3,"i":"접혀 있던 것을 사방으로 쫙 펼쳐 넓게 깖. 이불도 펴고, 소문·병도 퍼지고, 빵에 잼도 바름."},{"w":"sum","p":"n.","m":"총계, 합계, 총액","f":3,"i":"여러 낱개를 하나로 끌어올려(sum위로) 합친 꼭대기 값 — 총합. 다 더해 맨 위에 얹힌 한 덩어리."},{"w":"usher","p":"v.","m":"안내하다 n. 안내자","f":3,"i":"문 앞에 서서(원래 문지기 ostium문) 손님을 자리로 이끌어 데려가는 안내인. 새 시대를 '열어 맞이하다'로도."},{"w":"access","p":"v.","m":"접근하다, 도달하다","f":3,"i":"목표 쪽으로(ac-) 다가가(cess가다) 문턱을 넘어 안으로 들어감. 그 들어가는 통로·권한이 '접근'. cf. excess(넘어감), proceed(나아가다)."},{"w":"curb","p":"v.","m":"억제하다 n. (도로의) 연석","f":3,"i":"말고삐를 당겨(curb재갈) 날뛰는 놈을 억눌러 멈춰 세움. 그 억제가 핵심. 도로 가장자리의 연석도 차를 막아 세우는 턱."},{"w":"head","p":"v.","m":"향하다","f":3,"i":"몸에서 맨 앞·맨 위인 머리가 향하는 쪽으로 나아감. 머리를 그쪽에 두니 '~로 향하다'. 조직의 머리면 '우두머리·이끌다'."},{"w":"implicate","p":"v.","m":"관계시키다, (의미를) 포함하다","f":3,"i":"손가락으로 누군가를 콕 집어 사건의 그물 안으로 함께 엮어 끌어들임 (im-안으로 + plic접다/엮다). 그래서 '연루시키다'이자 말 속에 뜻을 접어 넣은 '함축하다'."},{"w":"strike","p":"v.","m":"충격을 주다, 급습하다 / 파업, 동맹 파업","f":3,"i":"팔을 뒤로 뺐다가 목표에 딱 내리꽂는 한 방. 그 타격 이미지가 때리다·급습하다·(생각이) 문득 꽂히다로 확장. 일손을 딱 멈춰 내리치듯 거부하면 파업."},{"w":"deflect","p":"v.","m":"빗나가게 하다, 비끼게 하다","f":2,"i":"날아오던 것이 방패에 맞아 옆으로 휙 꺾여 빗나감 (de-벗어나 + flect구부리다). 화살·비난·질문을 정면으로 안 받고 방향만 틀어버림."},{"w":"eradicate","p":"v.","m":"근절하다, 박멸하다","f":2,"i":"잡초를 뿌리째 뽑아 흙에서 완전히 걷어냄 (e-밖으로 + radic뿌리). 표면만이 아니라 근원까지 싹 없앰 — 그래서 '근절'. (문어·격식체)"},{"w":"mobile","p":"a.","m":"움직일 수 있는 n. 자동차","f":2,"i":"바퀴 달린 듯 언제든 자리를 옮길 수 있는 상태 (mov/mob움직이다). 손안에서 들고 다니니 mobile phone, 스스로 굴러가니 automobile."},{"w":"noxious","p":"a.","m":"해로운, 유독한","f":2,"i":"코를 찌르는 매연이 폐로 들어와 몸을 상하게 하는 감각. 눈에 안 보여도 해를 끼치는 유독함. harmful보다 딱딱한 (문어체)."},{"w":"obedient","p":"a.","m":"순종적인, 양순한","f":2,"i":"윗사람 말에 귀를 딱 기울여 그대로 따르는 자세 (ob-향해 + ed듣다). 들은 대로 순순히 움직이는 순종."},{"w":"patron","p":"n.","m":"단골 손님, 고객, 후원자","f":2,"i":"가게 문을 늘 드나들며 돈을 대주는 든든한 어른 (patr아버지). 아버지처럼 뒤를 봐주니 후원자, 늘 오니 단골."},{"w":"publicize","p":"v.","m":"홍보하다, 알리다","f":2,"i":"안에만 있던 소식을 광장 한복판으로 끌어내 모두가 보게 함 (public공중 + -ize만들다). 널리 퍼뜨려 알림."},{"w":"rapport","p":"n.","m":"관계","f":2,"i":"두 사람 사이에 보이지 않는 다리가 놓여 마음이 척척 오가는 상태 (re-다시 + port나르다, 감정을 서로 실어 나름). 프랑스어라 발음은 라포r로 t 묵음."},{"w":"slot","p":"n.","m":"틈, 위치","f":2,"i":"기계나 일정표에 길쭉하게 파인 홈 하나. 동전이 딱 들어가는 그 틈처럼, 뭔가가 쏙 들어갈 정해진 자리."},{"w":"subscribe","p":"v.","m":"구독하다, 기부하다","f":2,"i":"명단 맨 아래에 내 이름을 적어 넣어 '나 여기 낄게'라고 서명함 (sub-아래에 + scribe쓰다). 아래에 이름 적으니 구독·기부·동의."},{"w":"upsurge","p":"n.","m":"급증","f":2,"i":"잠잠하던 파도가 갑자기 위로 확 솟구쳐 오름 (up위로 + surge치솟음). 수치·감정이 급격히 치솟는 급증."},{"w":"vent","p":"v.","m":"발산하다, 드러내다 n. 구멍, 통풍구","f":2,"i":"꽉 막혔던 압력이 좁은 구멍으로 '푸쉬' 빠져나가는 통풍구. 그 구멍처럼 참았던 화·감정을 밖으로 터뜨려 발산함."},{"w":"alter","p":"v.","m":"바꾸다, 변경하다","f":2,"i":"옷을 통째로 새로 짓지 않고 다른(alter=other) 모양이 되게 부분만 고쳐 바꿈. change보다 부분 수정 뉘앙스 — 옷 수선집이 alteration."},{"w":"approve","p":"v.","m":"찬성하다, 시인하다","f":2,"i":"위에서 내려다보며 '좋다(prove=시험해 통과)'고 도장을 꾹 눌러줌 (ap-쪽으로 + prove인정). 확인 후 찬성·승인."},{"w":"chase","p":"v.","m":"뒤쫓다, 추격하다","f":2,"i":"앞서 달아나는 등을 향해 헐떡이며 바짝 뒤쫓아 붙는 동작. 잡으려 끝까지 따라붙는 추격."},{"w":"clarify","p":"v.","m":"명백하게 하다","f":2,"i":"뿌옇게 흐린 물을 가라앉혀 바닥까지 훤히 비치게 만듦 (clar맑은 + -fy만들다). 흐린 뜻을 맑게 걷어내 또렷이 함."},{"w":"click","p":"v.","m":"딸깍 소리 나게 하다, 클릭하다","f":2,"i":"손가락 끝이 버튼을 눌러 '딸깍' 하고 맞물리는 소리. 그 순간 두 조각이 착 맞듯, 사람·생각이 갑자기 통하는 것도 click."},{"w":"fetch","p":"v.","m":"가지고 오다, 데리고 오다","f":2,"i":"저쪽에 있는 걸 향해 갔다가 그걸 손에 쥐고 다시 여기로 돌아오는 왕복 동작. 개가 공 물어오듯, 가서-가져옴 한 세트."},{"w":"pick up","p":"phr.","m":"차로 (사람·물건을) 태우다, (몸에) 익히다","f":2,"i":"길 가다 몸을 숙여 바닥의 것을 손으로 집어 올리는 동작. 그래서 차로 사람을 태워 데려가고, 지식·습관을 슬쩍 주워 익힘."},{"w":"possible","p":"a.","m":"있을 수 있는, 가능한","f":2,"i":"문이 아직 잠기지 않아 밀면 열릴 수도 있는 상태 (pot힘/능력). 실현될 힘이 남아 있어 '있을 수 있는'."},{"w":"recount","p":"v.","m":"이야기하다, 열거하다","f":2,"i":"겪은 일을 처음부터 하나하나 다시 세듯 되짚어 이야기함 (re-다시 + count세다). 순서대로 늘어놓아 열거·서술."},{"w":"segment","p":"n.","m":"단편, 조각, 부분","f":2,"i":"통째 하나였던 것을 칼로 잘라 나눈 한 토막 (seg자르다). 오렌지 속 한 조각처럼 전체에서 떨어져 나온 부분."},{"w":"vacancy","p":"n.","m":"빈방, 공허, 공백","f":2,"i":"사람도 짐도 없이 텅 비어 울리는 방 (vac비다). 그 빈자리처럼 채워지길 기다리는 공석·공백. (호텔 간판 vacancy = 빈방 있음)"},{"w":"affable","p":"a.","m":"사귀기 쉬운, 붙임성 있는","f":2,"i":"누구에게든 얼굴 맞대고 말 붙이기 편한 사람 (af-쪽으로 + fa말하다). 말이 술술 통해 붙임성 있음. (문어·격식체, 회화는 friendly)"},{"w":"allure","p":"v.","m":"꾀다, 끌어들이다, 매혹하다","f":2,"i":"눈앞에 미끼를 살랑 흔들어 저도 모르게 발이 그쪽으로 끌려가게 함 (al-쪽으로 + lure미끼). 홀리듯 유혹."},{"w":"attributable","p":"a.","m":"~의 탓에 의한, ~에 기인하는","f":2,"i":"어떤 결과의 원인을 '이 탓이다'라며 딱 한 곳에 갖다 붙일 수 있음 (at-쪽으로 + tribut배당). ~에 돌릴 수 있는. (문어체)"},{"w":"baffle","p":"v.","m":"좌절시키다, 실패로 끝나게 하다","f":2,"i":"가려던 길이 벽에 딱 막혀 어쩔 줄 모르고 머리를 긁는 상태. 계획을 좌절시키고 사람을 어리둥절하게 함."},{"w":"compose","p":"v.","m":"작곡하다, 구성하다","f":2,"i":"흩어진 조각들을 하나하나 제자리에 놓아 하나의 전체로 짜 맞춤 (com-함께 + pos놓다). 음을 놓으면 작곡, 마음을 놓으면 진정."},{"w":"defer","p":"v.","m":"연기하다, 미루다","f":2,"i":"지금 할 일을 손에서 뒤로 밀어 나중으로 옮겨 놓음 (de-떨어져 + fer나르다). 미룸. (남 뜻에 따르는 defer to는 별개 갈래)"},{"w":"deliberate","p":"v.","m":"숙고하다","f":2,"i":"저울(libra) 위에 이것저것 올려 무게를 재듯 서두르지 않고 천천히 따져봄 (de-완전히 + liber저울). 그래서 신중히 숙고, 형용사면 '의도적인'."},{"w":"detailed","p":"a.","m":"자세한","f":2,"i":"큰 덩어리를 잘게 잘라(de-+tail자르다) 실오라기 하나까지 다 짚어 놓은 상태. 세부까지 촘촘한 '자세한'."},{"w":"diffuse","p":"v.","m":"발산하다, 보급하다","f":2,"i":"잉크 한 방울을 물에 떨어뜨리면 사방으로 스멀스멀 번져 퍼짐 (dis-흩어져 + fus붓다). 열·소문·향을 널리 퍼뜨림."},{"w":"equitable","p":"a.","m":"공정한","f":2,"i":"저울 양쪽 접시가 딱 수평을 이룬 상태 (equi같은). 어느 쪽도 안 기운 공정함 — 법정에서의 형평."},{"w":"gathering","p":"n.","m":"모임, 회합","f":2,"i":"흩어져 있던 사람들이 한 점으로 모여드는 장면 (gather모으다). 그렇게 모인 결과가 모임·회합."},{"w":"genuine","p":"a.","m":"진짜의, 진품의, 진심의","f":2,"i":"태어날 때부터(gen낳다) 그 핏줄인 진짜 — 겉만 흉내 낸 가짜가 아니라 속까지 진품. 감정에 쓰면 꾸밈없는 진심."},{"w":"incise","p":"v.","m":"절개하다, 새기다","f":2,"i":"칼끝을 살 안으로 밀어 넣어 정확히 그어 가름 (in-안으로 + cis자르다). 수술로 절개하거나 표면에 새김. (전문·문어체)"},{"w":"keep up with","p":"phr.","m":"뒤떨어지지 않게 하다","f":2,"i":"앞서가는 사람 등을 놓치지 않게 나란히 속도를 맞춰 따라붙음. 뒤처지지 않고 흐름·유행·소식을 계속 좇음."},{"w":"provision","p":"v.","m":"양식을 공급하다 n. 공급, 준비","f":2,"i":"겨울 오기 전에 미리(pro-앞으로) 내다보고(vis보다) 식량을 쟁여 둠. 앞을 보고 챙긴 준비물이 공급·양식, 계약에선 미리 박아 둔 조항."},{"w":"serve","p":"v.","m":"도움이 되다, 시중들다","f":2,"i":"쟁반을 받쳐 들고 상대 앞에 내놓아 필요를 채워 줌. 그 시중드는 동작이 봉사·기여, 밥을 내면 서빙, 공을 넣으면 서브."},{"w":"vindicate","p":"v.","m":"정당성을 입증하다","f":2,"i":"부당하게 뒤집어쓴 누명을 걷어내고 '이 사람 옳았다'를 증거로 되찾아 줌. 결백·정당성을 입증해 명예를 회복. (문어·격식체)"},{"w":"current","p":"n.","m":"흐름, 경향 a. 현재의, 지금의","f":2,"i":"지금 이 순간 눈앞을 흐르며 지나가는 물살·전류 (cur달리다). 흐르니 '흐름·조류', 지금 흐르는 중이니 '현재의'."},{"w":"cut back","p":"phr.","m":"줄이다, 삭감하다","f":2,"i":"무성하게 자란 가지를 가위로 싹둑 잘라 되돌려(back) 줄임. 비용·생산을 도로 깎아 내리는 삭감."},{"w":"direct","p":"v.","m":"안내하다, 감독하다, 지시하다","f":2,"i":"구부러짐 없이 곧게(di-떨어져 + rect곧은) 목표를 딱 가리키는 손끝. 길을 곧장 가리키니 안내·지시, 배우를 곧장 이끄니 감독."},{"w":"elicit","p":"v.","m":"이끌어 내다","f":2,"i":"상대 속에 숨은 대답·반응을 살살 꾀어 밖으로 끌어냄 (e-밖으로 + licit끌다). 질문으로 웃음·정보를 이끌어 냄. (문어체)"},{"w":"glide","p":"v.","m":"미끄러지다, 활공하다","f":2,"i":"발도 안 구르고 매끄러운 얼음판 위를 소리 없이 쭉 미끄러져 나감. 새가 날갯짓 없이 공기를 타면 활공."},{"w":"inherit","p":"v.","m":"물려받다, 상속하다","f":2,"i":"돌아가신 분이 남긴 것을 핏줄을 타고 그대로 넘겨받아 내 안(in-)에 들여옴. 재산도, 눈매·성격 같은 형질도 물려받음."},{"w":"innate","p":"a.","m":"타고난, 선천적인","f":2,"i":"태어날(nat태어나다) 때부터 이미 몸 안(in-)에 심겨 나온 것. 배워 얻은 게 아니라 처음부터 지닌 선천적 성질."},{"w":"officially","p":"ad.","m":"공식적으로","f":2,"i":"개인 생각이 아니라 도장 찍힌 직책(office)의 이름으로 못박아 말함. 사사롭지 않은 '공식적으로'."},{"w":"play a role","p":"phr.","m":"역할을 하다","f":2,"i":"무대에서 배우가 맡은 배역을 연기하듯, 어떤 일 속에서 한 몫을 담당함. 그 역할을 해냄."},{"w":"poignant","p":"a.","m":"감동적인, 신랄한","f":2,"i":"가슴 한복판을 뾰족한 바늘이 콕 찌르는 듯한 아릿함 (poign찌르다, point과 한 뿌리). 찡하게 감동적이거나 날카롭게 신랄함. (문어체)"},{"w":"spectacular","p":"a.","m":"굉장한, 볼 만한","f":2,"i":"눈이 휘둥그레져 자꾸 쳐다보게(spec보다) 만드는 대단한 볼거리. 그 구경거리(spectacle)처럼 굉장하고 화려함."},{"w":"trace","p":"v.","m":"추적하다, 발자국을 더듬어 가다","f":2,"i":"땅에 찍힌 발자국 선을 손끝으로 하나씩 되짚어 근원까지 따라감 (tract끌다). 흔적을 더듬어 추적, 얇게 남은 자취가 '미량'."},{"w":"claim","p":"v.","m":"요구하다, 청구하다","f":2,"i":"'이건 내 거다'라고 목소리 높여 소리쳐 요구함 (claim외치다). 권리·보상을 당당히 청구하거나, 사실이라 주장."},{"w":"evict","p":"v.","m":"퇴거시키다, 쫓아내다","f":2,"i":"세입자를 이겨(vict이기다) 집 밖으로(e-) 강제로 몰아냄. 법의 힘으로 살던 곳에서 쫓아내는 퇴거. (법률·문어체)"},{"w":"gauge","p":"v.","m":"평가하다, 측정하다","f":2,"i":"자·계기를 갖다 대고 크기·양·정도를 눈금으로 딱 재어 봄. 수치뿐 아니라 분위기·반응까지 가늠. 발음은 게이지."},{"w":"laud","p":"v.","m":"극찬하다, 칭송하다","f":2,"i":"박수와 함께 소리 높여 '훌륭하다'고 떠받들어 칭송함. praise보다 격식 있고 과장된 (문어·격식체) 극찬."},{"w":"meet the needs","p":"phr.","m":"필요를 충족시키다","f":2,"i":"요구라는 목표 지점에 부족함 없이 딱 가서 닿음. 필요한 만큼을 채워 충족시킴."},{"w":"rudimentary","p":"a.","m":"기본의, 기초의","f":2,"i":"아직 다듬지 않은(rud거친) 첫 단계, 뼈대만 겨우 갖춘 기초 수준. 갓 싹튼 초보적·미발달 상태. (문어체)"},{"w":"transition","p":"n.","m":"변천, 변화","f":2,"i":"한 방을 가로질러(trans-가로질러 + it가다) 다음 방으로 넘어가는 문지방 위 순간. 이전 상태와 다음 상태 사이를 건너가는 이행·변천."},{"w":"valid","p":"a.","m":"유효한, 타당한","f":2,"i":"힘(val=강함)이 살아 있어 실제로 통하는 상태 — 아직 유효기간이 안 지나 문을 통과시키는 표. 논리가 힘 있게 서 있으면 타당한."},{"w":"absorb","p":"v.","m":"흡수하다, 빨아들이다","f":2,"i":"스펀지가 물을 안으로(ab~로부터→쪽으로 + sorb빨다) 쭉 빨아들여 자기 속에 가둠. 액체든 정보든 지식이든 통째로 빨아들여 삼킴."},{"w":"affirm","p":"v.","m":"단언하다, 확언하다","f":2,"i":"손바닥으로 탁자를 꽉 눌러 단단히(ad-쪽으로 + firm굳건) 못박듯 '이건 확실하다'고 단단히 다짐. 흔들림 없이 그렇다고 확언."},{"w":"console","p":"v.","m":"위로하다","f":2,"i":"무너진 사람 곁에 바짝 붙어(con-함께) 어깨를 감싸 다시 세워 줌(sol=위로·달래다). 슬픔에 빠진 이를 곁에서 다독여 위로."},{"w":"encourage","p":"v.","m":"촉진하다, 장려하다","f":2,"i":"겁먹은 사람 가슴속에 용기(courage)를 안으로(en-안에) 밀어넣어 등을 떠밀어 줌. 그래서 격려·촉진."},{"w":"exhale","p":"v.","m":"내쉬다, 발산하다","f":2,"i":"폐 안의 숨을 몸 밖으로(ex-밖으로 + hale숨쉬다) 후 하고 밀어냄. 날숨. 반대는 inhale(들이쉬다)."},{"w":"flimsy","p":"a.","m":"부서지기 쉬운, 설득력이 없는","f":2,"i":"얇은 티슈처럼 손으로 살짝만 당겨도 후줄근하게 찢어지는 것. 물건이 부실하거나 변명·근거가 힘없이 무너지는."},{"w":"greedy","p":"a.","m":"탐욕스러운, 욕심 많은","f":2,"i":"먹을 걸 두 팔로 다 그러모아 품에 꽉 껴안고 놓지 않는 눈빛. 남 몫까지 탐내는 탐욕스러운."},{"w":"invalid","p":"a.","m":"타당하지 않은, 실효성이 없는","f":2,"i":"도장이 안 찍혀(in-부정 + valid유효) 창구에서 튕겨 나오는 표 — 힘이 죽어 통하지 않음. 논리가 무너지면 타당성 없는."},{"w":"loop","p":"v.","m":"고리로 만들다 n. 고리, 올가미","f":2,"i":"줄을 한 바퀴 돌려 둥근 고리를 만든 모양. 그 고리처럼 제자리로 돌아와 반복되는 순환."},{"w":"precede","p":"v.","m":"앞서다, 선행하다","f":2,"i":"행렬에서 남보다 앞서(pre-앞 + cede가다) 걸어 먼저 지나감. 시간·순서상 앞에 옴."},{"w":"ring a bell","p":"phr.","m":"벨을 울리다","f":2,"i":"머릿속에서 작은 종이 딸랑 울리며 '아, 이거 어디서 들어봤는데' 하는 희미한 기억이 반짝. 정확히는 몰라도 낯익음."},{"w":"scared","p":"a.","m":"겁먹은, 깜짝 놀란","f":2,"i":"그림자에 흠칫 어깨가 움츠러들고 등이 서늘해지는 순간. 갑작스레 겁먹은·놀란 상태."},{"w":"admit","p":"v.","m":"들어오게 하다, 시인하다","f":2,"i":"문지기가 빗장을 풀어 안으로(ad-쪽으로 + mit보내다) 들여보냄. 사람을 들이면 입장 허가, 사실을 마음에 들이면 시인·인정."},{"w":"ascertain","p":"v.","m":"확인하다, 규명하다","f":2,"i":"안개 속을 더듬어 나가 마침내 확실한(certain) 지점에 손이 닿게 함(ad-쪽으로). 애매한 걸 캐물어 분명히 규명."},{"w":"consolidate","p":"v.","m":"통합하다, 합병하다","f":2,"i":"흩어진 것들을 한데 모아(con-함께) 눌러 단단한(solid) 한 덩어리로 굳힘. 조직·빚·권력을 하나로 통합·공고화."},{"w":"defuse","p":"v.","m":"안전하게 하다, 위기를 해소하다","f":2,"i":"폭탄의 뇌관(fuse)을 뽑아 떼어냄(de-분리). 터질 위기를 미리 무력화해 가라앉힘."},{"w":"exit","p":"v.","m":"퇴장하다, 나가다 n. 출구","f":2,"i":"무대 옆으로 빠져(ex-밖으로 + it가다) 밖으로 나가는 문. 퇴장·출구."},{"w":"gratify","p":"v.","m":"만족시키다, 기쁘게 하다","f":2,"i":"상대 마음에 딱 드는 걸 안겨(grat=기쁨·감사 + fy만들다) 흐뭇한 미소가 번지게 함. 욕구·기대를 충족시켜 기쁘게 함."},{"w":"infuse","p":"v.","m":"주입하다, (신념·용기 등을) 불어 넣다","f":2,"i":"찻잎을 뜨거운 물에 담가 그 성분이 물속으로(in-안으로 + fuse붓다) 서서히 배어들게 함. 신념·활력을 마음에 부어 넣음."},{"w":"intercept","p":"v.","m":"가로막다, 가로채다","f":2,"i":"두 지점 사이(inter-사이)로 손을 쑥 뻗어 날아가던 공을 중간에 낚아챔(cept잡다). 가로채기·가로막기."},{"w":"legitimate","p":"a.","m":"합법적인, 도리에 맞는 / 합법적인","f":2,"i":"법(leg=법)의 도장이 찍혀 정식으로 인정받은 것. 뒷문이 아니라 정문으로 들어온 합법적·정당한."},{"w":"look up","p":"phr.","m":"존경하다, (사전 등으로) 찾아보다","f":2,"i":"고개를 들어(up) 우러러보면 존경, 책 페이지에서 위아래로 눈을 굴려 찾으면 (사전 등을) 찾아보다."},{"w":"reiterate","p":"v.","m":"되풀이하다, 반복하여 말하다","f":2,"i":"갔던 길을 다시(re-다시 + iter길·여정) 밟아 되돌아옴 — 같은 말을 몇 번이고 되풀이해 강조."},{"w":"stack","p":"v.","m":"쌓아 올리다","f":2,"i":"접시를 하나씩 위로 차곡차곡 얹어 높은 탑을 쌓음. 위로 포개어 쌓아 올림."},{"w":"track","p":"v.","m":"추적하다, 뒤를 밟다 n. 궤도, 선로, 흔적","f":2,"i":"눈밭에 찍힌 발자국(흔적)을 하나하나 짚어 뒤를 밟아감. 그래서 추적하다, 그 자국이 이어지면 궤도·선로."},{"w":"trivial","p":"a.","m":"보통의, 평범한, 사소한, 시시한","f":2,"i":"옛 로마에서 세 갈래 길(tri-셋 + via길)이 만나는 길목 — 아무나 서서 떠드는 흔한 잡담거리. 그래서 사소하고 시시한."},{"w":"trust","p":"v.","m":"신뢰하다, 신용하다 n. 신용","f":2,"i":"눈 감고 뒤로 넘어져도 저 사람이 받아줄 거라 온몸을 맡김. 흔들림 없이 기대는 신뢰."},{"w":"undo","p":"v.","m":"원상으로 되돌리다, (매듭을) 풀다","f":2,"i":"이미 한(do) 일을 반대로(un-반대) 되감아 없던 상태로 돌림. 매듭을 풀거나 작업을 원상복구."},{"w":"affect","p":"v.","m":"영향을 미치다, 가장하다","f":2,"i":"밖에서 손을 뻗어(ad-쪽으로 + fect만들다) 대상을 건드려 변화를 일으킴 — 영향을 미치다. cf. effect(결과·초래하다)."},{"w":"confine","p":"v.","m":"한정하다, 제한하다, 구금하다","f":2,"i":"사방의 경계(fin=끝·경계) 안에 함께(con-) 가둬 그 선 밖으로 못 나가게 함. 한정·제한·구금."},{"w":"conscript","p":"v.","m":"징집하다, 징병하다","f":2,"i":"명단(script=쓰다)에 강제로 이름을 올려(con-함께) 군대로 끌어감. 강제 징집."},{"w":"diminish","p":"v.","m":"줄이다, 감소하다","f":2,"i":"큰 덩어리를 조금씩(mini=작게) 아래로(di-) 깎아내려 점점 작아지게 함. 규모·양이 줄어듦."},{"w":"disperse","p":"v.","m":"분산시키다, 흩어지게 하다","f":2,"i":"한 점에 모였던 것을 사방으로(dis-흩어짐 + sperse뿌리다) 확 뿌려 흩어놓음. 군중·안개가 퍼져 사라짐."},{"w":"enhance","p":"v.","m":"강화하다, 높이다","f":2,"i":"이미 있는 걸 발판 위로 한 단 더 올려(en-만들다 + hance높이다) 돋보이게 함. 가치·질을 한층 끌어올림."},{"w":"exhume","p":"v.","m":"(시체를) 발굴하다","f":2,"i":"땅(hum=흙) 속에 묻힌 것을 도로 밖으로(ex-밖으로) 파냄. 시신을 다시 발굴. (문어·격식체)"},{"w":"persistent","p":"a.","m":"지속적인, 고집하는","f":2,"i":"비바람 속에서도 끝까지(per-끝까지관통 + sist서다) 그 자리에 버텨 서 있음. 끈질기게 지속되는·고집하는."},{"w":"refer","p":"v.","m":"언급하다, 참조하다","f":2,"i":"말하다 말고 손가락을 돌려(re-뒤로 + fer나르다) 다른 출처 쪽을 가리킴. 언급하거나 참조하도록 넘김."},{"w":"allege","p":"v.","m":"주장하다, 단언하다","f":2,"i":"증거는 아직 안 내밀고 '저 사람이 그랬다'고 먼저 말로 들이댐(leg=말하다). 확정 전에 일단 주장·단언."},{"w":"apprehend","p":"v.","m":"이해하다, 붙잡다, 체포하다","f":2,"i":"손을 쭉 뻗어(ad-쪽으로 + prehend잡다) 대상을 움켜쥠 — 몸으로 붙잡으면 체포, 머리로 붙잡으면 이해."},{"w":"apprehension","p":"n.","m":"이해, 이해력, 염려, 불안","f":2,"i":"아직 안 온 위험을 미리 마음으로 움켜쥐고(prehend잡다) 조마조마함 — 불안·염려. 붙잡아 파악하면 이해력."},{"w":"be done with","p":"phr.","m":"~을 끝내다","f":2,"i":"접시를 싹 비우고 손 탁탁 털며 '이건 이제 끝'이라 선언. 어떤 일·관계를 완전히 끝냄."},{"w":"dissuade","p":"v.","m":"단념시키다, 만류하다","f":2,"i":"달콤한 말로 끌어당기려는 걸 반대로(dis-반대 + suade권하다) 밀어내 마음을 돌려놓음. 하려는 걸 만류·단념시킴."},{"w":"exuberant","p":"a.","m":"생기에 가득 찬, 풍성한","f":2,"i":"샘물이 넘쳐(ex-밖으로 + uber풍부) 사방으로 콸콸 솟구치는 활력. 억누를 수 없이 생기·기쁨이 넘쳐흐르는."},{"w":"help oneself (to)","p":"v.","m":"(음식을) 마음껏 먹다","f":2,"i":"식탁에서 남 눈치 안 보고 자기 손으로 척척 덜어 먹음. 마음껏 갖다 먹다·쓰다."},{"w":"mitigate","p":"v.","m":"(고통·슬픔 등을) 가라앉히다","f":2,"i":"날카롭게 곤두선 고통을 부드럽게(mit=부드럽게) 눌러 가라앉힘. 통증·처벌·충격을 완화. (문어·격식체)"},{"w":"partake","p":"v.","m":"참가하다, 함께 하다","f":2,"i":"한 접시를 여럿이 나눠(part-부분 + take잡다) 각자 자기 몫을 집어 듦. 함께 참여해 나눠 가짐. (격식체, 보통 take part가 흔함)"},{"w":"present","p":"v.","m":"제공하다 a. 현재의, 오늘날의","f":2,"i":"지금(pre-앞 + sent있다) 눈앞에 놓아 내밀어 보임 — 그래서 제공·제시. 시점이 눈앞이면 현재의."},{"w":"proceed","p":"v.","m":"나아가다, 진출하다 / 시작하다, 착수하여 계속하다","f":2,"i":"잠깐 멈췄다가 다시 앞으로(pro-앞으로 + ceed가다) 발을 떼어 계속 나아감. 하던 일을 이어서 진행."},{"w":"resolve","p":"v.","m":"해결하다, 결심하다","f":2,"i":"엉킨 실뭉치를 도로 풀어(re- + solve풀다) 매듭을 없앰 — 문제를 풀면 해결, 마음속 갈등을 풀어 하나로 굳히면 결심."},{"w":"slack","p":"v.","m":"(의무 등을) 게을리 하다, 방치해 두다 n. 느슨함","f":2,"i":"팽팽하던 밧줄이 축 늘어져 처진 상태. 그 느슨함처럼 할 일을 늘어져 게을리함."},{"w":"vigilant","p":"a.","m":"조심성 있는, 자지 않고 지키는","f":2,"i":"밤새 눈 부릅뜨고(vig=깨어있다) 초소를 지키는 보초. 위험을 놓칠세라 바짝 경계하는."},{"w":"augment","p":"v.","m":"늘리다, 증가시키다","f":2,"i":"이미 찬 그릇에 한 국자 더 부어(aug=늘리다) 양을 불림. 기존에 덧보태 늘림·증대."},{"w":"counter","p":"v.","m":"반격하다, 반대하다, 거스르다","f":2,"i":"맞은편에서(counter-맞서서) 밀어오는 힘을 정면으로 되받아 밀어냄. 반격·반박·거스름."},{"w":"display","p":"v.","m":"보여 주다, 전시하다 / 전시, 진열","f":2,"i":"접어 둔 것을 활짝 펼쳐(dis-흩어짐 + play펼치다) 남 앞에 쫙 벌여 보임. 진열·전시."},{"w":"extenuate","p":"v.","m":"완화하다","f":2,"i":"죄의 무게를 얇게(ex-밖으로 + tenu가늘게) 늘여 펴 가볍게 보이게 함. 정상참작하듯 죄·잘못을 경감. (문어·격식체)"},{"w":"exude","p":"v.","m":"넘치다, 스며나오다","f":2,"i":"땀이 피부 밖으로(ex-밖으로 + ud젖다) 배어 스며 나옴 — 자신감·매력이 몸에서 저절로 새어 나와 풍김."},{"w":"instill","p":"v.","m":"서서히 불어 넣다, 주입하다","f":2,"i":"약병에서 한 방울씩(still=방울) 마음속으로(in-안으로) 똑똑 떨어뜨려 스미게 함. 가치관을 서서히 주입."},{"w":"plead","p":"v.","m":"탄원하다, 변호하다","f":2,"i":"무릎 꿇고 두 손 모아 '제발' 하고 간절히 매달림 — 탄원. 법정에서 대신 목소리 내면 변호."},{"w":"soundly","p":"ad.","m":"깊이, 완전히","f":2,"i":"바닥까지 흔들림 없이 꽉 닿은 상태. 원래 '탈 없이 온전한(sound)' 감각 → 잠이 바닥까지 깊게, 패배가 완전하게, 논리가 빈틈없이 탄탄하게."},{"w":"suppress","p":"v.","m":"억압하다, 진정시키다","f":2,"i":"끓어오르려는 것을 손바닥으로 아래로(sup-=sub 아래) 꾹 눌러 못 나오게 함 (press누르다). 반란도, 웃음도, 정보도 눌러 억누른다."},{"w":"switch","p":"v.","m":"바꾸다, 스위치를 돌리다","f":2,"i":"휙 하고 방향을 홱 틀어 딴 선로로 갈아탐. 회초리가 찰싹 방향 트는 이미지 → 전환하다, 딸깍 켜고 끄다."},{"w":"brandish","p":"v.","m":"휘두르다, 과시하다","f":2,"i":"칼·무기를 머리 위로 들어 눈에 띄게 휘둘러 보이며 위협·과시함. 조용히 든 게 아니라 '봐라' 하고 흔드는 동작."},{"w":"continue","p":"v.","m":"계속하다, 이어지다","f":2,"i":"끊기지 않고 함께(con-) 계속 붙잡고 이어감 (tin=tain 붙잡다). 손을 놓지 않아 줄이 안 끊기는 그림."},{"w":"dissent","p":"n.","m":"이의, 반대 의견","f":2,"i":"다들 한쪽으로 느끼는데 나만 감정이 흩어져 반대편으로 (dis-흩어짐·반대 + sent느끼다). 공식적 반대 의견. (문어·격식체)"},{"w":"grab","p":"v.","m":"(음식 등을) 간단히 먹다, 움켜쥐다","f":2,"i":"지나가며 손을 확 뻗어 낚아채듯 움켜쥠. 음식도 '앉지 않고 후딱 낚아채 먹다', 자리도 잡아채다."},{"w":"hang onto","p":"phr.","m":"~에 매달리다, ~에 의지하다","f":2,"i":"떨어지지 않으려 매달려 꽉 붙든 손. 물리적으로 손잡이를 붙잡거나, 놓기 싫은 물건·희망을 계속 쥐고 있음."},{"w":"messy","p":"a.","m":"어질러진, 지저분한","f":2,"i":"물건이 사방에 흩뿌려져 뒤죽박죽 엉킨 방. 정돈의 반대 → 지저분한, 나아가 상황이 복잡하게 엉킨."},{"w":"represent","p":"v.","m":"상징하다, 대표하다","f":2,"i":"그것을 대신해 다시(re-) 눈앞에 세워 보여줌 (present내놓다). 대신 나서면 대표하다, 대신 가리키면 상징하다."},{"w":"susceptible","p":"a.","m":"민감한, 영향받기 쉬운","f":2,"i":"방어막 없이 아래로 열려 있어 뭐든 쑥 받아들여 잡히는 상태 (sus-=sub 아래 + cept잡다). 병·영향·유혹에 쉽게 걸려든다."},{"w":"turnover","p":"n.","m":"전복, 전도","f":2,"i":"위아래가 홱 뒤집혀 굴러 넘어감 (turn돌다 + over위로 넘어). 뒤집힘 → 뒤집혀 나가고 새로 채워지는 회전율·이직률로도 확장."},{"w":"unyielding","p":"a.","m":"굽히지 않는, 완고한, 단호한","f":2,"i":"밀어도 한 치도 밀리지 않고 버티는 벽 (un-부정 + yield양보하다). 물러섬 없이 딱 버팀 → 완고한, 단호한."},{"w":"allot","p":"v.","m":"할당하다, 배당하다","f":2,"i":"몫을 제비뽑기하듯 뚝뚝 떼어 각자에게(al-
