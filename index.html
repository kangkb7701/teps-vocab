 빛나는 즐거움."},{"w":"fixation","p":"n.","m":"집착, 강박 관념","f":0,"i":"한 지점에 못을 박아(fix고정) 시선·마음이 딱 붙어 안 떨어짐. 벗어나지 못하고 매달린 상태 — 집착·강박."},{"w":"hypnosis","p":"n.","m":"최면 상태, 최면술","f":0,"i":"의식이 잠(hypn-잠) 밑으로 스르르 가라앉아 남의 암시에 따라 움직이는 상태. 반쯤 잠든 최면."},{"w":"hypochondria","p":"n.","m":"우울증","f":0,"i":"갈비뼈 아래(hypo-아래+chondr연골) 배 언저리를 자꾸 만지며 병났나 걱정함 — 옛 의학에서 이 부위를 우울·건강염려의 자리로 봄. 실은 건강염려증에 가까움(뜻풀이의 우울증은 다소 부정확)."},{"w":"mass psychology","p":"phr.","m":"대중 심리","f":0,"i":"한 사람이 아닌 덩어리(mass) 무리 전체가 함께 휩쓸리는 마음의 흐름 — 대중 심리."},{"w":"maturation","p":"n.","m":"성숙, 성숙기","f":0,"i":"설익은 열매가 시간을 먹고 서서히 무르익어(mature) 완성 상태로 가는 과정 — 성숙. (학술·문어체)"},{"w":"mind-set","p":"n.","m":"사고 방식, 심적 경향","f":0,"i":"마음(mind)이 굳어(set) 한 방향으로 세팅된 틀. 콘크리트처럼 굳은 사고의 기본 설정 — 사고방식."},{"w":"mental","p":"a.","m":"정신의","f":0,"i":"몸이 아닌 머릿속·마음(ment-정신) 안에서 일어나는 것. 정신의·심적인."},{"w":"obsession","p":"n.","m":"강박 관념","f":0,"i":"생각 하나가 문 앞을 딱 막아서(ob-맞서서+sess앉다) 온종일 머릿속을 점령해 안 비켜줌 — 강박 관념."},{"w":"psychology","p":"n.","m":"심리학","f":0,"i":"영혼·마음(psych-)을 대상으로 삼아 파고드는 학문(-logy). 마음의 작동 원리를 연구 — 심리학."},{"w":"psychotherapy","p":"n.","m":"정신 심리 요법","f":0,"i":"약이 아니라 대화로 마음(psycho-)을 어루만져 고침(therapy-치료). 정신을 다스리는 치료 — 심리 요법."},{"w":"self-defense","p":"n.","m":"자기 방어","f":0,"i":"누가 치려 할 때 자기(self) 앞에 팔을 들어 막아섬(defend 아래로+치다를 쳐냄). 스스로를 지키는 방어."},{"w":"traumatic","p":"a.","m":"정신적 충격이 큰","f":0,"i":"지워지지 않는 상처(trauma-외상)를 마음에 깊이 낸. 겪은 뒤 오래 흉터로 남는 — 정신적 충격이 큰."},{"w":"administraion","p":"n.","m":"경영","f":0,"i":"누군가에게 손을 뻗어(ad-쪽으로) 봉사·관리하며(minister) 일을 돌봄. 조직을 굴러가게 운영·경영. (철자는 administration이 맞음)"},{"w":"arbitration","p":"n.","m":"중재, 조정","f":0,"i":"다투는 양쪽 사이에 제3자 심판(arbiter)이 들어와 판정을 내려 갈등을 정리 — 중재·조정."},{"w":"auction","p":"n.","m":"경매","f":0,"i":"값을 위로 계속 올려가며(auc-늘리다, augment과 같은 뿌리) 최고가 부르는 사람에게 넘기는 판 — 경매."},{"w":"audit","p":"n.","m":"회계 감사 v. 감사하다","f":0,"i":"장부를 귀 기울여 들여다보듯(audi-듣다, 원래 회계 보고를 소리 내어 들음) 샅샅이 검사 — 회계 감사."},{"w":"bailout","p":"n.","m":"긴급 융자, 비상 구제","f":0,"i":"물 새는 배에서 물을 퍼내(bail) 밖으로(out) 빼주듯, 가라앉는 회사에 급히 돈을 부어 건져냄 — 긴급 구제."},{"w":"balance","p":"n.","m":"잔고","f":0,"i":"저울(balance) 양쪽 접시가 맞고 남은 무게. 들어온 것과 나간 것을 맞추고 남은 액수 — 잔고."},{"w":"bear market","p":"phr.","m":"(주식) 약세 시장","f":0,"i":"곰(bear)이 앞발을 위에서 아래로 내리치듯 주가가 짓눌려 내려가는 시장 — 약세장."},{"w":"bond","p":"n.","m":"채권","f":0,"i":"돈을 빌려주고 갚겠다는 약속으로 서로를 묶는(bond-끈·유대) 증서. 그 채무의 끈 — 채권."},{"w":"bottom line","p":"phr.","m":"이익","f":0,"i":"장부 맨 아래(bottom) 줄에 최종으로 남는 순이익 숫자. 다 따지고 남는 결론·핵심 — 이익."},{"w":"bounce","p":"v.","m":"(수표가) 부도나다","f":0,"i":"던진 공이 벽에 맞고 도로 튕겨(bounce) 돌아오듯, 수표가 은행에서 거부돼 되돌아옴 — 부도나다."},{"w":"boycott","p":"n.","m":"불매 운동","f":0,"i":"다 함께 짜고 그 가게 물건을 안 사며 등 돌려버림 (Boycott이라는 사람 이름에서 유래). 뜻 그대로 불매 운동."},{"w":"brand-new","p":"a.","m":"아주 새로운, 신품의","f":0,"i":"대장간 인두(brand)로 막 찍어낸 듯 방금 나온, 손도 안 탄 새것. 아주 새로운·신품."},{"w":"brochure","p":"n.","m":"광고용 소책자","f":0,"i":"얇은 종이를 바늘로 꿰매어(broch-찌르다·꿰다) 엮은 작은 홍보 책자 — 광고용 소책자."},{"w":"bull market","p":"phr.","m":"(주식) 강세 시장","f":0,"i":"황소(bull)가 뿔을 아래에서 위로 치받아 올리듯 주가가 힘차게 오르는 시장 — 강세장."},{"w":"capital","p":"n.","m":"자본","f":0,"i":"머리(capit-머리)에 해당하는 밑천. 사업이 굴러가려면 맨 위에 있어야 할 근본 자금 — 자본."},{"w":"career prospect","p":"phr.","m":"직업 전망","f":0,"i":"직업 길(career) 저 앞을 미리 내다봄(pro-앞+spect보다). 앞으로 펼쳐질 진로 전망."},{"w":"choice range","p":"phr.","m":"선택 범위","f":0,"i":"고를 수 있는(choice) 선택지들이 놓인 폭·사거리(range). 선택 범위."},{"w":"collaborative","p":"a.","m":"협력적인, 공동 제작의","f":0,"i":"여럿이 함께(col-함께) 노동(labor)을 얹어 하나를 만들어냄. 손을 맞대는 — 협력적인."},{"w":"collectively","p":"ad.","m":"집단으로, 공동으로","f":0,"i":"흩어진 것을 함께(col-) 골라 모아(lect) 한 덩어리로. 따로가 아니라 뭉쳐서 — 집단으로."},{"w":"commerce","p":"n.","m":"상업, 통상, 무역","f":0,"i":"물건(merc-상품)을 서로(com-함께) 주고받으며 오가는 거래의 흐름 — 상업·통상."},{"w":"corporation","p":"n.","m":"주식회사, 법인","f":0,"i":"여러 사람을 하나의 법적 몸(corp-몸)으로 묶어 만든 단일 인격체. 사람처럼 취급되는 법인·주식회사."},{"w":"coverage","p":"n.","m":"(보험 등의) 보상 범위","f":0,"i":"우산처럼 덮어(cover) 보호해 주는 범위. 그 덮개가 미치는 넓이 — 보상 범위."},{"w":"creditor","p":"n.","m":"채권자","f":0,"i":"남을 믿고(cred-믿다) 돈을 내준 사람. 그 믿음의 대가로 돌려받을 권리를 쥔 쪽 — 채권자."},{"w":"deduction","p":"n.","m":"공제, 공제액","f":0,"i":"전체에서 일부를 아래로 끌어내(de-아래+duct이끌다) 빼냄. 월급에서 떼가는 공제·공제액."},{"w":"default","p":"n.","m":"채무 불이행","f":0,"i":"해야 할 것을 안 하고(de-아래로+faul실패) 무너뜨림. 갚기로 한 빚을 이행 안 함 — 채무 불이행."},{"w":"defraud","p":"v.","m":"횡령하다","f":0,"i":"속임수(fraud-사기)로 남의 것을 빼내 감(de-분리). 남을 등쳐 재산을 앗음 — 횡령·사취하다."},{"w":"delinquent","p":"a.","m":"직무 태만의","f":0,"i":"해야 할 의무를 뒤에 버려두고(de-분리+linqu-남기다) 안 함. 제 할 일 방치한 — 직무 태만의 (연체된 뜻도)."},{"w":"depression","p":"n.","m":"불경기, 불황","f":0,"i":"경기가 바닥으로 짓눌려(de-아래+press누르다) 푹 꺼진 상태. 마음이든 경제든 아래로 눌림 — 불황."},{"w":"discredit","p":"v.","m":"신용을 떨어뜨리다","f":0,"i":"믿음(cred-믿다)을 흩어(dis-) 떼어내 깎아버림. 쌓인 신용을 무너뜨림 — 신용을 떨어뜨리다."},{"w":"dismissal","p":"n.","m":"면직, 해고","f":0,"i":"붙어 있던 사람을 흩어(dis-) 멀리 보내버림(miss-보내다). 자리에서 내보냄 — 면직·해고."},{"w":"dividend","p":"n.","m":"배당금","f":0,"i":"이익을 여럿에게 갈라(divid-나누다) 나눠줄 몫. 주주에게 쪼개 돌려주는 돈 — 배당금."},{"w":"domestic","p":"a.","m":"국내의","f":0,"i":"집(domes-집) 울타리 안쪽에 속한 것. 밖(해외)이 아닌 집·나라 안의 — 국내의·가정의."},{"w":"downsizing","p":"n.","m":"인원 삭감","f":0,"i":"회사의 몸집(size)을 아래로(down) 줄여 사람·조직을 깎아냄 — 인원 삭감."},{"w":"efficient","p":"a.","m":"능률적인, 효율적인","f":0,"i":"빈틈없이 짜인 기계가 연료를 하나도 안 버리고 최대 출력을 뽑아내는 느낌 (ef-=ex-밖으로 + fic만들다). 힘을 밖으로 알뜰하게 만들어내니 능률적."},{"w":"embargo","p":"n.","m":"(수출) 금지","f":0,"i":"항구 입구에 빗장을 걸어 배가 못 나가게 막아둠 (스페인어 embargar-막다). 그래서 특정국·품목의 수출입을 국가가 금지하는 것."},{"w":"employee","p":"n.","m":"피고용인, 종업원","f":0,"i":"고용주가 자기 일 속(em-=in-안으로)으로 사람을 끌어넣어 부리는 대상. -ee는 당하는 쪽 → 고용을 당한 사람, 즉 종업원."},{"w":"enterprise","p":"n.","m":"기업","f":0,"i":"위험을 무릅쓰고 손을 안으로 뻗어 붙잡아 벌이는 큰 사업 (enter-사이로 + prise붙잡다). 그 모험적 사업체가 곧 기업."},{"w":"establishment","p":"n.","m":"가게, 상점","f":0,"i":"땅에 말뚝을 박아 흔들리지 않게 세워둔 것 (sta-서다). 세워 자리 잡은 시설·기관, 좁게는 문 열고 장사하는 가게·업소."},{"w":"exchange","p":"v.","m":"환전하다","f":0,"i":"두 사람이 손에 든 것을 서로 맞바꿔 밖으로 넘김 (ex-밖으로 + change바꿈). 돈끼리 맞바꾸면 환전."},{"w":"expenditure","p":"n.","m":"지출, 세출, 지불, 소비","f":0,"i":"지갑에서 돈을 밖으로 저울에 달아 내보냄 (ex-밖으로 + pend달다·매달다). 나가는 돈, 즉 지출. (문어·격식체, 회화선 spending)"},{"w":"fire","p":"v.","m":"해고하다","f":0,"i":"쏘아버리듯 순식간에 직장 밖으로 튕겨 내보냄. 총을 쏘는(fire) 그 확 내치는 느낌이 해고에 그대로. (구어)"},{"w":"fluctuation","p":"n.","m":"변화, 변동","f":0,"i":"물결이 위로 아래로 끝없이 출렁이는 모습 (flu흐르다). 그 오르내림이 환율·물가의 변동."},{"w":"go bankrupt","p":"phr.","m":"파산하다","f":0,"i":"장사꾼의 거래대(banca)가 부러져(rupt깨지다) 더는 영업 못 하는 상태로 들어감. 밑천이 깨져 파산."},{"w":"government intervention","p":"phr.","m":"정부의 중재, 시장 개입","f":0,"i":"정부가 시장이라는 두 힘 사이(inter-사이 + ven오다)로 걸어 들어와 개입함. 알아서 굴러가게 두지 않고 끼어드는 것."},{"w":"gross","p":"a.","m":"총체의, 총계의 n. 총계","f":0,"i":"포장·군더더기 다 붙인 채 통째로 잰 큰 덩어리 (원뜻 두툼한·거친). 아무것도 안 뺀 총계 → 순(net)의 반대."},{"w":"haggle","p":"v.","m":"값을 깎다, 논쟁하다","f":0,"i":"가격을 놓고 서로 톱질하듯 밀고 당기며 깎아대는 실랑이. 시장에서 값 깎는 그 끈질긴 흥정."},{"w":"headquarters","p":"n.","m":"본사, 본부","f":0,"i":"군대의 사령관(head)이 자리 잡은 숙영지(quarters). 조직의 머리가 있는 곳, 즉 본사·본부. 항상 -s."},{"w":"incur","p":"v.","m":"(빚 등을) 지다, (손실을) 입다","f":0,"i":"제 발로 그 안으로 달려 들어가 나쁜 결과를 뒤집어씀 (in-안으로 + cur달리다). 빚·손실·비난을 스스로 불러 짊어짐. (문어·격식체)"},{"w":"industrial","p":"a.","m":"산업의, 실업의, 공업의","f":0,"i":"쉼 없이 안에서 부지런히 돌아가는 공장 지대의 이미지 (industria근면). 산업의·공업의. 참고: industrious=근면한(사람)."},{"w":"inflation","p":"n.","m":"인플레이션, 통화 팽창","f":0,"i":"풍선에 바람을 계속 불어넣어(in-안으로 + flat불다) 몸집만 부풀어 오름. 돈이 부풀어 값어치가 얇아지는 통화 팽창."},{"w":"installment","p":"n.","m":"할부(금)","f":0,"i":"큰 짐을 한 칸(stall)씩 자리에 앉히듯 나눠 넣는 것. 값을 여러 번에 쪼개 앉히는 할부."},{"w":"interest-free","p":"a.","m":"무이자의","f":0,"i":"이자(interest)라는 짐이 완전히 벗겨진(-free) 상태. 빌려도 덤으로 붙는 게 없는 무이자."},{"w":"invoice","p":"n.","m":"송장","f":0,"i":"물건과 값을 목록으로 적어 상대에게 보내는 청구 목소리(voice) 같은 서류. 뭘 얼마에 보냈다는 명세서, 송장."},{"w":"labor productivity","p":"phr.","m":"노동 생산성","f":0,"i":"일꾼 한 명이 정해진 시간에 얼마나 많이 뽑아내는지 재는 눈금. 노동이 만들어내는(product) 산출의 밀도, 노동 생산성."},{"w":"levy","p":"v.","m":"징수하다, 부과하다","f":0,"i":"권위자가 사람들 위에 손을 얹어(lev올리다·거두다) 돈이나 병력을 걷어 올림. 세금을 부과·징수함. (문어·격식체)"},{"w":"liability insurance","p":"phr.","m":"책임자 보험","f":0,"i":"내가 남에게 끼칠 손해라는 무거운 짐(liable-묶여 책임진)을 대신 받쳐주는 보험. 배상 책임을 덮어주는 보험."},{"w":"liquidation","p":"n.","m":"청산, 파산","f":0,"i":"굳어 있던 회사 재산을 물처럼 녹여(liquid액체) 흘려보내 빚을 갚고 정리함. 자산을 현금으로 풀어 청산·파산 정리."},{"w":"M&A(=merger and acquisition)","p":"n.","m":"기업 인수 합병","f":0,"i":"두 회사를 하나로 녹여 합치거나(merge잠기다·섞이다) 한쪽이 다른 쪽을 통째로 사서 손에 넣음(acquire). 기업 인수 합병."},{"w":"manage","p":"v.","m":"경영하다, 관리하다","f":0,"i":"손(manu-손)으로 사나운 말의 고삐를 잡고 원하는 대로 부리는 모습. 사람·일을 손안에서 다루는 경영·관리."},{"w":"management","p":"n.","m":"경영진","f":0,"i":"고삐를 쥔 손들의 집단 — 회사를 손에 넣고 부리는 사람들, 즉 경영진."},{"w":"managerial","p":"a.","m":"경영(자)의, 관리(자)의","f":0,"i":"고삐 쥔 손의 시선에서 바라보는, 관리하는 자리에 속한. 경영자의·관리자의."},{"w":"mediation","p":"n.","m":"중재","f":0,"i":"다투는 양쪽 한가운데(medi-가운데)에 제3자가 서서 둘을 이어줌. 사이에 끼어 갈등을 풀어주는 중재."},{"w":"monopoly","p":"n.","m":"독점","f":0,"i":"장터에서 딱 한(mono-하나) 사람만 팔(poly판매) 권리를 쥐어 다 틀어막음. 시장을 혼자 다 먹는 독점."},{"w":"moratorium","p":"n.","m":"지불 유예 기간","f":0,"i":"빚 갚기를 잠시 멈추고(mora지연) 시계를 세워둔 유예 기간. 갚아야 할 시점을 뒤로 미뤄준 정지 상태. (격식·전문어)"},{"w":"on credit","p":"phr.","m":"외상으로, 신용 대출로","f":0,"i":"믿음(credit-믿다) 위에 얹어 지금 돈 없이 물건부터 가져감. 나중에 갚기로 하고 외상으로."},{"w":"outlet","p":"n.","m":"소매점, 직판점, 판매장","f":0,"i":"물·상품이 밖으로(out-) 흘러 빠져나가는 출구. 재고를 밖으로 흘려보내는 소매·직판점."},{"w":"payroll","p":"n.","m":"급여 지급 명부","f":0,"i":"직원 이름을 죽 말아 적은(roll두루마리) 급여 명단. 누구에게 얼마 준다를 적어둔 급여 지급 명부."},{"w":"plant","p":"n.","m":"(공장) 단지","f":0,"i":"땅에 심듯(plant심다) 붙박이로 크게 세워둔 생산 설비 덩어리. 기계가 심겨 돌아가는 공장 단지."},{"w":"productive","p":"a.","m":"생산적인, 생산하는","f":0,"i":"앞으로(pro-앞으로 + duct이끌다) 계속 결과물을 이끌어내 쏟아냄. 자꾸 만들어내는 생산적인."},{"w":"publicity","p":"n.","m":"광고, 선전","f":0,"i":"무대 조명을 켜서 뭇 사람(public) 눈앞에 확 드러내 보임. 대중에게 널리 알리는 광고·선전, 세간의 주목."},{"w":"receipt","p":"n.","m":"영수증","f":0,"i":"돈을 도로 받아(re-뒤로 + cip잡다) 쥐었다는 증표를 손에 되돌려줌. 받았음을 적어준 종이, 영수증. p는 묵음(리시트)."},{"w":"recession","p":"n.","m":"경기 침체, 불경기","f":0,"i":"앞으로 나가던 경기가 슬금슬금 뒤로(re-뒤로 + cess가다) 물러남. 성장이 후퇴하는 경기 침체."},{"w":"recruit","p":"v.","m":"충원하다, (새로) 고용하다","f":0,"i":"새싹이 다시 돋듯(re-다시 + cru자라다) 빠진 인원을 새로 길러 채워 넣음. 사람을 뽑아 충원함."},{"w":"refundable","p":"a.","m":"환불 가능한","f":0,"i":"냈던 돈을 도로(re-뒤로 + fund부어넣다) 부어 돌려받을 수 있는 상태. 환불 가능한."},{"w":"reimbursement","p":"n.","m":"변상, 배상","f":0,"i":"지갑(bursa돈주머니) 속으로 도로(re-뒤로) 돈을 다시 넣어줌. 남이 대신 쓴 돈을 채워 갚는 변상·상환. (문어·격식체)"},{"w":"remittance","p":"n.","m":"송금","f":0,"i":"돈을 상대 쪽으로 되돌려 보냄(re- + mit보내다). 부쳐 보내는 송금(액). (격식체)"},{"w":"restructuring","p":"n.","m":"구조 조정","f":0,"i":"무너진 건물의 뼈대(structure)를 다시(re-) 짜 맞춰 세움. 회사 조직을 다시 짜는 구조 조정."},{"w":"retail","p":"n.","m":"소매","f":0,"i":"큰 덩어리를 다시(re-) 잘게 잘라(tail-자르다) 낱개로 손님에게 넘김. 쪼개 파는 소매. 반대는 wholesale(도매)."},{"w":"self-sufficiency","p":"n.","m":"자급 자족","f":0,"i":"밖에서 안 들여와도 제 힘으로 밑에서 충분히(suffic-아래로 채우다) 대는 상태. 스스로 다 대는 자급자족."},{"w":"shareholder","p":"n.","m":"주주","f":0,"i":"회사를 나눈 조각(share)을 손에 쥔(hold) 사람. 지분을 들고 있는 주주."},{"w":"shut down","p":"phr.","m":"~을 폐쇄하다, 휴업하다","f":0,"i":"가게 셔터를 아래로(down) 확 내려 닫음. 문 닫고 가동을 멈추는 폐쇄·휴업."},{"w":"smuggler","p":"n.","m":"밀수업자","f":0,"i":"몰래 옷 속에 숨겨(원뜻 슬며시 밀어넣다) 세관을 빠져나가는 자. 밀수업자."},{"w":"solvency","p":"n.","m":"지불 능력","f":0,"i":"묶인 빚을 풀어(solv풀다) 없앨 만큼 돈이 있는 상태. 빚을 녹여 갚을 수 있는 지불 능력. 반대 insolvency(지급 불능). (전문어)"},{"w":"statistics","p":"n.","m":"통계, 통계 자료","f":0,"i":"국가(state) 상태를 숫자로 세워 늘어놓은 데이터. 상태를 수치로 잡은 통계. 학문이면 단수, 자료면 복수 취급."},{"w":"surplus","p":"n.","m":"흑자","f":0,"i":"그릇을 채우고도 위로(sur-위에 + plus더) 넘쳐 남은 부분. 쓰고 남은 것, 흑자·잉여. 반대 deficit(적자)."},{"w":"tax rebate","p":"phr.","m":"세금 환급","f":0,"i":"냈던 세금 일부를 다시(re-) 때려(bate두드려 깎다) 돌려줌. 되돌려받는 세금 환급."},{"w":"treasury","p":"n.","m":"국고, 자금","f":0,"i":"귀중품을 쌓아두는(thesaurus보물창고) 금고. 나라 돈을 쟁여둔 국고, 자금."},{"w":"unemployment rate","p":"phr.","m":"실업률","f":0,"i":"일자리에 안(un-) 들어간 사람들의 비율 눈금. 노는 사람 몫이 얼마인지 재는 실업률."},{"w":"voucher","p":"n.","m":"(현금 대용의) 인환권, 상품권","f":0,"i":"이건 진짜라고 보증해주는(vouch-보증하다) 종이 딱지. 현금 대신 값을 쳐주는 인환권·상품권."},{"w":"advertising agency","p":"phr.","m":"광고 대행사","f":0,"i":"남 대신(agent대리) 광고를 만들어 세상에 돌려주는 회사. 광고를 맡아 하는 대행사."},{"w":"alienation","p":"n.","m":"소외","f":0,"i":"한때 내 자리였던 곳에서 남(alien-남·이방인)이 되어 밀려나 겉도는 상태. 끼지 못하고 동떨어진 소외."},{"w":"alumnus","p":"n.","m":"동창회, 동창생 (복수형 alumni)","f":0,"i":"학교라는 어미 품에서 길러져(al-기르다) 자라 나온 사람. 그 학교가 키운 졸업생·동문. 복수는 alumni(알럼나이). (격식·라틴어)"},{"w":"ancestry","p":"n.","m":"혈통, 족보","f":0,"i":"나보다 앞서(ance-=ante앞으로 + cess가다) 걸어간 조상들이 줄줄이 이어진 핏줄. 거슬러 올라가는 혈통·가계."},{"w":"anonymity","p":"n.","m":"익명, 무명","f":0,"i":"이름표를 떼어내(a-없이 + onym이름) 얼굴 없는 군중 속에 섞여 누구인지 지목할 수 없는 상태. 그래서 익명·무명."},{"w":"bachelor","p":"n.","m":"미혼남, 독신남","f":0,"i":"결혼이라는 짝의 사슬에 아직 묶이지 않은 혼자 사는 남자. 특별한 어원 이미지 없음 — 뜻 그대로. 학사 학위 뜻도 있음."},{"w":"broadcast","p":"n.","m":"방송 v. 방송하다","f":0,"i":"씨앗을 손으로 넓게(broad) 흩뿌리듯(cast던지다) 전파를 사방에 퍼뜨림. 그래서 방송."},{"w":"bulletin board","p":"phr.","m":"게시판","f":0,"i":"짧은 공지 쪽지(bulletin)를 핀으로 콕콕 꽂아두는 벽에 걸린 판. 뜻 그대로 게시판."},{"w":"burial","p":"n.","m":"매장, 장례식","f":0,"i":"흙 속에 시신을 넣고 덮어 파묻음(bury). 땅 아래로 감추는 동작 — 매장·장례."},{"w":"carriage","p":"n.","m":"탈것, 차","f":0,"i":"사람이나 짐을 실어 나르는(carry) 바퀴 달린 탈것. 옛 마차, 기차 객차. 실어 나름이 핵심."},{"w":"celebration","p":"n.","m":"식, 축하, 축전, 의식, 성찬식","f":0,"i":"여럿이 한데 모여 떠들썩하게 기림. 특별한 공간 이미지보단 '모여서 기린다'는 동작 — 축하·의식·성찬식."},{"w":"celebrity","p":"n.","m":"유명 인사","f":0,"i":"사람들 입에 오르내려(celebrate기리다) 널리 알려진 유명 인사. 군중의 시선이 쏠리는 한 사람."},{"w":"censor","p":"v.","m":"검열하다","f":0,"i":"인구조사관(census)의 눈처럼 하나하나 훑어보며 걸러낼 것을 도려냄. 그래서 검열하다."},{"w":"census","p":"n.","m":"국세 조사, 인구 조사","f":0,"i":"나라가 국민을 한 명씩 세어 명부에 올림. 머릿수를 훑어 기록하는 국가의 눈 — 인구 조사."},{"w":"clan","p":"n.","m":"씨족, 일족","f":0,"i":"같은 조상의 피로 한 덩어리로 뭉친 부족. 뜻 그대로 씨족·일족."},{"w":"collective behavior","p":"phr.","m":"집단 행동","f":0,"i":"낱개들이 한데(collect모으다) 모여 하나의 무리처럼 함께 움직임. 뜻 그대로 집단 행동."},{"w":"commercial","p":"n.","m":"상업 광고","f":0,"i":"물건을 팔려고(commerce상업) TV·라디오 사이에 끼워 파는 광고 토막. 그래서 상업 광고."},{"w":"community","p":"n.","m":"공동 사회, 지역 사회","f":0,"i":"같은 담장 안에서 함께(com-함께) 어울려 사는 사람들의 묶음. 그래서 공동체·지역 사회."},{"w":"commute","p":"v.","m":"통근하다","f":0,"i":"매일 같은 길을 왕복으로 갈아타며(com-함께 + mut바꾸다) 오감. 집과 직장을 오가는 통근."},{"w":"commuter","p":"n.","m":"통근자","f":0,"i":"매일 정해진 노선을 왕복하는 사람 — 통근자. commute하는 사람."},{"w":"correspondent","p":"n.","m":"특파원, 투고자","f":0,"i":"멀리서 서로(cor-함께 + respond응답) 소식을 주고받으며 현장 기사를 보내오는 사람 — 특파원·투고자."},{"w":"cosmopolitan","p":"a.","m":"전 세계적인, 국제적인","f":0,"i":"온 우주(cosmo세계) 어디든 자기 도시(polis)처럼 편히 사는 사람. 국경 없이 세계적인."},{"w":"crossroad","p":"n.","m":"교차로","f":0,"i":"두 길이 가로질러(cross) 십자로 겹치는 지점 — 교차로. 갈림길 은유로도 씀."},{"w":"crosswalk","p":"n.","m":"횡단보도","f":0,"i":"찻길을 가로질러(cross) 걸어(walk) 건너도록 그은 줄무늬 길 — 횡단보도."},{"w":"cultural diversity","p":"phr.","m":"문화적 다양성","f":0,"i":"여러 갈래로(di-갈라짐) 다르게 뻗은 문화들이 한자리에 섞여 있음 — 문화적 다양성."},{"w":"deadline","p":"n.","m":"마감 기한","f":0,"i":"이 선(line)을 넘으면 끝장(dead) — 원래 감옥 경계선, 넘으면 총살. 그래서 넘으면 안 되는 마감 기한."},{"w":"demographics","p":"n.","m":"인구 통계","f":0,"i":"국민(demo사람들)을 나이·성별로 갈라 그래프로 그림(graph) — 인구 통계."},{"w":"descendant","p":"n.","m":"자손","f":0,"i":"핏줄을 타고 아래로(de-아래로 + scend오르다) 내려온 사람. 위 조상에서 흘러내린 자손."},{"w":"district","p":"n.","m":"지역","f":0,"i":"선을 그어 따로 떼어 묶은(di-떨어져 + strict조이다) 구역 — 지역·행정구."},{"w":"divorce","p":"n.","m":"이혼 v. 이혼하다","f":0,"i":"한 몸이던 부부를 서로 다른 방향으로(di-갈라짐) 갈라 떼어놓음 — 이혼."},{"w":"dweller","p":"n.","m":"거주자","f":0,"i":"한곳에 눌러앉아(dwell머무르다) 사는 사람 — 거주자. city dweller처럼 씀."},{"w":"editorial","p":"n.","m":"(신문의) 사설","f":0,"i":"편집자(editor)가 신문의 목소리로 직접 쓴 의견 글 — 사설."},{"w":"editor in chief","p":"phr.","m":"편집장","f":0,"i":"편집자들 맨 위(chief우두머리)에 앉은 총책임자 — 편집장."},{"w":"emancipation","p":"n.","m":"해방","f":0,"i":"손(man손)에 잡혀 있던 것을 놓아(e-밖으로) 풀어줌. 노예의 사슬을 벗겨내는 해방."},{"w":"enlightened","p":"a.","m":"계몽된, 문명화된, 개화된","f":0,"i":"머릿속에 빛(light)을 밝혀 넣어(en-) 어둠(무지)이 걷힌 상태 — 계몽된·개화된."},{"w":"ennoble","p":"v.","m":"고상하게 하다, 품격을 높이다","f":0,"i":"누군가에게 고귀함(noble)을 입혀(en-) 격을 위로 끌어올림 — 품격을 높이다."},{"w":"entertainment","p":"n.","m":"오락","f":0,"i":"사람들을 붙잡아(tain잡다) 그 사이(enter-사이)에 붙들어 두고 지루하지 않게 함 — 오락."},{"w":"ethnic","p":"a.","m":"민족의, 인종의","f":0,"i":"같은 핏줄·풍습으로 묶인 한 민족(ethnos) 특유의 색깔 — 민족의·인종의."},{"w":"fad","p":"n.","m":"일시적 유행","f":0,"i":"확 타올랐다 금세 꺼지는 반짝 불꽃 같은 유행. 특별한 어원 이미지 없음 — 일시적 유행. trend보다 더 짧고 가벼움."},{"w":"frill","p":"n.","m":"허식, 주름 장식","f":0,"i":"옷단에 달린 하늘거리는 주름 장식. 없어도 되는 군더더기 → 허식."},{"w":"funeral","p":"n.","m":"장례식","f":0,"i":"고인을 떠나보내며 치르는 엄숙한 의식 — 장례식. 특별한 공간 이미지 없음, 뜻 그대로."},{"w":"future generation","p":"phr.","m":"미 ze","p":"v.","m":"공인하다, 법률상 정당하다고 인정하다","f":0,"i":"회색지대에 있던 것을 법(leg법) 테두리 안으로 끌어들여 '합법'이라 도장 찍음 — 합법화하다."},{"w":"legislation","p":"n.","m":"법규, 입법 조치","f":0,"i":"법(leg법)을 실어 나르듯 만들어 세상에 내놓는 행위와 그 결과물 — 입법·법규. (문어체)"},{"w":"liable","p":"a.","m":"책임을 져야 할, 의무가 있는","f":0,"i":"어떤 결과에 끈으로 묶여(li묶다) 책임을 지게 매인 상태. be liable for damages(손해 배상 책임이 있다)처럼."},{"w":"liberal","p":"a.","m":"자유주의의, 진보적인, 개혁적인","f":0,"i":"묶인 것을 풀어 자유롭게(liber자유) 놓아주려는 — 관대한·자유주의의·진보적인. conservative의 반대편."},{"w":"litigation","p":"n.","m":"소송, 기소","f":0,"i":"서로 물고 늘어지며 법정에서 다투는 긴 싸움(litig다투다) — 소송. (문어·법률체)"},{"w":"minister","p":"n.","m":"장관","f":0,"i":"더 작은(mini작다) 자로서 위를 섬기던 '봉사자'가 지위가 올라 나랏일을 맡은 장관·성직자로. 섬김의 흔적이 남은 말."},{"w":"murder","p":"n.","m":"살인 v. 살해하다","f":0,"i":"피가 튀는 잔혹한 고의 살인. homicide가 중립 법률어라면 murder는 감정과 악의가 실린 무거운 말."},{"w":"no-fault","p":"a.","m":"과실 책임자를 따지지 않는","f":0,"i":"누구 잘못(fault)인지 따지지 않고 처리하는 — no-fault divorce(책임 안 묻는 이혼)처럼. 과실 불문의."},{"w":"petition","p":"n.","m":"청원, 탄원","f":0,"i":"간절히 청하며(petit구하다) 여럿의 서명을 모아 위에 내미는 청원서 — 청원·탄원."},{"w":"pirate","p":"n.","m":"약탈","f":0,"i":"바다 위에서 남의 배를 덮쳐 약탈하는 해적. 저작물을 훔치면 '해적판'으로 확장 — 불법 복제하다."},{"w":"plaintiff","p":"n.","m":"원고, 고소인","f":0,"i":"억울함을 호소하며(plaint하소연) 소송을 건 쪽 — 원고·고소인. defendant(피고)와 짝. (법률체)"},{"w":"policy maker","p":"phr.","m":"정책 입안자","f":0,"i":"나라의 방침·정책(policy)을 만들어내는 사람 — 정책 입안자."},{"w":"political party","p":"phr.","m":"정당","f":0,"i":"같은 정치 성향끼리 갈라져 나온 한 편(party부분) — 정당."},{"w":"poll","p":"n.","m":"여론 조사, 투표","f":0,"i":"사람들 머릿수(원래 poll=머리)를 하나하나 세어 의견을 집계함 — 여론 조사·투표."},{"w":"principle","p":"n.","m":"원리, 원칙, 법칙","f":0,"i":"맨 처음(prin처음) 붙잡아야 할 뿌리가 되는 근본 규칙 — 원리·원칙. 발음 같은 principal(교장·주요한)과 혼동 주의."},{"w":"probation","p":"n.","m":"집행 유예","f":0,"i":"'앞으로 잘하나' 시험(prob시험)하며 지켜보는 유예 기간 — 집행 유예·수습. 감옥 대신 지켜보기."},{"w":"propaganda","p":"n.","m":"선전","f":0,"i":"한쪽 생각의 씨앗을 앞으로 널리 퍼뜨려(pro-앞으로 + prop번식시키다) 심는 선전. 부정적 색이 강함."},{"w":"proponent","p":"n.","m":"제안자, 지지자","f":0,"i":"어떤 안을 앞으로 내놓고(pro-앞 + pon놓다) 밀어주는 사람 — 제안자·지지자. opponent(반대자)와 짝."},{"w":"radical","p":"a.","m":"급진적인, 과격한, 혁명적인","f":0,"i":"뿌리(radic뿌리)까지 통째로 갈아엎으려는 — 근본적·급진적. 뿌리부터 건드리니 과격."},{"w":"referendum","p":"n.","m":"국민 투표","f":0,"i":"결정을 국민에게 다시 되돌려(re-다시 + fer나르다) 물어 표로 확정하는 것 — 국민 투표."},{"w":"refugee","p":"n.","m":"망명자, 피난자","f":0,"i":"전쟁·박해를 피해(refuge 피난처) 국경 너머로 도망쳐 몸을 숨긴 사람. fug=달아나다(fugitive와 한 뿌리) — 등 떠밀려 살던 곳을 등지고 달아난 이미지."},{"w":"regime","p":"n.","m":"통치, 정권","f":0,"i":"한 나라를 위에서 꽉 틀어쥐고 다스리는 체제·정권 (reg=다스리다·왕처럼). 흔히 억압적·부정적 뉘앙스로, '군사 정권' 같은 통치 시스템 전체를 가리킴."},{"w":"regulate","p":"v.","m":"규제하다","f":0,"i":"자를 대고(reg=곧게·규칙) 기준선 안에 들어오게 다듬어 통제함. 제멋대로 튀는 걸 규칙의 틀 안으로 눌러 맞추는 이미지 — 규제·조절."},{"w":"rehabilitation","p":"n.","m":"사회 복귀, 재활","f":0,"i":"쓰러졌던 사람을 다시(re-) 제 능력 갖춰(habilit=능력있게) 사회에 세워 돌려보냄. 재활 운동으로 몸을, 갱생으로 삶을 원상 복귀시키는 그림."},{"w":"rejection","p":"n.","m":"거절","f":0,"i":"던져진 것을 도로(re-뒤로) 밖으로 홱 내던져(ject=던지다) 튕겨냄. 손을 밀어 되던지는 몸짓 — 거절·거부."},{"w":"republican","p":"n.","m":"공화주의자","f":0,"i":"권력이 왕 개인이 아니라 공공의 것(res publica=공공의 일)이라 믿는 사람. '왕 말고 우리 모두의 나라' 편에 선 이미지."},{"w":"retroactively","p":"ad.","m":"(법령 따위의 효력이) 소급해서","f":0,"i":"시곗바늘을 거꾸로(retro=뒤로) 돌려, 이미 지나간 과거까지 효력이 미치게 작동함(act=작동). 오늘 만든 규칙이 지난달 일까지 소급 적용되는 그림. (법률·격식체)"},{"w":"riot","p":"n.","m":"폭동","f":0,"i":"성난 군중이 거리로 쏟아져 나와 뒤엉켜 부수고 소리치는 아수라장. 질서가 터져버린 난장판의 이미지 — 폭동."},{"w":"ruling party","p":"phr.","m":"여당","f":0,"i":"지금 정권의 키를 손에 쥐고(rule 다스리다) 나라를 운전하는 쪽 정당 — 여당. 반대편은 out인 야당(opposition)."},{"w":"sue","p":"v.","m":"고소하다, 소송을 제기하다","f":0,"i":"상대를 법정으로 끌어내 '따라와서 갚아라'고 법의 힘으로 쫓아가는 행위 (원래 seek/follow=뒤쫓다). 손해를 물리려 법정으로 소환하는 이미지 — 고소하다."},{"w":"Supreme Court","p":"phr.","m":"대법원, 연방 대법원","f":0,"i":"법원 피라미드의 맨 꼭대기(supreme=최고·위) 한 층. 더 위로 항소할 데가 없는 최종 심판대 — 대법원."},{"w":"testimony","p":"n.","m":"증언","f":0,"i":"증인이 손을 얹고(원래 증인testis) '내가 본 것은 이렇다'고 입으로 확인해 세우는 진술. 법정에서 사실을 떠받치는 말 — 증언."},{"w":"theft","p":"n.","m":"절도","f":0,"i":"남의 물건을 몰래 슬쩍 집어 자기 쪽으로 빼돌리는 행위 자체(thief의 행위 명사). 손이 조용히 남의 것을 채가는 이미지 — 절도."},{"w":"tyranny","p":"n.","m":"전제 정치","f":0,"i":"한 사람이 모든 권력을 움켜쥐고 사람들을 짓누르는 폭군(tyrant)의 통치. 위에서 내리누르는 억압의 무게 — 전제·폭정."},{"w":"unconstitutional","p":"a.","m":"헌법에 위배되는","f":0,"i":"나라의 뼈대 설계도(constitution 헌법)를 어겨(un- 부정) 그 틀 밖으로 벗어난 상태. 헌법이라는 기준선을 넘어선 것 — 위헌의."},{"w":"uprising","p":"n.","m":"반란, 폭동","f":0,"i":"눌려 있던 사람들이 아래에서 위로(up) 벌떡 일어나(rise) 권력에 맞서 들고 일어남. 바닥에서 솟구쳐 오르는 봉기의 이미지 — 반란."},{"w":"verdict","p":"n.","m":"(배심원의) 평결","f":0,"i":"배심원이 '진실은 이것'이라고 딱 잘라 말하는(ver=진실 + dict=말하다) 최종 한마디. 유죄냐 무죄냐를 못박는 평결."},{"w":"veto","p":"n.","m":"거부권","f":0,"i":"라틴어로 '나는 금지한다(I forbid)'. 통과하려는 안건 앞에 손바닥을 내밀어 '멈춰'라고 막아서는 거부권."},{"w":"witness","p":"n.","m":"목격자 v. 목격하다","f":0,"i":"그 자리에서 두 눈으로 직접 본 사람, 또는 그렇게 봄. 사건의 현장을 눈에 담아 나중에 '내가 봤다'고 증언하는 목격자."},{"w":"abdomen","p":"n.","m":"복부, 배","f":0,"i":"가슴과 골반 사이, 배가 불룩 나온 몸통 부위 — 복부. 특별한 감각 이미지 없음, 뜻 그대로의 해부 용어. (격식·의학체; 일상 회화는 belly/stomach)"},{"w":"abortion","p":"n.","m":"낙태, 유산","f":0,"i":"자라던 태아를 만삭 전에 떼어내(ab-떨어져 + ort=태어나다) 임신을 중단시킴. 태어나기로부터 떨어져 나가는 이미지 — 낙태·유산."},{"w":"acupuncture","p":"n.","m":"침술","f":0,"i":"가느다란 침으로 몸의 혈자리를 콕콕 찔러(acu=바늘 + punct=찌르다) 기운의 흐름을 트는 시술 — 침술. punct은 point·puncture와 한 뿌리."},{"w":"adrenaline","p":"n.","m":"아드레날린, 흥분시키는 것","f":0,"i":"위험 순간 콩팥 위(ad-옆에 + renal=신장) 부신에서 확 뿜어져 나와 심장을 쿵쿵 뛰게 하는 흥분 물질 — 아드레날린."},{"w":"ailment","p":"n.","m":"질병","f":0,"i":"죽을 병까지는 아니고 사람을 은근히 앓게 하는(ail 앓다) 잔병·지병. 오래 달고 사는 자잘한 몸의 탈 — 질병. (약간 문어체)"},{"w":"anemia","p":"n.","m":"빈혈증","f":0,"i":"피(-emia=혈액) 속에 붉은 기운이 모자란(an-없음) 상태. 얼굴 창백하고 어질어질한 이미지 — 빈혈."},{"w":"anorexia","p":"n.","m":"거식증","f":0,"i":"먹으려는 식욕(-orexia) 자체가 없어진(an-없음) 상태. 음식 앞에서 몸을 뒤로 빼며 거부하는 이미지 — 거식증."},{"w":"antibacterial","p":"a.","m":"항균성의","f":0,"i":"세균(bacteria)에 맞서(anti-대항) 싸워 죽이거나 못 자라게 하는 성질 — 항균성의. anti-는 '반대·대항'의 방패 이미지."},{"w":"antigen","p":"n.","m":"항원","f":0,"i":"몸속에 침입해 면역 반응(항체)을 만들어내게(-gen 생성) 자극하는, 맞서야 할(anti-) 외부 표식 물질 — 항원. (의학·학술체)"},{"w":"artery","p":"n.","m":"동맥","f":0,"i":"심장이 뿜은 피를 온몸으로 힘차게 밀어 보내는 두껍고 탱탱한 관 — 동맥. 압력으로 벌떡이는 굵은 파이프 이미지."},{"w":"avian flu","p":"phr.","m":"조류 독감","f":0,"i":"새(avian=조류)에게서 퍼지는 독감(flu). 특별한 비유 없음 — 조류 독감, 뜻 그대로. avi=새(aviation 항공도 같은 뿌리)."},{"w":"beneficial","p":"a.","m":"유익한, 이로운","f":0,"i":"누군가에게 좋은(bene=좋은 + fic=하다·만들다) 결과를 만들어 주는. 상대 손에 이로움을 쥐여 주는 이미지 — 유익한. bene-는 benefit·benevolent과 한 뿌리."},{"w":"blood vessel","p":"phr.","m":"혈관","f":0,"i":"피가 흐르는 몸속의 관·그릇(vessel=그릇·배). 몸 전체에 뻗은 붉은 배관망 이미지 — 혈관."},{"w":"bruise","p":"n.","m":"타박상, 멍","f":0,"i":"부딪혀 피부 속 혈관이 터져 겉은 안 찢겼는데 속이 퍼렇게 물든 자국 — 멍. 눌러 뭉갠 듯한 검푸른 얼룩 이미지."},{"w":"cancer","p":"n.","m":"암","f":0,"i":"정상 세포가 통제를 벗어나 게(원래 뜻: 게crab)처럼 사방으로 집게발을 뻗어 파고드는 악성 덩어리 — 암."},{"w":"cardiovascular","p":"a.","m":"심장 혈관의","f":0,"i":"심장(cardio=심장) + 혈관(vascular=관)을 한 묶음으로 부르는 말. 심장과 온몸 배관이 한 세트로 도는 순환계 이미지 — 심혈관의. (의학체)"},{"w":"chronic","p":"a.","m":"만성의","f":0,"i":"시간(chron=시간, chronology와 한 뿌리)이 길게 늘어져 낫지 않고 계속 끌리는. 급성처럼 확 오는 게 아니라 오래 눌러앉은 병 — 만성의."},{"w":"coma","p":"n.","m":"혼수 상태","f":0,"i":"깊은 잠보다 더 아래로 가라앉아(원래 그리스어 '깊은 잠') 흔들어도 안 깨어나는 의식 없는 상태 — 혼수."},{"w":"conceive","p":"v.","m":"임신하다, (아이를) 배다","f":0,"i":"씨를 몸 안에 함께 받아 품음(con-함께 + ceive=잡다·받다). 그 '안에 붙잡아 품다'가 생명이면 임신, 생각이면 (아이디어를) 마음에 품다·구상하다."},{"w":"contagious","p":"a.","m":"전염성의","f":0,"i":"닿기만 해도(con-함께 + tag=만지다) 옆 사람에게 옮겨 붙는. 손 닿는 순간 번져가는 이미지 — 전염성의. tag=touch는 contact와 한 뿌리."},{"w":"cramp","p":"n.","m":"경련, 쥐","f":0,"i":"근육이 갑자기 꽉 뭉쳐 조여들며 굳는 통증 — 쥐·경련. 쇠갈고리(cramp=꺾쇠)로 죄어 오그라뜨린 느낌."},{"w":"deadly","p":"a.","m":"치명적인","f":0,"i":"닿으면 죽음(dead)으로 데려가는. 목숨을 앗아갈 힘을 품은 이미지 — 치명적인. deadly poison(치사 독)처럼 실제로 죽이는 것."},{"w":"degenerative","p":"a.","m":"퇴행성의","f":0,"i":"세포·조직이 원래의 좋은 종자(gen=태어남)에서 아래로(de-) 무너져 점점 기능이 깎여 내려가는 — 퇴행성의. 시간 따라 쇠락해 가는 그림."},{"w":"dementia","p":"n.","m":"치매","f":0,"i":"정신(ment=마음)이 제자리에서 떨어져 나가(de-분리) 빠져나간 상태. 기억과 판단이 밖으로 새어나가는 이미지 — 치매. ment는 mental과 한 뿌리."},{"w":"digestion","p":"n.","m":"소화","f":0,"i":"먹은 것을 위장이 잘게 나눠(di-흩어 + gest=나르다·운반) 흡수 가능하게 처리함. 덩어리를 풀어 실어 나르는 이미지 — 소화."},{"w":"disability","p":"n.","m":"장애","f":0,"i":"할 수 있는 능력(ability)이 떨어져 나간(dis-분리·반대) 상태. 원래 되던 기능이 막혀버린 이미지 — 장애."},{"w":"disabled","p":"a.","m":"불구가 된","f":0,"i":"정상 기능이 꺼지고 떨어져 나가(dis- + able) 그 능력을 못 쓰게 된. 스위치가 꺼진 듯 작동이 막힌 상태 — 장애가 있는. (사람은 disabled보다 요즘은 'person with a disability'를 선호)"},{"w":"disorder","p":"n.","m":"질환, 장애, 병","f":0,"i":"제자리에 있어야 할 질서(order)가 흩어져(dis-) 어긋난 상태. 몸의 정상 질서가 무너진 것 — 질환·장애."},{"w":"dose","p":"n.","m":"복용량","f":0,"i":"약을 한 번에 '주는'(dos=주다, donate와 한 뿌리) 정해진 양. 딱 한 컵 분량으로 떼어 건네는 이미지 — 복용량."},{"w":"dyslexia","p":"n.","m":"읽기 장애, 난독증","f":0,"i":"글자(lex=말·단어)를 읽어내는 처리가 어긋나 잘못 돌아가는(dys-나쁜·비정상) 상태. 글자가 뒤엉켜 보이는 이미지 — 난독증. dys-는 '고장난'의 뉘앙스."},{"w":"embryo","p":"n.","m":"배아","f":0,"i":"아직 몸 안에서 부풀며(em-안에 + bryo=차오르다) 자라는 초기 생명 덩어리 — 배아. 태아 이전, 갓 부풀기 시작한 씨눈 이미지."},{"w":"epidemic","p":"n.","m":"유행병, 전염병 a. 유행성의","f":0,"i":"병이 사람들(dem=민중, democracy와 한 뿌리) 위로(epi-위에) 쫙 덮치듯 퍼짐. 마을 사람 전체에 번지는 유행병 이미지. 더 크게 번지면 pandemic(pan-전부)."},{"w":"euthanasia","p":"n.","m":"안락사","f":0,"i":"잘·편안하게(eu-좋은) 죽음(thanas=죽음)을 맞게 해 줌. 고통 없이 곱게 생을 마치게 하는 이미지 — 안락사. eu-는 좋은(euphoria)의 뿌리."},{"w":"exhausted","p":"a.","m":"지친, 피로한","f":0,"i":"속에 든 기운을 마지막 한 방울까지 밖으로(ex-밖 + haust=빨아내다) 다 빼내 빈 상태. 다 소진돼 텅 빈 이미지 — 기진맥진한. 배기가스 exhaust와 한 뿌리."},{"w":"face blindness","p":"phr.","m":"안면 인식 장애","f":0,"i":"얼굴(face)을 봐도 누군지 못 알아보는, 얼굴에 대한 눈멂(blindness). 특별한 비유 없음 — 안면 인식 장애 (의학명 prosopagnosia)."},{"w":"fever","p":"n.","m":"열병, 열","f":0,"i":"몸이 불덩이처럼 뜨겁게 달아오른 상태 — 열. fev=끓다·타오르다의 이미지. 이마에 손 대면 화끈한 그 감각."},{"w":"fiber","p":"n.","m":"섬유질","f":0,"i":"가늘고 질긴 실 한 올(fiber=섬유). 음식 속 소화 안 되고 장을 훑고 지나가는 질긴 실 가닥 이미지 — 식이섬유."},{"w":"gene","p":"n.","m":"유전자","f":0,"i":"생명의 설계 정보를 담아 다음 세대를 태어나게(gen=낳다·생기다) 하는 최소 단위 — 유전자. generate·genesis와 한 뿌리인 '생성의 씨앗'."},{"w":"genetically","p":"ad.","m":"유전학적으로, 유전자에 의해","f":0,"i":"타고난 유전자(gene) 차원에서, 태생적으로 정해진 방식으로 — 유전학적으로. 부모에게서 받은 설계도에 따라라는 뉘앙스."},{"w":"germ","p":"n.","m":"세균, 병균","f":0,"i":"싹(germ=싹·씨눈)처럼 자라나 병을 일으키는 눈에 안 보이는 미생물 — 세균·병균. 원래 '움트는 씨앗'이 병의 씨앗으로 확장된 이미지."},{"w":"gland","p":"n.","m":"샘, 분비선","f":0,"i":"몸속에서 호르몬·땀·침 같은 액을 만들어 짜내는 도토리만 한 분비 주머니 — 샘. gland=도토리(라틴)에서 온, 작고 둥근 알맹이 이미지."},{"w":"halitosis","p":"n.","m":"입 냄새, 구취","f":0,"i":"입에서 새어 나오는 안 좋은 숨 냄새 (라틴 halitus=숨결 + -osis병적 상태). 특별한 감각 이미지랄 건 없고, 회화에선 그냥 bad breath라 하고 halitosis는 병원·의학용어(격식)."},{"w":"handicapped","p":"a.","m":"신체적 장애가 있는","f":0,"i":"손(hand)에 모자(cap)를 들고 구걸하던 옛 모습에서 온 말이라지만, 지금 감각은 '경주에서 무거운 짐을 얹어 남보다 불리하게 출발'하는 그림. 신체에 핸디캡을 진 상태. 요즘은 disabled가 더 정중한 1순위 표현."},{"w":"heart attack","p":"phr.","m":"심장 마비","f":0,"i":"심장(heart)이 갑자기 습격(attack)당해 멈칫 — 가슴을 움켜쥐고 쓰러지는 장면. 뜻 그대로, 회화에서 매우 흔함."},{"w":"immune","p":"a.","m":"면역(성)의","f":0,"i":"성벽 안(im-=in안)으로 병이 못 넘어오게 담을 쌓아 면제된 상태 (라틴 immunis=의무를 면제받은). 세금·의무를 면제받듯, 병으로부터 면제됨. be immune to로 씀."},{"w":"infect","p":"v.","m":"감염시키다","f":0,"i":"병균을 남의 몸 안(in-안으로)에 만들어 넣어 물들임 (in-안으로 + fect만들다). 안으로 심어져 퍼지는 그림. 같은 fac/fect: affect, effect, perfect."},{"w":"infertility","p":"n.","m":"불임","f":0,"i":"씨를 뿌려도 싹이 안 트는 메마른 땅 (in-부정 + fertile비옥한). 아이를 못 배는 상태. 반대말 fertility=비옥·다산."},{"w":"influenza","p":"n.","m":"독감","f":0,"i":"옛날 사람들이 병이 별(星)의 '흘러듦(in-안으로 + flu흐르다)' 때문이라 믿어 붙인 이름 — 하늘의 나쁜 기운이 몸 안으로 흘러 든 것. 줄여서 flu. 특별한 감각보다 어원 이야기로 기억."},{"w":"injection","p":"n.","m":"주사, 주입","f":0,"i":"액체를 몸 안(in-안으로)으로 콱 던져 넣음 (in-안 + ject던지다). 주삿바늘로 밀어 넣는 그림. 같은 ject: reject(뒤로 던짐), project(앞으로 던짐), eject(밖으로 던짐)."},{"w":"insomnia","p":"n.","m":"불면증","f":0,"i":"밤새 잠(라틴 somnus=잠)이 안 오는(in-부정) 상태 — 천장만 보며 뒤척이는 그림. 같은 어근: somnolent(졸린), insomniac(불면증 환자)."},{"w":"kidney","p":"n.","m":"신장","f":0,"i":"허리 양쪽에 박힌 강낭콩 모양 장기, 신장. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"languid","p":"a.","m":"지친, 피로한, 활기 없는","f":0,"i":"늘어진 빨래처럼 축 처져 손가락 하나 까딱하기 싫은 나른함 (라틴 languere=지치다). 병후·더위에 힘 빠진 느낌. (문어·격식체) 회화에선 listless나 sluggish가 흔함."},{"w":"limb","p":"n.","m":"팔다리, 사지","f":0,"i":"몸통에서 뻗어 나온 가지 — 팔·다리 하나하나. 나무의 큰 가지도 limb. 몸통에서 뻗은 굵은 가지라는 그림 하나로 둘 다 통함."},{"w":"liver","p":"n.","m":"간","f":0,"i":"배 오른쪽에 자리한 크고 붉은 해독 공장, 간. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"longevity","p":"n.","m":"장수, 수명","f":0,"i":"생명(라틴 aevum=나이·시대)이 길게(long) 늘어진 것 — 촛불이 오래오래 타는 그림. 장수·수명. (문어·격식체)"},{"w":"lung","p":"n.","m":"폐, 허파","f":0,"i":"숨 쉴 때 부풀었다 쪼그라드는 가슴 속 두 개의 풍선, 폐. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"malnourished","p":"a.","m":"영양 부족의, 영양 실조의","f":0,"i":"나쁘게(mal-=나쁜) 먹여져 뼈가 드러나게 마른 몸 (mal-나쁜 + nourish영양을 주다). 잘 못 먹어 영양이 바닥난 상태."},{"w":"malnutrition","p":"n.","m":"영양 실조","f":0,"i":"나쁜(mal-나쁜) 영양 상태 (mal- + nutrition영양). malnourished의 명사형 — 영양 실조 그 자체."},{"w":"medication","p":"n.","m":"약물 (치료)","f":0,"i":"의사가 처방해 몸을 고치는 약(medic-치료하다). 특별한 감각 이미지보다, medicine이 '약'이면 medication은 '약물+그걸 쓰는 처치'까지 아우름."},{"w":"metabolism","p":"n.","m":"신진대사","f":0,"i":"몸속에서 물질이 끊임없이 형태를 바꿔(meta-변화 + bol던지다) 지어졌다 허물어지는 공장 — 먹은 걸 태워 에너지로 바꾸는 흐름. 신진대사."},{"w":"migraine","p":"n.","m":"편두통","f":0,"i":"머리 한쪽(그리스 hemi-=반 → mi)만 망치로 조여 오는 극심한 두통 (원래 '머리 반쪽'이란 뜻). 그냥 두통이 아니라 한쪽이 쿡쿡 쑤시는 편두통."},{"w":"miscarriage","p":"n.","m":"유산","f":0,"i":"품고 있던(carry) 것을 잘못(mis-=잘못) 놓쳐 떨어뜨림 (mis-잘못 + carriage나름). 아이를 끝까지 못 나르고 잃는 것 — 유산. 재판이 잘못되면 miscarriage of justice(오심)."},{"w":"neuron","p":"n.","m":"뉴런, 신경 단위","f":0,"i":"전기 신호를 실어 나르는 신경의 한 가닥 세포 (그리스 neuron=신경·줄). 가지 뻗은 나무처럼 생긴 신경 단위. 특별한 감각보다 뜻 그대로의 전문어."},{"w":"neuroscience","p":"n.","m":"신경 과학","f":0,"i":"신경(neuro-)을 다루는 과학(science) — 뇌와 신경을 파헤치는 학문. 결합어라 뜻 그대로."},{"w":"obese","p":"a.","m":"비만의","f":0,"i":"먹은 게 몸에 맞서(ob-=맞서서) 잔뜩 쌓여 부풀어 오른 몸 (ob- + esus먹어치운). 단순 뚱뚱함(fat)보다 의학적으로 심각한 비만. (격식·의학체)"},{"w":"organ","p":"n.","m":"장기, 기관","f":0,"i":"각자 맡은 일을 하는 몸속 도구·기관 (그리스 organon=도구·악기). 심장·간처럼 특정 기능을 맡은 부품이라는 그림. 파이프 오르간(악기)도 같은 어원."},{"w":"overweight","p":"n.","m":"과체중, 비만 a. 살이 찐","f":0,"i":"저울 눈금을 넘어서(over-넘어) 무게(weight)가 초과된 상태. 뜻 그대로 — 정상 체중 위(over)로 올라감."},{"w":"pandemic","p":"n.","m":"전 세계적 유행병 a. 전국적으로 유행하는","f":0,"i":"온(pan-=전부) 백성(demos=사람들)에게 번진 병 — 국경 없이 전 세계 사람 모두를 덮치는 그림. epidemic(epi-위에, 특정 지역)보다 판이 훨씬 큼. 같은 pan: panorama, panacea."},{"w":"paralysis","p":"n.","m":"마비","f":0,"i":"몸이 옆으로(para-=옆·이상) 풀려(lysis풀림) 끈 끊긴 인형처럼 움직이지 않음 (para- + lysis느슨해짐). 마비. 같은 lys: analysis(풀어헤침)."},{"w":"panacea","p":"n.","m":"만병 통치약","f":0,"i":"모든(pan-=전부) 병을 낫게 한다는 그리스 치유 여신(Panacea)의 만능 약 한 병. 뭐든 고친다는 만병통치약 — 흔히 '그런 만능 해결책은 없다'는 맥락에서 비유로 씀. (문어·격식체)"},{"w":"pharmacist","p":"n.","m":"약사","f":0,"i":"약(그리스 pharmakon=약·독) 짓는 사람 — 하얀 가운 입고 조제대에서 알약을 세는 그림. 약사. 영국에선 chemist라고도 함."},{"w":"physician","p":"n.","m":"내과 의사","f":0,"i":"몸의 자연(그리스 physis=자연·신체)을 다루는 의사 — 수술칼 대신 진찰·처방으로 병을 보는 내과 의사. 수술하는 surgeon과 대비. (격식체) 회화에선 그냥 doctor."},{"w":"pill","p":"n.","m":"알약","f":0,"i":"혀에 올려 꿀꺽 삼키는 작고 동그란 알약. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"plastic surgery","p":"phr.","m":"성형 수술","f":0,"i":"얼굴·몸을 찰흙(그리스 plastikos=빚어 만드는)처럼 주물러 새 모양으로 빚는 수술. 성형수술 — 조직을 재료 삼아 형태를 새로 빚는 그림."},{"w":"pneumonia","p":"n.","m":"폐렴","f":0,"i":"허파(그리스 pneumon=폐)에 물·염증이 차 숨이 그렁그렁 차오르는 병. 폐렴. 앞의 p는 묵음(뉴모니아). 특별한 감각보다 뜻 그대로."},{"w":"preservative","p":"n.","m":"방부제","f":0,"i":"썩기 전에 미리(pre-=미리) 지켜(serve간직) 부패를 막아 두는 것 (pre- + serve지키다). 음식이 상하지 않게 넣는 방부제. 같은 serve: reserve, conserve, preserve."},{"w":"rash","p":"n.","m":"발진, 뾰루지","f":0,"i":"피부 위로 좍 돋아 오른 붉은 오돌토돌한 발진. 형용사 rash(성급한)와 철자는 같지만 별개 — 여기선 피부에 확 번진 붉은 반점 그림."},{"w":"remedy","p":"n.","m":"치료 v. 치료하다","f":0,"i":"다시(re-=다시) 낫게(라틴 mederi=치료하다) 원상복구시키는 처방·해결책 (re- + medy치료). 병뿐 아니라 문제를 바로잡는 방책에도 씀 — a remedy for the problem."},{"w":"respiration","p":"n.","m":"호흡","f":0,"i":"숨을 다시(re-=반복) 들이쉬고 내쉬는(spir=숨쉬다) 반복 운동 (re- + spir숨). 호흡. 같은 spir: inspire(숨을 불어넣다), expire(숨을 내쉬다=만료)."},{"w":"respiratory","p":"a.","m":"호흡의","f":0,"i":"숨쉬는(respire) 일과 관련된 — 코·기관지·폐로 이어지는 호흡 계통을 가리키는 형용사. respiratory system(호흡기)."},{"w":"sanitary","p":"a.","m":"위생적인","f":0,"i":"병균 없이 말끔히 소독된 상태 (라틴 sanitas=건강). 화장실·주방이 깨끗한 그림. 반대말 insanitary(비위생). 참고: sanity(제정신)와 같은 sanus=건강한 뿌리."},{"w":"schizophrenic","p":"n.","m":"정신 분열증 환자 a. 정신 분열증의","f":0,"i":"마음(그리스 phren=마음)이 쪼개진(schizo=split) 상태 — 정신이 갈라져 현실과 어긋난 환자. 조현병 환자·조현병의. (의학 전문어) 요즘 정식 병명은 '조현병'."},{"w":"scurvy","p":"n.","m":"괴혈병","f":0,"i":"비타민C가 바닥나 잇몸이 무르고 피가 나던 옛 뱃사람의 병, 괴혈병. 특별한 감각 이미지 없음 — 역사·의학 용어."},{"w":"secretion","p":"n.","m":"분비 작용","f":0,"i":"몸속 샘에서 몰래 따로(se-=떨어져) 짜내어(cret가려내다) 내보내는 액 (se- + cret분리하다). 침·땀·호르몬 분비. secret(비밀)과 같은 '따로 떼어둠' 뿌리."},{"w":"skull","p":"n.","m":"두개골","f":0,"i":"머리를 감싼 단단한 뼈 바가지, 두개골. 특별한 감각 이미지 없음 — 뜻 그대로."},{"w":"sneeze","p":"n.","m":"재채기","f":0,"i":"간지러움에 코가 참지 못하고 '에취!' 하고 터뜨리는 재채기. 소리 자체가 그림 — 뜻 그대로."},{"w":"spine","p":"n.","m":"척추, 등뼈","f":0,"i":"등 한가운데를 세로로 꿰뚫는 뼈 기둥, 척추. 책의 '책등', '가시'도 같은 말 — 곧고 단단한 등뼈 줄기라는 그림. 비유로 backbone처럼 '기개'."},{"w":"stomachache","p":"n.","m":"위통, 복통","f":0,"i":"위(stomach)가 아픔(ache) — 배를 움켜쥐고 웅크린 그림. 결합어라 뜻 그대로."},{"w":"stout","p":"a.","m":"튼튼한","f":0,"i":"속이 꽉 찬 참나무 통처럼 단단하고 다부진 — 튼튼한 몸집, 흔들리지 않는 의지. 살짝 살집 있고 건장한 뉘앙스. (다소 문어·옛말투) 흑맥주 stout도 진하고 묵직한 데서."},{"w":"stroke","p":"n.","m":"뇌졸중","f":0,"i":"뇌 혈관이 한 방(stroke=일격)에 터지거나 막혀 쓰러짐 — 벼락처럼 내리친 타격이라는 그림. 뇌졸중. stroke의 '치다·쓰다듬다' 뜻과 같은 뿌리로, 여기선 갑작스러운 '가격'."},{"w":"surgeon","p":"n.","m":"외과 의사","f":0,"i":"손(그리스 kheir=손 + ergon=일)으로 직접 몸을 째고 꿰매는 의사 — 수술칼 든 외과 의사. 어원 자체가 '손으로 하는 일'. 처방 위주 physician과 대비."},{"w":"surgery","p":"n.","m":"수술","f":0,"i":"손으로 하는 일(kheir손+ergon일) — 몸을 열어 고치는 수술. surgeon이 하는 행위. 영국에선 '병원 진료실'도 surgery."},{"w":"tissue","p":"n.","m":"(신체의) 조직","f":0,"i":"세포들이 실처럼 짜여(라틴 texere=짜다) 이룬 얇은 몸의 결 — 옷감처럼 엮인 조직. 화장지 tissue도 '얇게 짠 것'에서. 같은 뿌리: textile, texture."},{"w":"transfusion","p":"n.","m":"수혈","f":0,"i":"피를 한 몸에서 다른 몸으로 가로질러(trans-=가로질러) 부어(fus붓다) 옮김 (trans- + fus쏟다). 수혈. 같은 fus: infuse(주입), confuse(뒤섞어 붓다)."},{"w":"transplant","p":"n.","m":"이식 v. 이식하다","f":0,"i":"장기·식물을 뽑아 다른 자리로 가로질러(trans-=가로질러) 옮겨 심음 (trans- + plant심다). 심장 이식도, 나무 옮겨심기도 같은 그림."},{"w":"treatment","p":"n.","m":"치료, 처우, 대우","f":0,"i":"환자를 어떻게 다루는가(treat다루다) — 병을 다루면 치료, 사람을 다루면 대우·처우. '다룸' 하나에서 두 뜻이 갈림."},{"w":"tumor","p":"n.","m":"종양","f":0,"i":"조직이 제멋대로 부풀어(라틴 tumere=붓다) 올라 뭉친 혹덩어리, 종양. 몸 어딘가가 비정상적으로 부어오른 그림."},{"w":"ulcer","p":"n.","m":"궤양","f":0,"i":"위벽·피부가 헐어 움푹 파여 짓무른 상처, 궤양. 살이 곪아 패인 구덩이라는 그림. stomach ulcer(위궤양)."},{"w":"vaccination","p":"n.","m":"예방 접종","f":0,"i":"약해진 병원균을 미리 몸에 넣어 면역을 훈련시킴 — 어원은 라틴 vacca(암소), 최초 천연두 백신이 소의 우두에서 왔기에. 예방 접종. 소(vacca)에서 왔다는 게 기억 포인트."},{"w":"vegetarian","p":"n.","m":"채식주의자 a. 채식주의자의","f":0,"i":"고기 없이 채소(vegetable)만 상에 올리는 사람. 뜻 그대로 — 채식주의자."},{"w":"vein","p":"n.","m":"정맥, 혈관","f":0,"i":"심장으로 피를 다시 실어 나르는 푸르스름한 혈관 줄기, 정맥. 잎맥·광맥(mineral vein)도 vein — 무언가가 흐르는 가느다란 통로라는 그림. 피가 심장 쪽으로 '돌아오는' 관(동맥 artery는 나가는 관)."},{"w":"venereal","p":"a.","m":"성병의","f":0,"i":"사랑의 여신 비너스(Venus)의 이름에서 온 말 — '성적 접촉으로 옮는'. venereal disease(성병)가 거의 유일한 쓰임. 오늘날엔 STD/STI가 더 흔함."},{"w":"acid rain","p":"phr.","m":"산성비","f":0,"i":"공장 매연이 하늘에서 산(酸)으로 변해 숲과 동상 위로 떨어져 갉아먹는 비. 뜻 그대로 산성비."},{"w":"alternative energy","p":"phr.","m":"대체 에너지","f":0,"i":"석유·석탄 말고 '다른 길로 갈아탄' 에너지 (alter-다른). 태양·풍력처럼 화석연료를 대신하는 것."},{"w":"aquatic","p":"a.","m":"물속에 사는","f":0,"i":"물(aqua)에 온몸이 잠긴 채 사는 것. 물고기·수초처럼 물이 삶의 터전인."},{"w":"Arctic tundra","p":"phr.","m":"북극의 툰드라, 동토 지대","f":0,"i":"북극(Arctic)의 나무 한 그루 없이 얼어붙은 벌판 — 땅속까지 꽝꽝 언 동토. 뜻 그대로."},{"w":"atomic","p":"a.","m":"원자의, 원자력의","f":0,"i":"더 쪼갤 수 없는 알갱이(atom)의. 그 알갱이를 쪼개 터뜨리면 원자력·원자폭탄의 어마어마한 힘."},{"w":"avalanche","p":"n.","m":"눈사태","f":0,"i":"산비탈 눈덩이가 우르릉 통째로 무너져 내리 쏟아지는 것. 비유로 '(주문·질문이) 쇄도하다'로도."},{"w":"biochemical","p":"a.","m":"생화학의, 생화학적인","f":0,"i":"생명(bio)+화학(chemical) — 몸속 세포에서 벌어지는 화학 반응의."},{"w":"biology","p":"n.","m":"생물학, 생태학","f":0,"i":"생명(bio-)에 대한 학문(-logy). 살아있는 것 전부를 다루는 생물학."},{"w":"biotechnology","p":"n.","m":"생명 공학","f":0,"i":"생명(bio) 자체를 도구처럼 다뤄 조작·개량하는 기술. 유전자 편집 같은 생명공학."},{"w":"botany","p":"n.","m":"식물학","f":0,"i":"풀·나무 등 식물만 파고드는 학문. 특별한 이미지 없음 — 식물학."},{"w":"by-product","p":"n.","m":"부산물","f":0,"i":"본 물건을 만드는 '옆(by)에서' 덤으로 딸려 나온 것. 목표는 아니었지만 생긴 부산물."},{"w":"carnivore","p":"n.","m":"육식 동물","f":0,"i":"살(carn-고기)을 삼키는(vore) 짐승. 이빨로 고기를 뜯는 육식동물. (cf. herbivore 초식)"},{"w":"catastrophe","p":"n.","m":"대참사, 큰 재앙","f":0,"i":"무대가 아래로(cata-) 확 뒤집혀(strophe-돌다) 모든 게 나락으로 떨어지는 파국. 그리스 비극의 파멸 장면 → 대참사."},{"w":"chilly","p":"a.","m":"차가운, 쌀쌀한","f":0,"i":"살갗에 오소소 소름이 돋을 만큼 서늘한 냉기. 춥다(cold)까진 아니고 쌀쌀한 정도."},{"w":"chromosome","p":"n.","m":"염색체","f":0,"i":"색(chromo-)으로 물들여야 현미경에 보이는 몸(some)체 — 세포 속 유전정보를 담은 실타래, 염색체."},{"w":"conifer","p":"n.","m":"침엽수","f":0,"i":"솔방울(cone)을 달고(fer-나르다) 있는 나무. 뾰족한 바늘잎의 침엽수."},{"w":"conservation","p":"n.","m":"보존, 보호, 유지","f":0,"i":"소중한 것을 통째로(con-) 지켜(serv-간직) 축나지 않게 붙들어 둠. 자연·자원의 보존."},{"w":"contaminate","p":"v.","m":"오염시키다","f":0,"i":"깨끗한 것에 더러운 것이 닿아(con-함께 + tam-접촉) 물들어 버림. 오염시키다."},{"w":"contamination","p":"n.","m":"오염","f":0,"i":"깨끗하던 것에 오물이 닿아 스며 번진 상태. contaminate의 명사, 오염."},{"w":"coral reef","p":"phr.","m":"산호초","f":0,"i":"따뜻한 바다에 산호가 켜켜이 쌓여 만든 물속 암초 지대. 뜻 그대로 산호초."},{"w":"decay","p":"v.","m":"썩다, 부패하다","f":0,"i":"싱싱하던 것이 아래로(de-) 무너져 내리며 서서히 썩어 문드러짐. 이빨·시체·건물이 삭는 것."},{"w":"decomposer","p":"n.","m":"분해자","f":0,"i":"죽은 것을 다시 아래로(de-) 잘게 풀어헤쳐(compose) 흙으로 되돌리는 존재. 곰팡이·박테리아 같은 분해자."},{"w":"decontamination","p":"n.","m":"오염 제거","f":0,"i":"묻은 오염을 도로 벗겨(de-제거) 내는 것. contamination의 반대, 오염 제거."},{"w":"deforest","p":"v.","m":"숲을 벌목하다","f":0,"i":"숲(forest)을 밀어 없애(de-제거) 민둥산으로 만듦. 벌목·삼림 파괴."},{"w":"desertification","p":"n.","m":"사막화","f":0,"i":"멀쩡하던 땅이 물기를 잃고 점점 사막(desert)으로 변해감. 사막화."},{"w":"detergent","p":"n.","m":"세제","f":0,"i":"때를 싹 벗겨(de-분리 + terg-닦다) 내는 물질. 세제."},{"w":"devastate","p":"v.","m":"황폐화하다","f":0,"i":"온 땅을 텅 비게(vast-황량) 쓸어버려 폐허로 만듦. 전쟁·재해가 초토화하다."},{"w":"development","p":"n.","m":"발생, 발육, 성장","f":0,"i":"안으로 감겨있던(en-vel 봉투) 것이 도로 풀려(de-반전) 활짝 펼쳐짐. 씨앗이 열리듯 발생·성장."},{"w":"dinosaur","p":"n.","m":"공룡","f":0,"i":"무시무시한(dino-) 도마뱀(saur) — 오래전 지구를 밟고 다닌 거대 파충류, 공룡. 뜻 그대로."},{"w":"disaster","p":"n.","m":"재난, 재해","f":0,"i":"별(aster)이 어긋나(dis-) 운수가 뒤틀렸다는 옛 점성술 발상 — 하늘이 등 돌린 듯한 재난."},{"w":"disposable","p":"n.","m":"일회용품 a. 일회용품의","f":0,"i":"쓰고 나면 툭 던져(pos-놓다) 흩어버리게(dis-) 만든 것. 한 번 쓰고 버리는 일회용품."},{"w":"drought","p":"n.","m":"가뭄","f":0,"i":"하늘에서 비가 뚝 끊겨 땅이 쩍쩍 갈라지도록 마른 상태. 가뭄. (발음 '드라웃')"},{"w":"earthquake","p":"n.","m":"지진","f":0,"i":"땅(earth)이 흔들려(quake) 발밑이 출렁이는 것. 뜻 그대로 지진."},{"w":"ecocide","p":"n.","m":"환경 파괴","f":0,"i":"생태계(eco)를 통째로 죽여(cide-살해) 버림 — genocide(대학살)와 같은 -cide. 환경 파괴."},{"w":"ecology","p":"n.","m":"생태학, 환경학","f":0,"i":"생물이 사는 집(eco-, 그리스어 oikos 집)을 통째로 보는 학문. 서로 얽힌 생태를 다룸."},{"w":"ecosystem","p":"n.","m":"생태계","f":0,"i":"생물의 집(eco) 안에서 먹고 먹히며 하나로 맞물려 돌아가는 체계(system). 생태계."},{"w":"environment","p":"n.","m":"환경","f":0,"i":"나를 빙 둘러(environ-둘러싸다) 감싸고 있는 모든 것. 사방을 에워싼 환경."},{"w":"environment-friendly","p":"a.","m":"환경 친화적인","f":0,"i":"환경에게 해를 안 끼치고 다정하게(friendly) 구는. 친환경적인. (= eco-friendly)"},{"w":"enzyme","p":"n.","m":"효소","f":0,"i":"세포 속 반죽에 넣는 누룩(-zyme, 그리스어 발효)처럼 반응을 확 부추기는 촉매 단백질. 효소."},{"w":"ergonomic","p":"a.","m":"인간 공학의","f":0,"i":"일(ergo-, 그리스어 일)과 몸이 딱 맞게 법칙(nomic)을 짠 — 손목·허리가 안 아프게 설계된 인체공학의."},{"w":"eruption","p":"n.","m":"폭발, 분화, 분출","f":0,"i":"안에 눌려있던 것이 밖으로(e-) 뚫고(rupt-터지다) 확 솟구침. 화산 분출, 발진."},{"w":"evaporate","p":"v.","m":"증발시키다, 증발하다","f":0,"i":"물이 김(vapor)이 되어 밖으로(e-) 스르르 날아가 사라짐. 증발하다."},{"w":"evolution","p":"n.","m":"발달, 진화","f":0,"i":"안에 말려있던(volv-굴리다) 것이 밖으로(e-) 천천히 굴러 펼쳐짐. 오랜 세월 굴러 나온 진화."},{"w":"evolve","p":"v.","m":"서서히 발전하다, 진화하다","f":0,"i":"돌돌 말린 것이 밖으로(e-) 조금씩 굴러(volv-) 풀려 나옴. 급변이 아니라 서서히 발전·진화하다."},{"w":"exhaust","p":"n.","m":"배기가스 v. 소모하다, 고갈시키다","f":0,"i":"속에 든 것을 밖으로(ex-) 남김없이 퍼내(haust-긷다) 텅 비게 함. 다 써버리다 + 차 뒤로 뿜는 배기가스."},{"w":"exhaustion","p":"n.","m":"자원 고갈","f":0,"i":"우물물을 밑바닥까지 다 퍼내(ex-haust) 바닥난 상태. 자원의 완전 고갈, 기진맥진."},{"w":"exploitative","p":"a.","m":"자원 개발의, 착취적인","f":0,"i":"쥐어짜 밖으로(ex-) 이득만 뽑아내는. 자원·사람을 부려먹는 착취적인."},{"w":"extinction","p":"n.","m":"멸종","f":0,"i":"타던 불이 밖으로(ex-) 완전히 꺼져(stinct-찌르다/끄다) 다시 안 살아남. 한 종(種)이 영영 사라진 멸종."},{"w":"fauna","p":"n.","m":"동물군","f":0,"i":"한 지역에 사는 온갖 짐승 무리 전체. (로마 숲의 여신 Fauna) 동물군. (cf. flora 식물군, 문어체)"},{"w":"fertility","p":"n.","m":"수정 능력, 번식력","f":0,"i":"씨를 뿌리면 쑥쑥 자라나는(fer-나르다/낳다) 땅과 몸의 힘. 비옥함, 번식력."},{"w":"fertilization","p":"n.","m":"수정, 비옥화","f":0,"i":"정자와 난자가 만나 새 생명이 깃드는 것 / 땅에 거름을 줘 기름지게 함. 수정·비옥화."},{"w":"fertilizer","p":"n.","m":"비료","f":0,"i":"메마른 땅에 뿌려 작물을 쑥쑥 낳게(fer-낳다) 하는 거름. 비료."},{"w":"foliage","p":"n.","m":"잎","f":0,"i":"나무를 뒤덮은 잎사귀(foli-잎) 전체 — 낱장이 아니라 우거진 잎 무리. (약간 문어체)"},{"w":"free radicals","p":"phr.","m":"활성 산소","f":0,"i":"짝 잃고 홀로 떠도는(free) 성난 분자 — 아무거나 붙잡고 세포를 상하게 함. 활성산소."},{"w":"frost","p":"n.","m":"서리, 결빙","f":0,"i":"밤새 유리창·풀잎에 하얗게 얼어붙은 얼음 알갱이. 서리."},{"w":"fungal","p":"a.","m":"균의","f":0,"i":"곰팡이·버섯(fungus)의. 축축한 데 스멀스멀 번지는 균의."},{"w":"garbage","p":"n.","m":"쓰레기","f":0,"i":"부엌에서 나온 음식 찌꺼기 등 버리는 쓰레기. (미국식; 영국은 rubbish)"},{"w":"glacier","p":"n.","m":"빙하","f":0,"i":"산꼭대기 눈이 수천 년 눌려 얼음이 되어 아주 느리게 흘러내리는 거대한 얼음강. 빙하. (발음 '글레이셔')"},{"w":"global warming","p":"phr.","m":"지구 온난화","f":0,"i":"지구(global) 전체를 이불처럼 덮은 온실가스가 열을 가둬 더워짐. 지구 온난화."},{"w":"greenhouse effect","p":"phr.","m":"온실 효과","f":0,"i":"유리 온실이 햇빛은 들이고 열은 못 나가게 가둬 안이 후끈해지듯, 대기 속 가스가 지구 열을 덮어 가두는 그림. 뜻 그대로 '온실 효과'."},{"w":"herbivore","p":"n.","m":"초식 동물","f":0,"i":"풀(herb)을 삼켜 먹는(-vore) 놈 — 초원에 고개 박고 풀만 뜯는 소·사슴의 그림. herb풀 + vor삼키다."},{"w":"herd","p":"n.","m":"짐승의 떼, 가축의 무리","f":0,"i":"한 덩어리로 뭉쳐 함께 몰려다니는 큰 짐승 떼 — 초원을 우르르 이동하는 소·물소 무리."},{"w":"hybrid","p":"n.","m":"교배종, 잡종 a. 혼합 방식의, 잡종의","f":0,"i":"서로 다른 두 혈통을 한 몸에 겹쳐 섞어 만든 것 — 노새, 하이브리드차처럼 둘의 피가 한데 섞인 그림."},{"w":"hydrogen","p":"n.","m":"수소","f":0,"i":"물(hydro)을 낳는(-gen) 원소 — 산소와 만나 물이 되는 가장 가볍고 잘 타는 기체. hydro물 + gen낳다."},{"w":"inexhaustible","p":"a.","m":"무한한, 소진되지 않는","f":0,"i":"아무리 퍼내도 바닥이 안 드러나는 우물 — 다 빼낼(exhaust) 수 없다(in-부정). in-부정 + ex-밖으로 + haust퍼내다."},{"w":"inheritance","p":"n.","m":"유전, 상속","f":0,"i":"앞세대가 안(in-)으로 물려줘 내 것으로 들어온 것 — 재산이든 유전자든 핏줄 따라 흘러들어옴."},{"w":"insecticide","p":"n.","m":"살충제","f":0,"i":"벌레(insect)를 베어 죽이는(-cide) 약 — 곤충에게 뿌리는 독. -cide베다·죽이다(살인homicide과 같은 뿌리)."},{"w":"landfill","p":"n.","m":"매립지","f":0,"i":"땅(land)에 파낸 구덩이를 쓰레기로 꽉 채워(fill) 덮은 곳 — 뜻 그대로 매립지."},{"w":"landslide","p":"n.","m":"산사태","f":0,"i":"산비탈의 흙더미가 통째로 아래로 주르륵 미끄러져(slide) 쏟아지는 그림. 선거 '압승'도 표가 한쪽으로 와르르 쏟아지는 이 이미지."},{"w":"lizard","p":"n.","m":"도마뱀","f":0,"i":"네 다리로 벽·바위에 착 붙어 잽싸게 기어가는 작은 파충류, 도마뱀. 특별한 이미지 없음 — 뜻 그대로."},{"w":"mammal","p":"n.","m":"포유 동물","f":0,"i":"젖(mamma, 유방)을 물려 새끼를 키우는 동물 — 어미 젖에 매달린 새끼의 그림. 사람·소·고래 모두 포함."},{"w":"marine","p":"a.","m":"바다의","f":0,"i":"짠 바닷물 속 세계에 속한 것 — 해병대(marine)도 바다에서 상륙하는 군인. mar바다."},{"w":"metamorphosis","p":"n.","m":"변태","f":0,"i":"형태(morph)를 넘어서 완전히 딴 모습으로 갈아탐(meta-) — 애벌레가 나비로 몸이 통째 바뀌는 그림. meta-넘어 + morph형태."},{"w":"meteorology","p":"n.","m":"기상학","f":0,"i":"하늘 높이(meteor, 공중에 뜬 것) 벌어지는 일을 연구하는 학문(-logy) — 구름·비·바람을 다루는 기상학."},{"w":"microbe","p":"n.","m":"미생물, 세균","f":0,"i":"눈에 안 보일 만큼 작은(micro-) 생명(bio) — 현미경으로만 보이는 세균·미생물. micro-아주작은 + bio생명."},{"w":"mutant","p":"a.","m":"돌연 변이의","f":0,"i":"원본에서 유전자가 딴 것으로 바뀌어(mut-) 튀어나온 개체 — 엑스맨처럼 변형된 것. mut바꾸다(mutate)."},{"w":"natural selection","p":"phr.","m":"자연 선택","f":0,"i":"자연이 심사위원처럼 살아남을 놈만 골라(select) 뽑는 그림 — 환경에 맞는 것만 걸러져 대를 잇는다."},{"w":"omnivore","p":"n.","m":"잡식성 동물","f":0,"i":"이것저것 다(omni-) 삼키는(-vore) 놈 — 고기든 풀이든 가리지 않는 사람·곰의 그림. omni-모두 + vor삼키다."},{"w":"organic","p":"a.","m":"유기농의","f":0,"i":"화학약품 없이 살아있는 생명 기관(organ)에서 나온 자연 그대로의 것 — 밭에서 흙만으로 키운 유기농."},{"w":"oxygen","p":"n.","m":"산소","f":0,"i":"신맛(oxy, 산)을 낳는다(-gen) 여겨져 붙은 이름 — 숨쉬고 불태우는 데 꼭 필요한 기체 산소. oxy신맛 + gen낳다."},{"w":"oyster","p":"n.","m":"굴","f":0,"i":"울퉁불퉁한 껍데기를 꽉 다문 조개, 굴. 특별한 이미지 없음 — 뜻 그대로."},{"w":"parasite","p":"n.","m":"기생충","f":0,"i":"남의 밥상(sitos, 음식) 곁(para-)에 빌붙어 얻어먹는 존재 — 숙주 몸에 달라붙어 빨아먹는 기생충. para-곁에 + sit먹다."},{"w":"pest","p":"n.","m":"해충","f":0,"i":"농작물·사람을 성가시게 갉아먹고 괴롭히는 해로운 벌레·짐승 — 진저리나는 골칫거리. (사람에게도 '골칫덩이'로 씀)"},{"w":"pesticide","p":"n.","m":"살충제, 농약","f":0,"i":"해충(pest)을 베어 죽이는(-cide) 약 — 밭에 뿌리는 농약. -cide베다·죽이다."},{"w":"poison","p":"v.","m":"오염시키다","f":0,"i":"몸속에 스며들어 서서히 망가뜨리는 독 — 물·땅에 풀리면 '오염시키다'. 물약(potion)과 같은 뿌리, 마시는 것이 독이 됨."},{"w":"pollutant","p":"n.","m":"오염 물질, 오염원","f":0,"i":"깨끗한 물·공기 속에 섞여들어 더럽히는 물질 — 오염(pollute)을 일으키는 놈. 매연·폐수처럼 흘려보내진 오물."},{"w":"predator","p":"n.","m":"포식자","f":0,"i":"먼저(prae-) 덮쳐 낚아채(prey) 잡아먹는 사냥꾼 — 먹잇감을 노려 달려드는 사자·매의 그림. pre-앞서 + prey먹이."},{"w":"radiation detector","p":"phr.","m":"방사능 측정기","f":0,"i":"방사선(radiation)이 새어나오는지 삑삑 잡아내는(detect) 기계 — 뜻 그대로 방사능 측정기."},{"w":"rain forest","p":"phr.","m":"열대 우림","f":0,"i":"일 년 내내 비가 쏟아져 나무가 빽빽이 우거진 숲 — 뜻 그대로 열대 우림."},{"w":"recycle","p":"v.","m":"재활용하다","f":0,"i":"버릴 것을 다시(re-) 순환 고리(cycle)에 태워 새 물건으로 돌려보냄 — 쓰레기가 원료로 되돌아오는 그림. re-다시 + cycle순환."},{"w":"reptile","p":"n.","m":"파충류 동물","f":0,"i":"배를 땅에 대고 슬금슬금 기어(rept-) 다니는 동물 — 뱀·도마뱀·악어. rept기다(creep)."},{"w":"rubbish","p":"n.","m":"쓰레기","f":0,"i":"아무렇게나 쌓인 잡동사니 쓰레기 (영국식). 회화에서 '헛소리·형편없는 것'이란 뜻으로도 자주 씀 — 미국은 보통 trash/garbage."},{"w":"salinity","p":"n.","m":"염분, 염도","f":0,"i":"물에 소금(sal)이 얼마나 녹아 짠지를 재는 정도 — 혀에 닿는 짠맛의 세기. sal소금(salt, salary와 같은 뿌리)."},{"w":"seed","p":"n.","m":"씨, 열매, 종자","f":0,"i":"껍질 속에 다음 세대 생명을 통째로 품은 작은 알갱이 — 땅에 묻으면 싹이 트는 씨앗."},{"w":"sewage","p":"n.","m":"하수","f":0,"i":"집·화장실에서 하수관(sewer)을 타고 흘러나가는 더러운 오수 — 뜻 그대로 하수."},{"w":"spawn","p":"v.","m":"낳다, 산란하다","f":0,"i":"물고기·개구리가 물속에 알을 한꺼번에 왈칵 뿌리는 그림 — 대량으로 우수수 '낳다·산란하다'. 비유로 '우르르 생겨나게 하다'."},{"w":"taxonomy","p":"n.","m":"분류, 분류학","f":0,"i":"생물을 정해진 순서·질서(taxis)에 따라 칸칸이 나눠 이름 붙이는 법칙(-nomy) — 계·문·강·목 서랍에 정리하는 분류학. taxis배열 + nomy법칙."},{"w":"tornado","p":"n.","m":"토네이도, 회오리 바람","f":0,"i":"좁은 깔때기 모양으로 빙글빙글 돌며 땅을 훑어 빨아올리는 회오리 기둥. 뜻 그대로 토네이도."},{"w":"toxic","p":"a.","m":"유독한, 치명적인","f":0,"i":"몸에 닿으면 서서히 갉아먹는 독성 — 화살촉(toxikon)에 바르던 독에서 온 말. 독한 관계·환경에도 씀."},{"w":"trash","p":"n.","m":"쓰레기","f":0,"i":"구겨 던져 넣은 종이·잡동사니 쓰레기 (미국식). 회화에서 '형편없다·깎아내리다(trash-talk)'로도 흔함."},{"w":"tropical","p":"a.","m":"열대 (지방)의, 열대 특유의","f":0,"i":"적도를 낀 뜨겁고 습한 열대 지방의 — 야자수·스콜·후텁지근함의 그림. trop돌다(태양이 되돌아가는 회귀선tropic)."},{"w":"tsunami","p":"n.","m":"해일","f":0,"i":"지진에 밀린 바닷물이 거대한 물벽으로 솟아 해안을 덮치는 그림 — 일본어에서 온 말, 뜻 그대로 해일."},{"w":"turbulence","p":"n.","m":"난기류","f":0,"i":"공기·물이 매끄럽게 안 흐르고 소용돌이치며 뒤엉켜 마구 흔들리는 상태 — 비행기가 덜컹대는 난기류. turb휘젓다(disturb와 같은 뿌리)."},{"w":"vaporize","p":"v.","m":"증발시키다, 증발하다","f":0,"i":"액체가 김(vapor)으로 흩어져 공중으로 날아가 사라짐 — 증발시키다. SF에선 '흔적도 없이 증발시키다'."},{"w":"vegetation","p":"n.","m":"식물","f":0,"i":"한 지역을 뒤덮은 풀·나무 전체를 뭉뚱그린 초록 융단 — 개별 식물이 아니라 '초목·식생' 덩어리."},{"w":"volcano","p":"n.","m":"화산","f":0,"i":"땅속 불의 신(Vulcan)의 대장간처럼 산꼭대기가 터져 벌건 용암과 재를 뿜는 그림. 뜻 그대로 화산."},{"w":"wheat","p":"n.","m":"밀","f":0,"i":"누렇게 익어 물결치는 밀밭의 이삭 — 빵·국수의 원료가 되는 곡물, 밀. 특별한 이미지 없음."},{"w":"wilderness","p":"n.","m":"황무지, 황야, 자연","f":0,"i":"사람 손이 안 닿아 길도 집도 없이 거칠게 방치된 땅 — 야생(wild)이 통째로 펼쳐진 황야."},{"w":"wildlife","p":"n.","m":"야생 동물, 야생 생물","f":0,"i":"사람 손 밖에서 제멋대로 살아가는 야생의 생명들 — 숲·초원의 짐승·새를 통틀어."},{"w":"zoology","p":"n.","m":"동물학","f":0,"i":"동물(zoo)을 연구하는 학문(-logy) — 살아있는 짐승을 다루는 동물학. zoo동물 + logy학문."},{"w":"android","p":"n.","m":"인조 인간","f":0,"i":"사람(andro, 남성·인간) 모습(-oid)을 본떠 만든 기계 — 겉이 인간처럼 생긴 로봇. andr인간 + oid닮은꼴."},{"w":"accessible","p":"a.","m":"(자료 등에) 접근할 수 있는, 접근하기 쉬운","f":0,"i":"문이 열려 누구나 다가가 닿을(access) 수 있는 상태 — 자료든 건물이든 막힘없이 접근 가능. ac-쪽으로 + cess가다."},{"w":"airflow","p":"n.","m":"공기의 흐름, 기류","f":0,"i":"공기(air)가 한 방향으로 죽 흘러가는(flow) 줄기 — 뜻 그대로 기류, 공기의 흐름."},{"w":"apparatus","p":"n.","m":"설비, 장치, 기구","f":0,"i":"어떤 일을 하려고 미리(ap-) 갖춰 차려둔(paratus, prepared) 장치 일습 — 실험대에 세팅된 기구 세트. ap-쪽으로 + para준비하다."},{"w":"appliance","p":"n.","m":"(가전) 기기","f":0,"i":"특정 용도에 딱 갖다 붙여(apply) 쓰는 기계 — 냉장고·세탁기 같은 가전기기. apply적용하다에서."},{"w":"applicable","p":"a.","m":"적용할 수 있는","f":0,"i":"이 규칙·방법을 그 경우에 갖다 붙여(apply) 쓸 수 있는 — 적용 가능한. ap-쪽으로 + plic접다·붙이다."},{"w":"automate","p":"v.","m":"자동화하다","f":0,"i":"사람 손 없이 스스로(auto-) 돌아가게 만듦 — 컨베이어가 알아서 움직이는 그림. auto-스스로."},{"w":"backing storage","p":"phr.","m":"보조 기억 장치","f":0,"i":"주기억장치 뒤(backing)에서 받쳐주며 자료를 담아두는(storage) 저장고 — 하드디스크 같은 보조 기억 장치."},{"w":"batch processing","p":"phr.","m":"자료 일괄 처리","f":0,"i":"낱개로 그때그때가 아니라 한 묶음(batch)씩 모아 한꺼번에 처리하는 방식 — 빨래 한 통 몰아서 돌리듯 일괄 처리."},{"w":"brainchild","p":"n.","m":"창작물, 발명품","f":0,"i":"머리(brain)가 낳은 자식(child) — 누군가의 뇌에서 태어난 아이디어·발명품. '그의 브레인차일드'는 오롯이 그 사람 머리가 낳은 창작물."},{"w":"catalyze","p":"v.","m":"촉매 작용하다, 촉진하다","f":0,"i":"자기는 변하지 않으면서 곁에서 반응을 확 빠르게 불붙이는 촉매. 그래서 남의 변화·발전에 불을 지피다."},{"w":"cellular","p":"a.","m":"셀 방식의, 세포의","f":0,"i":"벌집처럼 작은 방(cell) 하나하나로 이뤄진. 몸이면 세포의, 통신망이면 지역을 셀로 쪼갠 셀 방식(휴대전화)."},{"w":"Celsius","p":"a.","m":"섭씨의","f":0,"i":"물이 어는 0도, 끓는 100도로 눈금 매긴 섭씨 온도계. 고안자 셀시우스 이름 리저리 굴러다니며 탐사하는 로봇 차."},{"w":"space probe","p":"phr.","m":"우주 탐색기, 탐사용 로켓","f":0,"i":"우주(space) 깊숙이 찔러넣어 더듬어보는(probe-탐침) 무인 탐사기 — 어둠 속을 손가락처럼 뻗어 조사."},{"w":"spacecraft","p":"n.","m":"우주선","f":0,"i":"우주(space)를 항해하는 배·기구(craft-배·기구) — 우주 공간을 떠다니는 탈것."}]/*__DATA__*/;
const NUM_DAYS=30, PER_DAY=Math.ceil(RAW.length/NUM_DAYS);
const KEY="teps_mobile_v1";

// ---- data indexing ----
RAW.forEach((e,i)=>{ e.day=Math.min(NUM_DAYS, Math.floor(i/PER_DAY)+1); e.idx=i; });
const DAYS={}; for(let d=1;d<=NUM_DAYS;d++) DAYS[d]=[];
RAW.forEach(e=>DAYS[e.day].push(e));

// ---- progress (localStorage) ----
let P;
try{ P=JSON.parse(localStorage.getItem(KEY))||{}; }catch(_){ P={}; }
P.box=P.box||{};          // idx -> 1/2/3 (없거나 0 = 안 봄)
P.lastDay=P.lastDay||null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(_){} }
const boxOf=i=>P.box[i]||0;
const seen=i=>boxOf(i)>0;

// theme
if(P.theme){ document.documentElement.setAttribute("data-theme",P.theme); }
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  P.theme=dark?"light":"dark"; document.documentElement.setAttribute("data-theme",P.theme); save();
};

// ---- speech ----
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices()||[];
  voice=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){
  if(!("speechSynthesis" in window))return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.92; if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  }catch(_){}
}

// ---- helpers ----
const app=document.getElementById("app");
const backBtn=document.getElementById("backBtn");
const topTitle=document.getElementById("topTitle");
let backTo=null;
function setTop(title, back){ topTitle.textContent=title;
  if(back){ backBtn.style.display=""; backTo=back; } else { backBtn.style.display="none"; backTo=null; } }
backBtn.onclick=()=>{ if(backTo) backTo(); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dayDone(d){ return DAYS[d].reduce((n,e)=>n+(seen(e.idx)?1:0),0); }
function autoAudioOn(){ return P.auto!==false; }

// ================= HOME =================
function home(){
  setTop("TEPS 단어", null);
  const total=RAW.length, mastered=Object.keys(P.box).filter(i=>P.box[i]===3).length;
  const due=RAW.filter(e=>[1,2].includes(boxOf(e.idx))).length;
  let html=`<h1>TEPS 350+ · 30일 단어</h1>
    <div class="sub">총 ${total}개 · 잘 아는 단어 ${mastered}개 · 복습 대기 ${due}개</div>`;
  if(P.lastDay){
    const unseen=DAYS[P.lastDay].filter(e=>!seen(e.idx)).length;
    html+=`<button class="btn" data-act="day" data-d="${P.lastDay}">▶ 이어서 Day ${P.lastDay} ${unseen?`(새 단어 ${unseen}개)`:""}</button>`;
  }
  if(due>0) html+=`<button class="btn warn" data-act="review">🔁 복습 세션 (${due}개 약한 단어)</button>`;
  html+=`<div class="grid">`;
  for(let d=1;d<=NUM_DAYS;d++){
    const done=dayDone(d), tot=DAYS[d].length, comp=done===tot;
    const cls=comp?"tile done":(done>0?"tile prog":"tile");
    const s=comp?"✓ 완료":(done>0?`${done}/${tot}`:`${tot}개`);
    html+=`<div class="${cls}" data-act="dayview" data-d="${d}"><div class="d">Day ${d}</div><div class="s">${s}</div></div>`;
  }
  html+=`</div>
    <div class="footnote">단어를 보고 뜻을 떠올린 뒤 → 뜻 확인 → 1/2/3 자가평가.<br>진행은 이 기기에 자동 저장됩니다.</div>`;
  app.innerHTML=html; window.scrollTo(0,0);
}

// ============== DAY DETAIL ==============
function dayView(d){
  setTop("Day "+d, home);
  const done=dayDone(d), tot=DAYS[d].length, unseen=tot-done;
  const startTxt = done===0? "▶ 학습 시작"
      : (unseen>0? `▶ 이어서 학습 (새 단어 ${unseen}개)` : "✓ 새 단어 모두 봄");
  app.innerHTML=`<h1>Day ${d}</h1>
    <div class="sub">총 ${tot}개 · 본 단어 ${done}개 · 안 본 새 단어 ${unseen}개</div>
    <button class="btn" data-act="day" data-d="${d}" ${unseen===0?"disabled":""}>${startTxt}</button>
    <button class="btn warn" data-act="replay" data-d="${d}">🔁 전체 다시보기 (처음부터)</button>
    <button class="btn sec" data-act="list" data-d="${d}">📋 전체 단어 보기 (목록)</button>
    <button class="btn danger" data-act="reset" data-d="${d}">↺ 이 Day 초기화</button>`;
  window.scrollTo(0,0);
}

// ================ STUDY =================
let S=null; // session
function startDay(d){ P.lastDay=d; save();
  const q=DAYS[d].filter(e=>!seen(e.idx)).map(e=>e.idx);
  begin({kind:"day", day:d, title:"Day "+d, queue:q}); }
function replayDay(d){ P.lastDay=d; save();
  begin({kind:"replay", day:d, title:"Day "+d+" 다시보기", queue:DAYS[d].map(e=>e.idx)}); }
function reviewSession(){
  const q=RAW.filter(e=>[1,2].includes(boxOf(e.idx))).map(e=>e.idx);
  begin({kind:"review", day:P.lastDay||1, title:"복습", queue:q}); }
function begin(sess){
  if(sess.queue.length===0){ alert("이 세션에서 볼 단어가 없습니다."); return; }
  S=Object.assign({current:null, ev:{1:0,2:0,3:0}, planned:sess.queue.length}, sess);
  nextWord();
}
function nextWord(){
  if(S.queue.length===0){ return summary(); }
  S.current=S.queue.shift(); S.revealed=false; renderStudy();
}
function renderStudy(){
  const phase={day:"🆕 새 단어",review:"🔁 복습",replay:"🔁 다시보기"}[S.kind]||"";
  setTop(S.title+" · "+phase, ()=> S.kind==="day"||S.kind==="replay"? dayView(S.day): home());
  const e=RAW[S.current];
  const remaining=S.queue.length+1;
  let html=`<div class="progline">남은 ${remaining}개 · 좋음 ${S.ev[3]} / 애매 ${S.ev[2]} / 모름 ${S.ev[1]}</div>
    <div class="card" id="card">`;
  if(!S.revealed){
    html+=`<div class="word">${esc(e.w)}</div><div class="hint">눌러서 뜻 보기</div></div>
      <button class="btn" data-act="reveal">뜻 보기</button>`;
  }else{
    const stars="★".repeat(e.f||0);
    html+=`<div class="word">${esc(e.w)}</div>`;
    if(e.p) html+=`<div class="pos">${esc(e.p)}</div>`;
    html+=`<div class="mean">${esc(e.m)}</div>`;
    if(e.i) html+=`<div class="imgbox">🧠 ${esc(e.i)}</div>`;
    html+=`<div class="meta">${stars?("출제빈도 "+stars):""}</div>
      <div><button class="spk" data-act="speak">🔊 발음 듣기</button></div></div>
      <div class="evalbar">
        <button class="ev b1" data-act="rate" data-s="1">1<small>몰랐음</small></button>
        <button class="ev b2" data-act="rate" data-s="2">2<small>애매함</small></button>
        <button class="ev b3" data-act="rate" data-s="3">3<small>알았음</small></button>
      </div>`;
  }
  app.innerHTML=html; window.scrollTo(0,0);
}
function reveal(){ S.revealed=true; renderStudy(); if(autoAudioOn()) speak(RAW[S.current].w); }
function rate(s){ P.box[S.current]=s; save(); S.ev[s]++; nextWord(); }

// =============== SUMMARY ================
function summary(){
  const back=()=> S.kind==="day"||S.kind==="replay"? dayView(S.day): home();
  setTop(S.title+" 완료", back);
  const total=S.ev[1]+S.ev[2]+S.ev[3];
  let html=`<h1>${esc(S.title)} 완료 🎉</h1>
    <div class="sub center">이번 세션 평가 ${total}회</div>
    <div class="statbox">
      <div class="stat"><div class="v" style="color:var(--good)">${S.ev[3]}</div><div class="l">알았음</div></div>
      <div class="stat"><div class="v" style="color:var(--warn)">${S.ev[2]}</div><div class="l">애매함</div></div>
      <div class="stat"><div class="v" style="color:var(--bad)">${S.ev[1]}</div><div class="l">몰랐음</div></div>
    </div>`;
  if(S.kind==="day"){
    const done=dayDone(S.day), tot=DAYS[S.day].length;
    html+=`<div class="sub center">Day ${S.day}: ${done}/${tot} 단어 봄</div>`;
    if(S.day<NUM_DAYS) html+=`<button class="btn" data-act="day" data-d="${S.day+1}">Day ${S.day+1} →</button>`;
  }
  html+=`<button class="btn sec" data-act="home">🏠 홈으로</button>`;
  app.innerHTML=html; window.scrollTo(0,0);
}

// ================ LIST ==================
function listView(d){
  setTop("Day "+d+" · 전체 단어", ()=>dayView(d));
  const marks={0:["·","d0"],1:["모름","d1"],2:["애매","d2"],3:["앎","d3"]};
  let html=`<div class="detail" id="detail"><div class="dw">단어를 누르면</div>
      <div class="dm">뜻이 여기 나옵니다</div><div class="di"></div></div>
    <div class="listgrid">`;
  DAYS[d].forEach((e,n)=>{
    const [t,c]=marks[boxOf(e.idx)]||marks[0];
    html+=`<div class="wchip" data-act="worddetail" data-i="${e.idx}">
      <span><span class="n">${n+1}.</span>${esc(e.w)}</span><span class="dot ${c}">${t}</span></div>`;
  });
  html+=`</div>`;
  app.innerHTML=html; window.scrollTo(0,0);
}
function wordDetail(i){
  const e=RAW[i], dt=document.getElementById("detail");
  if(!dt)return;
  dt.querySelector(".dw").textContent=e.w;
  dt.querySelector(".dm").textContent=(e.p?e.p+" ":"")+e.m;
  dt.querySelector(".di").textContent=e.i?("🧠 "+e.i):"";
  speak(e.w);
  window.scrollTo(0,0);
}

// ============ event delegation ==========
app.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act, d=+t.dataset.d, i=+t.dataset.i, s=+t.dataset.s;
  if(a==="dayview")dayView(d);
  else if(a==="day"){P.lastDay=d;save();startDay(d);}
  else if(a==="replay")replayDay(d);
  else if(a==="review")reviewSession();
  else if(a==="list")listView(d);
  else if(a==="reset"){ if(confirm("Day "+d+"의 진행 기록을 지우고 '안 본' 상태로 되돌릴까요?\n(단어 데이터는 그대로)")){ DAYS[d].forEach(e=>{delete P.box[e.idx];}); save(); dayView(d); } }
  else if(a==="reveal")reveal();
  else if(a==="rate")rate(s);
  else if(a==="speak")speak(RAW[S.current].w);
  else if(a==="home")home();
  else if(a==="worddetail")wordDetail(i);
});
// 카드 아무 곳이나 눌러도 뜻 보기
app.addEventListener("click",ev=>{
  if(S && !S.revealed && ev.target.closest("#card")) reveal();
});
// 키보드(데스크톱)
document.addEventListener("keydown",ev=>{
  if(!S)return;
  if((ev.key===" "||ev.key==="Enter")&&!S.revealed){ev.preventDefault();reveal();}
  else if(S.revealed&&["1","2","3"].includes(ev.key))rate(+ev.key);
});

home();
</script>

</body>
</html>
